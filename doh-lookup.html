<script>
async function queryDns() {
  const domain = document.getElementById('domainInput').value.trim();
  const type = document.getElementById('recordType').value;
  const provider = document.getElementById('dohProvider').value;
  if (!domain) return showToast('请输入要查询的域名！');

  const resBox = document.getElementById('resultContent');
  resBox.innerHTML = '<div style="color:var(--text-muted);padding:14px 0;">正在通过 ' + provider + ' DoH 查询中...</div>';

  let url = '';
  if (provider === 'cloudflare') {
    url = 'https://cloudflare-dns.com/dns-query?name=' + encodeURIComponent(domain) + '&type=' + type;
  } else {
    url = 'https://dns.google/resolve?name=' + encodeURIComponent(domain) + '&type=' + type;
  }

  const start = performance.now();
  try {
    const res = await fetch(url, { headers: { 'Accept': 'application/dns-json' } });
    const rtt = Math.round(performance.now() - start);
    document.getElementById('rttBadge').textContent = 'RTT: ' + rtt + ' ms';

    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    if (!data.Answer || data.Answer.length === 0) {
      resBox.innerHTML = '<div style="color:var(--warning);padding:10px 0;">未检索到 ' + type + ' 记录。</div>';
      return;
    }

    let html = '<table class="dns-result-table"><thead><tr><th>记录名称</th><th>类型</th><th>TTL</th><th>解析数据 (Data)</th></tr></thead><tbody>';
    data.Answer.forEach(ans => {
      html += '<tr><td>' + ans.name + '</td><td>' + type + '</td><td>' + ans.TTL + 's</td><td class="record-code">' + ans.data + '</td></tr>';
    });
    html += '</tbody></table>';
    resBox.innerHTML = html;
  } catch (err) {
    document.getElementById('rttBadge').textContent = '超时 / 降级';
    // Fallback simulation
    resBox.innerHTML = '<div style="color:var(--text-muted);padding:10px 0;">网络受限或跨域策略拦截，展示模拟解析样本：</div>' +
      '<table class="dns-result-table"><thead><tr><th>记录名称</th><th>类型</th><th>TTL</th><th>解析数据 (Data)</th></tr></thead><tbody>' +
      '<tr><td>' + domain + '.</td><td>' + type + '</td><td>300s</td><td class="record-code">140.82.113.4</td></tr>' +
      '</tbody></table>';
  }
}

window.addEventListener('DOMContentLoaded', queryDns);
</script>

<script>
function initTheme(){
  const saved=localStorage.getItem('app_theme');
  if(saved){document.documentElement.setAttribute('data-theme',saved);}
  else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const target=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',target);
  localStorage.setItem('app_theme',target);
}
initTheme();
function showToast(msg, duration=2200){
  const el=document.createElement('div');
  el.textContent=msg;
  el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:9999px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 10px 25px rgba(0,0,0,.2);transition:opacity .3s;';
  document.body.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),300);},duration);
}
</script>
