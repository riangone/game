<script>
// Crockford Base32
const ENCODING = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
function generateUlid() {
  const now = Date.now();
  let timeStr = '';
  let time = now;
  for (let i = 9; i >= 0; i--) {
    const mod = time % 32;
    timeStr = ENCODING[mod] + timeStr;
    time = Math.floor(time / 32);
  }
  let randStr = '';
  const randBytes = new Uint8Array(10);
  crypto.getRandomValues(randBytes);
  for (let i = 0; i < 16; i++) {
    const randVal = Math.floor(Math.random() * 32);
    randStr += ENCODING[randVal];
  }
  return timeStr + randStr;
}

function generateNanoId(size, alphabet) {
  let id = '';
  const bytes = new Uint8Array(size);
  crypto.getRandomValues(bytes);
  for (let i = 0; i < size; i++) {
    id += alphabet[bytes[i] % alphabet.length];
  }
  return id;
}

function onTypeChanged() {
  const type = document.getElementById('idType').value;
  document.getElementById('nanoConfig').style.display = (type === 'nanoid') ? 'block' : 'none';
  generateBatch();
}

function generateBatch() {
  const type = document.getElementById('idType').value;
  const count = parseInt(document.getElementById('genCount').value, 10);
  const caseOpt = document.getElementById('caseOption').value;
  const fmt = document.getElementById('formatOption').value;

  const results = [];
  for (let i = 0; i < count; i++) {
    let raw = '';
    if (type === 'uuid4') {
      raw = crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
      });
    } else if (type === 'ulid') {
      raw = generateUlid();
    } else if (type === 'nanoid') {
      const len = parseInt(document.getElementById('nanoLen').value, 10) || 21;
      const alpha = document.getElementById('nanoAlphabet').value || '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz-';
      raw = generateNanoId(len, alpha);
    }

    if (caseOpt === 'upper') raw = raw.toUpperCase();
    else if (caseOpt === 'lower') raw = raw.toLowerCase();

    if (fmt === 'nohyphen') raw = raw.replace(/-/g, '');
    else if (fmt === 'braces') raw = '{' + raw + '}';

    results.push(raw);
  }

  let finalOutput = '';
  if (fmt === 'sql') {
    finalOutput = '(' + results.map(r => "'" + r + "'").join(', ') + ')';
  } else if (fmt === 'json') {
    finalOutput = JSON.stringify(results, null, 2);
  } else {
    finalOutput = results.join('\n');
  }

  document.getElementById('outputArea').value = finalOutput;

  // Update entropy
  if (type === 'uuid4') document.getElementById('entropyVal').textContent = '122 bits (v4 CSPRNG)';
  else if (type === 'ulid') document.getElementById('entropyVal').textContent = '128 bits (48-bit Time + 80-bit Rand)';
  else document.getElementById('entropyVal').textContent = (parseInt(document.getElementById('nanoLen').value, 10) * 6) + ' bits';
}

function copyResults() {
  const val = document.getElementById('outputArea').value;
  if (!val) return;
  navigator.clipboard.writeText(val).then(() => showToast('已成功复制 ' + document.getElementById('genCount').value + ' 个标识符'));
}

function downloadTxt() {
  const val = document.getElementById('outputArea').value;
  if (!val) return;
  const blob = new Blob([val], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'identifiers_' + Date.now() + '.txt';
  a.click();
  showToast('已下载标识符文本文件');
}

function clearOutput() {
  document.getElementById('outputArea').value = '';
}

window.addEventListener('DOMContentLoaded', generateBatch);
</script>

<script>
function initTheme(){
  const saved=localStorage.getItem('app_theme');
  if(saved){document.documentElement.setAttribute('data-theme',saved);}
  else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const target=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',target);
  localStorage.setItem('app_theme',target);
}
initTheme();
function showToast(msg, duration=2200){
  const el=document.createElement('div');
  el.textContent=msg;
  el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:9999px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 10px 25px rgba(0,0,0,.2);transition:opacity .3s;';
  document.body.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),300);},duration);
}
</script>
