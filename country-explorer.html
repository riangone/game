<style>
:root{--bg-base:#f8fafc;--bg-surface:#fff;--bg-subtle:#f1f5f9;--border-color:#e2e8f0;--border-focus:#0284c7;--text-main:#0f172a;--text-muted:#64748b;--text-light:#94a3b8;--primary:#0284c7;--primary-hover:#0369a1;--primary-subtle:#e0f2fe;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--purple:#8b5cf6;--radius-sm:8px;--radius-md:14px;--radius-lg:20px;--radius-pill:9999px;--shadow-sm:0 1px 3px rgba(0,0,0,.05);--shadow-md:0 4px 6px -1px rgba(0,0,0,.06);--shadow-lg:0 10px 15px -3px rgba(0,0,0,.08);--font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;}
[data-theme="dark"]{--bg-base:#090d16;--bg-surface:#111827;--bg-subtle:#1f2937;--border-color:#374151;--border-focus:#38bdf8;--text-main:#f9fafb;--text-muted:#9ca3af;--text-light:#6b7280;--primary:#38bdf8;--primary-hover:#0ea5e9;--primary-subtle:rgba(56,189,248,.15);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--font-sans);background:var(--bg-base);color:var(--text-main);min-height:100vh;display:flex;flex-direction:column;}
header.app-header{background:var(--bg-surface);border-bottom:1px solid var(--border-color);position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;flex-wrap:wrap;}
.header-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.back-link{display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:var(--text-muted);font-size:13px;font-weight:600;padding:6px 10px;border-radius:var(--radius-sm);}
.back-link:hover{background:var(--primary-subtle);color:var(--primary);}
.app-brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;}
.tool-switch,.theme-btn{padding:7px 10px;border-radius:var(--radius-sm);border:1px solid var(--border-color);background:var(--bg-subtle);color:var(--text-main);font-size:13px;font-weight:600;cursor:pointer;}
.container{max-width:1160px;margin:0 auto;padding:24px 20px 48px;width:100%;flex:1;}
h1.page-title{font-size:22px;font-weight:800;margin-bottom:4px;}
p.page-sub{color:var(--text-muted);font-size:13px;margin-bottom:18px;}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.tab-btn{padding:8px 16px;border-radius:var(--radius-pill);border:1px solid var(--border-color);background:var(--bg-surface);color:var(--text-muted);font-size:13px;font-weight:700;cursor:pointer;transition:.2s;}
.tab-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:var(--shadow-sm);}
.panel{display:none;background:var(--bg-surface);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-sm);}
.panel.active{display:block;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--radius-md);border:none;background:var(--primary);color:#fff;font-weight:700;font-size:13px;cursor:pointer;transition:.2s;}
.btn:hover{background:var(--primary-hover);}
.btn-subtle{background:var(--bg-subtle);color:var(--text-main);border:1px solid var(--border-color);}
.btn-subtle:hover{border-color:var(--primary);color:var(--primary);}
.btn-sm{padding:6px 12px;font-size:12px;}
input[type=text],select{width:100%;padding:10px 14px;border-radius:var(--radius-md);border:1px solid var(--border-color);background:var(--bg-subtle);color:var(--text-main);font-size:13px;outline:none;transition:border-color .2s;}
input:focus,select:focus{border-color:var(--border-focus);}

/* 区域筛选 */
.region-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.region-btn{padding:5px 12px;border-radius:var(--radius-pill);border:1px solid var(--border-color);background:var(--bg-subtle);color:var(--text-muted);font-size:12px;font-weight:600;cursor:pointer;transition:.15s;}
.region-btn.active{background:var(--primary-subtle);color:var(--primary);border-color:var(--primary);}

/* 卡片布局 */
.country-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;}
.country-card{background:var(--bg-subtle);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:14px;cursor:pointer;transition:.2s;display:flex;flex-direction:column;gap:8px;}
.country-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow-md);}
.flag-wrap{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.flag-box{width:48px;height:32px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.04);border-radius:4px;overflow:hidden;border:1px solid rgba(0,0,0,0.08);}
.flag-img{width:100%;height:100%;object-fit:cover;display:block;}
.flag-emoji{font-size:28px;line-height:1;}
.code-badge{font-size:11px;font-weight:700;font-family:var(--font-mono);background:var(--bg-surface);color:var(--text-muted);padding:2px 6px;border-radius:4px;border:1px solid var(--border-color);}
.country-title{font-weight:800;font-size:14px;color:var(--text-main);line-height:1.4;}
.country-meta{font-size:12px;color:var(--text-muted);display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;margin-top:auto;}
.country-meta span b{color:var(--text-main);font-weight:600;}

/* 猜谜样式 */
.quiz-box{text-align:center;padding:24px;background:var(--bg-subtle);border-radius:var(--radius-lg);border:1px solid var(--border-color);max-width:560px;margin:0 auto;}
.quiz-flag-box{width:160px;height:106px;margin:16px auto;display:flex;align-items:center;justify-content:center;background:var(--bg-surface);border-radius:8px;overflow:hidden;box-shadow:var(--shadow-md);border:1px solid var(--border-color);}
.quiz-flag-img{width:100%;height:100%;object-fit:cover;display:block;}
.quiz-flag-emoji{font-size:72px;}
.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;}
.quiz-opt-btn{padding:12px 14px;border-radius:var(--radius-md);border:1px solid var(--border-color);background:var(--bg-surface);color:var(--text-main);font-size:13px;font-weight:700;cursor:pointer;transition:.15s;text-align:center;}
.quiz-opt-btn:hover:not(:disabled){border-color:var(--primary);color:var(--primary);background:var(--primary-subtle);}
.quiz-opt-btn.correct{background:#10b981!important;color:#fff!important;border-color:#10b981!important;}
.quiz-opt-btn.wrong{background:#ef4444!important;color:#fff!important;border-color:#ef4444!important;}
.quiz-stats{display:flex;justify-content:center;gap:24px;margin-top:12px;}
.quiz-fact-card{margin-top:18px;padding:12px 16px;background:var(--bg-surface);border-radius:var(--radius-md);border:1px solid var(--border-color);text-align:left;font-size:12px;color:var(--text-muted);display:none;}
.quiz-fact-card.show{display:block;}

/* 模态框 */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:999;padding:20px;backdrop-filter:blur(4px);}
.modal-overlay.active{display:flex;}
.modal-card{background:var(--bg-surface);border:1px solid var(--border-color);border-radius:var(--radius-lg);max-width:440px;width:100%;padding:24px;box-shadow:var(--shadow-lg);position:relative;animation:modalFade .2s ease-out;}
@keyframes modalFade{from{opacity:0;transform:scale(0.95);}to{opacity:1;transform:scale(1);}}
.modal-close{position:absolute;top:16px;right:16px;background:var(--bg-subtle);border:1px solid var(--border-color);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--text-muted);}
.modal-close:hover{color:var(--text-main);border-color:var(--primary);}
</style>

"大洋洲", "tz": "UTC+11"}, {"name": "瓦努阿图 (Vanuatu)", "code": "VU", "flag": "🇻🇺", "capital": "维拉港", "pop": "32 万", "region": "大洋洲", "tz": "UTC+11"}, {"name": "萨摩亚 (Samoa)", "code": "WS", "flag": "🇼🇸", "capital": "阿皮亚", "pop": "21 万", "region": "大洋洲", "tz": "UTC+13"}, {"name": "关岛 (Guam)", "code": "GU", "flag": "🇬🇺", "capital": "阿加尼亚", "pop": "17 万", "region": "大洋洲", "tz": "UTC+10"}, {"name": "基里巴斯 (Kiribati)", "code": "KI", "flag": "🇰🇮", "capital": "南塔拉瓦", "pop": "12 万", "region": "大洋洲", "tz": "UTC+12 ~ +14"}, {"name": "密克罗尼西亚 (Micronesia)", "code": "FM", "flag": "🇫🇲", "capital": "帕利基尔", "pop": "11 万", "region": "大洋洲", "tz": "UTC+10 ~ +11"}, {"name": "汤加 (Tonga)", "code": "TO", "flag": "🇹🇴", "capital": "努库阿洛法", "pop": "10 万", "region": "大洋洲", "tz": "UTC+13"}, {"name": "帕劳 (Palau)", "code": "PW", "flag": "🇵🇼", "capital": "恩吉鲁穆德", "pop": "1.8 万", "region": "大洋洲", "tz": "UTC+9"}, {"name": "马绍尔群岛 (Marshall Islands)", "code": "MH", "flag": "🇲🇭", "capital": "马朱罗", "pop": "4.2 万", "region": "大洋洲", "tz": "UTC+12"}, {"name": "图瓦卢 (Tuvalu)", "code": "TV", "flag": "🇹🇻", "capital": "富纳富提", "pop": "1.1 万", "region": "大洋洲", "tz": "UTC+12"}, {"name": "瑙鲁 (Nauru)", "code": "NR", "flag": "🇳🇷", "capital": "亚伦", "pop": "1.2 万", "region": "大洋洲", "tz": "UTC+12"}, {"name": "法属波利尼西亚 (French Polynesia)", "code": "PF", "flag": "🇵🇫", "capital": "帕皮提", "pop": "28 万", "region": "大洋洲", "tz": "UTC-10"}, {"name": "新喀里多尼亚 (New Caledonia)", "code": "NC", "flag": "🇳🇨", "capital": "努美阿", "pop": "27 万", "region": "大洋洲", "tz": "UTC+11"}];

let curTab = 'explore';
let curRegion = '全部';
let quizScore = 0;
let quizHighScore = parseInt(localStorage.getItem('flag_quiz_highscore') || '0', 10);
let curQuizTarget = null;
let quizAnswered = false;

document.getElementById('quizHighScore').textContent = quizHighScore;

function switchTab(tab) {
  curTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-tab') === tab));
  document.getElementById('panel-explore').classList.toggle('active', tab === 'explore');
  document.getElementById('panel-quiz').classList.toggle('active', tab === 'quiz');
  if (tab === 'quiz' && !curQuizTarget) startQuizQuestion();
}

function setRegion(reg) {
  curRegion = reg;
  document.querySelectorAll('.region-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.startsWith(reg));
  });
  filterCountries();
}

function renderCountries(list) {
  const grid = document.getElementById('countryGrid');
  const emptyHint = document.getElementById('emptyHint');
  grid.innerHTML = '';
  if (list.length === 0) {
    emptyHint.style.display = 'block';
    return;
  }
  emptyHint.style.display = 'none';

  list.forEach(c => {
    const card = document.createElement('div');
    card.className = 'country-card';
    card.onclick = () => openModal(c);

    const flagUrl = 'https://flagcdn.com/w80/' + c.code.toLowerCase() + '.png';

    card.innerHTML = '<div class="flag-wrap">' +
      '<div class="flag-box">' +
        '<img src="' + flagUrl + '" loading="lazy" class="flag-img" alt="' + c.name + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\';">' +
        '<span class="flag-emoji" style="display:none;">' + c.flag + '</span>' +
      '</div>' +
      '<span class="code-badge">' + c.code + '</span>' +
    '</div>' +
    '<div class="country-title">' + c.name + '</div>' +
    '<div class="country-meta">' +
      '<span>首都: <b>' + c.capital + '</b></span>' +
      '<span>大洲: <b>' + c.region + '</b></span>' +
      '<span>人口: <b>' + c.pop + '</b></span>' +
      '<span>时区: <b>' + c.tz + '</b></span>' +
    '</div>';
    grid.appendChild(card);
  });
}

function filterCountries() {
  const q = (document.getElementById('countrySearch').value || '').trim().toLowerCase();
  const filtered = COUNTRIES.filter(c => {
    const matchReg = (curRegion === '全部') || (c.region === curRegion);
    const matchQ = !q || c.name.toLowerCase().includes(q) || c.capital.toLowerCase().includes(q) || c.code.toLowerCase().includes(q);
    return matchReg && matchQ;
  });
  renderCountries(filtered);
}

function openModal(c) {
  document.getElementById('modalTitle').textContent = c.name;
  document.getElementById('modalCode').textContent = 'ISO: ' + c.code + ' · ' + c.flag;
  document.getElementById('modalCapital').textContent = c.capital;
  document.getElementById('modalRegion').textContent = c.region;
  document.getElementById('modalPop').textContent = c.pop;
  document.getElementById('modalTz').textContent = c.tz;

  const img = document.getElementById('modalFlagImg');
  const emoji = document.getElementById('modalFlagEmoji');
  img.style.display = 'block';
  emoji.style.display = 'none';
  img.src = 'https://flagcdn.com/w160/' + c.code.toLowerCase() + '.png';
  emoji.textContent = c.flag;

  document.getElementById('countryModal').classList.add('active');
}

function closeModal() {
  document.getElementById('countryModal').classList.remove('active');
}

function startQuizQuestion() {
  quizAnswered = false;
  document.getElementById('quizFactCard').classList.remove('show');

  const reg = document.getElementById('quizRegionSelect').value;
  const pool = (reg === '全部') ? COUNTRIES : COUNTRIES.filter(c => c.region === reg);
  if (pool.length < 4) return;

  const target = pool[Math.floor(Math.random() * pool.length)];
  curQuizTarget = target;

  const img = document.getElementById('quizFlagImg');
  const emoji = document.getElementById('quizFlagEmoji');
  img.style.display = 'block';
  emoji.style.display = 'none';
  img.src = 'https://flagcdn.com/w160/' + target.code.toLowerCase() + '.png';
  emoji.textContent = target.flag;

  const others = pool.filter(c => c !== target).sort(() => Math.random() - 0.5).slice(0, 3);
  const options = [...others, target].sort(() => Math.random() - 0.5);

  const container = document.getElementById('quizOptions');
  container.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'quiz-opt-btn';
    btn.textContent = opt.name.split(' (')[0];
    btn.onclick = () => handleQuizAnswer(opt, btn);
    container.appendChild(btn);
  });
}

function handleQuizAnswer(selected, selectedBtn) {
  if (quizAnswered) return;
  quizAnswered = true;

  const btns = document.querySelectorAll('.quiz-opt-btn');
  btns.forEach(b => b.disabled = true);

  const factCard = document.getElementById('quizFactCard');
  const factTitle = document.getElementById('quizFactTitle');
  const factDesc = document.getElementById('quizFactDesc');

  if (selected === curQuizTarget) {
    selectedBtn.classList.add('correct');
    quizScore++;
    if (quizScore > quizHighScore) {
      quizHighScore = quizScore;
      localStorage.setItem('flag_quiz_highscore', quizHighScore);
      document.getElementById('quizHighScore').textContent = quizHighScore;
    }
    document.getElementById('quizScore').textContent = quizScore;
    showToast('🎉 回答正确！连胜 +' + quizScore);

    factTitle.textContent = '✅ 正确答案：' + curQuizTarget.name;
    factDesc.textContent = '首都：' + curQuizTarget.capital + ' · 大洲：' + curQuizTarget.region + ' · 人口：' + curQuizTarget.pop + ' · 时区：' + curQuizTarget.tz;
    factCard.classList.add('show');

    setTimeout(() => {
      startQuizQuestion();
    }, 1400);
  } else {
    selectedBtn.classList.add('wrong');
    btns.forEach(b => {
      if (b.textContent === curQuizTarget.name.split(' (')[0]) {
        b.classList.add('correct');
      }
    });

    factTitle.textContent = '❌ 正确答案其实是：' + curQuizTarget.name;
    factDesc.textContent = '首都：' + curQuizTarget.capital + ' · 大洲：' + curQuizTarget.region + ' · 人口：' + curQuizTarget.pop + ' · 时区：' + curQuizTarget.tz;
    factCard.classList.add('show');

    showToast('❌ 回答错误！正确答案是: ' + curQuizTarget.name.split(' (')[0]);
    quizScore = 0;
    document.getElementById('quizScore').textContent = quizScore;
  }
}

window.addEventListener('DOMContentLoaded', () => {
  renderCountries(COUNTRIES);
});
</script>

<script>
function initTheme(){
  const saved=localStorage.getItem('app_theme');
  if(saved){document.documentElement.setAttribute('data-theme',saved);}
  else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const target=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',target);
  localStorage.setItem('app_theme',target);
}
initTheme();
function showToast(msg, duration=2200){
  const el=document.createElement('div');
  el.textContent=msg;
  el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:9999px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 10px 25px rgba(0,0,0,.2);transition:opacity .3s;';
  document.body.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),300);},duration);
}
</script>
