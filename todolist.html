.filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}

.todo-item.dragging{opacity:0.4;}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--text-light);}
.todo-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border-color);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;}
.todo-item.done .todo-check{background:var(--success);border-color:var(--success);color:#fff;}
.todo-text{flex:1;font-size:14px;}
.todo-tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:var(--radius-pill);flex-shrink:0;}
.tag-work{background:#dbeafe;color:#1d4ed8;}
.tag-life{background:#d1fae5;color:#047857;}
.tag-study{background:#ede9fe;color:#6d28d9;}
.tag-other{background:#fef3c7;color:#92400e;}
[data-theme="dark"] .tag-work{background:rgba(29,78,216,.25);color:#93c5fd;}
[data-theme="dark"] .tag-life{background:rgba(4,120,87,.25);color:#6ee7b7;}
[data-theme="dark"] .tag-study{background:rgba(109,40,217,.25);color:#c4b5fd;}
[data-theme="dark"] .tag-other{background:rgba(146,64,14,.25);color:#fcd34d;}
.del-btn{border:none;background:transparent;color:var(--text-light);cursor:pointer;font-size:16px;flex-shrink:0;}
.del-btn:hover{color:var(--danger);}
.drag-handle{color:var(--text-light);flex-shrink:0;cursor:grab;}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-light);}

<main class="container">

  <div class="add-bar">
    <input type="text" id="newTodoText" placeholder="输入待办事项，回车快速添加..." onkeydown="if(event.key==='Enter')addTodo()">
    <select id="newTodoTag">
      <option value="work">💼 工作</option>
      <option value="life">🏠 生活</option>
      <option value="study">📚 学习</option>
      <option value="other">🔖 其他</option>
    </select>
    <button onclick="addTodo()">+ 添加</button>
  </div>

  <div class="filter-row">
    <div class="filter-chip active" data-filter="all" onclick="setFilter('all')">全部</div>
    <div class="filter-chip" data-filter="active" onclick="setFilter('active')">未完成</div>
    <div class="filter-chip" data-filter="done" onclick="setFilter('done')">已完成</div>
  </div>

  <div class="stat-bar" id="statBar"></div>

  <ul id="todoList"></ul>

<script>
(function(){const t=localStorage.getItem('app_theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');})();
function toggleTheme(){const cur=document.documentElement.getAttribute('data-theme');const next=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',next);localStorage.setItem('app_theme',next);}

const STORAGE_KEY = 'todolist_items_v1';
let todos = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let filter = 'all';
const tagLabels = { work: ['💼 工作','tag-work'], life: ['🏠 生活','tag-life'], study: ['📚 学习','tag-study'], other: ['🔖 其他','tag-other'] };

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(todos)); render(); }

function addTodo(){
  const input = document.getElementById('newTodoText');
  const text = input.value.trim();
  if(!text) return;
  const tag = document.getElementById('newTodoTag').value;
  todos.push({ id: Date.now()+Math.random(), text, tag, done: false });
  input.value = '';
  save();
}

function toggleDone(id){ const t = todos.find(x=>x.id===id); if(t) t.done = !t.done; save(); }
function removeTodo(id){ todos = todos.filter(x=>x.id!==id); save(); }
function setFilter(f){ filter = f; document.querySelectorAll('.filter-chip').forEach(c=>c.classList.toggle('active', c.dataset.filter===f)); render(); }

let dragSrcId = null;
function render(){
  const list = document.getElementById('todoList');
  const filtered = todos.filter(t => filter==='all' ? true : filter==='active' ? !t.done : t.done);
  list.innerHTML = '';
  if(filtered.length===0){
    list.innerHTML = '<div class="empty-state">暂无事项，添加一个开始吧 ✨</div>';
  } else {
    filtered.forEach(t => {
      const [label, cls] = tagLabels[t.tag] || tagLabels.other;
      const li = document.createElement('li');
      li.className = 'todo-item' + (t.done ? ' done' : '');
      li.draggable = true;
      li.dataset.id = t.id;
      li.innerHTML = `
        <span class="drag-handle">⠿</span>
        <div class="todo-check" onclick="toggleDone(${t.id})">${t.done ? '✓' : ''}</div>
        <span class="todo-text">${escapeHtml(t.text)}</span>
        <span class="todo-tag ${cls}">${label}</span>
        <button class="del-btn" onclick="removeTodo(${t.id})">✕</button>
      `;
      li.addEventListener('dragstart', () => { dragSrcId = t.id; li.classList.add('dragging'); });
      li.addEventListener('dragend', () => li.classList.remove('dragging'));
      li.addEventListener('dragover', e => e.preventDefault());
      li.addEventListener('drop', () => {
        if(dragSrcId === null || dragSrcId === t.id) return;
        const srcIdx = todos.findIndex(x=>x.id===dragSrcId);
        const dstIdx = todos.findIndex(x=>x.id===t.id);
        const [moved] = todos.splice(srcIdx, 1);
        todos.splice(dstIdx, 0, moved);
        save();
      });
      list.appendChild(li);
    });
  }
  const doneCount = todos.filter(t=>t.done).length;
  document.getElementById('statBar').innerHTML = `<span>共 ${todos.length} 项</span><span>已完成 ${doneCount}</span><span>未完成 ${todos.length-doneCount}</span>`;
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

render();
</script>
