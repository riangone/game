<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>打蜜蜂 - Bee Hit</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #2b1a06;
    font-family: 'Outfit', "PingFang SC", "Microsoft YaHei", sans-serif;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #game { display: block; width: 100%; height: 100%; cursor: none; }

  #hud {
    position: fixed; top: 0; left: 0; width: 100%;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 20px 24px; box-sizing: border-box; pointer-events: none;
    z-index: 5;
  }
  .hud-card {
    background: rgba(60, 34, 8, 0.45);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 220, 150, 0.25);
    border-radius: 16px;
    padding: 12px 20px;
    color: #fff;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25);
  }
  #score-container { display: flex; gap: 14px; }
  .hud-value-highlight { font-size: 28px; font-weight: 800; color: #ffd54f; line-height: 1.1; margin-top: 2px;}
  .hud-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.75; margin-bottom: 2px; }
  .hud-value { font-size: 14px; opacity: 0.95; }
  #comboEl.hot { color: #ff9e5e; }
  #livesEl { font-size: 18px; letter-spacing: 2px; margin-top: 4px; }

  #hint {
    position: fixed; top: 90px; left: 50%; transform: translateX(-50%);
    text-align: center; color: #fff; opacity: 0.9; font-size: 13px;
    pointer-events: none; z-index: 5;
    background: rgba(60, 34, 8, 0.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 220, 150, 0.25);
    padding: 7px 20px;
    border-radius: 20px;
    max-width: 90vw; box-sizing: border-box;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    transition: opacity 0.3s ease;
    white-space: normal;
  }

  #banner {
    position: fixed; top: 34%; left: 50%; transform: translate(-50%, -50%);
    color: #fff; font-size: 22px; font-weight: 800;
    background: rgba(255, 213, 79, 0.22);
    border: 1px solid rgba(255, 213, 79, 0.6);
    padding: 10px 28px; border-radius: 16px;
    display: none; z-index: 6; pointer-events: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    text-align: center;
  }
  #banner.sting { background: rgba(239, 68, 68, 0.28); border-color: rgba(239,68,68,0.75); color: #fee2e2; }

  #flash {
    position: fixed; inset: 0; background: #ef4444; opacity: 0; pointer-events: none; z-index: 7;
    transition: opacity 0.08s ease;
  }

  #overlay {
    position: fixed; inset: 0; background: rgba(20, 12, 4, 0.6);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; backdrop-filter: blur(8px); z-index: 9;
  }
  #overlay.show { display: flex; }

  .glass-panel {
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 220, 150, 0.3);
    border-radius: 24px;
    padding: 32px 36px;
    text-align: center;
    max-width: 340px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    color: #fff;
  }
  .glass-panel h1 { font-size: 26px; margin: 0 0 6px; font-weight: 800; }
  .glass-panel p { font-size: 13px; opacity: 0.85; line-height: 1.6; margin: 4px 0 18px; }
  .btn {
    background: linear-gradient(135deg, #ffd54f, #ff8a3d);
    border: none; color: #2b1a06; font-weight: 800; font-size: 16px;
    padding: 13px 34px; border-radius: 14px; cursor: pointer;
    box-shadow: 0 8px 20px rgba(255, 213, 79, 0.35);
    pointer-events: auto;
  }
  .btn:active { transform: scale(0.96); }
  #finalScoreVal { font-size: 46px; font-weight: 800; color: #ffd54f; margin: 6px 0; }
  #bestScoreLine { font-size: 13px; opacity: 0.85; margin-bottom: 18px; }

  #gearBtn {
    position: fixed; bottom: 18px; right: 18px; width: 44px; height: 44px;
    border-radius: 50%; background: rgba(60,34,8,0.5); border: 1px solid rgba(255,220,150,0.25);
    color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center;
    z-index: 8; cursor: pointer; pointer-events: auto; backdrop-filter: blur(8px);
  }
  #settingsPanel {
    position: fixed; inset: 0; background: rgba(20,12,4,0.6); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; z-index: 10;
  }
  #settingsPanel.show { display: flex; }
  .setting-row { display: flex; align-items: center; justify-content: space-between; margin: 12px 0; gap: 16px; }
  .setting-row span { font-size: 14px; }
  .switch { position: relative; width: 44px; height: 24px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider-toggle { position: absolute; cursor: pointer; inset: 0; background: rgba(255,255,255,0.25); border-radius: 24px; transition: 0.2s; }
  .slider-toggle:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: 0.2s; }
  input:checked + .slider-toggle { background: #ff8a3d; }
  input:checked + .slider-toggle:before { transform: translateX(20px); }
  #closeSettings { margin-top: 10px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="flash"></div>

<div id="hud">
  <div class="hud-card">
    <div id="score-container">
      <div>
        <div class="hud-label">SCORE</div>
        <div class="hud-value-highlight" id="scoreEl">0</div>
      </div>
      <div>
        <div class="hud-label">BEST</div>
        <div class="hud-value" id="bestEl" style="margin-top:6px;">0</div>
      </div>
    </div>
    <div class="hud-value" id="comboEl" style="margin-top:6px;">连击 0</div>
  </div>
  <div class="hud-card">
    <div class="hud-label">生命</div>
    <div id="livesEl">🌼🌼🌼</div>
  </div>
</div>

<div id="hint">点击蜜蜂得分，别打到马蜂——马蜂飞走才是好事</div>
<div id="banner"></div>

<div id="overlay" class="show">
  <div class="glass-panel">
    <h1>🐝 打蜜蜂</h1>
    <p>蜂巢里会随机冒出蜜蜂 🐝，眼疾手快点它得分；金蜂 👑 分数更高但停留更短；深色马蜂 🟤 千万别碰——碰到会被蜇掉一条命，让它自己飞走反而加分。放跑蜜蜂也会扣命，3 条命耗尽游戏结束。</p>
    <button class="btn" id="startBtn">开始游戏</button>
  </div>
</div>

<div id="settingsPanel">
  <div class="glass-panel">
    <h1 style="font-size:20px;">设置</h1>
    <div class="setting-row">
      <span>音效</span>
      <label class="switch"><input type="checkbox" id="soundToggle"><span class="slider-toggle"></span></label>
    </div>
    <button class="btn" id="closeSettings">关闭</button>
  </div>
</div>

<div id="gearBtn">⚙</div>

<div id="overlayEnd" style="display:none;">
</div>

<script>
(function () {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("scoreEl");
  const bestEl = document.getElementById("bestEl");
  const comboEl = document.getElementById("comboEl");
  const livesEl = document.getElementById("livesEl");
  const hintEl = document.getElementById("hint");
  const bannerEl = document.getElementById("banner");
  const flashEl = document.getElementById("flash");
  const startOverlay = document.getElementById("overlay");
  const startBtn = document.getElementById("startBtn");
  const gearBtn = document.getElementById("gearBtn");
  const settingsPanel = document.getElementById("settingsPanel");
  const soundToggle = document.getElementById("soundToggle");
  const closeSettings = document.getElementById("closeSettings");

  // ---------- Settings ----------
  let soundEnabled = localStorage.getItem("beeHitSound") !== "false";
  soundToggle.checked = soundEnabled;
  soundToggle.addEventListener("change", () => { soundEnabled = soundToggle.checked; localStorage.setItem("beeHitSound", String(soundEnabled)); });
  gearBtn.addEventListener("click", () => settingsPanel.classList.add("show"));
  closeSettings.addEventListener("click", () => settingsPanel.classList.remove("show"));

  // ---------- Canvas sizing: fixed virtual world, letterboxed & scaled to fit screen ----------
  let DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;
  const WORLD_W = 360, WORLD_H = 640;
  let vscale = 1, offX = 0, offY = 0;
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    vscale = Math.min(W / WORLD_W, H / WORLD_H);
    offX = (W - WORLD_W * vscale) / 2;
    offY = (H - WORLD_H * vscale) / 2;
  }
  window.addEventListener("resize", resize);
  resize();

  function toWorld(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return { x: (clientX - rect.left - offX) / vscale, y: (clientY - rect.top - offY) / vscale };
  }

  // ---------- Audio ----------
  let audioCtx = null;
  function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  function tone(type, freq, freqEnd, dur, gainAmt, delay) {
    if (!soundEnabled || !audioCtx) return;
    delay = delay || 0;
    const now = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd, 1), now + dur);
    gain.gain.setValueAtTime(gainAmt, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + dur + 0.02);
  }
  function sfxHit() { tone("triangle", 520, 780, 0.12, 0.18); }
  function sfxGolden() { tone("triangle", 660, 1100, 0.18, 0.2); tone("sine", 990, 1400, 0.2, 0.12, 0.06); }
  function sfxSting() { tone("sawtooth", 220, 90, 0.28, 0.22); }
  function sfxAvoid() { tone("sine", 400, 500, 0.15, 0.12); }
  function sfxMiss() { tone("square", 180, 140, 0.08, 0.06); }
  function sfxEscape() { tone("sawtooth", 300, 160, 0.2, 0.15); }
  function sfxOver() { tone("sawtooth", 260, 60, 0.5, 0.2); }

  // ---------- Grid / holes ----------
  const HOLE_R = 40;
  const holes = [
    { x: 80, y: 250 }, { x: 180, y: 240 }, { x: 280, y: 250 },
    { x: 80, y: 380 }, { x: 180, y: 390 }, { x: 280, y: 380 },
    { x: 80, y: 510 }, { x: 180, y: 500 }, { x: 280, y: 510 },
  ].map((h, i) => ({
    id: i, x: h.x, y: h.y,
    state: "idle", // idle, rising, up, retreating, hit
    type: null,    // bee, golden, hornet
    t: 0,          // ms elapsed in current state
    riseMs: 140, holdMs: 500,
    bobPhase: Math.random() * Math.PI * 2,
    wingPhase: Math.random() * Math.PI * 2,
    hitTimer: 0,
    floatTexts: [],
  }));

  // ---------- Game state ----------
  let running = false;
  let score = 0, combo = 0, lives = 3;
  let best = parseInt(localStorage.getItem("beeHitBest") || "0", 10);
  bestEl.textContent = best;
  let spawnTimer = 0;
  let particles = [];
  let floaters = [];
  let shakeT = 0, shakeMag = 0;
  let pointerX = 180, pointerY = 400, pointerDown = false, swingT = 0;
  let lastTs = 0;

  function difficultyExposeMs() { return Math.max(900 - score * 0.6, 450); }
  function difficultySpawnMs() { return Math.max(700 - score * 0.4, 320); }
  function maxConcurrent() { return score < 100 ? 1 : (score < 300 ? 2 : 3); }
  function pHornet() { return Math.min(0.15 + score * 0.0002, 0.30); }
  function pGolden() { return 0.08; }

  function activeCount() {
    return holes.filter(h => h.state === "rising" || h.state === "up" || h.state === "retreating").length;
  }

  function pickType() {
    const r = Math.random();
    const ph = pHornet(), pg = pGolden();
    if (r < ph) return "hornet";
    if (r < ph + pg) return "golden";
    return "bee";
  }

  function trySpawn() {
    if (activeCount() >= maxConcurrent()) return;
    const idle = holes.filter(h => h.state === "idle");
    if (idle.length === 0) return;
    const h = idle[Math.floor(Math.random() * idle.length)];
    h.type = pickType();
    h.state = "rising"; h.t = 0;
    h.riseMs = 140;
    const expose = difficultyExposeMs() * (h.type === "golden" ? 0.65 : 1);
    h.holdMs = Math.max(expose - h.riseMs * 2, 150);
    h.wingPhase = Math.random() * Math.PI * 2;
  }

  function resetGame() {
    score = 0; combo = 0; lives = 3;
    spawnTimer = 0;
    particles = []; floaters = [];
    holes.forEach(h => { h.state = "idle"; h.type = null; h.t = 0; });
    updateHud();
  }

  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
    comboEl.textContent = "连击 " + combo;
    comboEl.classList.toggle("hot", combo >= 5);
    let hearts = "";
    for (let i = 0; i < 3; i++) hearts += i < lives ? "🌼" : "🥀";
    livesEl.textContent = hearts;
  }

  function showBanner(text, cls, ms) {
    bannerEl.textContent = text;
    bannerEl.className = cls || "";
    bannerEl.style.display = "block";
    clearTimeout(showBanner._t);
    showBanner._t = setTimeout(() => { bannerEl.style.display = "none"; }, ms || 800);
  }

  function flashScreen() {
    flashEl.style.opacity = "0.5";
    setTimeout(() => { flashEl.style.opacity = "0"; }, 90);
  }

  function shake(mag, dur) { shakeMag = mag; shakeT = dur; }

  function spawnParticles(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const spd = 60 + Math.random() * 120;
      particles.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd - 40, life: 0.5 + Math.random() * 0.3, t: 0, color, r: 2 + Math.random() * 2.5 });
    }
  }

  function addFloater(x, y, text, color) {
    floaters.push({ x, y, text, color, t: 0, life: 0.8 });
  }

  const MILESTONES = [100, 250, 500, 1000, 2000];
  let firedMilestones = new Set();
  function checkMilestone() {
    for (const m of MILESTONES) {
      if (score >= m && !firedMilestones.has(m)) {
        firedMilestones.add(m);
        showBanner(m >= 1000 ? "蜂王传说! " + m : "蜂群猎手! " + m, "", 1000);
      }
    }
  }

  function comboMultiplier() { return 1 + Math.min(Math.floor(combo / 5) * 0.5, 2); }

  function onPositive(h, baseScore, label, color) {
    combo++;
    const gained = Math.round(baseScore * comboMultiplier());
    score += gained;
    if (score > best) { best = score; localStorage.setItem("beeHitBest", String(best)); }
    addFloater(h.x, h.y - 20, "+" + gained + (label ? " " + label : ""), color || "#ffd54f");
    updateHud();
    checkMilestone();
  }

  function onNegative(h, lifeLoss, reason) {
    combo = 0;
    if (lifeLoss) {
      lives = Math.max(0, lives - 1);
      shake(6, 0.25);
      flashScreen();
    }
    updateHud();
    if (lives <= 0) endGame();
  }

  function hitHole(h) {
    if (h.state !== "rising" && h.state !== "up" && h.state !== "retreating") return false;
    if (h.type === "bee") {
      sfxHit();
      onPositive(h, 10, "", "#fff59d");
      spawnParticles(h.x, h.y - 20, "#ffd54f", 10);
    } else if (h.type === "golden") {
      sfxGolden();
      onPositive(h, 50, "金蜂!", "#ffe082");
      spawnParticles(h.x, h.y - 20, "#ffe082", 18);
      shake(3, 0.15);
    } else if (h.type === "hornet") {
      sfxSting();
      showBanner("被蜇了!", "sting", 700);
      addFloater(h.x, h.y - 20, "-1 命", "#ff6b6b");
      onNegative(h, true, "sting");
      spawnParticles(h.x, h.y - 20, "#8d4a1e", 10);
    }
    h.state = "hit"; h.t = 0;
    return true;
  }

  function onTap(wx, wy) {
    swingT = 0.18;
    // find nearest hittable hole under tap (topmost priority = closest)
    let best_ = null, bestD = 1e9;
    for (const h of holes) {
      if (h.state !== "rising" && h.state !== "up" && h.state !== "retreating") continue;
      const dd = Math.hypot(h.x - wx, (h.y - 18) - wy);
      if (dd < 46 && dd < bestD) { bestD = dd; best_ = h; }
    }
    if (best_) {
      hitHole(best_);
    } else {
      sfxMiss();
    }
  }

  function endGame() {
    running = false;
    sfxOver();
    showEndOverlay();
  }

  function showEndOverlay() {
    startOverlay.innerHTML = '<div class="glass-panel">' +
      '<h1>🐝 游戏结束</h1>' +
      '<div id="finalScoreVal">' + score + '</div>' +
      '<div id="bestScoreLine">最高分 ' + best + '</div>' +
      '<button class="btn" id="restartBtn">再玩一次</button>' +
      '</div>';
    startOverlay.classList.add("show");
    document.getElementById("restartBtn").addEventListener("click", startGame);
  }

  function startGame() {
    initAudio();
    resetGame();
    startOverlay.classList.remove("show");
    running = true;
  }

  startBtn.addEventListener("click", startGame);

  canvas.addEventListener("pointerdown", (e) => {
    pointerDown = true;
    const p = toWorld(e.clientX, e.clientY);
    pointerX = p.x; pointerY = p.y;
    if (running) onTap(p.x, p.y);
  });
  canvas.addEventListener("pointermove", (e) => {
    const p = toWorld(e.clientX, e.clientY);
    pointerX = p.x; pointerY = p.y;
  });
  window.addEventListener("pointerup", () => { pointerDown = false; });

  // ---------- Drawing ----------
  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, WORLD_H);
    g.addColorStop(0, "#8ed1f0");
    g.addColorStop(0.35, "#bfe8b0");
    g.addColorStop(1, "#6fae4a");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, WORLD_W, WORLD_H);
    // sun
    ctx.fillStyle = "rgba(255,244,180,0.9)";
    ctx.beginPath(); ctx.arc(300, 60, 34, 0, Math.PI * 2); ctx.fill();
    // clouds
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    [[60, 90, 26], [100, 100, 18], [40, 105, 16]].forEach(([dx, dy, r]) => {
      ctx.beginPath(); ctx.arc(dx, dy, r, 0, Math.PI * 2); ctx.fill();
    });
  }

  function drawHole(h) {
    ctx.save();
    ctx.translate(h.x, h.y);
    // mound / hive base
    const grd = ctx.createRadialGradient(0, 0, 4, 0, 0, HOLE_R);
    grd.addColorStop(0, "#3a2410");
    grd.addColorStop(1, "#7a4a1e");
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.ellipse(0, 10, HOLE_R, HOLE_R * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#1e1408";
    ctx.beginPath();
    ctx.ellipse(0, 6, HOLE_R * 0.68, HOLE_R * 0.36, 0, 0, Math.PI * 2);
    ctx.fill();
    // little flowers around
    ctx.fillStyle = "#ffe4ec";
    for (let i = 0; i < 3; i++) {
      const a = i * 2.2 + h.bobPhase;
      const fx = Math.cos(a) * (HOLE_R + 6), fy = 12 + Math.sin(a) * (HOLE_R * 0.5);
      ctx.beginPath(); ctx.arc(fx, fy, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawCritter(h, popFrac) {
    // popFrac: 0 = hidden in hole, 1 = fully up
    const cx = h.x, cy = h.y + 6 - popFrac * 34;
    const bob = Math.sin(h.bobPhase) * 2;
    ctx.save();
    ctx.translate(cx, cy + bob);
    const scale = 0.5 + 0.5 * popFrac;
    ctx.scale(scale, scale);

    const wingFlap = Math.sin(h.wingPhase) * 0.5 + 0.5;
    let bodyColor1, bodyColor2, stripeColor, angry = false, crown = false;
    if (h.type === "bee") { bodyColor1 = "#ffd54f"; bodyColor2 = "#ffca28"; stripeColor = "#3a2a0a"; }
    else if (h.type === "golden") { bodyColor1 = "#fffde7"; bodyColor2 = "#ffb300"; stripeColor = "#8a5a00"; crown = true; }
    else { bodyColor1 = "#a9673a"; bodyColor2 = "#6b3d1f"; stripeColor = "#241408"; angry = true; }

    // golden glow halo + sparkles — kept visually distinct from the regular bee's flat yellow
    if (h.type === "golden") {
      const pulse = 0.6 + Math.sin(h.wingPhase * 0.6) * 0.4;
      const glowR = 30 + pulse * 6;
      const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, glowR);
      glow.addColorStop(0, "rgba(255,236,140,0.55)");
      glow.addColorStop(1, "rgba(255,236,140,0)");
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(0, 0, glowR, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(255,250,205,0.9)";
      for (let i = 0; i < 3; i++) {
        const a = h.wingPhase * 1.3 + i * 2.1;
        const sr = 22 + Math.sin(h.wingPhase + i) * 4;
        const spx = Math.cos(a) * sr, spy = Math.sin(a) * sr;
        ctx.save();
        ctx.translate(spx, spy);
        ctx.rotate(a);
        ctx.beginPath();
        ctx.moveTo(0, -3.5); ctx.lineTo(1, 0); ctx.lineTo(0, 3.5); ctx.lineTo(-1, 0);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }

    // wings
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.save();
    ctx.rotate(-0.5 - wingFlap * 0.3);
    ctx.beginPath(); ctx.ellipse(-6, -16, 11, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.rotate(0.5 + wingFlap * 0.3);
    ctx.beginPath(); ctx.ellipse(6, -16, 11, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // body
    const bg = ctx.createLinearGradient(0, -18, 0, 18);
    bg.addColorStop(0, bodyColor1); bg.addColorStop(1, bodyColor2);
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.ellipse(0, 0, 18, 16, 0, 0, Math.PI * 2);
    ctx.fill();

    // stripes
    ctx.strokeStyle = stripeColor;
    ctx.lineWidth = 4;
    for (let sx = -9; sx <= 9; sx += 9) {
      ctx.beginPath();
      ctx.moveTo(sx, -14);
      ctx.lineTo(sx, 14);
      ctx.stroke();
    }

    // crown for golden
    if (crown) {
      ctx.fillStyle = "#ffd700";
      ctx.beginPath();
      ctx.moveTo(-8, -18); ctx.lineTo(-8, -26); ctx.lineTo(-3, -19);
      ctx.lineTo(0, -28); ctx.lineTo(3, -19); ctx.lineTo(8, -26); ctx.lineTo(8, -18);
      ctx.closePath(); ctx.fill();
    }

    // eyes
    ctx.fillStyle = angry ? "#ff3b3b" : "#1a1a1a";
    ctx.beginPath(); ctx.arc(-6, -3, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(6, -3, 2.6, 0, Math.PI * 2); ctx.fill();
    if (angry) {
      ctx.strokeStyle = "#1a1a1a"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-9, -7); ctx.lineTo(-3, -5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(9, -7); ctx.lineTo(3, -5); ctx.stroke();
    }

    // antenna
    ctx.strokeStyle = "#1a1a1a"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-4, -14); ctx.quadraticCurveTo(-8, -22, -10, -24); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4, -14); ctx.quadraticCurveTo(8, -22, 10, -24); ctx.stroke();

    // stinger
    ctx.fillStyle = stripeColor;
    ctx.beginPath();
    ctx.moveTo(0, 15); ctx.lineTo(-3, 21); ctx.lineTo(3, 21);
    ctx.closePath(); ctx.fill();

    ctx.restore();
  }

  function drawSwatter() {
    ctx.save();
    ctx.translate(pointerX, pointerY);
    const swing = swingT > 0 ? Math.sin((0.18 - swingT) / 0.18 * Math.PI) : 0;
    ctx.rotate(-0.5 + swing * 0.9);
    ctx.fillStyle = "rgba(90,60,20,0.9)";
    ctx.fillRect(-3, 0, 6, 30);
    ctx.strokeStyle = "rgba(255,213,79,0.9)";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(0, -14, 16, 12, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  function draw() {
    ctx.save();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.translate(offX, offY);
    ctx.scale(vscale, vscale);

    let shx = 0, shy = 0;
    if (shakeT > 0) { shx = (Math.random() - 0.5) * shakeMag; shy = (Math.random() - 0.5) * shakeMag; }
    ctx.translate(shx, shy);

    drawBackground();

    for (const h of holes) {
      drawHole(h);
      if (h.state === "rising") drawCritter(h, Math.min(h.t / h.riseMs, 1));
      else if (h.state === "up") drawCritter(h, 1);
      else if (h.state === "retreating") drawCritter(h, Math.max(1 - h.t / h.riseMs, 0));
      else if (h.state === "hit") {
        // squish pop
        const f = h.t / 220;
        ctx.save();
        ctx.globalAlpha = Math.max(1 - f, 0);
        drawCritter(h, Math.max(1 - f * 1.4, 0));
        ctx.restore();
      }
    }

    // particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(1 - p.t / p.life, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // floaters
    ctx.textAlign = "center";
    ctx.font = "800 15px Outfit, sans-serif";
    for (const f of floaters) {
      ctx.globalAlpha = Math.max(1 - f.t / f.life, 0);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y - f.t * 30);
    }
    ctx.globalAlpha = 1;

    drawSwatter();

    ctx.restore();
  }

  function update(dt) {
    if (running) {
      spawnTimer += dt * 1000;
      const interval = difficultySpawnMs();
      if (spawnTimer >= interval) {
        spawnTimer = 0;
        trySpawn();
      }
    }

    for (const h of holes) {
      h.bobPhase += dt * 4;
      h.wingPhase += dt * 22;
      if (h.state === "idle") continue;
      h.t += dt * 1000;
      if (h.state === "rising" && h.t >= h.riseMs) { h.state = "up"; h.t = 0; }
      else if (h.state === "up" && h.t >= h.holdMs) { h.state = "retreating"; h.t = 0; }
      else if (h.state === "retreating" && h.t >= h.riseMs) {
        // escaped un-hit
        if (h.type === "hornet") {
          sfxAvoid();
          onPositive(h, 5, "闪避!", "#a7f3d0");
        } else {
          sfxEscape();
          addFloater(h.x, h.y - 20, "跑了", "#ff9e5e");
          onNegative(h, true, "escape");
        }
        h.state = "idle"; h.type = null; h.t = 0;
      } else if (h.state === "hit" && h.t >= 220) {
        h.state = "idle"; h.type = null; h.t = 0;
      }
    }

    particles.forEach(p => { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; });
    particles = particles.filter(p => p.t < p.life);
    floaters.forEach(f => { f.t += dt; });
    floaters = floaters.filter(f => f.t < f.life);

    if (shakeT > 0) shakeT -= dt;
    if (swingT > 0) swingT -= dt;
  }

  function loop(ts) {
    if (!lastTs) lastTs = ts;
    let dt = (ts - lastTs) / 1000;
    dt = Math.min(dt, 0.05);
    lastTs = ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ---------- Debug hook ----------
  window.__beeDebug = {
    getState: () => ({ running, score, combo, lives, best }),
    getHoles: () => holes.map(h => ({ id: h.id, state: h.state, type: h.type, t: h.t })),
    forceSpawn: (idx, type) => {
      const h = holes[idx];
      if (!h) return false;
      h.type = type || "bee"; h.state = "up"; h.t = 0; h.riseMs = 140; h.holdMs = 5000;
      return true;
    },
    forceHit: (idx) => {
      const h = holes[idx];
      if (!h) return false;
      return hitHole(h);
    },
    setLives: (n) => { lives = n; updateHud(); },
    setScore: (n) => { score = n; updateHud(); },
    forceStart: () => { startGame(); },
    forceEnd: () => { endGame(); },
    project: (x, y) => ({ x: x * vscale + offX, y: y * vscale + offY }),
  };
})();
</script>
</body>
