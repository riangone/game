<script>
const QUOTES_BANK = [
  { text: '生活原本沉闷，但跑起来就有风。', from: '网络' },
  { text: '凡是过往，皆为序章。', from: '莎士比亚《暴风雨》' },
  { text: '愿你历尽千帆，归来仍是少年。', from: '网络' },
  { text: '架构的本质，是在混沌中建立清晰的秩序。', from: 'Architect' },
  { text: '保持热爱，奔赴山海。', from: '网络' }
];

async function fetchQuote() {
  try {
    const res = await fetch('https://v1.hitokoto.cn');
    if (!res.ok) throw new Error();
    const data = await res.json();
    document.getElementById('qText').textContent = '“' + data.hitokoto + '”';
    document.getElementById('qFrom').textContent = '—— ' + (data.from_who ? data.from_who + ' ' : '') + '《' + data.from + '》';
  } catch (e) {
    const rnd = QUOTES_BANK[Math.floor(Math.random() * QUOTES_BANK.length)];
    document.getElementById('qText').textContent = '“' + rnd.text + '”';
    document.getElementById('qFrom').textContent = '—— ' + rnd.from;
  }
}

function applyTheme() {
  const theme = document.getElementById('themeSelect').value;
  const font = document.getElementById('fontSelect').value;
  const paper = document.getElementById('paper');

  paper.style.fontFamily = font;
  if (theme === 'minimal') {
    paper.style.background = '#ffffff';
    paper.style.color = '#0f172a';
    paper.style.border = '1px solid #e2e8f0';
  } else if (theme === 'dark') {
    paper.style.background = '#111827';
    paper.style.color = '#f9fafb';
    paper.style.border = '1px solid #374151';
  } else if (theme === 'sunset') {
    paper.style.background = 'linear-gradient(135deg, #fbcfe8, #fed7aa)';
    paper.style.color = '#831843';
    paper.style.border = 'none';
  } else if (theme === 'kraft') {
    paper.style.background = '#d7c4a3';
    paper.style.color = '#3e2723';
    paper.style.border = 'none';
  }
}

function exportCardImage() {
  const paper = document.getElementById('paper');
  const text = document.getElementById('qText').textContent;
  const from = document.getElementById('qFrom').textContent;
  const seal = document.getElementById('sealEl').textContent;
  const theme = document.getElementById('themeSelect').value;

  const cv = document.createElement('canvas');
  cv.width = 840;
  cv.height = 560;
  const ctx = cv.getContext('2d');

  // Background
  if (theme === 'dark') ctx.fillStyle = '#111827';
  else if (theme === 'sunset') {
    const grad = ctx.createLinearGradient(0, 0, 840, 560);
    grad.addColorStop(0, '#fbcfe8'); grad.addColorStop(1, '#fed7aa');
    ctx.fillStyle = grad;
  } else if (theme === 'kraft') ctx.fillStyle = '#d7c4a3';
  else ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, 840, 560);

  // Text
  ctx.fillStyle = theme === 'dark' ? '#f9fafb' : (theme === 'sunset' ? '#831843' : (theme === 'kraft' ? '#3e2723' : '#0f172a'));
  ctx.font = '32px serif';
  ctx.textAlign = 'center';
  ctx.fillText(text, 420, 240);

  ctx.font = '22px serif';
  ctx.textAlign = 'right';
  ctx.fillText(from, 740, 360);

  // Seal
  ctx.strokeStyle = '#ef4444';
  ctx.lineWidth = 3;
  ctx.strokeRect(80, 420, 60, 60);
  ctx.fillStyle = '#ef4444';
  ctx.font = 'bold 20px serif';
  ctx.textAlign = 'center';
  ctx.fillText(seal, 110, 458);

  const a = document.createElement('a');
  a.href = cv.toDataURL('image/png');
  a.download = 'quote_card_' + Date.now() + '.png';
  a.click();
  showToast('卡片图片已生成导出！');
}

window.addEventListener('DOMContentLoaded', applyTheme);
</script>

<script>
function initTheme(){
  const saved=localStorage.getItem('app_theme');
  if(saved){document.documentElement.setAttribute('data-theme',saved);}
  else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const target=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',target);
  localStorage.setItem('app_theme',target);
}
initTheme();
function showToast(msg, duration=2200){
  const el=document.createElement('div');
  el.textContent=msg;
  el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:9999px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 10px 25px rgba(0,0,0,.2);transition:opacity .3s;';
  document.body.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),300);},duration);
}
</script>
