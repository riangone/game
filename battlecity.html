<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>坦克大战 - Battle City</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0b1108;
    font-family: 'Outfit', "PingFang SC", "Microsoft YaHei", sans-serif;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #game { display: block; width: 100%; height: 100%; cursor: none; }

  #hud {
    position: fixed; top: 0; left: 0; width: 100%;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 20px 24px; box-sizing: border-box; pointer-events: none;
    z-index: 5;
  }
  .hud-card {
    background: rgba(16, 26, 14, 0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(160, 255, 120, 0.25);
    border-radius: 16px;
    padding: 12px 20px;
    color: #fff;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.35);
  }
  #score-container { display: flex; gap: 14px; }
  .hud-value-highlight { font-size: 28px; font-weight: 800; color: #b6ff5c; line-height: 1.1; margin-top: 2px;}
  .hud-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.75; margin-bottom: 2px; }
  .hud-value { font-size: 14px; opacity: 0.95; }
  #waveEl { font-size: 18px; font-weight: 700; color: #ffd54f; margin-top: 4px; }
  #livesEl { font-size: 16px; letter-spacing: 2px; margin-top: 4px; }
  #baseEl { font-size: 13px; margin-top: 4px; opacity: 0.9; }
  #levelEl { font-size: 13px; margin-top: 4px; color: #7ef9ff; }

  #hint {
    position: fixed; top: 138px; left: 50%; transform: translateX(-50%);
    text-align: center; color: #fff; opacity: 0.9; font-size: 12.5px;
    pointer-events: none; z-index: 5;
    background: rgba(16, 26, 14, 0.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(160, 255, 120, 0.25);
    padding: 7px 20px;
    border-radius: 20px;
    max-width: 90vw; box-sizing: border-box;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    transition: opacity 0.3s ease;
    white-space: normal;
  }

  #banner {
    position: fixed; top: 34%; left: 50%; transform: translate(-50%, -50%);
    color: #fff; font-size: 21px; font-weight: 800;
    background: rgba(182, 255, 92, 0.18);
    border: 1px solid rgba(182, 255, 92, 0.55);
    padding: 10px 28px; border-radius: 16px;
    display: none; z-index: 6; pointer-events: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    text-align: center;
  }
  #banner.hurt { background: rgba(239, 68, 68, 0.28); border-color: rgba(239,68,68,0.75); color: #fee2e2; }
  #banner.gold { background: rgba(255, 213, 79, 0.24); border-color: rgba(255,213,79,0.7); color: #fff8e1; }
  #banner.doom { background: rgba(239, 68, 68, 0.4); border-color: rgba(239,68,68,0.9); color: #fff; }

  #flash {
    position: fixed; inset: 0; background: #ef4444; opacity: 0; pointer-events: none; z-index: 7;
    transition: opacity 0.08s ease;
  }

  #overlay {
    position: fixed; inset: 0; background: rgba(4, 10, 3, 0.68);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; backdrop-filter: blur(8px); z-index: 9;
  }
  #overlay.show { display: flex; }

  .glass-panel {
    background: rgba(255, 255, 255, 0.10);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(182, 255, 92, 0.3);
    border-radius: 24px;
    padding: 32px 36px;
    text-align: center;
    max-width: 340px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    color: #fff;
  }
  .glass-panel h1 { font-size: 26px; margin: 0 0 6px; font-weight: 800; }
  .glass-panel p { font-size: 13px; opacity: 0.85; line-height: 1.6; margin: 4px 0 18px; }
  .btn {
    background: linear-gradient(135deg, #b6ff5c, #4fbf6a);
    border: none; color: #0b1108; font-weight: 800; font-size: 16px;
    padding: 13px 34px; border-radius: 14px; cursor: pointer;
    box-shadow: 0 8px 20px rgba(182, 255, 92, 0.35);
    pointer-events: auto;
  }
  .btn:active { transform: scale(0.96); }
  #finalScoreVal { font-size: 46px; font-weight: 800; color: #b6ff5c; margin: 6px 0; }
  #bestScoreLine { font-size: 13px; opacity: 0.85; margin-bottom: 18px; }

  #gearBtn {
    position: fixed; bottom: 18px; right: 18px; width: 44px; height: 44px;
    border-radius: 50%; background: rgba(16,26,14,0.55); border: 1px solid rgba(182,255,92,0.25);
    color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center;
    z-index: 8; cursor: pointer; pointer-events: auto; backdrop-filter: blur(8px);
  }
  #settingsPanel {
    position: fixed; inset: 0; background: rgba(4,10,3,0.65); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; z-index: 10;
  }
  #settingsPanel.show { display: flex; }
  .setting-row { display: flex; align-items: center; justify-content: space-between; margin: 12px 0; gap: 16px; }
  .setting-row span { font-size: 14px; }
  .switch { position: relative; width: 44px; height: 24px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider-toggle { position: absolute; cursor: pointer; inset: 0; background: rgba(255,255,255,0.25); border-radius: 24px; transition: 0.2s; }
  .slider-toggle:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: 0.2s; }
  input:checked + .slider-toggle { background: #4fbf6a; }
  input:checked + .slider-toggle:before { transform: translateX(20px); }
  #closeSettings { margin-top: 10px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="flash"></div>

<div id="hud">
  <div class="hud-card">
    <div id="score-container">
      <div>
        <div class="hud-label">SCORE</div>
        <div class="hud-value-highlight" id="scoreEl">0</div>
      </div>
      <div>
        <div class="hud-label">BEST</div>
        <div class="hud-value" id="bestEl" style="margin-top:6px;">0</div>
      </div>
    </div>
    <div id="waveEl">WAVE 1</div>
    <div id="levelEl">火力 ★☆☆</div>
  </div>
  <div class="hud-card">
    <div class="hud-label">生命</div>
    <div id="livesEl">🚙🚙🚙</div>
    <div id="baseEl">🦅 基地完好</div>
  </div>
</div>

<div id="hint">按住并拖动方向操纵坦克移动，坦克会自动朝面向方向开火。摧毁敌方坦克，守住基地不被攻破！</div>
<div id="banner"></div>

<div id="overlay" class="show">
  <div class="glass-panel">
    <h1>🎮 坦克大战</h1>
    <p>经典 FC《坦克大战》复刻：拖动操纵坦克在砖墙迷宫中移动并自动开火，消灭敌方坦克波次推进。捡取 ⭐火力/🛡护盾/💣手雷/❤️生命 道具。<b>基地一旦被摧毁立即游戏结束</b>——无论你还剩几条命，所以别光顾着推进，回头看看家门口。</p>
    <button class="btn" id="startBtn">开始游戏</button>
  </div>
</div>

<div id="settingsPanel">
  <div class="glass-panel">
    <h1 style="font-size:20px;">设置</h1>
    <div class="setting-row">
      <span>音效</span>
      <label class="switch"><input type="checkbox" id="soundToggle"><span class="slider-toggle"></span></label>
    </div>
    <button class="btn" id="closeSettings">关闭</button>
  </div>
</div>

<div id="gearBtn">⚙</div>

<script>
(function () {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("scoreEl");
  const bestEl = document.getElementById("bestEl");
  const waveEl = document.getElementById("waveEl");
  const levelEl = document.getElementById("levelEl");
  const livesEl = document.getElementById("livesEl");
  const baseEl = document.getElementById("baseEl");
  const bannerEl = document.getElementById("banner");
  const flashEl = document.getElementById("flash");
  const startOverlay = document.getElementById("overlay");
  const startBtn = document.getElementById("startBtn");
  const gearBtn = document.getElementById("gearBtn");
  const settingsPanel = document.getElementById("settingsPanel");
  const soundToggle = document.getElementById("soundToggle");
  const closeSettings = document.getElementById("closeSettings");

  // ---------- Settings ----------
  let soundEnabled = localStorage.getItem("battlecitySound") !== "false";
  soundToggle.checked = soundEnabled;
  soundToggle.addEventListener("change", () => { soundEnabled = soundToggle.checked; localStorage.setItem("battlecitySound", String(soundEnabled)); });
  gearBtn.addEventListener("click", () => settingsPanel.classList.add("show"));
  closeSettings.addEventListener("click", () => settingsPanel.classList.remove("show"));

  // ---------- Canvas sizing: fixed virtual world, letterboxed & scaled to fit screen ----------
  let DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;
  const WORLD_W = 360, WORLD_H = 640;
  let vscale = 1, offX = 0, offY = 0;
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    vscale = Math.min(W / WORLD_W, H / WORLD_H);
    offX = (W - WORLD_W * vscale) / 2;
    offY = (H - WORLD_H * vscale) / 2;
  }
  window.addEventListener("resize", resize);
  resize();

  function toWorld(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return { x: (clientX - rect.left - offX) / vscale, y: (clientY - rect.top - offY) / vscale };
  }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // ---------- Audio ----------
  let audioCtx = null;
  function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  function tone(type, freq, freqEnd, dur, gainAmt, delay) {
    if (!soundEnabled || !audioCtx) return;
    delay = delay || 0;
    const now = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd, 1), now + dur);
    gain.gain.setValueAtTime(gainAmt, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + dur + 0.02);
  }
  function sfxShoot() { tone("square", 700, 900, 0.05, 0.045); }
  function sfxBrick() { tone("sawtooth", 260, 90, 0.1, 0.13); }
  function sfxSteel() { tone("square", 1400, 1200, 0.05, 0.06); }
  function sfxExplode() { tone("sawtooth", 320, 50, 0.2, 0.18); }
  function sfxHurt() { tone("sawtooth", 220, 60, 0.35, 0.22); }
  function sfxPowerup() { tone("sine", 500, 1100, 0.28, 0.16); }
  function sfxExtraLife() { tone("sine", 660, 1320, 0.4, 0.18); }
  function sfxWaveClear() { tone("triangle", 520, 1040, 0.5, 0.16); }
  function sfxBaseDoom() { tone("sawtooth", 200, 30, 0.9, 0.28); tone("sawtooth", 140, 20, 1.1, 0.2, 0.1); }
  function sfxOver() { tone("sawtooth", 260, 40, 0.6, 0.22); }

  // ---------- Grid / map ----------
  const TILE = 24, COLS = 14, ROWS = 24;
  const GRID_W = COLS * TILE, GRID_H = ROWS * TILE;
  const OFF_X = (WORLD_W - GRID_W) / 2, OFF_Y = (WORLD_H - GRID_H) / 2;
  const T_EMPTY = 0, T_BRICK = 1, T_STEEL = 2, T_WATER = 3, T_BASE = 4;
  const BASE_COL = 6, BASE_ROW = ROWS - 1;
  const PLAYER_SPAWN = { col: 3, row: ROWS - 2 };
  const ENEMY_SPAWN_COLS = [1, 6, 12];
  const BAND_ROW = ROWS - 6;

  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  let grid = [];
  function tileCenter(col, row) { return { x: OFF_X + col * TILE + TILE / 2, y: OFF_Y + row * TILE + TILE / 2 }; }
  function tileTopLeft(col, row) { return { x: OFF_X + col * TILE, y: OFF_Y + row * TILE }; }
  function inBounds(col, row) { return col >= 0 && col < COLS && row >= 0 && row < ROWS; }

  function buildMap(wave) {
    const rng = mulberry32(wave * 100003 + 7);
    const g = [];
    for (let r = 0; r < ROWS; r++) { g.push(new Array(COLS).fill(T_EMPTY)); }

    const clear = new Set();
    for (let c = 0; c < COLS; c++) clear.add("0," + c); // spawn row
    for (let c = 0; c < COLS; c++) clear.add(BAND_ROW + "," + c); // connective band
    for (const sc of ENEMY_SPAWN_COLS) {
      for (let r = 0; r <= BAND_ROW; r++) clear.add(r + "," + sc);
    }
    for (let r = BAND_ROW; r <= BASE_ROW - 2; r++) clear.add(r + "," + BASE_COL);
    clear.add(PLAYER_SPAWN.row + "," + PLAYER_SPAWN.col);
    clear.add((PLAYER_SPAWN.row - 1) + "," + PLAYER_SPAWN.col);

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (clear.has(r + "," + c)) continue;
        const roll = rng();
        if (roll < 0.06) g[r][c] = T_STEEL;
        else if (roll < 0.11) g[r][c] = T_WATER;
        else if (roll < 0.44) g[r][c] = T_BRICK;
        else g[r][c] = T_EMPTY;
      }
    }

    // base fortress: enclose the base on all 4 sides with brick
    g[BASE_ROW][BASE_COL] = T_BASE;
    g[BASE_ROW - 1][BASE_COL - 1] = T_BRICK;
    g[BASE_ROW - 1][BASE_COL] = T_BRICK;
    g[BASE_ROW - 1][BASE_COL + 1] = T_BRICK;
    g[BASE_ROW][BASE_COL - 1] = T_BRICK;
    g[BASE_ROW][BASE_COL + 1] = T_BRICK;

    // player spawn area always clear
    g[PLAYER_SPAWN.row][PLAYER_SPAWN.col] = T_EMPTY;
    g[PLAYER_SPAWN.row - 1][PLAYER_SPAWN.col] = T_EMPTY;
    for (const sc of ENEMY_SPAWN_COLS) g[0][sc] = T_EMPTY;

    return g;
  }

  // BFS reachability check (empty tiles only) used at map-build time as a safety net;
  // guaranteed lanes above already ensure this always passes, this just patches any
  // logic error defensively rather than ever leaving a truly unsolvable map.
  function ensureReachable(g) {
    function bfsReachable(fromCol, fromRow, toCol, toRow) {
      const seen = new Set();
      const q = [[fromCol, fromRow]];
      seen.add(fromCol + "," + fromRow);
      while (q.length) {
        const [c, r] = q.shift();
        if (c === toCol && r === toRow) return true;
        for (const [dc, dr] of [[1,0],[-1,0],[0,1],[0,-1]]) {
          const nc = c + dc, nr = r + dr;
          if (!inBounds(nc, nr)) continue;
          const key = nc + "," + nr;
          if (seen.has(key)) continue;
          if (g[nr][nc] === T_BRICK || g[nr][nc] === T_STEEL || g[nr][nc] === T_WATER) continue;
          seen.add(key);
          q.push([nc, nr]);
        }
      }
      return false;
    }
    const targetCol = BASE_COL, targetRow = BASE_ROW - 2;
    for (const sc of ENEMY_SPAWN_COLS) {
      if (!bfsReachable(sc, 0, targetCol, targetRow)) {
        // patch: carve a straight path down sc to band row, across to targetCol, down to target
        for (let r = 0; r <= BAND_ROW; r++) g[r][sc] = T_EMPTY;
        for (let c = Math.min(sc, targetCol); c <= Math.max(sc, targetCol); c++) g[BAND_ROW][c] = T_EMPTY;
        for (let r = BAND_ROW; r <= targetRow; r++) g[r][targetCol] = T_EMPTY;
      }
    }
    return g;
  }

  // ---------- Enemy type table ----------
  const ENEMY_TYPES = {
    basic: { hp: 1, speed: 66, fireMs: 1500, color: "#c7d2c2", dark: "#7c8a76", points: 100 },
    fast:  { hp: 1, speed: 128, fireMs: 1150, color: "#7ef2ff", dark: "#2b93a8", points: 150 },
    power: { hp: 2, speed: 62, fireMs: 950, color: "#ff8ad1", dark: "#c23f8f", points: 200 },
    armor: { hp: 4, speed: 44, fireMs: 1650, color: "#ffd54f", dark: "#c9941f", points: 300 },
  };
  function typeWeights(wave) {
    return {
      basic: Math.max(60 - wave * 3, 12),
      fast: 18 + wave * 2,
      power: 10 + wave * 2,
      armor: 4 + wave * 2.2,
    };
  }
  function pickEnemyType(wave) {
    const w = typeWeights(wave);
    const total = w.basic + w.fast + w.power + w.armor;
    let r = Math.random() * total;
    for (const k of ["basic", "fast", "power", "armor"]) {
      if (r < w[k]) return k;
      r -= w[k];
    }
    return "basic";
  }

  // ---------- Difficulty ----------
  function enemiesPerWave(w) { return Math.min(6 + w * 2, 24); }
  function maxConcurrent(w) { return Math.min(2 + Math.floor(w / 2), 5); }
  function spawnIntervalMs(w) { return Math.max(2600 - w * 120, 900); }
  function enemySpeedMul(w) { return Math.min(1 + w * 0.04, 1.6); }
  function enemyFireMul(w) { return Math.min(1 + w * 0.06, 1.9); }

  // ---------- Game state ----------
  let running = false;
  let score = 0, lives = 3, wave = 1;
  let best = parseInt(localStorage.getItem("battlecityBest") || "0", 10);
  bestEl.textContent = best;
  let lastExtraLifeScore = 0;
  let baseAlive = true;
  let enemies = [];
  let playerBullets = [], enemyBullets = [];
  let particles = [], floaters = [];
  let powerups = [];
  let shakeT = 0, shakeMag = 0;
  let enemiesSpawnedThisWave = 0, enemiesKilledThisWave = 0;
  let spawnTimer = 0;
  let waveClearing = false;

  const TSIZE = TILE - 6;
  const player = {
    x: 0, y: 0, w: TSIZE, h: TSIZE, dir: "up", moving: false,
    speed: 92, fireCooldown: 0, bulletLevel: 1, invulnT: 0, shieldT: 0,
  };

  const DIRV = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };

  // ---------- Collision helpers ----------
  function solidTileAt(col, row) {
    if (!inBounds(col, row)) return true;
    const t = grid[row][col];
    return t === T_BRICK || t === T_STEEL || t === T_WATER || t === T_BASE;
  }
  function collidesTiles(x, y, w, h) {
    const left = x - w / 2, right = x + w / 2, top = y - h / 2, bottom = y + h / 2;
    const worldLeft = OFF_X, worldTop = OFF_Y, worldRight = OFF_X + GRID_W, worldBottom = OFF_Y + GRID_H;
    if (left < worldLeft || right > worldRight || top < worldTop || bottom > worldBottom) return true;
    const c0 = Math.floor((left - OFF_X) / TILE), c1 = Math.floor((right - OFF_X - 0.01) / TILE);
    const r0 = Math.floor((top - OFF_Y) / TILE), r1 = Math.floor((bottom - OFF_Y - 0.01) / TILE);
    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        if (solidTileAt(c, r)) return true;
      }
    }
    return false;
  }
  function collidesTank(self, x, y, list) {
    for (const o of list) {
      if (o === self || o.dead || o.state === "spawning") continue;
      const dx = Math.abs(x - o.x), dy = Math.abs(y - o.y);
      if (dx < (self.w + o.w) / 2 - 2 && dy < (self.h + o.h) / 2 - 2) return true;
    }
    return false;
  }
  function tryMove(entity, dx, dy, others) {
    if (dx !== 0) {
      const nx = entity.x + dx;
      if (!collidesTiles(nx, entity.y, entity.w, entity.h) && !collidesTank(entity, nx, entity.y, others)) entity.x = nx;
    }
    if (dy !== 0) {
      const ny = entity.y + dy;
      if (!collidesTiles(entity.x, ny, entity.w, entity.h) && !collidesTank(entity, entity.x, ny, others)) entity.y = ny;
    }
  }

  // ---------- Reset / spawn ----------
  function resetPlayer() {
    const c = tileCenter(PLAYER_SPAWN.col, PLAYER_SPAWN.row);
    player.x = c.x; player.y = c.y; player.dir = "up"; player.moving = false;
    player.fireCooldown = 0; player.invulnT = 1.2; player.shieldT = 0;
  }

  function spawnWave(n) {
    wave = n;
    waveEl.textContent = "WAVE " + wave;
    grid = ensureReachable(buildMap(wave));
    baseAlive = true;
    enemies = [];
    playerBullets = []; enemyBullets = [];
    powerups = [];
    enemiesSpawnedThisWave = 0; enemiesKilledThisWave = 0;
    spawnTimer = 400;
    waveClearing = false;
    updateBaseHud();
  }

  function resetGame() {
    score = 0; lives = 3; lastExtraLifeScore = 0;
    player.bulletLevel = 1;
    particles = []; floaters = [];
    spawnWave(1);
    resetPlayer();
    updateHud();
  }

  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
    let icons = "";
    for (let i = 0; i < 3; i++) icons += i < lives ? "🚙" : "💥";
    livesEl.textContent = icons;
    const stars = "★".repeat(player.bulletLevel) + "☆".repeat(3 - player.bulletLevel);
    levelEl.textContent = "火力 " + stars;
  }
  function updateBaseHud() {
    baseEl.textContent = baseAlive ? "🦅 基地完好" : "🦅 基地已毁";
  }

  function showBanner(text, cls, ms) {
    bannerEl.textContent = text;
    bannerEl.className = cls || "";
    bannerEl.style.display = "block";
    clearTimeout(showBanner._t);
    showBanner._t = setTimeout(() => { bannerEl.style.display = "none"; }, ms || 900);
  }
  function flashScreen() {
    flashEl.style.opacity = "0.5";
    setTimeout(() => { flashEl.style.opacity = "0"; }, 90);
  }
  function shake(mag, dur) { shakeMag = mag; shakeT = dur; }

  function spawnParticles(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const spd = 50 + Math.random() * 140;
      particles.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, life: 0.35 + Math.random() * 0.3, t: 0, color, r: 2 + Math.random() * 2.2 });
    }
  }
  function addFloater(x, y, text, color) { floaters.push({ x, y, text, color, t: 0, life: 0.8 }); }

  function awardScore(amount, x, y, label) {
    score += amount;
    addFloater(x, y, "+" + amount + (label ? " " + label : ""), label ? "#ffd54f" : "#b6ff5c");
    if (score > best) { best = score; localStorage.setItem("battlecityBest", String(best)); }
    if (score - lastExtraLifeScore >= 3000) {
      lastExtraLifeScore += 3000;
      lives++;
      sfxExtraLife();
      showBanner("额外生命! +1", "gold", 1100);
    }
    updateHud();
  }

  // ---------- Powerups ----------
  const POWERUP_TYPES = ["star", "shield", "grenade", "life"];
  const POWERUP_WEIGHTS = { star: 0.40, shield: 0.25, grenade: 0.15, life: 0.20 };
  function maybeDropPowerup(x, y) {
    if (Math.random() > 0.22) return;
    let r = Math.random(), type = "star", acc = 0;
    for (const k of POWERUP_TYPES) { acc += POWERUP_WEIGHTS[k]; if (r <= acc) { type = k; break; } }
    powerups.push({ x, y, type, t: 0, life: 8 });
  }
  function collectPowerup(p) {
    sfxPowerup();
    if (p.type === "star") {
      if (player.bulletLevel < 3) { player.bulletLevel++; showBanner("火力升级! ★x" + player.bulletLevel, "gold", 900); }
      else { awardScore(100, player.x, player.y, "满级火力"); }
    } else if (p.type === "shield") {
      player.shieldT = 6;
      showBanner("护盾启动!", "", 900);
    } else if (p.type === "grenade") {
      let n = 0;
      for (const e of enemies) { if (!e.dead && e.state !== "spawning") { killEnemy(e); n++; } }
      if (n > 0) showBanner("手雷! 清场 x" + n, "gold", 1000);
    } else if (p.type === "life") {
      lives++;
      showBanner("额外生命! +1", "gold", 900);
    }
    updateHud();
  }

  // ---------- Firing ----------
  function fireCooldownFor(level) { return level === 1 ? 0.46 : level === 2 ? 0.34 : 0.26; }
  function bulletSpeedFor(level) { return level === 1 ? 300 : level === 2 ? 380 : 430; }
  function canDestroySteel(level) { return level >= 3; }

  function tryPlayerFire() {
    if (!running) return;
    if (player.fireCooldown > 0) return;
    const v = DIRV[player.dir];
    playerBullets.push({
      x: player.x + v.x * (player.w / 2 + 2), y: player.y + v.y * (player.h / 2 + 2),
      vx: v.x * bulletSpeedFor(player.bulletLevel), vy: v.y * bulletSpeedFor(player.bulletLevel),
      owner: "player", pierceSteel: canDestroySteel(player.bulletLevel),
    });
    player.fireCooldown = fireCooldownFor(player.bulletLevel);
    sfxShoot();
  }

  function enemyFire(e) {
    const v = DIRV[e.dir];
    enemyBullets.push({
      x: e.x + v.x * (e.w / 2 + 2), y: e.y + v.y * (e.h / 2 + 2),
      vx: v.x * 210, vy: v.y * 210, owner: "enemy",
    });
  }

  // ---------- Enemy AI ----------
  function spawnEnemy() {
    const col = ENEMY_SPAWN_COLS[Math.floor(Math.random() * ENEMY_SPAWN_COLS.length)];
    const c = tileCenter(col, 0);
    const type = pickEnemyType(wave);
    const t = ENEMY_TYPES[type];
    enemies.push({
      x: c.x, y: c.y, w: TSIZE, h: TSIZE, type, hp: t.hp, maxHp: t.hp,
      dir: "down", moving: true, state: "spawning", spawnT: 0.5,
      decideT: 0.3 + Math.random() * 0.3, fireCooldown: 0.4 + Math.random() * 0.6, dead: false,
    });
    enemiesSpawnedThisWave++;
  }

  function decideDirection(e) {
    const dirs = ["up", "down", "left", "right"];
    const opposite = { up: "down", down: "up", left: "right", right: "left" };
    let dir;
    if (Math.random() < 0.5) {
      const dCol = BASE_COL - Math.floor((e.x - OFF_X) / TILE);
      const dRow = BASE_ROW - Math.floor((e.y - OFF_Y) / TILE);
      if (Math.abs(dCol) > Math.abs(dRow)) dir = dCol > 0 ? "right" : "left";
      else dir = dRow > 0 ? "down" : "up";
    } else {
      const opts = dirs.filter(d => d !== opposite[e.dir]);
      dir = opts[Math.floor(Math.random() * opts.length)];
    }
    e.dir = dir;
    e.decideT = 0.5 + Math.random() * 0.6;
  }

  function updateEnemy(e, dt) {
    if (e.state === "spawning") {
      e.spawnT -= dt;
      if (e.spawnT <= 0) e.state = "active";
      return;
    }
    const t = ENEMY_TYPES[e.type];
    const spd = t.speed * enemySpeedMul(wave);
    e.decideT -= dt;
    if (e.decideT <= 0) decideDirection(e);

    const before = { x: e.x, y: e.y };
    const v = DIRV[e.dir];
    tryMove(e, v.x * spd * dt, v.y * spd * dt, enemies.concat([player]));
    if (Math.abs(e.x - before.x) < 0.01 && Math.abs(e.y - before.y) < 0.01) {
      e.decideT = 0; // blocked, force redecide next tick
    }

    e.fireCooldown -= dt * enemyFireMul(wave);
    if (e.fireCooldown <= 0) {
      const alignedCol = Math.abs(e.x - player.x) < TILE * 0.4;
      const alignedRow = Math.abs(e.y - player.y) < TILE * 0.4;
      let shouldFire = false;
      if (alignedCol && player.y < e.y) { e.dir = "up"; shouldFire = true; }
      else if (alignedCol && player.y > e.y) { e.dir = "down"; shouldFire = true; }
      else if (alignedRow && player.x < e.x) { e.dir = "left"; shouldFire = true; }
      else if (alignedRow && player.x > e.x) { e.dir = "right"; shouldFire = true; }
      else if (Math.random() < 0.05) shouldFire = true;
      if (shouldFire) {
        enemyFire(e);
        e.fireCooldown = t.fireMs / 1000;
      } else {
        e.fireCooldown = 0.15;
      }
    }
  }

  // ---------- Damage / destruction ----------
  function destroyTileAt(col, row, byLevel3) {
    if (!inBounds(col, row)) return "none";
    const t = grid[row][col];
    if (t === T_BRICK) {
      grid[row][col] = T_EMPTY;
      sfxBrick();
      spawnParticles(tileCenter(col, row).x, tileCenter(col, row).y, "#c98a4b", 8);
      return "brick";
    }
    if (t === T_STEEL) {
      if (byLevel3) {
        grid[row][col] = T_EMPTY;
        sfxSteel();
        spawnParticles(tileCenter(col, row).x, tileCenter(col, row).y, "#cfd8e3", 10);
        return "steel";
      }
      sfxSteel();
      return "blocked";
    }
    if (t === T_BASE) {
      grid[row][col] = T_EMPTY;
      baseAlive = false;
      return "base";
    }
    return "none";
  }

  function bulletHitTile(b) {
    const col = Math.floor((b.x - OFF_X) / TILE), row = Math.floor((b.y - OFF_Y) / TILE);
    if (!inBounds(col, row)) return true;
    const t = grid[row][col];
    if (t === T_EMPTY || t === T_WATER) return false;
    const result = destroyTileAt(col, row, b.owner === "player" && b.pierceSteel);
    if (result === "blocked") return true;
    if (result === "base") {
      shake(10, 0.5);
      flashScreen();
      sfxBaseDoom();
      showBanner("基地被摧毁!!", "doom", 1600);
      endGame();
    }
    return result !== "none" ? true : false;
  }

  function killEnemy(e) {
    e.dead = true;
    enemiesKilledThisWave++;
    const pts = ENEMY_TYPES[e.type].points;
    awardScore(pts, e.x, e.y, "");
    spawnParticles(e.x, e.y, ENEMY_TYPES[e.type].color, 14);
    sfxExplode();
    maybeDropPowerup(e.x, e.y);
  }

  function hitPlayer() {
    if (player.invulnT > 0 || player.shieldT > 0 || !running) return;
    lives--;
    shake(7, 0.3);
    flashScreen();
    sfxHurt();
    showBanner("坦克被击毁!", "hurt", 700);
    updateHud();
    if (lives <= 0) { endGame(); return; }
    resetPlayer();
  }

  function checkCollisions() {
    // player bullets vs tiles
    for (const b of playerBullets) {
      if (b.dead) continue;
      if (bulletHitTile(b)) { b.dead = true; continue; }
    }
    // player bullets vs enemies
    for (const b of playerBullets) {
      if (b.dead) continue;
      for (const e of enemies) {
        if (e.dead || e.state === "spawning") continue;
        const dx = b.x - e.x, dy = b.y - e.y;
        if (Math.abs(dx) < e.w / 2 && Math.abs(dy) < e.h / 2) {
          b.dead = true;
          e.hp--;
          if (e.hp <= 0) killEnemy(e);
          else spawnParticles(b.x, b.y, "#fff", 4);
          break;
        }
      }
    }
    // enemy bullets vs tiles
    for (const b of enemyBullets) {
      if (b.dead) continue;
      if (bulletHitTile(b)) { b.dead = true; continue; }
    }
    // enemy bullets vs player
    for (const b of enemyBullets) {
      if (b.dead) continue;
      const dx = b.x - player.x, dy = b.y - player.y;
      if (Math.abs(dx) < player.w / 2 && Math.abs(dy) < player.h / 2) {
        b.dead = true;
        hitPlayer();
      }
    }
    // bullet vs bullet (opposite owners) cancel out
    for (const pb of playerBullets) {
      if (pb.dead) continue;
      for (const eb of enemyBullets) {
        if (eb.dead) continue;
        const dx = pb.x - eb.x, dy = pb.y - eb.y;
        if (dx * dx + dy * dy < 8 * 8) {
          pb.dead = true; eb.dead = true;
          spawnParticles((pb.x + eb.x) / 2, (pb.y + eb.y) / 2, "#fff", 6);
        }
      }
    }
    playerBullets = playerBullets.filter(b => !b.dead);
    enemyBullets = enemyBullets.filter(b => !b.dead);

    // powerup pickup
    for (const p of powerups) {
      if (p.collected) continue;
      const dx = p.x - player.x, dy = p.y - player.y;
      if (Math.abs(dx) < (player.w + TILE) / 2 - 4 && Math.abs(dy) < (player.h + TILE) / 2 - 4) {
        p.collected = true;
        collectPowerup(p);
      }
    }
    powerups = powerups.filter(p => !p.collected);
  }

  function endGame() {
    running = false;
    sfxOver();
    showEndOverlay();
  }

  function showEndOverlay() {
    startOverlay.innerHTML = '<div class="glass-panel">' +
      '<h1>' + (baseAlive ? '🎮 游戏结束' : '🦅 基地失守') + '</h1>' +
      '<div id="finalScoreVal">' + score + '</div>' +
      '<div id="bestScoreLine">第 ' + wave + ' 波 · 最高分 ' + best + '</div>' +
      '<button class="btn" id="restartBtn">再玩一次</button>' +
      '</div>';
    startOverlay.classList.add("show");
    document.getElementById("restartBtn").addEventListener("click", startGame);
  }

  function startGame() {
    initAudio();
    resetGame();
    startOverlay.classList.remove("show");
    running = true;
  }
  startBtn.addEventListener("click", startGame);

  // ---------- Input: dynamic drag joystick ----------
  let dragging = false, dragOrigin = null, dragCurrent = null;
  const DEADZONE = 9, JOY_RADIUS = 40;

  function updateDesiredDir() {
    if (!dragging || !dragOrigin || !dragCurrent) return;
    const dx = dragCurrent.x - dragOrigin.x, dy = dragCurrent.y - dragOrigin.y;
    const mag = Math.hypot(dx, dy);
    if (mag < DEADZONE) { player.moving = false; return; }
    player.moving = true;
    player.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
  }

  canvas.addEventListener("pointerdown", (e) => {
    dragging = true;
    dragOrigin = { x: e.clientX, y: e.clientY };
    dragCurrent = { x: e.clientX, y: e.clientY };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    dragCurrent = { x: e.clientX, y: e.clientY };
    updateDesiredDir();
  });
  window.addEventListener("pointerup", () => { dragging = false; player.moving = false; });
  window.addEventListener("pointercancel", () => { dragging = false; player.moving = false; });

  // ---------- Drawing ----------
  function drawJoystick() {
    if (!dragging || !dragOrigin) return;
    ctx.save();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const dx = clamp(dragCurrent.x - dragOrigin.x, -JOY_RADIUS, JOY_RADIUS);
    const dy = clamp(dragCurrent.y - dragOrigin.y, -JOY_RADIUS, JOY_RADIUS);
    ctx.strokeStyle = "rgba(182,255,92,0.5)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(dragOrigin.x, dragOrigin.y, JOY_RADIUS, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "rgba(182,255,92,0.35)";
    ctx.beginPath(); ctx.arc(dragOrigin.x + dx, dragOrigin.y + dy, 16, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawTile(col, row) {
    const p = tileTopLeft(col, row);
    const t = grid[row][col];
    if (t === T_BRICK) {
      ctx.fillStyle = "#a85a32";
      ctx.fillRect(p.x, p.y, TILE, TILE);
      ctx.strokeStyle = "#7c3f1f"; ctx.lineWidth = 1;
      ctx.strokeRect(p.x + 0.5, p.y + 0.5, TILE - 1, TILE - 1);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y + TILE / 2); ctx.lineTo(p.x + TILE, p.y + TILE / 2);
      ctx.moveTo(p.x + TILE / 2, p.y); ctx.lineTo(p.x + TILE / 2, p.y + TILE / 2);
      ctx.moveTo(p.x + TILE / 2, p.y + TILE / 2); ctx.lineTo(p.x + TILE / 2, p.y + TILE);
      ctx.stroke();
    } else if (t === T_STEEL) {
      ctx.fillStyle = "#8b97a3";
      ctx.fillRect(p.x, p.y, TILE, TILE);
      ctx.strokeStyle = "#4c545c"; ctx.lineWidth = 1.5;
      ctx.strokeRect(p.x + 1, p.y + 1, TILE - 2, TILE - 2);
      ctx.fillStyle = "#c6cfd8";
      ctx.fillRect(p.x + 3, p.y + 3, 3, 3);
      ctx.fillRect(p.x + TILE - 6, p.y + TILE - 6, 3, 3);
    } else if (t === T_WATER) {
      const wob = Math.sin(waterT + col * 0.7 + row * 0.4) * 2;
      ctx.fillStyle = "#2a6fb0";
      ctx.fillRect(p.x, p.y, TILE, TILE);
      ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(p.x + 2, p.y + TILE / 2 + wob); ctx.lineTo(p.x + TILE - 2, p.y + TILE / 2 - wob);
      ctx.stroke();
    } else if (t === T_BASE) {
      ctx.fillStyle = "#2b3a26";
      ctx.fillRect(p.x, p.y, TILE, TILE);
      ctx.font = (TILE - 2) + "px sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("🦅", p.x + TILE / 2, p.y + TILE / 2 + 1);
    }
  }

  function drawTankBody(x, y, w, h, dir, colorA, colorB) {
    ctx.save();
    ctx.translate(x, y);
    const rot = dir === "up" ? 0 : dir === "down" ? Math.PI : dir === "left" ? -Math.PI / 2 : Math.PI / 2;
    ctx.rotate(rot);
    ctx.fillStyle = colorB;
    ctx.fillRect(-w / 2, -h / 2, w, h);
    ctx.fillStyle = colorA;
    ctx.fillRect(-w / 2 + 2, -h / 2 + 2, w - 4, h - 4);
    // barrel
    ctx.fillStyle = colorB;
    ctx.fillRect(-2, -h / 2 - 6, 4, 8);
    ctx.restore();
  }

  function drawPlayer() {
    if (player.invulnT > 0 && Math.floor(player.invulnT * 10) % 2 === 0) return;
    drawTankBody(player.x, player.y, player.w, player.h, player.dir, "#b6ff5c", "#3f7a2a");
    if (player.shieldT > 0) {
      ctx.save();
      ctx.strokeStyle = "rgba(126,249,255,0.8)";
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.6 + 0.3 * Math.sin(player.shieldT * 10);
      ctx.beginPath(); ctx.arc(player.x, player.y, player.w / 2 + 5, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  }

  function drawEnemy(e) {
    const t = ENEMY_TYPES[e.type];
    if (e.state === "spawning") {
      ctx.save();
      ctx.strokeStyle = "rgba(255,213,79,0.8)";
      ctx.lineWidth = 2;
      const pulse = 8 + (0.5 - e.spawnT) * 20;
      ctx.beginPath(); ctx.arc(e.x, e.y, pulse, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
      return;
    }
    let colA = t.color, colB = t.dark;
    if (e.hp < e.maxHp) colA = "#fff";
    drawTankBody(e.x, e.y, e.w, e.h, e.dir, colA, colB);
  }

  function drawPowerup(p) {
    const blink = p.life - p.t < 2 ? (Math.floor(p.t * 10) % 2 === 0) : true;
    if (!blink) return;
    const icon = p.type === "star" ? "⭐" : p.type === "shield" ? "🛡" : p.type === "grenade" ? "💣" : "❤️";
    ctx.save();
    ctx.font = (TILE) + "px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const bob = Math.sin(p.t * 4) * 2;
    ctx.fillText(icon, p.x, p.y + bob);
    ctx.restore();
  }

  let waterT = 0;
  function draw() {
    ctx.save();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.translate(offX, offY);
    ctx.scale(vscale, vscale);

    let shx = 0, shy = 0;
    if (shakeT > 0) { shx = (Math.random() - 0.5) * shakeMag; shy = (Math.random() - 0.5) * shakeMag; }
    ctx.translate(shx, shy);

    ctx.fillStyle = "#0b1108";
    ctx.fillRect(0, 0, WORLD_W, WORLD_H);
    ctx.fillStyle = "#131f10";
    ctx.fillRect(OFF_X, OFF_Y, GRID_W, GRID_H);

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (grid[r][c] !== T_EMPTY) drawTile(c, r);
      }
    }

    for (const p of powerups) drawPowerup(p);
    for (const e of enemies) { if (!e.dead) drawEnemy(e); }
    if (running || player.invulnT > 0) drawPlayer();

    ctx.fillStyle = "#7ef9ff";
    for (const b of playerBullets) ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
    ctx.fillStyle = "#ff5a5a";
    for (const b of enemyBullets) ctx.fillRect(b.x - 2, b.y - 2, 4, 4);

    for (const p of particles) {
      ctx.globalAlpha = Math.max(1 - p.t / p.life, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.textAlign = "center";
    ctx.font = "800 13px Outfit, sans-serif";
    for (const f of floaters) {
      ctx.globalAlpha = Math.max(1 - f.t / f.life, 0);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y - f.t * 30);
    }
    ctx.globalAlpha = 1;

    ctx.restore();
    drawJoystick();
  }

  // ---------- Update ----------
  function update(dt) {
    waterT += dt;
    if (running) {
      updateDesiredDir();
      if (player.fireCooldown > 0) player.fireCooldown -= dt;
      if (player.moving) {
        const v = DIRV[player.dir];
        tryMove(player, v.x * player.speed * dt, v.y * player.speed * dt, enemies);
      }
      tryPlayerFire();
      if (player.invulnT > 0) player.invulnT -= dt;
      if (player.shieldT > 0) player.shieldT -= dt;

      for (const e of enemies) { if (!e.dead) updateEnemy(e, dt); }
      enemies = enemies.filter(e => !e.dead);

      for (const b of playerBullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
      for (const b of enemyBullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
      playerBullets = playerBullets.filter(b => inBounds(Math.floor((b.x - OFF_X) / TILE), Math.floor((b.y - OFF_Y) / TILE)));
      enemyBullets = enemyBullets.filter(b => inBounds(Math.floor((b.x - OFF_X) / TILE), Math.floor((b.y - OFF_Y) / TILE)));

      checkCollisions();

      spawnTimer -= dt * 1000;
      const activeCount = enemies.filter(e => !e.dead).length;
      if (running && spawnTimer <= 0 && activeCount < maxConcurrent(wave) && enemiesSpawnedThisWave < enemiesPerWave(wave)) {
        spawnEnemy();
        spawnTimer = spawnIntervalMs(wave);
      }

      if (running && !waveClearing && enemiesKilledThisWave >= enemiesPerWave(wave) && activeCount === 0) {
        waveClearing = true;
        sfxWaveClear();
        awardScore(100 * wave, WORLD_W / 2, WORLD_H / 2, "");
        showBanner("第 " + wave + " 波 通关!", "gold", 1300);
        setTimeout(() => { if (running || waveClearing) { spawnWave(wave + 1); running = true; } }, 1400);
        running = false;
      }
    }

    particles.forEach(p => { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 160 * dt; });
    particles = particles.filter(p => p.t < p.life);
    floaters.forEach(f => { f.t += dt; });
    floaters = floaters.filter(f => f.t < f.life);
    powerups.forEach(p => { p.t += dt; });
    powerups = powerups.filter(p => p.t < p.life && !p.collected);

    if (shakeT > 0) shakeT -= dt;
  }

  let lastTs = 0;
  function loop(ts) {
    if (!lastTs) lastTs = ts;
    let dt = (ts - lastTs) / 1000;
    dt = Math.min(dt, 0.05);
    lastTs = ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  grid = ensureReachable(buildMap(1));
  resetPlayer();
  requestAnimationFrame(loop);

  // ---------- Debug hook ----------
  window.__battlecityDebug = {
    getState: () => ({ running, score, best, lives, wave, baseAlive, enemiesSpawnedThisWave, enemiesKilledThisWave, enemiesPerWave: enemiesPerWave(wave), waveClearing }),
    getPlayer: () => ({ x: player.x, y: player.y, dir: player.dir, moving: player.moving, bulletLevel: player.bulletLevel, invuln: player.invulnT > 0, shield: player.shieldT > 0 }),
    getEnemies: () => enemies.map(e => ({ x: e.x, y: e.y, type: e.type, hp: e.hp, dir: e.dir, state: e.state })),
    getBullets: () => ({ player: playerBullets.length, enemy: enemyBullets.length }),
    getPowerups: () => powerups.map(p => ({ x: p.x, y: p.y, type: p.type })),
    getTile: (col, row) => grid[row] ? grid[row][col] : null,
    getBaseTile: () => ({ col: BASE_COL, row: BASE_ROW }),
    forceSpawnEnemy: (type) => {
      const col = ENEMY_SPAWN_COLS[0];
      const c = tileCenter(col, 0);
      const t = ENEMY_TYPES[type] || ENEMY_TYPES.basic;
      const e = { x: c.x, y: c.y, w: TSIZE, h: TSIZE, type: type || "basic", hp: t.hp, maxHp: t.hp, dir: "down", moving: true, state: "active", spawnT: 0, decideT: 5, fireCooldown: 5, dead: false };
      enemies.push(e);
      enemiesSpawnedThisWave++;
      return enemies.length - 1;
    },
    forceKillAllEnemies: () => { for (const e of enemies) if (!e.dead) killEnemy(e); },
    destroyTile: (col, row) => destroyTileAt(col, row, true),
    setTile: (col, row, val) => { if (grid[row]) grid[row][col] = val; },
    damageBase: () => { destroyTileAt(BASE_COL, BASE_ROW, false); if (!baseAlive) { shake(10,0.5); sfxBaseDoom(); showBanner("基地被摧毁!!","doom",1600); endGame(); } updateBaseHud(); },
    forcePowerup: (type, x, y) => { powerups.push({ x: x != null ? x : player.x, y: y != null ? y : player.y - TILE, type: type || "star", t: 0, life: 8 }); },
    setPlayerPos: (x, y) => { player.x = x; player.y = y; },
    setPlayerDir: (dir) => { player.dir = dir; },
    setLives: (n) => { lives = n; updateHud(); },
    setScore: (n) => { score = n; updateHud(); },
    setBulletLevel: (n) => { player.bulletLevel = clamp(n, 1, 3); updateHud(); },
    setShield: (t) => { player.shieldT = t; },
    setInvuln: (t) => { player.invulnT = t; },
    forceStart: () => { startGame(); },
    forceEnd: () => { endGame(); },
    forceHitPlayer: () => hitPlayer(),
    project: (x, y) => ({ x: x * vscale + offX, y: y * vscale + offY }),
  };
})();
</script>
</body>
</html>
