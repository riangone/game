<script>
(function () {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const coinsEl = document.getElementById("coins");
  const bestEl = document.getElementById("best");
  const overlay = document.getElementById("overlay");
  const finalScoreEl = overlay.querySelector(".final-score");
  const finalCoinsEl = overlay.querySelector(".final-coins");
  const deathReasonEl = document.getElementById("deathReason");
  const restartBtn = document.getElementById("restartBtn");
  const startScreen = document.getElementById("startScreen");
  const startBtn = document.getElementById("startBtn");
  const hint = document.getElementById("hint");

  const settingsBtnCard = document.getElementById("settingsBtnCard");
  const settingsScreen = document.getElementById("settingsScreen");
  const closeSettingsBtn = document.getElementById("closeSettingsBtn");
  const settingsSvg = document.getElementById("settingsBtn");
  const guideToggle = document.getElementById("guideToggle");
  const soundToggle = document.getElementById("soundToggle");
  const startGuideToggle = document.getElementById("startGuideToggle");
  const startSoundToggle = document.getElementById("startSoundToggle");

  let guideEnabled = localStorage.getItem("roadHopperGuide") !== "false";
  let soundEnabled = localStorage.getItem("roadHopperSound") !== "false";

  guideToggle.checked = guideEnabled;
  startGuideToggle.checked = guideEnabled;
  soundToggle.checked = soundEnabled;
  startSoundToggle.checked = soundEnabled;

  function updateGuideSetting(val) {
    guideEnabled = val;
    localStorage.setItem("roadHopperGuide", String(val));
    guideToggle.checked = val;
    startGuideToggle.checked = val;
  }

  function updateSoundSetting(val) {
    soundEnabled = val;
    localStorage.setItem("roadHopperSound", String(val));
    soundToggle.checked = val;
    startSoundToggle.checked = val;
  }

  guideToggle.addEventListener("change", (e) => updateGuideSetting(e.target.checked));
  startGuideToggle.addEventListener("change", (e) => updateGuideSetting(e.target.checked));
  soundToggle.addEventListener("change", (e) => updateSoundSetting(e.target.checked));
  startSoundToggle.addEventListener("change", (e) => updateSoundSetting(e.target.checked));

  settingsBtnCard.addEventListener("click", (e) => {
    e.stopPropagation();
    if (state === "dying" || state === "dead") return;
    settingsSvg.style.transform = "rotate(90deg)";
    settingsScreen.style.display = "flex";
  });

  closeSettingsBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    settingsScreen.style.display = "none";
    settingsSvg.style.transform = "rotate(0deg)";
  });

  // ---------- Resize / Grid ----------
  let DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;
  const COLS = 9;
  const START_COL = 4;
  let TILE = 64, ORIGIN_X = 0, BASE_Y = 0;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    TILE = Math.max(36, Math.min(W / COLS, H / 11, 92));
    ORIGIN_X = (W - COLS * TILE) / 2;
    BASE_Y = H * 0.76;
  }
  window.addEventListener("resize", resize);
  resize();

  function cellToScreen(col, row) {
    return {
      x: ORIGIN_X + col * TILE + TILE / 2,
      y: BASE_Y - (row - camera.row) * TILE
    };
  }

  // ---------- Web Audio Synthesizer ----------
  let audioCtx = null;
  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  function playSynthSound(type) {
    if (!soundEnabled) return;
    if (!audioCtx) initAudio();
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;

    if (type === "hop") {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(420, now);
      osc.frequency.exponentialRampToValueAtTime(680, now + 0.08);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.09);
    }
    if (type === "bump") {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(140, now);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.06);
    }
    if (type === "coin") {
      const notes = [880, 1100];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, now + idx * 0.07);
        gain.gain.setValueAtTime(0.08, now + idx * 0.07);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15 + idx * 0.07);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.07); osc.stop(now + 0.2);
      });
    }
    if (type === "crash") {
      try {
        const bufferSize = audioCtx.sampleRate * 0.35;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noiseSource = audioCtx.createBufferSource();
        noiseSource.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(450, now);
        filter.frequency.exponentialRampToValueAtTime(100, now + 0.3);
        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.25, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        noiseSource.connect(filter); filter.connect(noiseGain); noiseGain.connect(audioCtx.destination);
        noiseSource.start(now);
      } catch (err) {}
    }
    if (type === "splash") {
      try {
        const bufferSize = audioCtx.sampleRate * 0.3;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noiseSource = audioCtx.createBufferSource();
        noiseSource.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(900, now);
        filter.frequency.exponentialRampToValueAtTime(140, now + 0.3);
        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.22, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        noiseSource.connect(filter); filter.connect(noiseGain); noiseGain.connect(audioCtx.destination);
        noiseSource.start(now);
      } catch (err) {}
    }
  }

  function rand(min, max) { return min + Math.random() * (max - min); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function difficultyT(row) { return Math.min(Math.max(row, 0) / 42, 1); }

  // ---------- Row / World Generation ----------
  let rows = {};
  let genState = { streakType: null, streak: 0 };

  function pickRowType(row) {
    if (row < 3) return "grass";
    const diff = difficultyT(row);
    let wGrass = Math.max(0.16, 0.4 - diff * 0.18);
    let wRoad = 0.35 + diff * 0.12;
    let wRiver = 0.25 + diff * 0.1;
    if (genState.streakType === "river" && genState.streak >= 2) wRiver = 0;
    if (genState.streakType === "road" && genState.streak >= 3) wRoad = 0;
    const total = wGrass + wRoad + wRiver;
    let r = Math.random() * total;
    let type;
    if (r < wGrass) type = "grass";
    else if (r < wGrass + wRoad) type = "road";
    else type = "river";

    if (type === genState.streakType) genState.streak++;
    else { genState.streakType = type; genState.streak = 1; }
    return type;
  }

  function buildRow(row) {
    const type = pickRowType(row);
    const diff = difficultyT(row);
    const data = { row, type };

    if (type === "grass") {
      data.blocked = new Set();
      if (row >= 3) {
        const maxBlocked = Math.min(3, COLS - 4);
        const count = Math.floor(rand(0, maxBlocked + 1));
        const cols = [...Array(COLS).keys()].filter((c) => c !== START_COL);
        for (let i = 0; i < count && cols.length; i++) {
          const idx = Math.floor(Math.random() * cols.length);
          data.blocked.add(cols.splice(idx, 1)[0]);
        }
      }
      data.starCol = null;
      if (row >= 3 && Math.random() < 0.35) {
        const free = [...Array(COLS).keys()].filter((c) => !data.blocked.has(c));
        data.starCol = free[Math.floor(Math.random() * free.length)];
      }
    } else if (type === "road") {
      data.dir = Math.random() < 0.5 ? 1 : -1;
      data.speed = 1.1 + diff * 1.5; // cells / second
      data.vehicles = [];
      data.spawnTimer = rand(0.2, 0.9);
      data.spawnInterval = [rand(1.5, 2.1), rand(1.0, 1.6), rand(0.7, 1.15)][Math.min(2, Math.floor(diff * 3))];
      // seed a couple of vehicles already on-screen so rows don't pop in empty
      const seedCount = 1 + Math.floor(Math.random() * 2);
      for (let i = 0; i < seedCount; i++) {
        data.vehicles.push(spawnVehicle(data, true));
      }
    } else if (type === "river") {
      data.dir = Math.random() < 0.5 ? 1 : -1;
      data.speed = 0.7 + diff * 0.9;
      data.logs = [];
      data.spawnTimer = rand(0.1, 0.6);
      data.spawnInterval = rand(1.1, 1.8) - diff * 0.3;
      const seedCount = 2 + Math.floor(Math.random() * 2);
      for (let i = 0; i < seedCount; i++) {
        data.logs.push(spawnLog(data, true));
      }
    }
    return data;
  }

  function ensureRow(row) {
    if (row < 0) return null;
    if (!rows[row]) rows[row] = buildRow(row);
    return rows[row];
  }

  function spawnVehicle(row, seed) {
    const len = Math.random() < 0.3 ? rand(1.7, 2.3) : rand(0.9, 1.3);
    let x;
    if (seed) {
      x = rand(0, COLS - 1);
    } else {
      x = row.dir > 0 ? -len / 2 - rand(0, 1.2) : COLS + len / 2 + rand(0, 1.2);
    }
    return { x, len, dir: row.dir, hue: Math.floor(Math.random() * 6) };
  }

  function spawnLog(row, seed) {
    const len = rand(1.8, 3.0);
    let x;
    if (seed) {
      x = rand(0, COLS - 1);
    } else {
      x = row.dir > 0 ? -len / 2 - rand(0, 0.8) : COLS + len / 2 + rand(0, 0.8);
    }
    return { x, len, dir: row.dir };
  }

  function updateRowEntities(row, dt) {
    if (row.type === "road") {
      row.spawnTimer -= dt;
      if (row.spawnTimer <= 0) {
        row.vehicles.push(spawnVehicle(row, false));
        row.spawnTimer = row.spawnInterval;
      }
      for (const v of row.vehicles) v.x += v.dir * row.speed * dt;
      row.vehicles = row.vehicles.filter((v) => v.x > -row_bound(v.len) && v.x < COLS + row_bound(v.len));
    } else if (row.type === "river") {
      row.spawnTimer -= dt;
      if (row.spawnTimer <= 0) {
        row.logs.push(spawnLog(row, false));
        row.spawnTimer = row.spawnInterval;
      }
      for (const l of row.logs) l.x += l.dir * row.speed * dt;
      row.logs = row.logs.filter((l) => l.x > -row_bound(l.len) && l.x < COLS + row_bound(l.len));
    }
  }
  function row_bound(len) { return len / 2 + 1.5; }

  function findSupportLog(row, col) {
    if (!row.logs) return null;
    for (const l of row.logs) {
      if (col > l.x - l.len / 2 && col < l.x + l.len / 2) return l;
    }
    return null;
  }

  function vehicleHit(row, col) {
    if (!row.vehicles) return false;
    const half = 0.34;
    for (const v of row.vehicles) {
      if (col + half > v.x - v.len / 2 && col - half < v.x + v.len / 2) return true;
    }
    return false;
  }

  // ---------- Player & Game State ----------
  let player, maxRow, starsCollected, bonusScore, camera, particles, state, queuedDir, lastT;
  let best = parseInt(localStorage.getItem("roadHopperBest") || "0", 10);
  bestEl.textContent = "BEST: " + best;

  const HOP_DUR = 0.14;

  function resetGame() {
    rows = {};
    genState = { streakType: null, streak: 0 };
    player = {
      row: 0, col: START_COL,
      hopping: false, hopFrom: null, hopTo: null, hopT: 0,
      facing: { x: 0, y: -1 }, squash: 0,
      deathAnim: 0, deathType: null
    };
    maxRow = 0; starsCollected = 0; bonusScore = 0;
    camera = { row: 0 };
    particles = [];
    queuedDir = null;
    for (let r = 0; r <= 2; r++) ensureRow(r);
    ensureRow(0).blocked = new Set();

    scoreEl.textContent = "0";
    coinsEl.textContent = "★ 0";
    overlay.classList.remove("show");
    state = "running";
  }

  function totalScore() { return maxRow + starsCollected * 5 + bonusScore; }

  function gameOver() {
    state = "dead";
    const sc = totalScore();
    if (sc > best) {
      best = sc;
      localStorage.setItem("roadHopperBest", String(best));
    }
    bestEl.textContent = "BEST: " + best;
    finalScoreEl.textContent = String(sc);
    finalCoinsEl.textContent = "★ " + starsCollected;
    deathReasonEl.textContent = player.deathType === "drown" ? "被卷进了湍急的河水里！" : "撞上了疾驰的车辆！";
    overlay.classList.add("show");
  }

  function die(type) {
    if (state !== "running") return;
    state = "dying";
    player.deathType = type;
    player.deathAnim = 0;
    player.hopping = false;
    const scr = cellToScreen(player.col, player.row);
    if (type === "hit") {
      playSynthSound("crash");
      spawnParticles(scr.x, scr.y, "#f43f5e", 18, 220);
    } else {
      playSynthSound("splash");
      spawnParticles(scr.x, scr.y, "#38bdf8", 16, 160);
    }
  }

  function spawnParticles(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      particles.push({
        x, y, color,
        vx: Math.cos(ang) * speed * rand(0.3, 1),
        vy: Math.sin(ang) * speed * rand(0.3, 1),
        size: rand(2, 5), life: 1, decay: rand(1.6, 2.6)
      });
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= p.decay * dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 180 * dt;
    }
  }

  // ---------- Movement ----------
  function tryMove(dRow, dCol) {
    if (state !== "running") return;
    if (player.hopping) { queuedDir = { dRow, dCol }; return; }

    const curCol = Math.round(player.col);
    const curRow = player.row;
    const targetRow = curRow + dRow;
    const targetCol = curCol + dCol;
    if (targetRow < 0 || targetCol < 0 || targetCol >= COLS) { playSynthSound("bump"); return; }

    const destRow = ensureRow(targetRow);
    if (destRow.type === "grass" && destRow.blocked.has(targetCol)) { playSynthSound("bump"); return; }

    player.hopping = true;
    player.hopFrom = { row: curRow, col: curCol };
    player.hopTo = { row: targetRow, col: targetCol };
    player.hopT = 0;
    player.facing = { x: dCol, y: -dRow };
    playSynthSound("hop");
  }

  function finishHop() {
    const to = player.hopTo;
    player.row = to.row;
    player.col = to.col;
    player.hopping = false;
    player.squash = 0.4;
    if (to.row > maxRow) {
      maxRow = to.row;
      scoreEl.textContent = String(totalScore());
    }
    const row = ensureRow(to.row);
    if (row.type === "river") {
      const log = findSupportLog(row, to.col);
      if (!log) { die("drown"); return; }
    } else if (row.type === "road") {
      if (vehicleHit(row, to.col)) { die("hit"); return; }
    } else if (row.type === "grass") {
      if (row.starCol === to.col) {
        row.starCol = null;
        starsCollected++;
        coinsEl.textContent = "★ " + starsCollected;
        scoreEl.textContent = String(totalScore());
        playSynthSound("coin");
      }
    }
    if (queuedDir) {
      const d = queuedDir; queuedDir = null;
      tryMove(d.dRow, d.dCol);
    }
  }

  // ---------- Main Update ----------
  function update(dt) {
    const activeMin = Math.max(0, Math.floor(camera.row) - 3);
    const activeMax = Math.ceil(camera.row) + 16;
    for (let r = activeMin; r <= activeMax; r++) {
      const row = ensureRow(r);
      if (row && (row.type === "road" || row.type === "river")) updateRowEntities(row, dt);
    }
    for (const key of Object.keys(rows)) {
      if (Number(key) < camera.row - 6) delete rows[key];
    }

    if (state === "running") {
      if (player.hopping) {
        player.hopT += dt / HOP_DUR;
        if (player.hopT >= 1) { player.hopT = 1; finishHop(); }
      } else {
        if (player.squash > 0) player.squash = Math.max(0, player.squash - dt * 3);
        const row = ensureRow(player.row);
        if (row.type === "river") {
          const log = findSupportLog(row, player.col);
          if (log) {
            player.col += log.dir * row.speed * dt;
            if (player.col < -0.6 || player.col > COLS - 0.4) { die("drown"); }
          } else {
            die("drown");
          }
        } else if (row.type === "road") {
          if (vehicleHit(row, player.col)) die("hit");
        }
      }
      const visualRow = player.hopping
        ? player.hopFrom.row + (player.hopTo.row - player.hopFrom.row) * easeHop(player.hopT)
        : player.row;
      camera.row += (visualRow - camera.row) * Math.min(dt * 7, 1);
    } else if (state === "dying") {
      player.deathAnim += dt;
      if (player.deathAnim > 0.55) gameOver();
    }

    updateParticles(dt);
  }

  function easeHop(t) {
    return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  }

  // ---------- Drawing ----------
  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0d1f14");
    g.addColorStop(1, "#060b08");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawRow(row, gameTime) {
    const scr = cellToScreen(0, row.row);
    const y = scr.y;
    const w = COLS * TILE;
    const x0 = ORIGIN_X;

    if (row.type === "grass") {
      ctx.fillStyle = row.row % 2 === 0 ? "#1f7a3d" : "#1a6a35";
      ctx.fillRect(x0, y - TILE / 2, w, TILE);
      ctx.fillStyle = "rgba(255,255,255,0.03)";
      for (let c = 0; c < COLS; c++) {
        if ((c + row.row) % 2 === 0) ctx.fillRect(x0 + c * TILE, y - TILE / 2, TILE, TILE);
      }
      row.blocked.forEach((c) => drawTree(x0 + c * TILE + TILE / 2, y));
      if (row.starCol !== null && row.starCol !== undefined) drawStar(x0 + row.starCol * TILE + TILE / 2, y, gameTime);
    } else if (row.type === "road") {
      ctx.fillStyle = "#2b2f36";
      ctx.fillRect(x0, y - TILE / 2, w, TILE);
      ctx.fillStyle = "rgba(255,255,255,0.35)";
      const dashW = TILE * 0.35, gap = TILE * 0.3;
      const phase = ((gameTime * row.speed * row.dir * TILE) % (dashW + gap) + (dashW + gap)) % (dashW + gap);
      for (let dx = -dashW - gap + phase; dx < w; dx += dashW + gap) {
        ctx.fillRect(x0 + dx, y - 2, dashW, 4);
      }
      for (const v of row.vehicles) drawVehicle(x0 + v.x * TILE, y, v);
    } else if (row.type === "river") {
      ctx.fillStyle = "#114a66";
      ctx.fillRect(x0, y - TILE / 2, w, TILE);
      ctx.strokeStyle = "rgba(255,255,255,0.12)";
      ctx.lineWidth = 2;
      for (let i = -1; i < 4; i++) {
        const waveY = y - TILE / 2 + (i + 1) * (TILE / 4) + Math.sin(gameTime * 2 + i) * 3;
        ctx.beginPath();
        for (let px = 0; px <= w; px += 10) {
          const yy = waveY + Math.sin(px * 0.05 + gameTime * 3 + i) * 2;
          if (px === 0) ctx.moveTo(x0 + px, yy); else ctx.lineTo(x0 + px, yy);
        }
        ctx.stroke();
      }
      for (const l of row.logs) drawLog(x0 + l.x * TILE, y, l);
    }
  }

  function drawTree(cx, cy) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = "#6b4226";
    ctx.fillRect(-TILE * 0.06, TILE * 0.05, TILE * 0.12, TILE * 0.22);
    ctx.beginPath();
    ctx.fillStyle = "#166534";
    ctx.arc(0, -TILE * 0.08, TILE * 0.28, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.fillStyle = "#15803d";
    ctx.arc(-TILE * 0.1, -TILE * 0.18, TILE * 0.18, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawStar(cx, cy, gameTime) {
    const bob = Math.sin(gameTime * 4) * 3;
    ctx.save();
    ctx.translate(cx, cy + bob);
    ctx.fillStyle = "#fde68a";
    ctx.shadowColor = "#fbbf24"; ctx.shadowBlur = 10;
    ctx.beginPath();
    const spikes = 5, outerR = TILE * 0.22, innerR = TILE * 0.09;
    for (let i = 0; i < spikes * 2; i++) {
      const r = i % 2 === 0 ? outerR : innerR;
      const a = (Math.PI / spikes) * i - Math.PI / 2;
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  const carColors = ["#f87171", "#60a5fa", "#fbbf24", "#a78bfa", "#34d399", "#fb923c"];
  function drawVehicle(cx, cy, v) {
    ctx.save();
    ctx.translate(cx, cy);
    const vw = v.len * TILE - 6, vh = TILE * 0.56;
    if (v.dir < 0) ctx.scale(-1, 1);
    roundRect(ctx, -vw / 2, -vh / 2, vw, vh, 6);
    ctx.fillStyle = carColors[v.hue];
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.25)";
    roundRect(ctx, -vw / 2 + vw * 0.08, -vh / 2 + 3, vw * 0.4, vh - 6, 4);
    ctx.fill();
    ctx.fillStyle = "#fef3c7";
    ctx.fillRect(vw / 2 - 5, -vh * 0.28, 4, vh * 0.2);
    ctx.fillRect(vw / 2 - 5, vh * 0.08, 4, vh * 0.2);
    ctx.restore();
  }

  function drawLog(cx, cy, l) {
    ctx.save();
    ctx.translate(cx, cy);
    const lw = l.len * TILE - 4, lh = TILE * 0.46;
    roundRect(ctx, -lw / 2, -lh / 2, lw, lh, 8);
    ctx.fillStyle = "#92623c";
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.25)";
    ctx.lineWidth = 2;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(-lw / 2 + 4, i * lh * 0.3);
      ctx.lineTo(lw / 2 - 4, i * lh * 0.3);
      ctx.stroke();
    }
    ctx.restore();
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function drawGuide(gameTime) {
    if (!guideEnabled || state !== "running" || player.hopping) return;
    const aheadRow = ensureRow(player.row + 1);
    if (!aheadRow || aheadRow.type !== "road") return;
    const scr0 = cellToScreen(0, aheadRow.row);
    const glow = 0.12 + Math.sin(gameTime * 6) * 0.04;
    for (let c = 0; c < COLS; c++) {
      let danger = false;
      for (const v of aheadRow.vehicles) {
        const futureX = v.x + v.dir * aheadRow.speed * 0.35;
        if (c + 0.34 > futureX - v.len / 2 && c - 0.34 < futureX + v.len / 2) { danger = true; break; }
      }
      ctx.save();
      ctx.globalAlpha = danger ? 0.22 : glow;
      ctx.fillStyle = danger ? "#f43f5e" : "#22c55e";
      ctx.fillRect(ORIGIN_X + c * TILE, scr0.y - TILE / 2, TILE, TILE);
      ctx.restore();
    }
  }

  function drawPlayer() {
    let visCol, visRow, arc = 0, bodyScaleX = 1, bodyScaleY = 1;
    if (player.hopping) {
      const e = easeHop(player.hopT);
      visCol = player.hopFrom.col + (player.hopTo.col - player.hopFrom.col) * e;
      visRow = player.hopFrom.row + (player.hopTo.row - player.hopFrom.row) * e;
      const air = Math.sin(Math.PI * player.hopT);
      arc = air * TILE * 0.32;
      bodyScaleY = 1 + air * 0.22;
      bodyScaleX = 1 - air * 0.12;
    } else {
      visCol = player.col;
      visRow = player.row;
      const sq = player.squash || 0;
      bodyScaleX = 1 + sq * 0.25;
      bodyScaleY = 1 - sq * 0.25;
    }

    const ground = cellToScreen(visCol, visRow);
    let deathScale = 1, deathAlpha = 1, flattenY = 1;
    if (state === "dying") {
      const t = Math.min(1, player.deathAnim / 0.5);
      if (player.deathType === "drown") { deathScale = 1 - t; deathAlpha = 1 - t; }
      else { flattenY = Math.max(0.12, 1 - t * 1.3); deathAlpha = 1 - Math.max(0, t - 0.6) * 2.5; }
    }

    // shadow
    ctx.save();
    ctx.globalAlpha = 0.35 * deathAlpha;
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.ellipse(ground.x, ground.y + TILE * 0.08, TILE * 0.26, TILE * 0.12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    const bodyY = ground.y - arc;
    ctx.save();
    ctx.globalAlpha = deathAlpha;
    ctx.translate(ground.x, bodyY);
    const rX = TILE * 0.3 * bodyScaleX * deathScale;
    const rY = TILE * 0.3 * bodyScaleY * flattenY * deathScale;
    const grad = ctx.createLinearGradient(0, -rY, 0, rY);
    grad.addColorStop(0, "#ffe08a"); grad.addColorStop(1, "#ff9a5a");
    ctx.beginPath();
    ctx.ellipse(0, 0, rX, rY, 0, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.18)"; ctx.lineWidth = 1.5; ctx.stroke();

    if (flattenY > 0.3) {
      const fx = player.facing.x, fy = player.facing.y;
      const eyeBaseX = fx * rX * 0.4, eyeBaseY = fy * rY * 0.4;
      const perpX = -fy * rX * 0.28, perpY = fx * rY * 0.28;
      ctx.fillStyle = "#2d2f3b";
      [-1, 1].forEach((s) => {
        ctx.beginPath();
        ctx.arc(eyeBaseX + perpX * s, eyeBaseY + perpY * s, TILE * 0.045, 0, Math.PI * 2);
        ctx.fill();
      });
    }
    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function draw(gameTime) {
    drawBackground();
    const topRow = Math.ceil(camera.row + (H - BASE_Y) / TILE) + 1;
    const bottomRow = Math.max(0, Math.floor(camera.row - BASE_Y / TILE) - 1);
    for (let r = bottomRow; r <= topRow; r++) {
      const row = ensureRow(r);
      if (row) drawRow(row, gameTime);
    }
    drawGuide(gameTime);
    drawPlayer();
    drawParticles();
  }

  function loop(t) {
    if (!lastT) lastT = t;
    const dt = Math.min((t - lastT) / 1000, 0.033);
    lastT = t;
    const gameTime = t / 1000;

    if (state === "running" || state === "dying") update(dt);
    draw(gameTime);
    requestAnimationFrame(loop);
  }

  // ---------- Inputs ----------
  let pointerStart = null;
  canvas.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    if (settingsScreen.style.display === "flex") return;
    initAudio();
    if (state !== "running") return;
    pointerStart = { x: e.clientX, y: e.clientY };
  });

  canvas.addEventListener("pointerup", (e) => {
    e.preventDefault();
    if (!pointerStart || state !== "running") { pointerStart = null; return; }
    const dx = e.clientX - pointerStart.x;
    const dy = e.clientY - pointerStart.y;
    pointerStart = null;
    const threshold = 20;
    if (Math.abs(dx) < threshold && Math.abs(dy) < threshold) {
      tryMove(1, 0); // tap = step forward
    } else if (Math.abs(dx) > Math.abs(dy)) {
      tryMove(0, dx > 0 ? 1 : -1);
    } else {
      tryMove(dy < 0 ? 1 : -1, 0);
    }
  });

  canvas.addEventListener("pointercancel", () => { pointerStart = null; });

  window.addEventListener("keydown", (e) => {
    if (settingsScreen.style.display === "flex") return;
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
    if (state !== "running" || e.repeat) return;
    if (e.code === "ArrowUp" || e.code === "KeyW") tryMove(1, 0);
    else if (e.code === "ArrowDown" || e.code === "KeyS") tryMove(-1, 0);
    else if (e.code === "ArrowLeft" || e.code === "KeyA") tryMove(0, -1);
    else if (e.code === "ArrowRight" || e.code === "KeyD") tryMove(0, 1);
  });

  restartBtn.addEventListener("click", () => { initAudio(); resetGame(); });
  startBtn.addEventListener("click", () => {
    initAudio();
    startScreen.style.display = "none";
    resetGame();
  });

  // Idle backdrop
  state = "idle";
  player = {
    row: 0, col: START_COL, hopping: false, hopFrom: null, hopTo: null, hopT: 0,
    facing: { x: 0, y: -1 }, squash: 0, deathAnim: 0, deathType: null
  };
  maxRow = 0; starsCollected = 0; bonusScore = 0;
  camera = { row: 0 };
  particles = [];
  for (let r = 0; r <= 2; r++) ensureRow(r);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
