<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>简易画板 · Canvas 绘图工具</title>
<meta name="description" content="纯前端Canvas简易画板，支持画笔/橡皮、颜色与粗细调节、撤销重做栈、导出PNG，100%离线本地绘图。">
<style>
:root{--bg-base:#f8fafc;--bg-surface:#fff;--bg-subtle:#f1f5f9;--border-color:#e2e8f0;--border-focus:#0284c7;--text-main:#0f172a;--text-muted:#64748b;--text-light:#94a3b8;--primary:#0284c7;--primary-hover:#0369a1;--primary-subtle:#e0f2fe;--radius-sm:8px;--radius-md:14px;--radius-lg:20px;--radius-pill:9999px;--shadow-sm:0 1px 3px rgba(0,0,0,.05);--font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;}
[data-theme="dark"]{--bg-base:#090d16;--bg-surface:#111827;--bg-subtle:#1f2937;--border-color:#374151;--border-focus:#38bdf8;--text-main:#f9fafb;--text-muted:#9ca3af;--text-light:#6b7280;--primary:#38bdf8;--primary-hover:#0ea5e9;--primary-subtle:rgba(56,189,248,.15);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--font-sans);background:var(--bg-base);color:var(--text-main);min-height:100vh;display:flex;flex-direction:column;}
header.app-header{background:var(--bg-surface);border-bottom:1px solid var(--border-color);position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;flex-wrap:wrap;}
.header-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.back-link{display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:var(--text-muted);font-size:13px;font-weight:600;padding:6px 10px;border-radius:var(--radius-sm);}
.back-link:hover{background:var(--primary-subtle);color:var(--primary);}
.app-brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;}
.tool-switch,.theme-btn{padding:7px 10px;border-radius:var(--radius-sm);border:1px solid var(--border-color);background:var(--bg-subtle);color:var(--text-main);font-size:13px;font-weight:600;cursor:pointer;}
.container{max-width:1100px;margin:0 auto;padding:20px 20px 40px;width:100%;flex:1;}
h1.page-title{font-size:22px;font-weight:800;margin-bottom:4px;}
p.page-sub{color:var(--text-muted);font-size:13px;margin-bottom:16px;}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--bg-surface);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:12px 16px;box-shadow:var(--shadow-sm);margin-bottom:14px;}
.tool-group{display:flex;gap:6px;align-items:center;padding-right:12px;border-right:1px solid var(--border-color);}
.tool-group:last-child{border-right:none;}
.tool-btn{width:36px;height:36px;border-radius:var(--radius-sm);border:1px solid var(--border-color);background:var(--bg-subtle);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
.tool-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
input[type=color]{width:36px;height:36px;border-radius:var(--radius-sm);border:1px solid var(--border-color);cursor:pointer;background:none;}
input[type=range]{width:100px;}
.btn{padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-color);background:var(--bg-subtle);color:var(--text-main);font-size:12.5px;font-weight:700;cursor:pointer;}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);}
.canvas-wrap{background:var(--bg-surface);border:1px solid var(--border-color);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:10px;overflow:auto;}
#drawCanvas{background:#fff;border-radius:var(--radius-md);display:block;margin:0 auto;cursor:crosshair;touch-action:none;}
.size-label{font-size:11px;color:var(--text-muted);width:24px;text-align:center;}
</style>
    <link rel="canonical" href="https://tool.0101.click/drawing-board.html">
</head>
<body>
<header class="app-header">
  <div class="header-left">
    <a href="tools.html" class="back-link">← 工具箱</a>
    <div class="app-brand"><span>🖌️</span><span>简易画板</span></div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <select class="tool-switch" onchange="if(this.value) location.href=this.value;">
      <option value="">🔀 切换工具...</option>
      <option value="drawing-board.html">🖌️ 简易画板</option>
      <option value="color-tool.html">🎨 颜色工具箱</option>
      <option value="img-to-pdf.html">📄 图片转PDF</option>
      <option value="image-tool.html">🖼️ 图片工坊</option>
      <option value="qrcode.html">📱 二维码</option>
          <option value="calendar.html">📅 万年历</option>
</select>
    <button class="theme-btn" onclick="toggleTheme()">🌓</button>
  </div>
</header>

<main class="container">
  <h1 class="page-title">🖌️ 简易画板</h1>
  <p class="page-sub">支持画笔/橡皮、颜色与粗细调节、撤销重做、清空与导出 PNG。纯 Canvas 本地绘制，支持触屏与鼠标。</p>

  <div class="toolbar">
    <div class="tool-group">
      <button class="tool-btn active" id="toolPen" onclick="setTool('pen')" title="画笔">✏️</button>
      <button class="tool-btn" id="toolEraser" onclick="setTool('eraser')" title="橡皮">🧹</button>
    </div>
    <div class="tool-group">
      <input type="color" id="penColor" value="#0f172a">
      <input type="range" id="penSize" min="1" max="50" value="4">
      <span class="size-label" id="sizeLabel">4</span>
    </div>
    <div class="tool-group">
      <button class="btn" onclick="undo()">↺ 撤销</button>
      <button class="btn" onclick="redo()">↻ 重做</button>
      <button class="btn" onclick="clearCanvas()">🗑️ 清空</button>
    </div>
    <div class="tool-group" style="border-right:none;">
      <button class="btn primary" onclick="exportPNG()">⬇ 导出 PNG</button>
    </div>
  </div>

  <div class="canvas-wrap">
    <canvas id="drawCanvas" width="1000" height="600"></canvas>
  </div>
</main>

<script>
(function(){const t=localStorage.getItem('app_theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');})();
function toggleTheme(){const cur=document.documentElement.getAttribute('data-theme');const next=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',next);localStorage.setItem('app_theme',next);}

const canvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d');
ctx.fillStyle = '#fff';
ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.lineCap = 'round';
ctx.lineJoin = 'round';

let tool = 'pen';
let drawing = false;
let lastX = 0, lastY = 0;
let undoStack = [];
let redoStack = [];

function setTool(t){
  tool = t;
  document.getElementById('toolPen').classList.toggle('active', t==='pen');
  document.getElementById('toolEraser').classList.toggle('active', t==='eraser');
}

document.getElementById('penSize').addEventListener('input', e => {
  document.getElementById('sizeLabel').textContent = e.target.value;
});

function saveState(){
  undoStack.push(canvas.toDataURL());
  if(undoStack.length > 30) undoStack.shift();
  redoStack = [];
}

function getPos(e){
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: (clientX-rect.left)*scaleX, y: (clientY-rect.top)*scaleY };
}

function startDraw(e){
  e.preventDefault();
  saveState();
  drawing = true;
  const pos = getPos(e);
  lastX = pos.x; lastY = pos.y;
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, parseInt(document.getElementById('penSize').value)/2, 0, Math.PI*2);
  ctx.fillStyle = tool==='eraser' ? '#fff' : document.getElementById('penColor').value;
  ctx.fill();
}
function moveDraw(e){
  if(!drawing) return;
  e.preventDefault();
  const pos = getPos(e);
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(pos.x, pos.y);
  ctx.strokeStyle = tool==='eraser' ? '#fff' : document.getElementById('penColor').value;
  ctx.lineWidth = parseInt(document.getElementById('penSize').value);
  ctx.stroke();
  lastX = pos.x; lastY = pos.y;
}
function endDraw(){ drawing = false; }

canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', moveDraw);
canvas.addEventListener('mouseup', endDraw);
canvas.addEventListener('mouseleave', endDraw);
canvas.addEventListener('touchstart', startDraw, {passive:false});
canvas.addEventListener('touchmove', moveDraw, {passive:false});
canvas.addEventListener('touchend', endDraw);

function restoreFromDataUrl(dataUrl){
  const img = new Image();
  img.onload = () => { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0); };
  img.src = dataUrl;
}

function undo(){
  if(undoStack.length === 0) return;
  redoStack.push(canvas.toDataURL());
  const prev = undoStack.pop();
  restoreFromDataUrl(prev);
}
function redo(){
  if(redoStack.length === 0) return;
  undoStack.push(canvas.toDataURL());
  const next = redoStack.pop();
  restoreFromDataUrl(next);
}
function clearCanvas(){
  saveState();
  ctx.fillStyle = '#fff';
  ctx.fillRect(0,0,canvas.width,canvas.height);
}
function exportPNG(){
  const link = document.createElement('a');
  link.download = 'drawing-' + Date.now() + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}
</script>
</body>
</html>
