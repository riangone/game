<script>
(function(){const t=localStorage.getItem('app_theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');})();
function toggleTheme(){const cur=document.documentElement.getAttribute('data-theme');const next=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',next);localStorage.setItem('app_theme',next);}

const STORAGE_KEY = 'countdown_events_v1';
let events = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
const GRADIENTS = [
  'linear-gradient(135deg,#0284c7,#06b6d4)',
  'linear-gradient(135deg,#8b5cf6,#d946ef)',
  'linear-gradient(135deg,#f59e0b,#ef4444)',
  'linear-gradient(135deg,#10b981,#059669)',
  'linear-gradient(135deg,#ec4899,#f43f5e)',
  'linear-gradient(135deg,#6366f1,#3b82f6)'
];

document.getElementById('evDate').value = new Date().toISOString().slice(0,10);

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(events)); render(); }

function addEvent(){
  const name = document.getElementById('evName').value.trim();
  const date = document.getElementById('evDate').value;
  const emoji = document.getElementById('evEmoji').value;
  if(!name || !date){ alert('请输入事件名称和日期'); return; }
  events.push({ id: Date.now(), name, date, emoji });
  document.getElementById('evName').value = '';
  save();
}
function removeEvent(id){ events = events.filter(e=>e.id!==id); save(); }

function diffDays(dateStr){
  const target = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((target - todayStart) / 86400000);
}

function render(){
  const grid = document.getElementById('cardsGrid');
  if(events.length === 0){
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">暂无倒数日事件，添加一个开始期待吧 🎈</div>';
    return;
  }
  const sorted = [...events].sort((a,b)=>diffDays(a.date)-diffDays(b.date));
  grid.innerHTML = sorted.map((e,i) => {
    const d = diffDays(e.date);
    let text, unit;
    if(d === 0){ text = '🎉'; unit = '就是今天！'; }
    else if(d > 0){ text = d; unit = '天后'; }
    else { text = Math.abs(d); unit = '天前'; }
    return `
      <div class="cd-card" style="background:${GRADIENTS[i % GRADIENTS.length]}">
        <button class="cd-del" onclick="removeEvent(${e.id})">✕</button>
        <div class="cd-emoji">${e.emoji}</div>
        <div class="cd-name">${escapeHtml(e.name)}</div>
        <div class="cd-date">${e.date}</div>
        <div class="cd-days">${text}</div>
        <div class="cd-unit">${unit}</div>
      </div>`;
  }).join('');
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

render();
setInterval(render, 60000);
</script>
