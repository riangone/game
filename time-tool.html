<main class="container">
  <h1 class="page-title">🕐 时间工具箱</h1>
  <p class="page-sub">Unix 时间戳互转、多时区世界时钟、日期间隔计算、年龄计算器，基于浏览器原生 Intl API，纯本地计算。</p>

  <div class="tabs">
    <button class="tab-btn active" data-tab="ts" onclick="switchTab('ts')">时间戳转换</button>
    <button class="tab-btn" data-tab="clock" onclick="switchTab('clock')">世界时钟</button>
    <button class="tab-btn" data-tab="diff" onclick="switchTab('diff')">日期间隔</button>
    <button class="tab-btn" data-tab="age" onclick="switchTab('age')">年龄计算</button>
  </div>

  <!-- 时间戳 -->
  <section class="panel active" id="panel-ts">
    <label class="small">Unix 时间戳（秒或毫秒）</label>
    <div class="row">
      <input type="text" id="tsInput" placeholder="输入时间戳..." style="flex:1;min-width:200px;">
      <button class="btn" onclick="tsToDate()">→ 转为日期</button>
      <button class="btn" style="background:var(--bg-subtle);color:var(--text-main);" onclick="useNowTs()">使用当前时间</button>
    </div>
    <label class="small">日期时间</label>
    <div class="row">
      <input type="datetime-local" id="dateInput" step="1" style="flex:1;min-width:200px;">
      <button class="btn" onclick="dateToTs()">→ 转为时间戳</button>
    </div>
    <div class="result-box" id="tsResult">结果将显示在这里...</div>
  </section>

  <!-- 世界时钟 -->

      <button class="btn" onclick="calcDiff()">计算间隔</button>
    </div>

  </section>

  <!-- 年龄 -->

    </div>
    <div class="stat-grid" id="ageResult"></div>

<script>
(function(){const t=localStorage.getItem('app_theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');})();
function toggleTheme(){const cur=document.documentElement.getAttribute('data-theme');const next=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',next);localStorage.setItem('app_theme',next);}

function switchTab(id){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===id));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+id));
}

function pad(n){ return String(n).padStart(2,'0'); }
function toLocalInputValue(d){
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
}

function useNowTs(){
  document.getElementById('tsInput').value = Date.now();
  tsToDate();
}

function tsToDate(){
  let v = document.getElementById('tsInput').value.trim();
  if(!v){ return; }
  let n = Number(v);
  if(isNaN(n)){ document.getElementById('tsResult').textContent = '✗ 请输入有效数字'; return; }
  if(String(Math.trunc(n)).length <= 10) n *= 1000; // 秒 -> 毫秒
  const d = new Date(n);
  if(isNaN(d.getTime())){ document.getElementById('tsResult').textContent = '✗ 无效的时间戳'; return; }
  document.getElementById('dateInput').value = toLocalInputValue(d);
  document.getElementById('tsResult').innerHTML =
    '本地时间: ' + d.toLocaleString('zh-CN', {hour12:false}) + '<br>' +
    'ISO 8601: ' + d.toISOString() + '<br>' +
    'UTC 时间: ' + d.toUTCString() + '<br>' +
    '秒级时间戳: ' + Math.floor(d.getTime()/1000) + '<br>' +
    '毫秒级时间戳: ' + d.getTime();
}

function dateToTs(){
  const v = document.getElementById('dateInput').value;
  if(!v){ return; }
  const d = new Date(v);
  if(isNaN(d.getTime())){ document.getElementById('tsResult').textContent = '✗ 无效日期'; return; }
  document.getElementById('tsInput').value = Math.floor(d.getTime()/1000);
  document.getElementById('tsResult').innerHTML =
    '秒级时间戳: ' + Math.floor(d.getTime()/1000) + '<br>' +
    '毫秒级时间戳: ' + d.getTime() + '<br>' +
    'ISO 8601: ' + d.toISOString() + '<br>' +
    'UTC 时间: ' + d.toUTCString();
}

// 世界时钟
const ZONES = [
  {city:'北京',tz:'Asia/Shanghai',flag:'🇨🇳'}, {city:'东京',tz:'Asia/Tokyo',flag:'🇯🇵'},
  {city:'首尔',tz:'Asia/Seoul',flag:'🇰🇷'}, {city:'新加坡',tz:'Asia/Singapore',flag:'🇸🇬'},
  {city:'伦敦',tz:'Europe/London',flag:'🇬🇧'}, {city:'巴黎',tz:'Europe/Paris',flag:'🇫🇷'},
  {city:'纽约',tz:'America/New_York',flag:'🇺🇸'}, {city:'洛杉矶',tz:'America/Los_Angeles',flag:'🇺🇸'},
  {city:'悉尼',tz:'Australia/Sydney',flag:'🇦🇺'}, {city:'迪拜',tz:'Asia/Dubai',flag:'🇦🇪'},
  {city:'莫斯科',tz:'Europe/Moscow',flag:'🇷🇺'}, {city:'UTC',tz:'UTC',flag:'🌐'}
];
function renderClocks(){
  const grid = document.getElementById('clockGrid');
  const now = new Date();
  grid.innerHTML = ZONES.map(z => {
    const timeStr = now.toLocaleTimeString('zh-CN', {timeZone:z.tz, hour12:false});
    const dateStr = now.toLocaleDateString('zh-CN', {timeZone:z.tz, month:'2-digit', day:'2-digit', weekday:'short'});
    return `<div class="clock-card"><div class="city">${z.flag} ${z.city}</div><div class="time">${timeStr}</div><div class="date">${dateStr}</div></div>`;
  }).join('');
}
renderClocks();
setInterval(renderClocks, 1000);

// 日期间隔
document.getElementById('diffStart').value = new Date().toISOString().slice(0,10);
document.getElementById('diffEnd').value = new Date().toISOString().slice(0,10);
function calcDiff(){
  const s = new Date(document.getElementById('diffStart').value);
  const e = new Date(document.getElementById('diffEnd').value);
  if(isNaN(s) || isNaN(e)){ return; }
  const ms = Math.abs(e - s);
  const days = Math.round(ms / 86400000);
  const weeks = (days/7).toFixed(1);
  const months = Math.round(days/30.44);
  const years = (days/365.25).toFixed(2);
  document.getElementById('diffResult').innerHTML = `
    <div class="stat-card"><b>${days}</b><span>总天数</span></div>
    <div class="stat-card"><b>${weeks}</b><span>约等于周</span></div>
    <div class="stat-card"><b>${months}</b><span>约等于月</span></div>
    <div class="stat-card"><b>${years}</b><span>约等于年</span></div>
    <div class="stat-card"><b>${days*24}</b><span>总小时数</span></div>
    <div class="stat-card"><b>${days*86400}</b><span>总秒数</span></div>`;
}

// 年龄计算
document.getElementById('birthDate').value = '2000-01-01';
function calcAge(){
  const b = new Date(document.getElementById('birthDate').value);
  if(isNaN(b)){ return; }
  const now = new Date();
  let years = now.getFullYear() - b.getFullYear();
  let months = now.getMonth() - b.getMonth();
  let days = now.getDate() - b.getDate();
  if(days < 0){ months--; days += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
  if(months < 0){ years--; months += 12; }
  const totalDays = Math.floor((now - b)/86400000);
  const nextBirthday = new Date(now.getFullYear(), b.getMonth(), b.getDate());
  if(nextBirthday < now) nextBirthday.setFullYear(now.getFullYear()+1);
  const daysToNext = Math.ceil((nextBirthday - now)/86400000);
  document.getElementById('ageResult').innerHTML = `
    <div class="stat-card"><b>${years}</b><span>周岁</span></div>
    <div class="stat-card"><b>${years}年${months}月${days}天</b><span>精确年龄</span></div>
    <div class="stat-card"><b>${totalDays}</b><span>总天数</span></div>
    <div class="stat-card"><b>${Math.floor(totalDays/7)}</b><span>总周数</span></div>
    <div class="stat-card"><b>${daysToNext}</b><span>距下次生日(天)</span></div>`;
}
</script>
