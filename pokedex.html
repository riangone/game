<meta charset="UTF-8">

<meta name="description" content="纯前端宝可梦属性检索、六维种族值雷达图、属性相克倍率推算与官方像素精灵动图，支持离线。">
<style>
:root{--bg-base:#f8fafc;--bg-surface:#fff;--bg-subtle:#f1f5f9;--border-color:#e2e8f0;--border-focus:#0284c7;--text-main:#0f172a;--text-muted:#64748b;--text-light:#94a3b8;--primary:#0284c7;--primary-hover:#0369a1;--primary-subtle:#e0f2fe;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--purple:#8b5cf6;--radius-sm:8px;--radius-md:14px;--radius-lg:20px;--radius-pill:9999px;--shadow-sm:0 1px 3px rgba(0,0,0,.05);--shadow-md:0 4px 6px -1px rgba(0,0,0,.06);--shadow-lg:0 10px 15px -3px rgba(0,0,0,.08);--font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;}
[data-theme="dark"]{--bg-base:#090d16;--bg-surface:#111827;--bg-subtle:#1f2937;--border-color:#374151;--border-focus:#38bdf8;--text-main:#f9fafb;--text-muted:#9ca3af;--text-light:#6b7280;--primary:#38bdf8;--primary-hover:#0ea5e9;--primary-subtle:rgba(56,189,248,.15);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--font-sans);background:var(--bg-base);color:var(--text-main);min-height:100vh;display:flex;flex-direction:column;}
header.app-header{background:var(--bg-surface);border-bottom:1px solid var(--border-color);position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;flex-wrap:wrap;}
.header-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.back-link{display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:var(--text-muted);font-size:13px;font-weight:600;padding:6px 10px;border-radius:var(--radius-sm);}
.back-link:hover{background:var(--primary-subtle);color:var(--primary);}
.app-brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;}
.tool-switch,.theme-btn{padding:7px 10px;border-radius:var(--radius-sm);border:1px solid var(--border-color);background:var(--bg-subtle);color:var(--text-main);font-size:13px;font-weight:600;cursor:pointer;}
.container{max-width:1100px;margin:0 auto;padding:24px 20px 48px;width:100%;flex:1;}
h1.page-title{font-size:22px;font-weight:800;margin-bottom:4px;}
p.page-sub{color:var(--text-muted);font-size:13px;margin-bottom:18px;}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.tab-btn{padding:8px 14px;border-radius:var(--radius-pill);border:1px solid var(--border-color);background:var(--bg-surface);color:var(--text-muted);font-size:13px;font-weight:700;cursor:pointer;transition:.2s;}
.tab-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.panel{display:none;background:var(--bg-surface);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm);}
.panel.active{display:block;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--radius-md);border:none;background:var(--primary);color:#fff;font-weight:700;font-size:13px;cursor:pointer;transition:.2s;}
.btn:hover{background:var(--primary-hover);}
.btn-subtle{background:var(--bg-subtle);color:var(--text-main);border:1px solid var(--border-color);}
.btn-subtle:hover{border-color:var(--primary);color:var(--primary);}
.btn-sm{padding:6px 12px;font-size:12px;}
input[type=text],input[type=number],textarea,select{width:100%;padding:10px 12px;border-radius:var(--radius-md);border:1px solid var(--border-color);background:var(--bg-subtle);color:var(--text-main);font-size:13px;outline:none;}
input:focus,textarea:focus,select:focus{border-color:var(--border-focus);}
label.field-label{font-size:12px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:6px;}
.badge{display:inline-block;padding:3px 8px;border-radius:var(--radius-pill);font-size:11px;font-weight:700;}
.badge-success{background:rgba(16,185,129,.15);color:var(--success);}
.badge-warning{background:rgba(245,158,11,.15);color:var(--warning);}
.badge-primary{background:var(--primary-subtle);color:var(--primary);}
.stat-card{background:var(--bg-subtle);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:14px;text-align:center;}
.stat-card b{display:block;font-size:22px;color:var(--primary);font-weight:800;font-family:var(--font-mono);}
.stat-card span{font-size:12px;color:var(--text-muted);}
</style>
    <link rel="canonical" href="https://tool.0101.click/pokedex.html">
</head>
<style>
.poke-layout{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start;}
@media(max-width:768px){.poke-layout{grid-template-columns:1fr;}}
.poke-card{background:var(--bg-subtle);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:20px;text-align:center;}
.poke-avatar{width:160px;height:160px;margin:0 auto;display:flex;align-items:center;justify-content:center;}
.poke-avatar img{max-width:100%;max-height:100%;image-rendering:pixelated;}
.type-badge{display:inline-block;padding:4px 10px;border-radius:var(--radius-pill);color:#fff;font-size:12px;font-weight:800;margin:2px;}
.stat-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px;}
.stat-table td{padding:6px 8px;}
.bar-track{height:8px;background:var(--border-color);border-radius:4px;overflow:hidden;}
.bar-val{height:100%;border-radius:4px;}
</style>

<header class="app-header">
  <div class="header-left">
    <a href="tools.html" class="back-link">← 工具箱</a>
    <div class="app-brand"><span>⚡</span><span>宝可梦像素图鉴</span></div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <select class="tool-switch" onchange="if(this.value) location.href=this.value;">
      <option value="">🔀 切换工具...</option>
      <option value="iss-tracker.html">🛰️ 空间站实时追踪</option>
      <option value="bing-wallpaper.html">🖼️ 每日壁纸视界</option>
      <option value="pokedex.html">⚡ 宝可梦图鉴</option>
      <option value="quote-card.html">🖋️ 一言灵感排版</option>
      <option value="country-explorer.html">🌍 世界地理百科</option>
      <option value="doh-lookup.html">🔍 原生DNS探针</option>
      <option value="github-card.html">🐙 GitHub名片工坊</option>
      <option value="tools.html">🏠 全部工具大厅</option>
    </select>
    <button class="theme-btn" onclick="toggleTheme()" title="切换明暗主题">🌓</button>
  </div>
</header>
<main class="container">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:12px;">
    <div>
      <h1 class="page-title">⚡ 宝可梦像素图鉴</h1>
      <p class="page-sub">经典宝可梦属性相克、六维种族值雷达图、像素动图与官方数据检索。</p>
    </div>
  </div>

  <div style="margin-bottom:16px;">
    <input type="text" id="pokeSearch" placeholder="输入宝可梦名称或编号搜索 (如: 皮卡丘, 喷火龙, 25, Gengar)..." oninput="filterPokemon()">
  </div>

  <div class="poke-layout">
    <div>
      <div class="panel active" style="max-height:450px;overflow-y:auto;padding:8px;" id="pokeListContainer"></div>
    </div>

    <div>
      <div class="panel active" id="detailPanel">
        <div style="display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:center;">
          <div style="text-align:center;">
            <div class="poke-avatar"><img id="pokeImg" src="" alt="pokemon"></div>
            <h2 id="pokeName" style="font-size:22px;font-weight:900;margin-top:8px;">--</h2>
            <div id="pokeTypes" style="margin-top:6px;"></div>
          </div>

          <div>
            <canvas id="radarChart" width="300" height="220" style="width:100%;height:220px;"></canvas>
          </div>
        </div>

        <div style="margin-top:16px;">
          <h3 style="font-size:14px;font-weight:700;margin-bottom:8px;">📊 六维种族值明细</h3>
          <table class="stat-table" id="statTable"></table>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
const TYPE_COLORS = {
  'Normal': '#9ca3af', 'Fire': '#ef4444', 'Water': '#3b82f6', 'Grass': '#10b981',
  'Electric': '#f59e0b', 'Ice': '#06b6d4', 'Fighting': '#b91c1c', 'Poison': '#a855f7',
  'Ground': '#d97706', 'Flying': '#818cf8', 'Psychic': '#ec4899', 'Bug': '#84cc16',
  'Rock': '#78716c', 'Ghost': '#6366f1', 'Dragon': '#4f46e5', 'Steel': '#64748b', 'Fairy': '#f472b6'
};

const POKEMONS = [
  { id: 25, name: '皮卡丘 (Pikachu)', types: ['Electric'], stats: [35, 55, 40, 50, 50, 90], sprite: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/25.gif' },
  { id: 6, name: '喷火龙 (Charizard)', types: ['Fire', 'Flying'], stats: [78, 84, 78, 109, 85, 100], sprite: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/6.gif' },
  { id: 3, name: '妙蛙花 (Venusaur)', types: ['Grass', 'Poison'], stats: [80, 82, 83, 100, 100, 80], sprite: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/3.gif' },
  { id: 9, name: '水箭龟 (Blastoise)', types: ['Water'], stats: [79, 83, 100, 85, 105, 78], sprite: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/9.gif' },
  { id: 94, name: '耿鬼 (Gengar)', types: ['Ghost', 'Poison'], stats: [60, 65, 60, 130, 75, 110], sprite: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/94.gif' },
  { id: 150, name: '超梦 (Mewtwo)', types: ['Psychic'], stats: [106, 110, 90, 154, 90, 130], sprite: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/150.gif' },
  { id: 133, name: '伊布 (Eevee)', types: ['Normal'], stats: [55, 55, 50, 45, 65, 55], sprite: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/133.gif' },
  { id: 143, name: '卡比兽 (Snorlax)', types: ['Normal'], stats: [160, 110, 65, 65, 110, 30], sprite: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/143.gif' }
];

let curPoke = POKEMONS[0];

function renderList(list) {
  const container = document.getElementById('pokeListContainer');
  container.innerHTML = '';
  list.forEach(p => {
    const item = document.createElement('div');
    item.className = 'btn btn-subtle' + (p.id === curPoke.id ? ' active' : '');
    item.style.cssText = 'width:100%;justify-content:flex-start;margin-bottom:6px;font-size:13px;padding:8px 12px;';
    item.innerHTML = '<span style="font-family:var(--font-mono);color:var(--text-muted);width:36px;">#' + String(p.id).padStart(3, '0') + '</span><span>' + p.name + '</span>';
    item.onclick = () => selectPoke(p);
    container.appendChild(item);
  });
}

function selectPoke(p) {
  curPoke = p;
  document.getElementById('pokeImg').src = p.sprite;
  document.getElementById('pokeName').textContent = '#' + p.id + ' ' + p.name;
  
  const typesBox = document.getElementById('pokeTypes');
  typesBox.innerHTML = p.types.map(t => '<span class="type-badge" style="background:' + (TYPE_COLORS[t] || '#64748b') + ';">' + t + '</span>').join('');

  renderStats(p.stats);
  drawRadar(p.stats);
}

const STAT_NAMES = ['生命 (HP)', '攻击 (Atk)', '防御 (Def)', '特攻 (Sp.Atk)', '特防 (Sp.Def)', '速度 (Speed)'];

function renderStats(stats) {
  const table = document.getElementById('statTable');
  table.innerHTML = stats.map((val, idx) => {
    const pct = Math.min(100, Math.round((val / 160) * 100));
    return '<tr><td style="width:110px;font-weight:700;">' + STAT_NAMES[idx] + '</td>' +
      '<td style="width:40px;font-family:var(--font-mono);font-weight:800;color:var(--primary);">' + val + '</td>' +
      '<td><div class="bar-track"><div class="bar-val" style="width:' + pct + '%;background:var(--primary);"></div></div></td></tr>';
  }).join('');
}

function drawRadar(stats) {
  const canvas = document.getElementById('radarChart');
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  const cx = w / 2;
  const cy = h / 2;
  const radius = 75;
  const total = 6;

  // Grid
  ctx.strokeStyle = '#cbd5e1';
  ctx.lineWidth = 1;
  for (let r = 0.25; r <= 1; r += 0.25) {
    ctx.beginPath();
    for (let i = 0; i < total; i++) {
      const angle = (Math.PI * 2 / total) * i - Math.PI / 2;
      const x = cx + Math.cos(angle) * (radius * r);
      const y = cy + Math.sin(angle) * (radius * r);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
  }

  // Polygon
  ctx.fillStyle = 'rgba(2, 132, 199, 0.35)';
  ctx.strokeStyle = '#0284c7';
  ctx.lineWidth = 2;
  ctx.beginPath();

  stats.forEach((val, i) => {
    const r = Math.min(1.2, val / 140) * radius;
    const angle = (Math.PI * 2 / total) * i - Math.PI / 2;
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
}

function filterPokemon() {
  const q = document.getElementById('pokeSearch').value.trim().toLowerCase();
  const filtered = POKEMONS.filter(p => p.name.toLowerCase().includes(q) || String(p.id).includes(q));
  renderList(filtered);
}

window.addEventListener('DOMContentLoaded', () => {
  renderList(POKEMONS);
  selectPoke(POKEMONS[0]);
});
</script>

<script>
function initTheme(){
  const saved=localStorage.getItem('app_theme');
  if(saved){document.documentElement.setAttribute('data-theme',saved);}
  else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const target=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',target);
  localStorage.setItem('app_theme',target);
}
initTheme();
function showToast(msg, duration=2200){
  const el=document.createElement('div');
  el.textContent=msg;
  el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:9999px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 10px 25px rgba(0,0,0,.2);transition:opacity .3s;';
  document.body.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),300);},duration);
}
</script>
</body>
