        <div style="margin-bottom:12px;">

          <div>

<script>
let curTab = 'upload';
const SIZES = [16, 32, 48, 64, 128, 192, 512];
let sourceCanvas = document.createElement('canvas');
sourceCanvas.width = 512;
sourceCanvas.height = 512;

function switchTab(tab) {
  curTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-tab') === tab));
  document.getElementById('panel-upload').classList.toggle('active', tab === 'upload');
  document.getElementById('panel-emoji').classList.toggle('active', tab === 'emoji');
  if (tab === 'emoji') drawEmojiSource();
}

function handleImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const ctx = sourceCanvas.getContext('2d');
      ctx.clearRect(0, 0, 512, 512);
      ctx.drawImage(img, 0, 0, 512, 512);
      renderAllSizes();
      showToast('图片加载成功，已生成各尺寸图标');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function drawEmojiSource() {
  const text = document.getElementById('emojiInput').value || '🚀';
  const bg = document.getElementById('emojiBg').value;
  const color = document.getElementById('emojiColor').value;
  const shape = document.getElementById('emojiShape').value;

  const ctx = sourceCanvas.getContext('2d');
  ctx.clearRect(0, 0, 512, 512);

  ctx.fillStyle = bg;
  if (shape === 'circle') {
    ctx.beginPath();
    ctx.arc(256, 256, 256, 0, Math.PI * 2);
    ctx.fill();
  } else if (shape === 'squircle') {
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(0, 0, 512, 512, 110) : ctx.rect(0, 0, 512, 512);
    ctx.fill();
  } else {
    ctx.fillRect(0, 0, 512, 512);
  }

  ctx.fillStyle = color;
  ctx.font = '280px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 256, 276);

  renderAllSizes();
}

function renderAllSizes() {
  const grid = document.getElementById('sizeGrid');
  grid.innerHTML = '';

  SIZES.forEach(sz => {
    const card = document.createElement('div');
    card.className = 'size-card';

    const cv = document.createElement('canvas');
    cv.width = sz;
    cv.height = sz;
    cv.style.width = Math.min(64, sz) + 'px';
    cv.style.height = Math.min(64, sz) + 'px';
    cv.id = 'cv_' + sz;
    const ctx = cv.getContext('2d');
    ctx.drawImage(sourceCanvas, 0, 0, sz, sz);

    card.appendChild(cv);
    card.innerHTML += '<div style="font-weight:700;font-size:12px;margin-bottom:6px;">' + sz + '×' + sz + '</div>' +
      '<button class="btn btn-subtle btn-sm" onclick="downloadPng(' + sz + ')">下载</button>';
    grid.appendChild(card);
  });

  // Mock icons
  const cv16 = document.getElementById('cv_16') || sourceCanvas;
  const url16 = cv16.toDataURL('image/png');
  document.getElementById('tabMockDark').src = url16;
  document.getElementById('tabMockLight').src = url16;

  // HTML tags
  const tags = '<link rel="icon" type="image/x-icon" href="/favicon.ico">\n' +
    '<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">\n' +
    '<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">\n' +
    '<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">';
  document.getElementById('htmlCodeArea').value = tags;
}

function downloadPng(sz) {
  const cv = document.getElementById('cv_' + sz);
  if (!cv) return;
  const a = document.createElement('a');
  a.href = cv.toDataURL('image/png');
  a.download = 'favicon-' + sz + 'x' + sz + '.png';
  a.click();
}

// Pure client-side binary ICO generator (Windows Icon format)
async function downloadIco() {
  // We embed 16x16 and 32x32 PNGs
  const cv16 = document.getElementById('cv_16');
  const cv32 = document.getElementById('cv_32');
  if (!cv16 || !cv32) return;

  const blob16 = await new Promise(r => cv16.toBlob(r, 'image/png'));
  const blob32 = await new Promise(r => cv32.toBlob(r, 'image/png'));
  const buf16 = new Uint8Array(await blob16.arrayBuffer());
  const buf32 = new Uint8Array(await blob32.arrayBuffer());

  const numImages = 2;
  const headerLen = 6;
  const dirEntryLen = 16;
  const offset16 = headerLen + numImages * dirEntryLen;
  const offset32 = offset16 + buf16.length;
  const totalLen = offset32 + buf32.length;

  const icoBuf = new Uint8Array(totalLen);
  const view = new DataView(icoBuf.buffer);

  // ICONDIR: reserved (0), type (1 for ico), count (2)
  view.setUint16(0, 0, true);
  view.setUint16(2, 1, true);
  view.setUint16(4, numImages, true);

  // Entry 1: 16x16
  icoBuf[6] = 16; // width
  icoBuf[7] = 16; // height
  icoBuf[8] = 0;  // color count
  icoBuf[9] = 0;  // reserved
  view.setUint16(10, 1, true); // color planes
  view.setUint16(12, 32, true); // bpp
  view.setUint32(14, buf16.length, true); // size
  view.setUint32(18, offset16, true); // offset

  // Entry 2: 32x32
  icoBuf[22] = 32;
  icoBuf[23] = 32;
  icoBuf[24] = 0;
  icoBuf[25] = 0;
  view.setUint16(26, 1, true);
  view.setUint16(28, 32, true);
  view.setUint32(30, buf32.length, true);
  view.setUint32(34, offset32, true);

  // Copy PNG image data
  icoBuf.set(buf16, offset16);
  icoBuf.set(buf32, offset32);

  const icoBlob = new Blob([icoBuf], { type: 'image/x-icon' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(icoBlob);
  a.download = 'favicon.ico';
  a.click();
  showToast('已生成标准二进制 favicon.ico！');
}

function copyHtmlTags() {
  const val = document.getElementById('htmlCodeArea').value;
  navigator.clipboard.writeText(val).then(() => showToast('HTML 标签代码已复制'));
}

window.addEventListener('DOMContentLoaded', drawEmojiSource);
</script>

<script>
function initTheme(){
  const saved=localStorage.getItem('app_theme');
  if(saved){document.documentElement.setAttribute('data-theme',saved);}
  else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const target=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',target);
  localStorage.setItem('app_theme',target);
}
initTheme();
function showToast(msg, duration=2200){
  const el=document.createElement('div');
  el.textContent=msg;
  el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:9999px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 10px 25px rgba(0,0,0,.2);transition:opacity .3s;';
  document.body.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),300);},duration);
}
</script>
