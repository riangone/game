<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>网络信息查询 · IP与浏览器指纹</title>
<meta name="description" content="查询公网IP地址、User-Agent解析、浏览器与系统指纹信息，免Key开放接口，断网自动降级为仅展示本机信息。">
<style>
:root{--bg-base:#f8fafc;--bg-surface:#fff;--bg-subtle:#f1f5f9;--border-color:#e2e8f0;--border-focus:#0284c7;--text-main:#0f172a;--text-muted:#64748b;--text-light:#94a3b8;--primary:#0284c7;--primary-hover:#0369a1;--primary-subtle:#e0f2fe;--success:#10b981;--danger:#ef4444;--radius-sm:8px;--radius-md:14px;--radius-lg:20px;--radius-pill:9999px;--shadow-sm:0 1px 3px rgba(0,0,0,.05);--font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;}
[data-theme="dark"]{--bg-base:#090d16;--bg-surface:#111827;--bg-subtle:#1f2937;--border-color:#374151;--border-focus:#38bdf8;--text-main:#f9fafb;--text-muted:#9ca3af;--text-light:#6b7280;--primary:#38bdf8;--primary-hover:#0ea5e9;--primary-subtle:rgba(56,189,248,.15);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--font-sans);background:var(--bg-base);color:var(--text-main);min-height:100vh;display:flex;flex-direction:column;}
header.app-header{background:var(--bg-surface);border-bottom:1px solid var(--border-color);position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;flex-wrap:wrap;}
.header-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.back-link{display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:var(--text-muted);font-size:13px;font-weight:600;padding:6px 10px;border-radius:var(--radius-sm);}
.back-link:hover{background:var(--primary-subtle);color:var(--primary);}
.app-brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;}
.tool-switch,.theme-btn{padding:7px 10px;border-radius:var(--radius-sm);border:1px solid var(--border-color);background:var(--bg-subtle);color:var(--text-main);font-size:13px;font-weight:600;cursor:pointer;}
.container{max-width:860px;margin:0 auto;padding:24px 20px 48px;width:100%;flex:1;}
h1.page-title{font-size:22px;font-weight:800;margin-bottom:4px;}
p.page-sub{color:var(--text-muted);font-size:13px;margin-bottom:18px;}
.hero-card{background:linear-gradient(135deg,#0284c7,#06b6d4);color:#fff;border-radius:var(--radius-lg);padding:24px;margin-bottom:18px;text-align:center;}
.hero-card .ip{font-size:32px;font-weight:900;font-family:var(--font-mono);letter-spacing:1px;}
.hero-card .label{font-size:12px;opacity:.85;margin-top:4px;}
.status-badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:var(--radius-pill);background:rgba(255,255,255,.2);margin-top:10px;}
.card{background:var(--bg-surface);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-sm);margin-bottom:16px;}
.card h3{font-size:14px;margin-bottom:12px;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.info-row{display:flex;justify-content:space-between;padding:8px 10px;background:var(--bg-subtle);border-radius:8px;font-size:12.5px;}
.info-row .k{color:var(--text-muted);font-weight:600;}
.info-row .v{font-weight:700;text-align:right;word-break:break-word;}
.ua-box{font-family:var(--font-mono);font-size:11.5px;background:var(--bg-subtle);padding:12px;border-radius:8px;word-break:break-all;line-height:1.6;}
.refresh-btn{padding:8px 16px;border-radius:var(--radius-md);border:1px solid var(--border-color);background:var(--bg-subtle);color:var(--text-main);font-size:12px;font-weight:700;cursor:pointer;}
</style>
    <link rel="canonical" href="https://tool.0101.click/network-info.html">
</head>
<body>
<header class="app-header">
  <div class="header-left">
    <a href="tools.html" class="back-link">← 工具箱</a>
    <div class="app-brand"><span>🌐</span><span>网络信息查询</span></div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <select class="tool-switch" onchange="if(this.value) location.href=this.value;">
      <option value="">🔀 切换工具...</option>
      <option value="network-info.html">🌐 网络信息</option>
      <option value="weather.html">🌤️ 天气</option>
      <option value="currency.html">💱 汇率</option>
      <option value="password.html">🔐 密码</option>
      <option value="hash-tool.html">#️⃣ 哈希校验</option>
          <option value="calendar.html">📅 万年历</option>
</select>
    <button class="theme-btn" onclick="toggleTheme()">🌓</button>
  </div>
</header>

<main class="container">
  <h1 class="page-title">🌐 网络信息查询</h1>
  <p class="page-sub">查询公网 IP、地理位置参考、User-Agent 解析与浏览器/系统指纹信息。免 Key 开放接口，断网自动降级仅展示本机信息。</p>

  <div class="hero-card">
    <div class="ip" id="ipDisplay">查询中...</div>
    <div class="label">您的公网 IP 地址</div>
    <div class="status-badge" id="statusBadge">🔄 正在连接...</div>
  </div>

  <div class="card">
    <h3>📍 IP 归属信息</h3>
    <div class="info-grid" id="ipInfoGrid">
      <div class="info-row"><span class="k">状态</span><span class="v">加载中...</span></div>
    </div>
    <div style="text-align:right;margin-top:10px;"><button class="refresh-btn" onclick="fetchIpInfo()">🔄 重新查询</button></div>
  </div>

  <div class="card">
    <h3>🖥️ 浏览器与设备信息</h3>
    <div class="info-grid" id="browserInfoGrid"></div>
  </div>

  <div class="card">
    <h3>📡 网络连接状态</h3>
    <div class="info-grid" id="networkInfoGrid"></div>
  </div>

  <div class="card">
    <h3>🔤 完整 User-Agent 字符串</h3>
    <div class="ua-box" id="uaBox"></div>
  </div>
</main>

<script>
(function(){const t=localStorage.getItem('app_theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');})();
function toggleTheme(){const cur=document.documentElement.getAttribute('data-theme');const next=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',next);localStorage.setItem('app_theme',next);}

function row(k,v,note){ return `<div class="info-row"><span class="k">${k}</span><span class="v">${v}${note?` <span title="${note}" style="cursor:help;opacity:.55;">ⓘ</span>`:''}</span></div>`; }

async function fetchIpInfo(){
  document.getElementById('ipDisplay').textContent = '查询中...';
  document.getElementById('statusBadge').textContent = '🔄 正在连接...';
  document.getElementById('ipInfoGrid').innerHTML = row('状态','加载中...');
  try{
    const controller = new AbortController();
    const timeout = setTimeout(()=>controller.abort(), 6000);
    const res = await fetch('https://ipapi.co/json/', { signal: controller.signal });
    clearTimeout(timeout);
    if(!res.ok) throw new Error('接口响应异常');
    const data = await res.json();
    document.getElementById('ipDisplay').textContent = data.ip || '未知';
    document.getElementById('statusBadge').textContent = '✓ 在线查询成功';
    document.getElementById('ipInfoGrid').innerHTML = [
      row('国家/地区', (data.country_name||'-') + ' ' + (data.country_code||'')),
      row('城市', data.city || '-'),
      row('地区', data.region || '-'),
      row('邮编', data.postal || '-'),
      row('时区', data.timezone || '-'),
      row('运营商/ASN', data.org || data.asn || '-'),
      row('经纬度', (data.latitude!=null && data.longitude!=null) ? data.latitude.toFixed(3)+', '+data.longitude.toFixed(3) : '-'),
      row('货币', data.currency || '-')
    ].join('');
  }catch(e){
    document.getElementById('ipDisplay').textContent = '无法获取';
    document.getElementById('statusBadge').textContent = '⚠️ 离线或请求超时，仅展示本机信息';
    document.getElementById('ipInfoGrid').innerHTML = row('状态', '网络请求失败，请检查网络连接后点击重新查询');
  }
}

const WIN_VER_MAP = [
  {re:/Windows NT 10\.0/, name:'Windows 10', ambiguous:true},
  {re:/Windows NT 6\.3/,  name:'Windows 8.1'},
  {re:/Windows NT 6\.2/,  name:'Windows 8'},
  {re:/Windows NT 6\.1/,  name:'Windows 7'},
  {re:/Windows NT 6\.0/,  name:'Windows Vista'},
  {re:/Windows NT 5\.1/,  name:'Windows XP'}
];

function parseUA(ua){
  let browser = '未知', browserVer = '', engineFamily = '未知';
  const isIOS = /iPhone|iPad|iPod/.test(ua);

  if(/MicroMessenger\/([\d.]+)/.test(ua)){ browser='微信内置浏览器'; browserVer = ua.match(/MicroMessenger\/([\d.]+)/)[1]; }
  else if(/QQBrowser\/([\d.]+)/.test(ua)){ browser='QQ浏览器'; browserVer = ua.match(/QQBrowser\/([\d.]+)/)[1]; }
  else if(/UCBrowser\/([\d.]+)/.test(ua)){ browser='UC浏览器'; browserVer = ua.match(/UCBrowser\/([\d.]+)/)[1]; }
  else if(/QihooBrowser\/([\d.]+)|360SE|360EE/.test(ua)){ browser='360浏览器'; browserVer = (ua.match(/QihooBrowser\/([\d.]+)/)||[])[1]||''; }
  else if(/SamsungBrowser\/([\d.]+)/.test(ua)){ browser='Samsung Internet'; browserVer = ua.match(/SamsungBrowser\/([\d.]+)/)[1]; }
  else if(/OPR\/([\d.]+)/.test(ua)){ browser='Opera'; browserVer = ua.match(/OPR\/([\d.]+)/)[1]; }
  else if(/EdgA\/([\d.]+)/.test(ua)){ browser='Edge (Android)'; browserVer = ua.match(/EdgA\/([\d.]+)/)[1]; }
  else if(/EdgiOS\/([\d.]+)/.test(ua)){ browser='Edge (iOS)'; browserVer = ua.match(/EdgiOS\/([\d.]+)/)[1]; }
  else if(/Edg\/([\d.]+)/.test(ua)){ browser='Edge'; browserVer = ua.match(/Edg\/([\d.]+)/)[1]; }
  else if(/FxiOS\/([\d.]+)/.test(ua)){ browser='Firefox (iOS)'; browserVer = ua.match(/FxiOS\/([\d.]+)/)[1]; }
  else if(/Firefox\/([\d.]+)/.test(ua) && !/Seamonkey/.test(ua)){ browser='Firefox'; browserVer = ua.match(/Firefox\/([\d.]+)/)[1]; }
  else if(/Trident\/|MSIE /.test(ua)){ browser='Internet Explorer'; browserVer = (ua.match(/rv:([\d.]+)/)||ua.match(/MSIE ([\d.]+)/)||[])[1]||''; }
  else if(/CriOS\/([\d.]+)/.test(ua)){ browser='Chrome (iOS)'; browserVer = ua.match(/CriOS\/([\d.]+)/)[1]; }
  else if(/Chrome\/([\d.]+)/.test(ua) && !/Chromium/.test(ua)){ browser='Chrome'; browserVer = ua.match(/Chrome\/([\d.]+)/)[1]; }
  else if(/Chromium\/([\d.]+)/.test(ua)){ browser='Chromium'; browserVer = ua.match(/Chromium\/([\d.]+)/)[1]; }
  else if(/Version\/([\d.]+).*Safari\//.test(ua)){ browser='Safari'; browserVer = ua.match(/Version\/([\d.]+)/)[1]; }

  if(isIOS){
    engineFamily = 'WebKit（iOS 系统政策强制统一内核，与浏览器品牌无关）';
  } else if(browser==='Firefox'){
    engineFamily = 'Gecko';
  } else if(browser==='Safari'){
    engineFamily = 'WebKit';
  } else if(browser==='Internet Explorer'){
    engineFamily = 'Trident';
  } else if(['Chrome','Edge','Edge (Android)','Opera','Samsung Internet','QQ浏览器','UC浏览器','360浏览器','微信内置浏览器','Chromium'].includes(browser)){
    engineFamily = 'Blink (Chromium)';
  }

  let os = '未知';
  const winMatch = WIN_VER_MAP.find(w=>w.re.test(ua));
  if(winMatch){ os = winMatch.ambiguous ? 'Windows 10/11（标准UA无法区分，见下方UA-CH校正）' : winMatch.name; }
  else if(/Mac OS X ([\d_]+)/.test(ua)){ os = 'macOS ' + ua.match(/Mac OS X ([\d_]+)/)[1].replace(/_/g,'.'); }
  else if(/CrOS/.test(ua)){ os = 'ChromeOS'; }
  else if(/Android ([\d.]+)/.test(ua)){ os = 'Android ' + ua.match(/Android ([\d.]+)/)[1]; }
  else if(isIOS){ os = 'iOS ' + ((ua.match(/OS ([\d_]+) like Mac OS X/)||[])[1]||'').replace(/_/g,'.'); }
  else if(/Linux/.test(ua)){ os = 'Linux' + (/Ubuntu/.test(ua)?' (Ubuntu)':''); }

  return { browser, browserVer, os, engineFamily };
}

async function refineWithUACH(){
  const uad = navigator.userAgentData;
  if(!uad) return null;
  try{
    return await uad.getHighEntropyValues(['platformVersion','architecture','bitness','model','uaFullVersion','fullVersionList','wow64']);
  }catch(e){ return null; }
}

async function renderBrowserInfo(){
  const ua = navigator.userAgent;
  let { browser, browserVer, os, engineFamily } = parseUA(ua);

  if(browser==='Chrome' && navigator.brave && typeof navigator.brave.isBrave==='function'){
    try{ if(await navigator.brave.isBrave()) browser='Brave'; }catch(e){}
  }

  const baseRows = [
    row('浏览器', browser + (browserVer?(' '+browserVer):'')),
    row('渲染引擎', engineFamily),
    row('操作系统', os, '基于 User-Agent 字符串推断；Windows 10 与 11 在标准UA中完全同值，无法仅凭UA区分'),
    row('语言', navigator.language),
    row('平台标识 (platform)', navigator.platform || '-', 'navigator.platform 已被 W3C 标记为过时(Deprecated)，部分浏览器已冻结/泛化该值'),
    row('CPU 逻辑核心数', navigator.hardwareConcurrency || '-', '浏览器出于反指纹追踪策略，可能对该值设置上限，不等于物理核心数'),
    row('设备内存(GB)', navigator.deviceMemory || '未知', 'Chrome 按2的幂次“打桶”近似返回，并非精确物理内存容量'),
    row('屏幕分辨率', screen.width + ' × ' + screen.height),
    row('可视区域', window.innerWidth + ' × ' + window.innerHeight),
    row('像素密度', window.devicePixelRatio + 'x'),
    row('色彩深度', screen.colorDepth + ' bit'),
    row('Cookie 启用', navigator.cookieEnabled ? '是' : '否'),
    row('触摸支持', ('ontouchstart' in window) ? '是' : '否', '仅表示设备具备触控能力声明，不代表用户正在使用触屏')
  ];
  document.getElementById('browserInfoGrid').innerHTML = baseRows.join('');
  document.getElementById('uaBox').textContent = ua;

  const uach = await refineWithUACH();
  if(uach){
    let osLine = os;
    if(navigator.userAgentData && navigator.userAgentData.platform==='Windows' && uach.platformVersion){
      const major = parseInt(uach.platformVersion.split('.')[0], 10);
      osLine = (major>=13 ? 'Windows 11' : 'Windows 10') + `（platformVersion=${uach.platformVersion}）`;
    } else if(uach.platformVersion){
      osLine = os + `（平台版本 ${uach.platformVersion}）`;
    }
    const extraRows = [
      row('操作系统（UA-CH 精确校正）', osLine, '通过 User-Agent Client Hints 高熵API获取，精度高于传统UA字符串正则解析'),
      uach.architecture ? row('CPU 架构', uach.architecture) : '',
      uach.bitness ? row('CPU 位数', uach.bitness+' bit') : '',
      uach.model ? row('设备型号', uach.model) : '',
      (uach.wow64!=null) ? row('WOW64 (32位兼容层)', uach.wow64 ? '是':'否') : '',
      uach.uaFullVersion ? row('浏览器完整版本号', uach.uaFullVersion) : ''
    ].filter(Boolean);
    document.getElementById('browserInfoGrid').insertAdjacentHTML('beforeend', extraRows.join(''));
  } else {
    document.getElementById('browserInfoGrid').insertAdjacentHTML('beforeend',
      row('UA-CH 高熵校正', '当前浏览器不支持 / 未授予', '仅 Chromium 系浏览器（Chrome/Edge/Opera/Samsung Internet等）支持该 API，Firefox 与 Safari 完全不支持'));
  }
}

function renderNetworkInfo(){
  const grid = document.getElementById('networkInfoGrid');
  const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  const rows = [row('当前状态', navigator.onLine ? '🟢 在线' : '🔴 离线')];
  if(conn){
    rows.push(row('网络类型', conn.effectiveType || '-', '浏览器基于近期流量的估算值，非实测带宽'));
    rows.push(row('预估下行速度', conn.downlink ? conn.downlink+' Mbps' : '-', '浏览器估算值，仅供参考'));
    rows.push(row('往返延迟(RTT)', conn.rtt ? conn.rtt+' ms' : '-', '浏览器估算值，仅供参考'));
    rows.push(row('省流模式', conn.saveData ? '已开启' : '未开启'));
  } else {
    rows.push(row('网络详情API', '当前浏览器不支持 Network Information API', '仅 Chromium 系浏览器支持，Firefox 与 Safari 不支持'));
  }
  grid.innerHTML = rows.join('');
}

renderBrowserInfo();
renderNetworkInfo();
fetchIpInfo();
window.addEventListener('online', renderNetworkInfo);
window.addEventListener('offline', renderNetworkInfo);
</script>
</body>
