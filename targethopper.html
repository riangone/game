<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>打靶蓄力 - Target Hopper</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #1a0f24;
    font-family: 'Outfit', "PingFang SC", "Microsoft YaHei", sans-serif;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #game { display: block; width: 100%; height: 100%; }

  #hud {
    position: fixed; top: 0; left: 0; width: 100%;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 20px 24px; box-sizing: border-box; pointer-events: none;
    z-index: 5;
  }
  .hud-card {
    background: rgba(40, 12, 58, 0.45);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    padding: 12px 20px;
    color: #fff;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
  }
  #score-container { display: flex; gap: 14px; }
  .hud-value-highlight { font-size: 28px; font-weight: 800; color: #fbbf24; line-height: 1.1; margin-top: 2px;}
  .hud-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.75; margin-bottom: 2px; }
  .hud-value { font-size: 14px; opacity: 0.95; }
  #comboEl.hot { color: #f472b6; }

  #windCard { align-items: center; }
  #windArrow { font-size: 20px; transition: transform 0.2s ease; display: inline-block; }
  #windVal { font-size: 13px; opacity: 0.9; }

  #hint {
    position: fixed; top: 90px; left: 50%; transform: translateX(-50%);
    text-align: center; color: #fff; opacity: 0.9; font-size: 13px;
    pointer-events: none; z-index: 5;
    background: rgba(40, 12, 58, 0.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 7px 20px;
    border-radius: 20px;
    max-width: 90vw; box-sizing: border-box;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    transition: opacity 0.3s ease;
    white-space: normal;
  }

  #banner {
    position: fixed; top: 34%; left: 50%; transform: translate(-50%, -50%);
    color: #fff; font-size: 22px; font-weight: 800;
    background: rgba(251, 191, 36, 0.22);
    border: 1px solid rgba(251, 191, 36, 0.6);
    padding: 10px 28px; border-radius: 16px;
    display: none; z-index: 6; pointer-events: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    text-align: center;
  }

  #overlay {
    position: fixed; inset: 0; background: rgba(20, 8, 30, 0.6);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; backdrop-filter: blur(8px); z-index: 9;
  }
  #overlay.show { display: flex; }

  .glass-panel {
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 24px;
    padding: 32px 36px;
    text-align: center;
    max-width: 340px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    color: #fff;
  }
  .glass-panel h1 { font-size: 26px; margin: 0 0 6px; font-weight: 800; }
  .glass-panel p { font-size: 13px; opacity: 0.85; line-height: 1.6; margin: 4px 0 18px; }
  .btn {
    background: linear-gradient(135deg, #fbbf24, #f472b6);
    border: none; color: #241028; font-weight: 800; font-size: 16px;
    padding: 13px 34px; border-radius: 14px; cursor: pointer;
    box-shadow: 0 8px 20px rgba(251, 191, 36, 0.35);
    pointer-events: auto;
  }
  .btn:active { transform: scale(0.96); }
  #finalScoreVal { font-size: 46px; font-weight: 800; color: #fbbf24; margin: 6px 0; }
  #bestScoreLine { font-size: 13px; opacity: 0.85; margin-bottom: 18px; }

  #gearBtn {
    position: fixed; bottom: 18px; right: 18px; width: 44px; height: 44px;
    border-radius: 50%; background: rgba(40,12,58,0.5); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center;
    z-index: 8; cursor: pointer; pointer-events: auto; backdrop-filter: blur(8px);
  }
  #settingsPanel {
    position: fixed; inset: 0; background: rgba(20,8,30,0.6); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; z-index: 10;
  }
  #settingsPanel.show { display: flex; }
  .setting-row { display: flex; align-items: center; justify-content: space-between; margin: 12px 0; gap: 16px; }
  .setting-row span { font-size: 14px; }
  .switch { position: relative; width: 44px; height: 24px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider-toggle { position: absolute; cursor: pointer; inset: 0; background: rgba(255,255,255,0.25); border-radius: 24px; transition: 0.2s; }
  .slider-toggle:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: 0.2s; }
  input:checked + .slider-toggle { background: #f472b6; }
  input:checked + .slider-toggle:before { transform: translateX(20px); }
  #closeSettings { margin-top: 10px; }

  #banner.gold { background: rgba(251, 191, 36, 0.3); border-color: rgba(251,191,36,0.8); color: #fef3c7; }
  #banner.bonus { background: rgba(244, 114, 182, 0.28); border-color: rgba(244,114,182,0.7); color: #fce7f3; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-card">
    <div id="score-container">
      <div>
        <div class="hud-label">SCORE</div>
        <div class="hud-value-highlight" id="scoreEl">0</div>
      </div>
      <div>
        <div class="hud-label">BEST</div>
        <div class="hud-value" id="bestEl" style="margin-top:6px;">0</div>
      </div>
    </div>
    <div class="hud-value" id="comboEl" style="margin-top:6px;">连击 0</div>
  </div>
  <div class="hud-card" id="windCard">
    <div class="hud-label">风力</div>
    <div><span id="windArrow">→</span> <span id="windVal">0</span></div>
    <div class="hud-value" id="arrowsEl" style="margin-top:6px;">箭 10</div>
  </div>
</div>

<div id="hint">按住蓄力，拖动瞄准抵消风力，在满力瞬间松手</div>
<div id="banner"></div>

<div id="overlay" class="show">
  <div class="glass-panel">
    <h1>🎯 打靶蓄力</h1>
    <p>单指按住蓄力拉弓，拖动同一根手指瞄准抵消风力偏移，在力度条冲顶的瞬间松手放箭。<br>越靠近靶心得分越高，分级评分而非非成即败。</p>
    <button class="btn" id="startBtn">开始游戏</button>
  </div>
</div>

<div id="settingsPanel">
  <div class="glass-panel">
    <h1 style="font-size:20px;">设置</h1>
    <div class="setting-row">
      <span>音效</span>
      <label class="switch"><input type="checkbox" id="soundToggle"><span class="slider-toggle"></span></label>
    </div>
    <div class="setting-row">
      <span>瞄准辅助线</span>
      <label class="switch"><input type="checkbox" id="guideToggle"><span class="slider-toggle"></span></label>
    </div>
    <button class="btn" id="closeSettings">关闭</button>
  </div>
</div>

<div id="gearBtn">⚙</div>

<script>
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("scoreEl");
  const bestEl = document.getElementById("bestEl");
  const comboEl = document.getElementById("comboEl");
  const arrowsEl = document.getElementById("arrowsEl");
  const windArrowEl = document.getElementById("windArrow");
  const windValEl = document.getElementById("windVal");
  const hintEl = document.getElementById("hint");
  const bannerEl = document.getElementById("banner");
  const startOverlay = document.getElementById("overlay");
  const startBtn = document.getElementById("startBtn");
  const gearBtn = document.getElementById("gearBtn");
  const settingsPanel = document.getElementById("settingsPanel");
  const soundToggle = document.getElementById("soundToggle");
  const guideToggle = document.getElementById("guideToggle");
  const closeSettings = document.getElementById("closeSettings");

  // ---------- Settings ----------
  let soundEnabled = localStorage.getItem("targetHopperSound") !== "false";
  let guideEnabled = localStorage.getItem("targetHopperGuide") !== "false";
  soundToggle.checked = soundEnabled;
  guideToggle.checked = guideEnabled;
  soundToggle.addEventListener("change", () => { soundEnabled = soundToggle.checked; localStorage.setItem("targetHopperSound", String(soundEnabled)); });
  guideToggle.addEventListener("change", () => { guideEnabled = guideToggle.checked; localStorage.setItem("targetHopperGuide", String(guideEnabled)); });
  gearBtn.addEventListener("click", () => settingsPanel.classList.add("show"));
  closeSettings.addEventListener("click", () => settingsPanel.classList.remove("show"));

  // ---------- Canvas sizing: fixed virtual world, letterboxed & scaled to fit screen ----------
  let DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;
  const WORLD_W = 360, WORLD_H = 640;
  let vscale = 1, offX = 0, offY = 0;
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    vscale = Math.min(W / WORLD_W, H / WORLD_H);
    offX = (W - WORLD_W * vscale) / 2;
    offY = (H - WORLD_H * vscale) / 2;
  }
  window.addEventListener("resize", resize);
  resize();

  function toWorld(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return { x: (clientX - rect.left - offX) / vscale, y: (clientY - rect.top - offY) / vscale };
  }

  // ---------- Audio ----------
  let audioCtx = null;
  function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  function tone(type, freq, freqEnd, dur, gainAmt, now, delay) {
    delay = delay || 0;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now + delay);
    if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, now + delay + dur);
    gain.gain.setValueAtTime(gainAmt, now + delay);
    gain.gain.exponentialRampToValueAtTime(0.001, now + delay + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now + delay); osc.stop(now + delay + dur + 0.02);
  }
  function playSound(type) {
    if (!soundEnabled) return;
    if (!audioCtx) initAudio();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const now = audioCtx.currentTime;
    if (type === "chargeStart") tone("sine", 240, null, 0.08, 0.06, now);
    else if (type === "loose") tone("sawtooth", 300, 700, 0.1, 0.12, now);
    else if (type === "gold") { [880, 1108, 1318].forEach((f, i) => tone("sine", f, null, 0.22, 0.12, now, i * 0.05)); }
    else if (type === "hit8") tone("sine", 700, 900, 0.14, 0.11, now);
    else if (type === "hit6") tone("sine", 560, 640, 0.12, 0.1, now);
    else if (type === "hit4") tone("triangle", 420, 380, 0.12, 0.1, now);
    else if (type === "hit2") tone("triangle", 320, 260, 0.12, 0.09, now);
    else if (type === "miss") tone("triangle", 180, 80, 0.22, 0.11, now);
    else if (type === "bonus") { [523, 659, 784, 1047, 1318].forEach((f, i) => tone("sine", f, null, 0.18, 0.1, now, i * 0.06)); }
    else if (type === "gameover") tone("triangle", 280, 60, 0.5, 0.15, now);
  }

  // ---------- Physics / scoring constants ----------
  // Validated via Node Monte-Carlo (/tmp/pw-test/targethopper_sim2.js, 4000-20000 trials/case):
  //  Skilled (22ms release jitter, 4px base aim jitter, 6% wind-proportional aim error):
  //    gold rate 98.5% round1 -> 93.7% round10, avg score/arrow 9.97 -> 9.87
  //  Average (50ms/10px/12%): gold rate 65.6% -> 42.0%, avg 9.29 -> 8.55
  //  Shaky   (95ms/20px/22%): gold rate 32.4% -> 12.4%, avg 8.17 -> 6.07, zeroRate climbs to 8.2% by round10
  //  Full 10(+bonus)-arrow game: 0% early-end (4-consecutive-zero) rate across all three tiers at these jitter
  //  levels -- the mercy rule is a safety net for truly wild play, not a normal-play trap.
  //  Monotonic difficulty ramp confirmed: gold rate strictly declines round-over-round for Average/Shaky.
  const SENS_Y = 240;
  const RINGS = [ [10, 10, "#fde68a"], [26, 8, "#f87171"], [44, 6, "#f87171"], [64, 4, "#60a5fa"], [88, 2, "#60a5fa"] ];
  const BOARD_R = 110;
  const MAX_AIM = 70;
  function freqForRound(round) { return Math.min(0.30 + round * 0.09, 1.3); }
  function windForRound(round) { return Math.min(6 + round * 4, 50); }
  function ringScore(dist) {
    for (const [maxD, s] of RINGS) if (dist <= maxD) return s;
    return 0;
  }
  function ringColorAt(dist) {
    for (const [maxD, , c] of RINGS) if (dist <= maxD) return c;
    return null;
  }
  function computeShot(chargeP, aimValue, wind) {
    // chargeP: power-needle value [0,1] at release. aimValue: player's accumulated drag (px).
    const vErr = Math.max(0, 1 - chargeP);
    const dy = vErr * SENS_Y;
    const hErr = aimValue + wind;
    const dx = Math.max(-160, Math.min(160, hErr));
    const dist = Math.sqrt(dx * dx + dy * dy);
    return { dx, dy, dist, score: ringScore(dist) };
  }

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }

  // ---------- Game state ----------
  const BOARD_X = 180, BOARD_Y = 190;
  const ARCHER_X = 180, ARCHER_Y = 560;
  const BAR_X = 60, BAR_Y = 585, BAR_W = 240, BAR_H = 14;

  let state = "idle"; // idle | charging | flying | gameover
  let score = 0;
  let best = parseInt(localStorage.getItem("targetHopperBest") || "0", 10);
  bestEl.textContent = best;
  let arrowsLeft = 10;
  let arrowsShot = 0;
  let combo = 0;
  let zeroStreak = 0;
  let goldStreak = 0;
  let currentWind = 0; // signed px
  let currentRound = 1;

  let chargeStartT = 0;
  let chargeFreq = 0.3;
  let currentPower = 0;
  let aimDrag = 0;
  let pointerId = null;
  let dragStartX = 0;

  let impacts = []; // embedded arrows on board {dx,dy,score}
  let particles = [];
  let floatingTexts = [];
  let flight = null; // {fromX,fromY,toX,toY,t0,dur, result}
  let blinkT = rand(2, 5);
  let blinking = false;
  let idleT = 0;
  let lastT = 0;

  function newWind() {
    currentRound = Math.ceil((arrowsShot + 1) / 2);
    const mag = windForRound(currentRound);
    currentWind = mag * (Math.random() < 0.5 ? -1 : 1);
    chargeFreq = freqForRound(currentRound);
    windArrowEl.textContent = currentWind >= 0 ? "→" : "←";
    windArrowEl.style.transform = currentWind >= 0 ? "scaleX(1)" : "scaleX(-1)";
    windValEl.textContent = Math.abs(Math.round(currentWind));
  }

  function resetGame() {
    state = "idle";
    score = 0; arrowsLeft = 10; arrowsShot = 0; combo = 0; zeroStreak = 0; goldStreak = 0;
    impacts = []; particles = []; floatingTexts = []; flight = null;
    aimDrag = 0; currentPower = 0;
    newWind();
    updateHud();
    hideBanner();
  }

  function updateHud() {
    scoreEl.textContent = score;
    comboEl.textContent = "连击 " + combo;
    comboEl.classList.toggle("hot", combo >= 3);
    arrowsEl.textContent = "箭 " + arrowsLeft;
  }

  function showBanner(text, cls, ms) {
    bannerEl.textContent = text;
    bannerEl.className = cls || "";
    bannerEl.style.display = "block";
    clearTimeout(showBanner._t);
    showBanner._t = setTimeout(hideBanner, ms || 900);
  }
  function hideBanner() { bannerEl.style.display = "none"; }

  function spawnParticles(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(40, 160);
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.4, 0.8), maxLife: 0.8, color });
    }
  }
  function spawnFloatingText(x, y, text, color) {
    floatingTexts.push({ x, y, text, color, life: 1.0, vy: -40 });
  }

  // ---------- Input ----------
  function beginCharge(x, y, pid) {
    if (state !== "idle" || arrowsLeft <= 0) return;
    state = "charging";
    chargeStartT = performance.now();
    currentPower = 0;
    aimDrag = 0;
    dragStartX = x;
    pointerId = pid;
    playSound("chargeStart");
  }
  function updateAim(x) {
    if (state !== "charging") return;
    aimDrag = clamp(x - dragStartX, -MAX_AIM, MAX_AIM);
  }
  function releaseShot() {
    if (state !== "charging") return;
    const result = computeShot(currentPower, aimDrag, currentWind);
    resolveShot(result);
  }

  function resolveShot(result) {
    state = "flying";
    playSound("loose");
    flight = {
      fromX: ARCHER_X, fromY: ARCHER_Y - 40,
      toX: BOARD_X + result.dx, toY: BOARD_Y + result.dy,
      t0: performance.now(), dur: 380, result
    };
  }

  function landShot(result) {
    arrowsShot++;
    arrowsLeft--;
    impacts.push({ dx: result.dx, dy: result.dy, score: result.score });
    if (impacts.length > 14) impacts.shift();
    score += result.score;

    let bonusText = "";
    if (result.score === 10) {
      combo++; goldStreak++; zeroStreak = 0;
      spawnParticles(BOARD_X + result.dx, BOARD_Y + result.dy, "#fde68a", 26);
      spawnFloatingText(BOARD_X + result.dx, BOARD_Y + result.dy - 10, "GOLD +10", "#fde68a");
      playSound("gold");
      showBanner("GOLD!", "gold", 700);
      if (goldStreak >= 3) {
        score += 5;
        arrowsLeft++;
        goldStreak = 0;
        bonusText = "3连金 +5分 追加1箭!";
        setTimeout(() => showBanner(bonusText, "bonus", 1200), 750);
        playSound("bonus");
      }
    } else if (result.score > 0) {
      combo++; goldStreak = 0; zeroStreak = 0;
      spawnParticles(BOARD_X + result.dx, BOARD_Y + result.dy, ringColorAt(result.dist) || "#fff", 14);
      spawnFloatingText(BOARD_X + result.dx, BOARD_Y + result.dy - 10, "+" + result.score, "#fff");
      playSound("hit" + result.score);
    } else {
      combo = 0; goldStreak = 0; zeroStreak++;
      spawnFloatingText(BOARD_X + result.dx, BOARD_Y + Math.min(result.dy, 220) - 10, "MISS", "#94a3b8");
      playSound("miss");
    }

    updateHud();

    if (zeroStreak >= 4) {
      endGame();
      return;
    }
    if (arrowsLeft <= 0) {
      endGame();
      return;
    }
    state = "idle";
    currentPower = 0; aimDrag = 0;
    newWind();
  }

  function endGame() {
    state = "gameover";
    playSound("gameover");
    if (score > best) { best = score; localStorage.setItem("targetHopperBest", String(best)); }
    bestEl.textContent = best;
    showGameOverPanel();
  }

  // ---------- Game over panel (built dynamically to match glass style) ----------
  let gopanel = null;
  function showGameOverPanel() {
    if (!gopanel) {
      gopanel = document.createElement("div");
      gopanel.id = "goOverlay";
      gopanel.style.cssText = "position:fixed;inset:0;background:rgba(20,8,30,0.6);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);z-index:9;";
      gopanel.innerHTML = '<div class="glass-panel"><h1>比赛结束</h1><div id="finalScoreVal">0</div><div id="bestScoreLine">最高分 0</div><button class="btn" id="restartBtn">再打一轮</button></div>';
      document.body.appendChild(gopanel);
      gopanel.querySelector("#restartBtn").addEventListener("click", () => {
        gopanel.style.display = "none";
        resetGame();
      });
    }
    gopanel.querySelector("#finalScoreVal").textContent = score;
    gopanel.querySelector("#bestScoreLine").textContent = "最高分 " + best;
    gopanel.style.display = "flex";
  }

  // ---------- Pointer events (single-finger charge + drag-aim, matches climber/curlhop UX) ----------
  canvas.addEventListener("pointerdown", (e) => {
    if (state === "gameover") return;
    initAudio();
    const p = toWorld(e.clientX, e.clientY);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* defensive: some touch edge cases throw */ }
    beginCharge(p.x, p.y, e.pointerId);
  });
  canvas.addEventListener("pointermove", (e) => {
    if (e.pointerId !== pointerId) return;
    const p = toWorld(e.clientX, e.clientY);
    updateAim(p.x);
  });
  function onPointerUp(e) {
    if (e.pointerId !== pointerId) return;
    releaseShot();
    pointerId = null;
  }
  canvas.addEventListener("pointerup", onPointerUp);
  canvas.addEventListener("pointercancel", onPointerUp);

  startBtn.addEventListener("click", () => {
    startOverlay.classList.remove("show");
    initAudio();
    resetGame();
  });

  // ---------- Update / Draw ----------
  function update(dt, now) {
    idleT += dt;
    blinkT -= dt;
    if (blinkT <= 0 && !blinking) { blinking = true; blinkT = 0.14; }
    else if (blinking && blinkT <= 0) { blinking = false; blinkT = rand(2.5, 5.5); }

    if (state === "charging") {
      const t = (now - chargeStartT) / 1000;
      currentPower = 0.5 + 0.5 * Math.sin(2 * Math.PI * chargeFreq * t);
    }

    if (state === "flying" && flight) {
      const t = clamp((now - flight.t0) / flight.dur, 0, 1);
      if (t >= 1) {
        landShot(flight.result);
        flight = null;
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 220 * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const f = floatingTexts[i];
      f.y += f.vy * dt; f.life -= dt * 1.1;
      if (f.life <= 0) floatingTexts.splice(i, 1);
    }
  }

  function drawArcher(bowPull) {
    const x = ARCHER_X, y = ARCHER_Y;
    ctx.save();
    ctx.translate(x, y);
    const bob = Math.sin(idleT * 2) * 2;
    ctx.translate(0, bob);
    // body capsule
    ctx.fillStyle = "#fb923c";
    ctx.beginPath();
    ctx.moveTo(-16, 10);
    ctx.arc(0, -6, 16, Math.PI * 0.5, Math.PI * 1.5);
    ctx.arc(0, 10, 16, Math.PI * 1.5, Math.PI * 2.5);
    ctx.closePath();
    ctx.fill();
    // face
    ctx.fillStyle = "#1a0f24";
    if (blinking) {
      ctx.fillRect(-9, -10, 6, 2);
      ctx.fillRect(3, -10, 6, 2);
    } else {
      ctx.beginPath(); ctx.arc(-6, -9, 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(6, -9, 2.4, 0, Math.PI * 2); ctx.fill();
    }
    // bow arm
    ctx.strokeStyle = "#7c2d12"; ctx.lineWidth = 3; ctx.lineCap = "round";
    const pull = bowPull * 10;
    ctx.beginPath(); ctx.arc(0, -6, 22, -0.9, 0.9); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(15, -22); ctx.lineTo(-4 - pull, -6); ctx.lineTo(15, 10);
    ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.restore();
  }

  function drawBoard() {
    ctx.save();
    ctx.translate(BOARD_X, BOARD_Y);
    // stand
    ctx.fillStyle = "#4c1d3a";
    ctx.fillRect(-8, BOARD_R - 4, 16, 70);
    // rings back to front (outer to inner)
    const ringDefs = [
      { r: BOARD_R, c: "#1e293b" },
      { r: 88, c: "#3b82f6" },
      { r: 64, c: "#60a5fa" },
      { r: 44, c: "#ef4444" },
      { r: 26, c: "#f87171" },
      { r: 10, c: "#fde68a" }
    ];
    for (const rd of ringDefs) {
      ctx.beginPath();
      ctx.arc(0, 0, rd.r, 0, Math.PI * 2);
      ctx.fillStyle = rd.c;
      ctx.fill();
    }
    ctx.strokeStyle = "rgba(255,255,255,0.25)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, BOARD_R, 0, Math.PI * 2); ctx.stroke();

    // embedded arrows from previous shots
    for (const im of impacts) {
      ctx.save();
      ctx.translate(im.dx, im.dy);
      ctx.rotate(Math.atan2(im.dy, im.dx) + Math.PI / 2);
      ctx.fillStyle = "#e2e8f0";
      ctx.fillRect(-1.5, -12, 3, 18);
      ctx.fillStyle = "#facc15";
      ctx.beginPath(); ctx.moveTo(-4, -12); ctx.lineTo(4, -12); ctx.lineTo(0, -20); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  function drawAimGuide() {
    if (!guideEnabled || state !== "charging") return;
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.setLineDash([4, 6]);
    ctx.lineWidth = 1.5;
    const targetX = BOARD_X - currentWind; // where player should aim to cancel wind
    ctx.beginPath(); ctx.moveTo(targetX, BOARD_Y - BOARD_R - 10); ctx.lineTo(targetX, BOARD_Y + BOARD_R + 10);
    ctx.stroke();
    ctx.setLineDash([]);
    // current aim marker
    const curX = BOARD_X + aimDrag + currentWind;
    ctx.fillStyle = "#fde68a";
    ctx.beginPath(); ctx.arc(curX, BOARD_Y - BOARD_R - 22, 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawPowerBar() {
    ctx.save();
    ctx.fillStyle = "rgba(255,255,255,0.15)";
    ctx.beginPath();
    roundRect(BAR_X, BAR_Y, BAR_W, BAR_H, 7);
    ctx.fill();
    if (state === "charging") {
      const nx = BAR_X + currentPower * BAR_W;
      const grad = ctx.createLinearGradient(BAR_X, 0, BAR_X + BAR_W, 0);
      grad.addColorStop(0, "#60a5fa"); grad.addColorStop(0.7, "#fbbf24"); grad.addColorStop(1, "#f87171");
      ctx.fillStyle = grad;
      ctx.beginPath();
      roundRect(BAR_X, BAR_Y, Math.max(6, nx - BAR_X), BAR_H, 7);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(nx, BAR_Y + BAR_H / 2, 8, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  function roundRect(x, y, w, h, r) {
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawFlight() {
    if (state !== "flying" || !flight) return;
    const t = clamp((performance.now() - flight.t0) / flight.dur, 0, 1);
    const x = flight.fromX + (flight.toX - flight.fromX) * t;
    const y = flight.fromY + (flight.toY - flight.fromY) * t - Math.sin(t * Math.PI) * 60;
    ctx.save();
    ctx.translate(x, y);
    const angle = Math.atan2((flight.toY - flight.fromY) - Math.cos(t * Math.PI) * 60 * Math.PI, flight.toX - flight.fromX);
    ctx.rotate(angle);
    ctx.strokeStyle = "#e2e8f0"; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(12, 0); ctx.stroke();
    ctx.fillStyle = "#facc15";
    ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(6, -4); ctx.lineTo(6, 4); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function draw() {
    ctx.save();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.translate(offX, offY);
    ctx.scale(vscale, vscale);

    const g = ctx.createLinearGradient(0, 0, 0, WORLD_H);
    g.addColorStop(0, "#2c1436"); g.addColorStop(1, "#170a20");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, WORLD_W, WORLD_H);

    drawBoard();
    drawAimGuide();
    drawFlight();
    drawArcher(state === "charging" ? currentPower : 0);
    drawPowerBar();

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    for (const f of floatingTexts) {
      ctx.globalAlpha = clamp(f.life, 0, 1);
      ctx.fillStyle = f.color;
      ctx.font = "800 16px Outfit, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(f.text, f.x, f.y);
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  function loop(now) {
    if (!lastT) lastT = now;
    const dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;
    update(dt, now);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  newWind();
  updateHud();

  // ---------- Debug hook for automated (Playwright) testing ----------
  window.__targetHopperDebug = {
    getState: () => state,
    getScore: () => score,
    getArrowsLeft: () => arrowsLeft,
    getCombo: () => combo,
    getWind: () => currentWind,
    getRound: () => currentRound,
    getBest: () => best,
    ringScore,
    computeShot,
    // bypass real timing/drag precision to directly test scoring resolution
    forceShoot: (chargeP, aimValue) => {
      if (state !== "idle") return null;
      state = "charging";
      currentPower = chargeP;
      aimDrag = aimValue;
      const result = computeShot(chargeP, aimValue, currentWind);
      resolveShot(result);
      return result;
    },
    skipFlight: () => {
      if (flight) { landShot(flight.result); flight = null; }
    },
    forceStart: () => { startOverlay.classList.remove("show"); resetGame(); },
    forceGameOver: () => endGame(),
    getBoardConsts: () => ({ BOARD_X, BOARD_Y, ARCHER_X, ARCHER_Y, BOARD_R, SENS_Y, MAX_AIM })
  };
</script>
</body>
</html>
