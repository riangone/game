  function findTarget(t, stats, exclude) {
    let best = null, bestProgress = -1;
    for (const e of state.enemies) {
      if (exclude && exclude.has(e)) continue;
      if (e.flying && !stats.canAirTarget) continue;
      if (!e.flying && stats.airOnly) continue;
      const dx = e.x - t.x, dy = e.y - t.y;
      if (dx * dx + dy * dy > stats.range * stats.range) continue;
      const pts = pointsForEnemy(e);
      const nextPt = pts[e.idx + 1];
      let remain = nextPt ? Math.hypot(nextPt.x - e.x, nextPt.y - e.y) : 0;
      const progress = e.idx * 10000 - remain;
      if (progress > bestProgress) { bestProgress = progress; best = e; }
    }
    return best;
  }

  function fireTower(t) {
    if (state.time < t.disabledUntil) return;
    const stats = towerStats(t);
    if (t.type === 'lightning') { fireLightning(t, stats); return; }
    const target = findTarget(t, stats);
    if (!target) return;
    t.cooldown = 1 / stats.rate;
    t.facing = Math.atan2(target.y - t.y, target.x - t.x);
    t.muzzleFlash = 0.1;
    t.recoil = 1.0;

    const spawnY = t.y - tileW * 0.45;
    state.projectiles.push({
      x: t.x, y: spawnY, target, dmg: stats.dmg, splash: stats.splash,
      slow: stats.slow, armorPierce: stats.armorPierce, color: stats.color,
      speed: cellUnit * 14.5, type: t.type,
      startY: spawnY, startX: t.x,
      travelDist: Math.hypot(target.x - t.x, target.y - spawnY),
      currDist: 0
    });
    if (sfx['shoot_' + t.type]) sfx['shoot_' + t.type]();
  }

  function fireLightning(t, stats) {
    const first = findTarget(t, stats);
    if (!first) return;
    t.cooldown = 1 / stats.rate;
    t.facing = Math.atan2(first.y - t.y, first.x - t.x);
    t.muzzleFlash = 0.12;
    t.recoil = 1.0;

    const hit = new Set();
    const arcs = [];
    let from = { x: t.x, y: t.y - tileW * 0.45 };
    let cur = first;
    let dmg = stats.dmg;
    let jumps = stats.chain;
    while (cur) {
      damageEnemy(cur, dmg, stats.armorPierce);
      arcs.push({ x1: from.x, y1: from.y, x2: cur.x, y2: enemyHitY(cur), life: 0.22, maxLife: 0.22 });
      hit.add(cur);
      if (jumps <= 0) break;
      jumps--;
      dmg *= 0.75;
      let next = null, bestD = stats.chainRange;
      for (const e of state.enemies) {
        if (hit.has(e)) continue;
        if (e.flying && !stats.canAirTarget) continue;
        const d = Math.hypot(e.x - cur.x, e.y - cur.y);
        if (d <= bestD) { bestD = d; next = e; }
      }
      from = { x: cur.x, y: enemyHitY(cur) };
      cur = next;
    }
    state.lightnings.push(...arcs);
    sfx.shoot_lightning();
  }

  function damageEnemy(e, dmg, armorPierce) {
    // Phantom Dodge Check
    if (e.dodgeRate && Math.random() < e.dodgeRate) {
      addFloatingText('闪避!', e.x, enemyHitY(e) - 15, '#c084fc');
      return;
    }

    let actual = armorPierce ? dmg : dmg * (1 - e.armor);

    // Shield absorption (Boss berserk shield)
    if (e.shield > 0) {
      if (e.shield >= actual) {
        e.shield -= actual;
        actual = 0;
      } else {
        actual -= e.shield;
        e.shield = 0;
      }
    }

    e.hp -= actual;

    // Boss Berserk mechanic
    if (e.type === 'boss' && !e.enraged && e.hp <= e.maxHp * 0.5) {
      e.enraged = true;
      e.speedCells *= 1.35;
      e.shield = Math.round(e.maxHp * 0.28);
      e.maxShield = e.shield;
      state.screenShake = 0.45;
      sfx.berserk();
      addFloatingText('🔥 狂暴!', e.x, e.y - 30, '#ff3366');
      spawnImpactParticles(e.x, e.y, '#ff3366', 22);
    }

    if (e.hp <= 0 && !e.dead) {
      e.dead = true;
      state.gold += e.bounty;
      state.score += e.bounty * 2;
      spawnImpactParticles(e.x, enemyHitY(e), e.color, 18);
      sfx.death();

      // Bomber EMP shockwave
      if (e.type === 'bomber') {
        sfx.emp();
        state.shockwaves.push({
          x: e.x, y: e.y, r: 4, maxR: cellUnit * 2.2, life: 0.4, maxLife: 0.4, color: '#ef4444'
        });
        for (const t of state.towers) {
          const d = Math.hypot(t.x - e.x, t.y - e.y);
          if (d <= cellUnit * 2.2) {
            t.disabledUntil = Math.max(t.disabledUntil, state.time + 1.3);
            addFloatingText('⚡ 瘫痪', t.x, t.y - 20, '#ef4444');
          }
        }
      }
    }
  }

  function spawnImpactParticles(x, y, color, count = 8) {
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 30 + Math.random() * 95;
      state.particles.push({
        x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
        life: 0.4 + Math.random() * 0.25, maxLife: 0.65, color
      });
    }
  }

  function spawnDustPuff(x, y, scale = 1.0) {
    state.shockwaves.push({
      x, y, r: 2, maxR: tileW * 0.35 * scale, life: 0.35, maxLife: 0.35, color: 'rgba(255,255,255,0.45)'
    });
  }

  function leakEnemy(e) {
    e.dead = true;
    state.lives -= e.leak;
    sfx.leak();
    flashEl.style.opacity = '0.4';
    setTimeout(() => { flashEl.style.opacity = '0'; }, 100);
    state.screenShake = 0.25;
    if (state.lives <= 0) { state.lives = 0; endGame(false); }
  }

  function updateEnemyMove(e, dt) {
    const slowActive = state.time < e.slowUntil;
    const spd = e.speedCells * cellUnit * (slowActive ? e.slowFactor : 1);
    const pts = pointsForEnemy(e);
    const target = pts[e.idx + 1];
    if (!target) { leakEnemy(e); return; }

    const dx = target.x - e.x, dy = target.y - e.y;
    const dist = Math.hypot(dx, dy);
    const step = spd * dt;

    if (dist > 0.001) {
      e.facing = Math.atan2(dy, dx);
    }

    // Medic periodic healing aura
    if (e.type === 'medic' && !e.dead) {
      e.healTimer += dt;
      if (e.healTimer >= 2.0) {
        e.healTimer = 0;
        let healedAny = false;
        const healRange = cellUnit * 2.5;
        for (const ally of state.enemies) {
          if (ally === e || ally.dead) continue;
          const d = Math.hypot(ally.x - e.x, ally.y - e.y);
          if (d <= healRange && ally.hp < ally.maxHp) {
            const healAmt = Math.round(ally.maxHp * 0.18);
            ally.hp = Math.min(ally.maxHp, ally.hp + healAmt);
            healedAny = true;
            spawnImpactParticles(ally.x, ally.y - 10, '#10b981', 4);
          }
        }
        if (healedAny) {
          sfx.heal();
          state.shockwaves.push({
            x: e.x, y: e.y, r: 2, maxR: healRange, life: 0.45, maxLife: 0.45, color: '#10b981'
          });
        }
      }
    }

    // Realistic walk-cycle animation (feet stay on the ground, torso bobs gently)
    if (!e.flying) {
      const moveFactor = dist > 0.001 ? Math.min(1, step / Math.max(0.0001, dt * cellUnit)) : 0;
      e.walkPhase = (e.walkPhase || 0) + dt * (e.strideFreq || 2.4) * Math.max(0.35, moveFactor);
      const phi = e.walkPhase % 1.0;
      e.bobPhase = phi;
      // Double-bob per stride (feet alternate, torso dips twice per cycle) + slight sway
      e.z = Math.abs(Math.sin(phi * Math.PI * 2)) * (e.bobH || 3);

      const strideCycle = phi % 0.5;
      if (strideCycle < 0.04 && !e.landedCycle) {
        e.landedCycle = true;
        if (e.type === 'tank' || e.type === 'boss') {
          spawnDustPuff(e.x, e.y, e.type === 'boss' ? 1.5 : 1.0);
        }
      } else if (strideCycle > 0.12) {
        e.landedCycle = false;
      }
    } else {
      e.z = 38 + Math.sin(state.time * 4 + e.id * 10) * 3.5;
      e.propAngle = (e.propAngle || 0) + dt * 36;
      e.walkPhase = (e.walkPhase || 0) + dt * 2.2;
    }

    if (step >= dist) {
      e.x = target.x;
      e.y = target.y;
      e.idx++;
    } else {
      e.x += (dx / dist) * step;
      e.y += (dy / dist) * step;
    }
  }

  function update(dtRaw) {
    const dt = dtRaw * state.speedMult;
    state.time += dt;

    if (state.screenShake > 0) state.screenShake = Math.max(0, state.screenShake - dt);

    // Spawning wave
    if (state.waveActive) {
      if (state.spawnQueue.length > 0) {
        state.spawnTimer -= dt;
        if (state.spawnTimer <= 0) {
          spawnEnemy(state.spawnQueue.shift());
          state.spawnTimer = state.spawnInterval;
        }
      } else if (state.enemies.length === 0) {
        state.waveActive = false;
        state.gold += 25 + state.wave * 4 + curLevel.id * 5;
        if (state.wave >= curLevel.wavesCount) {
          levelComplete();
          return;
        }
        state.betweenWaves = true;
        state.countdown = WAVE_COUNTDOWN;
      }
    } else if (state.betweenWaves && state.wave < curLevel.wavesCount) {
      state.countdown -= dt;
      if (state.countdown <= 0) startWave();
    }

    // Enemies
    for (const e of state.enemies) if (!e.dead) updateEnemyMove(e, dt);
    state.enemies = state.enemies.filter(e => !e.dead);

    // Towers
    for (const t of state.towers) {
      if (t.cooldown > 0) t.cooldown -= dt;
      else fireTower(t);
      if (t.muzzleFlash > 0) t.muzzleFlash -= dt;
      if (t.recoil > 0) t.recoil = Math.max(0, t.recoil - dt * 6);
    }

    // Projectiles
    for (const p of state.projectiles) {
      if (!p.target || p.target.dead) { p.dead = true; continue; }
      const targetY = enemyHitY(p.target);
      const dx = p.target.x - p.x, dy = targetY - p.y;
      const dist = Math.hypot(dx, dy);
      const step = p.speed * dt;
      p.currDist += step;

      if (step >= dist) {
        p.dead = true;
        damageEnemy(p.target, p.dmg, p.armorPierce);
        if (p.slow) {
          p.target.slowUntil = state.time + 1.6;
          p.target.slowFactor = 1 - p.slow;
        }
        if (p.splash > 0) {
          state.shockwaves.push({
            x: p.target.x, y: p.target.y, r: 4, maxR: p.splash,
            life: 0.35, maxLife: 0.35, color: p.color
          });
          for (const e of state.enemies) {
            if (e === p.target || e.dead) continue;
            const d2 = Math.hypot(e.x - p.target.x, e.y - p.target.y);
            if (d2 <= p.splash) damageEnemy(e, p.dmg * 0.65, p.armorPierce);
          }
        }
      } else {
        p.x += (dx / dist) * step;
        p.y += (dy / dist) * step;
      }
    }
    state.projectiles = state.projectiles.filter(p => !p.dead);
    state.enemies = state.enemies.filter(e => !e.dead);

    // Particles
    for (const pt of state.particles) {
      pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.life -= dt;
    }
    state.particles = state.particles.filter(pt => pt.life > 0);

    // Shockwaves
    for (const sw of state.shockwaves) {
      sw.life -= dt;
      sw.r += ((sw.maxR - sw.r) * 12) * dt;
    }
    state.shockwaves = state.shockwaves.filter(sw => sw.life > 0);

    // Floating Texts
    for (const ft of state.floatingTexts) {
      ft.y += ft.vy * dt;
      ft.life -= dt;
    }
    state.floatingTexts = state.floatingTexts.filter(ft => ft.life > 0);

    // Lightning arcs
    for (const a of state.lightnings) a.life -= dt;
    state.lightnings = state.lightnings.filter(a => a.life > 0);
  }

  // ---------- 3D Isometric Rendering Helpers ----------

  function drawIsoBlock(c, r, topStyle, leftStyle, rightStyle, depth, liftZ = 0) {
    const hw = tileW / 2, hh = tileH / 2;
    const cx = X_center + (c - r) * hw;
    const cy = Y_center + (c + r + 1) * hh - blockDepth - liftZ;

    // Push each corner outward from the tile center by a tiny fixed world-space
    // amount so adjacent tiles slightly overlap. This "tile bleeding" trick hides
    // the hairline anti-aliasing seams between separately-filled polygons that
    // otherwise become visible once the camera zooms in.
    const EPS = 0.75;
    function inflate(px, py) {
      const dx = px - cx, dy = py - cy;
      const len = Math.hypot(dx, dy) || 1;
      return { x: px + (dx / len) * EPS, y: py + (dy / len) * EPS };
    }

    const topPt    = inflate(cx,      cy - hh);
    const rightPt  = inflate(cx + hw, cy);
    const bottomPt = inflate(cx,      cy + hh);
    const leftPt   = inflate(cx - hw, cy);

    // Left Face (soft top-to-bottom shading for a beveled, more three-dimensional feel)
    const leftGrad = ctx.createLinearGradient(leftPt.x, leftPt.y, leftPt.x, leftPt.y + depth);
    leftGrad.addColorStop(0, lightenHex(leftStyle, 0.08));
    leftGrad.addColorStop(1, darkenHex(leftStyle, 0.28));
    ctx.fillStyle = leftGrad;
    ctx.beginPath();
    ctx.moveTo(leftPt.x, leftPt.y);
    ctx.lineTo(bottomPt.x, bottomPt.y);
    ctx.lineTo(bottomPt.x, bottomPt.y + depth);
    ctx.lineTo(leftPt.x, leftPt.y + depth);
    ctx.closePath();
    ctx.fill();

    // Right Face
    const rightGrad = ctx.createLinearGradient(rightPt.x, rightPt.y, rightPt.x, rightPt.y + depth);
    rightGrad.addColorStop(0, lightenHex(rightStyle, 0.04));
    rightGrad.addColorStop(1, darkenHex(rightStyle, 0.32));
    ctx.fillStyle = rightGrad;
    ctx.beginPath();
    ctx.moveTo(bottomPt.x, bottomPt.y);
    ctx.lineTo(rightPt.x, rightPt.y);
    ctx.lineTo(rightPt.x, rightPt.y + depth);
    ctx.lineTo(bottomPt.x, bottomPt.y + depth);
    ctx.closePath();
    ctx.fill();

    // Top Face (subtle directional light: brighter toward the upper-left corner)
    const topGrad = ctx.createLinearGradient(topPt.x, topPt.y, bottomPt.x, bottomPt.y);
    topGrad.addColorStop(0, lightenHex(topStyle, 0.14));
    topGrad.addColorStop(0.55, topStyle);
    topGrad.addColorStop(1, darkenHex(topStyle, 0.1));
    ctx.fillStyle = topGrad;
    ctx.beginPath();
    ctx.moveTo(topPt.x, topPt.y);
    ctx.lineTo(rightPt.x, rightPt.y);
    ctx.lineTo(bottomPt.x, bottomPt.y);
    ctx.lineTo(leftPt.x, leftPt.y);
    ctx.closePath();
    ctx.fill();

    // Edge highlight
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function drawFloatingIslandBase() {
    const hw = tileW / 2, hh = tileH / 2;
    const islandDepth = blockDepth + 32;

    const topPt    = { x: X_center + (0 - 0) * hw,       y: Y_center + (0 + 0 + 1) * hh - blockDepth - hh };
    const rightPt  = { x: X_center + (COLS - 0) * hw,    y: Y_center + (COLS + 0) * hh - blockDepth };
    const bottomPt = { x: X_center + (COLS - ROWS) * hw, y: Y_center + (COLS + ROWS + 1) * hh - blockDepth + hh };
    const leftPt   = { x: X_center + (0 - ROWS) * hw,    y: Y_center + (0 + ROWS) * hh - blockDepth };

    // Island drop shadow
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(leftPt.x, leftPt.y + islandDepth + 15);
    ctx.lineTo(bottomPt.x, bottomPt.y + islandDepth + 15);
    ctx.lineTo(rightPt.x, rightPt.y + islandDepth + 15);
    ctx.lineTo(bottomPt.x, bottomPt.y + islandDepth + 35);
    ctx.closePath();
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.filter = 'blur(16px)';
    ctx.fill();
    ctx.restore();

    // Bedrock cliff faces
    const gradL = ctx.createLinearGradient(leftPt.x, leftPt.y, bottomPt.x, bottomPt.y + islandDepth);
    gradL.addColorStop(0, curLevel.theme.cliffL);
    gradL.addColorStop(1, '#05070f');
    ctx.fillStyle = gradL;
    ctx.beginPath();
    ctx.moveTo(leftPt.x, leftPt.y);
    ctx.lineTo(bottomPt.x, bottomPt.y);
    ctx.lineTo(bottomPt.x, bottomPt.y + islandDepth);
    ctx.lineTo(leftPt.x, leftPt.y + islandDepth - 10);
    ctx.closePath();
    ctx.fill();

    const gradR = ctx.createLinearGradient(bottomPt.x, bottomPt.y, rightPt.x, rightPt.y + islandDepth);
    gradR.addColorStop(0, curLevel.theme.cliffR);
    gradR.addColorStop(1, '#070a16');
    ctx.fillStyle = gradR;
    ctx.beginPath();
    ctx.moveTo(bottomPt.x, bottomPt.y);
    ctx.lineTo(rightPt.x, rightPt.y);
    ctx.lineTo(rightPt.x, rightPt.y + islandDepth - 10);
    ctx.lineTo(bottomPt.x, bottomPt.y + islandDepth);
    ctx.closePath();
    ctx.fill();
  }

  // Ground contact point used for projectile / lightning aim (roughly chest height)
  function enemyHitY(e) {
    if (e.flying) return e.y;
    return e.y - e.radius * tileW * 1.5;
  }

  // Draw a single pendulum limb (thigh/shin or upper-arm) pivoting at (originX, originY)
  function drawLimb(originX, originY, angle, length, width, color) {
    ctx.save();
    ctx.translate(originX, originY);
    ctx.rotate(angle);
    const grad = ctx.createLinearGradient(-width / 2, 0, width / 2, 0);
    grad.addColorStop(0, darkenHex(color, 0.42));
    grad.addColorStop(0.5, color);
    grad.addColorStop(1, darkenHex(color, 0.16));
    ctx.fillStyle = grad;
    roundRect(-width / 2, 0, width, length, width / 2);
    ctx.fill();
    ctx.restore();
  }

  const SKIN_TONE = '#dba36f';

  // Realistic bipedal soldier rig shared by 'normal' and 'runner'
  function drawSoldier(e, rad, isRunner) {
    const phase = e.bobPhase || 0;
    const swingAmt = isRunner ? 1.05 : 0.55;
    const swing = Math.sin(phase * Math.PI * 2) * swingAmt;
    const bob = (e.z || 0) * 0.5;

    const legLen = rad * (isRunner ? 1.28 : 1.34);
    const legW = rad * (isRunner ? 0.24 : 0.3);
    const torsoW = rad * (isRunner ? 0.7 : 0.92);
    const torsoH = rad * (isRunner ? 0.8 : 1.0);
    const armLen = rad * (isRunner ? 0.95 : 1.02);
    const armW = rad * (isRunner ? 0.18 : 0.22);
    const headR = rad * (isRunner ? 0.4 : 0.44);

    const hipY = -legLen + bob;
    const shoulderY = hipY - torsoH;
    const headCenterY = shoulderY - headR * 1.05;
    const armorColor = e.color;

    // Back leg & arm (depth)
    drawLimb(0, hipY, -swing, legLen, legW * 0.85, darkenHex(armorColor, 0.3));
    drawLimb(0, shoulderY, swing * 0.75, armLen * 0.9, armW * 0.85, darkenHex(armorColor, 0.32));

    // Speed streaks for runner
    if (isRunner) {
      ctx.strokeStyle = hexToRgba(armorColor, 0.35);
      ctx.lineWidth = Math.max(1, rad * 0.08);
      for (let i = 0; i < 3; i++) {
        const yy = hipY - i * rad * 0.35;
        ctx.beginPath(); ctx.moveTo(-legLen * 0.5 - i * 4, yy); ctx.lineTo(-legLen * 0.9 - i * 6, yy); ctx.stroke();
      }
    }

    // Front leg
    drawLimb(0, hipY, swing, legLen, legW, armorColor);

    // Backpack / pouch (behind torso)
    ctx.fillStyle = darkenHex(armorColor, 0.35);
    roundRect(-torsoW * 0.32, shoulderY + torsoH * 0.1, torsoW * 0.34, torsoH * 0.75, torsoW * 0.1);
    ctx.fill();

    // Torso
    const tGrad = ctx.createLinearGradient(-torsoW / 2, shoulderY, torsoW / 2, hipY);
    tGrad.addColorStop(0, lightenHex(armorColor, 0.22));
    tGrad.addColorStop(1, darkenHex(armorColor, 0.2));
    ctx.fillStyle = tGrad;
    roundRect(-torsoW / 2, shoulderY, torsoW, torsoH, torsoW * 0.3);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.28)'; ctx.lineWidth = Math.max(1, rad * 0.05);
    ctx.beginPath(); ctx.moveTo(-torsoW * 0.28, shoulderY + torsoH * 0.15); ctx.lineTo(torsoW * 0.22, hipY - torsoH * 0.05); ctx.stroke();
    // Chest light
    ctx.fillStyle = isRunner ? '#ffd54f' : '#5ce1ff';
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 4;
    ctx.beginPath(); ctx.arc(0, shoulderY + torsoH * 0.42, rad * 0.07, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;

    // Front arm
    drawLimb(0, shoulderY, -swing * 0.75, armLen, armW, armorColor);

    // Head (skin) + helmet
    const headGrad = ctx.createRadialGradient(-headR * 0.35, headCenterY - headR * 0.35, 1, 0, headCenterY, headR);
    headGrad.addColorStop(0, lightenHex(SKIN_TONE, 0.25));
    headGrad.addColorStop(0.7, SKIN_TONE);
    headGrad.addColorStop(1, darkenHex(SKIN_TONE, 0.25));
    ctx.beginPath(); ctx.arc(0, headCenterY, headR, 0, Math.PI * 2);
    ctx.fillStyle = headGrad; ctx.fill();

    // Helmet cap
    ctx.fillStyle = darkenHex(armorColor, 0.05);
    ctx.beginPath();
    ctx.arc(0, headCenterY - headR * 0.08, headR * 1.04, Math.PI, 0, false);
    ctx.closePath(); ctx.fill();
    if (isRunner) {
      ctx.strokeStyle = '#ffd54f'; ctx.lineWidth = Math.max(1, rad * 0.06);
      ctx.beginPath(); ctx.moveTo(0, headCenterY - headR); ctx.lineTo(0, headCenterY - headR - rad * 0.35); ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(0, headCenterY - headR - rad * 0.4, rad * 0.09, 0, Math.PI * 2); ctx.fill();
    }

    // Visor / HUD glow slit
    const eyeDir = Math.cos(e.facing || 0) >= 0 ? 1 : -1;
    ctx.fillStyle = isRunner ? 'rgba(255,213,79,0.85)' : 'rgba(92,225,255,0.85)';
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 5;
    roundRect(eyeDir * headR * 0.05 - headR * 0.55, headCenterY - headR * 0.12, headR * 0.95, headR * 0.32, headR * 0.14);
    ctx.fill();
    ctx.shadowBlur = 0;

    return headCenterY - headR * 1.3;
  }

  // Robed field medic — legs hidden under a swaying robe hem
  function drawMedicTrooper(e, rad) {
    const phase = e.bobPhase || 0;
    const sway = Math.sin(phase * Math.PI * 2) * 0.12;
    const bob = (e.z || 0) * 0.5;

    const robeH = rad * 1.55;
    const robeW = rad * 1.0;
    const torsoH = rad * 0.9;
    const armLen = rad * 0.95;
    const armW = rad * 0.2;
    const headR = rad * 0.42;

    const hemY = -bob;
    const shoulderY = hemY - robeH;
    const headCenterY = shoulderY - headR * 1.05;

    ctx.save();
    ctx.rotate(sway * 0.2);

    // Robe (trapezoid, swaying at hem)
    const rGrad = ctx.createLinearGradient(0, shoulderY, 0, hemY);
    rGrad.addColorStop(0, lightenHex(e.color, 0.2));
    rGrad.addColorStop(1, darkenHex(e.color, 0.25));
    ctx.fillStyle = rGrad;
    ctx.beginPath();
    ctx.moveTo(-robeW * 0.32, shoulderY);
    ctx.lineTo(robeW * 0.32, shoulderY);
    ctx.lineTo(robeW * 0.52 + sway * rad, hemY);
    ctx.lineTo(-robeW * 0.52 + sway * rad, hemY);
    ctx.closePath();
    ctx.fill();

    // Cross emblem
    ctx.fillStyle = '#fff';
    roundRect(-rad * 0.06, shoulderY + torsoH * 0.25, rad * 0.12, rad * 0.34, rad * 0.03); ctx.fill();
    roundRect(-rad * 0.17, shoulderY + torsoH * 0.35, rad * 0.34, rad * 0.12, rad * 0.03); ctx.fill();

    drawLimb(0, shoulderY, -0.15 - sway, armLen, armW, e.color);
    // Staff
    ctx.strokeStyle = '#b98d54'; ctx.lineWidth = Math.max(1.5, rad * 0.09);
    ctx.beginPath(); ctx.moveTo(robeW * 0.4, shoulderY + rad * 0.2); ctx.lineTo(robeW * 0.4, shoulderY - rad * 0.75); ctx.stroke();
    ctx.fillStyle = '#34d399'; ctx.shadowColor = '#34d399'; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(robeW * 0.4, shoulderY - rad * 0.82, rad * 0.13, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    drawLimb(0, shoulderY, 0.35 + sway, armLen * 0.85, armW, e.color);

    // Head + hood
    const headGrad = ctx.createRadialGradient(-headR * 0.35, headCenterY - headR * 0.35, 1, 0, headCenterY, headR);
    headGrad.addColorStop(0, lightenHex(SKIN_TONE, 0.25));
    headGrad.addColorStop(1, darkenHex(SKIN_TONE, 0.25));
    ctx.beginPath(); ctx.arc(0, headCenterY, headR, 0, Math.PI * 2);
    ctx.fillStyle = headGrad; ctx.fill();
    ctx.fillStyle = darkenHex(e.color, 0.1);
    ctx.beginPath(); ctx.arc(0, headCenterY - headR * 0.1, headR * 1.08, Math.PI, 0, false); ctx.closePath(); ctx.fill();

    ctx.restore();
    return headCenterY - headR * 1.3;
  }

  // Hooded shadow trooper — translucent, ghost-tail trail, no visible legs
  function drawPhantomTrooper(e, rad) {
    const phase = e.bobPhase || 0;
    const drift = Math.sin(phase * Math.PI * 2) * rad * 0.06;
    const bodyH = rad * 1.85;
    const bodyW = rad * 0.82;
    const headR = rad * 0.42;

    const hemY = -rad * 0.15 + drift;
    const shoulderY = hemY - bodyH;
    const headCenterY = shoulderY - headR * 1.0;

    ctx.save();
    ctx.globalAlpha = 0.62;

    // Trailing after-images
    for (let i = 1; i <= 2; i++) {
      ctx.globalAlpha = 0.62 - i * 0.2;
      ctx.fillStyle = e.color;
      ctx.beginPath();
      ctx.moveTo(-bodyW * 0.3 - i * 3, shoulderY);
      ctx.lineTo(bodyW * 0.3 - i * 3, shoulderY);
      ctx.quadraticCurveTo(bodyW * 0.45 - i * 3, hemY, 0 - i * 3, hemY + rad * 0.1);
      ctx.quadraticCurveTo(-bodyW * 0.45 - i * 3, hemY, -bodyW * 0.3 - i * 3, shoulderY);
      ctx.closePath(); ctx.fill();
    }

    ctx.globalAlpha = 0.7;
    const grad = ctx.createLinearGradient(0, shoulderY, 0, hemY);
    grad.addColorStop(0, lightenHex(e.color, 0.3));
    grad.addColorStop(1, hexToRgba(e.color, 0.1));
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-bodyW * 0.34, shoulderY);
    ctx.lineTo(bodyW * 0.34, shoulderY);
    ctx.quadraticCurveTo(bodyW * 0.5, hemY, 0, hemY + rad * 0.15);
    ctx.quadraticCurveTo(-bodyW * 0.5, hemY, -bodyW * 0.34, shoulderY);
    ctx.closePath(); ctx.fill();

    ctx.globalAlpha = 0.85;
    ctx.fillStyle = darkenHex(e.color, 0.1);
    ctx.beginPath(); ctx.arc(0, headCenterY, headR, 0, Math.PI * 2); ctx.fill();
    // Glowing eyes
    ctx.fillStyle = '#f5d0ff'; ctx.shadowColor = '#f5d0ff'; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(-headR * 0.32, headCenterY, headR * 0.16, 0, Math.PI * 2); ctx.arc(headR * 0.32, headCenterY, headR * 0.16, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    ctx.restore();
    return headCenterY - headR * 1.4;
  }

  // Six-legged self-destruct spider drone, low profile & fast skittering legs
  function drawSpiderBot(e, rad) {
    const phase = e.bobPhase || 0;
    const bodyY = -rad * 0.7 - (e.z || 0) * 0.4;
    const bodyW = rad * 1.15, bodyH = rad * 0.62;

    // Legs (6, alternating tripod gait)
    for (let i = 0; i < 6; i++) {
      const side = i < 3 ? -1 : 1;
      const idx = i % 3;
      const legPhase = (phase + (idx % 2 === 0 ? 0 : 0.5)) * Math.PI * 2;
      const kAngle = Math.sin(legPhase) * 0.5;
      const originX = side * bodyW * 0.32;
      const originY = bodyY - bodyH * 0.1 + idx * bodyH * 0.35 - bodyH * 0.35;
      drawLimb(originX, originY, side * (0.9 + kAngle * side), rad * 0.55, rad * 0.09, darkenHex(e.color, 0.2));
    }

    // Body
    const bGrad = ctx.createRadialGradient(-bodyW * 0.2, bodyY - bodyH * 0.3, 1, 0, bodyY, bodyW * 0.7);
    bGrad.addColorStop(0, lightenHex(e.color, 0.3));
    bGrad.addColorStop(1, darkenHex(e.color, 0.25));
    ctx.fillStyle = bGrad;
    ctx.beginPath(); ctx.ellipse(0, bodyY, bodyW * 0.5, bodyH * 0.5, 0, 0, Math.PI * 2); ctx.fill();

    // Blinking warning light + fuse
    const blink = 0.5 + 0.5 * Math.sin(state.time * 10);
    ctx.fillStyle = `rgba(239,68,68,${0.5 + blink * 0.5})`;
    ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 6 + blink * 4;
    ctx.beginPath(); ctx.arc(0, bodyY - bodyH * 0.15, rad * 0.14, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = Math.max(1, rad * 0.06);
    ctx.beginPath(); ctx.moveTo(bodyW * 0.15, bodyY - bodyH * 0.4); ctx.lineTo(bodyW * 0.3, bodyY - bodyH * 0.8); ctx.stroke();

    return bodyY - bodyH - rad * 0.5;
  }

  // Heavy quadruped mech beast
  function drawMechBeast(e, rad) {
    const phase = e.bobPhase || 0;
    const swing = Math.sin(phase * Math.PI * 2) * 0.35;
    const bob = (e.z || 0) * 0.3;

    const legLen = rad * 0.75, legW = rad * 0.32;
    const bodyW = rad * 1.7, bodyH = rad * 1.0;
    const hipY = -legLen + bob;
    const bodyBottomY = hipY;
    const bodyTopY = bodyBottomY - bodyH;
    const headR = rad * 0.5;
    const headCenterY = bodyTopY - headR * 0.6;

    // Four stubby legs (front/back pairs)
    drawLimb(-bodyW * 0.28, hipY, -swing, legLen, legW * 0.9, darkenHex(e.color, 0.3));
    drawLimb(bodyW * 0.28, hipY, swing, legLen, legW * 0.9, darkenHex(e.color, 0.3));
    drawLimb(-bodyW * 0.22, hipY, swing * 0.8, legLen, legW, e.color);
    drawLimb(bodyW * 0.22, hipY, -swing * 0.8, legLen, legW, e.color);

    // Armored body block
    const bGrad = ctx.createLinearGradient(-bodyW / 2, bodyTopY, bodyW / 2, bodyBottomY);
    bGrad.addColorStop(0, lightenHex(e.color, 0.18));
    bGrad.addColorStop(1, darkenHex(e.color, 0.22));
    ctx.fillStyle = bGrad;
    roundRect(-bodyW / 2, bodyTopY, bodyW, bodyH, bodyW * 0.14);
    ctx.fill();
    // Rivets & plating seams
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = Math.max(1, rad * 0.05);
    ctx.beginPath(); ctx.moveTo(-bodyW * 0.42, bodyTopY + bodyH * 0.5); ctx.lineTo(bodyW * 0.42, bodyTopY + bodyH * 0.5); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    [-0.38, 0.38].forEach(fx => { ctx.beginPath(); ctx.arc(bodyW * fx, bodyTopY + bodyH * 0.25, rad * 0.05, 0, Math.PI * 2); ctx.fill(); });

    // Head + glowing visor
    ctx.fillStyle = darkenHex(e.color, 0.15);
    roundRect(-headR, headCenterY - headR * 0.6, headR * 2, headR * 1.2, headR * 0.3);
    ctx.fill();
    const blink = 0.6 + 0.4 * Math.sin(state.time * 6);
    ctx.fillStyle = `rgba(239,68,68,${blink})`;
    ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 8;
    roundRect(-headR * 0.7, headCenterY - headR * 0.22, headR * 1.4, headR * 0.32, headR * 0.1);
    ctx.fill();
    ctx.shadowBlur = 0;

    return headCenterY - headR * 0.6 - 4;
  }

  // Armored king boss — big humanoid rig + cape + crown
  function drawKingBoss(e, rad) {
    const phase = e.bobPhase || 0;
    const swing = Math.sin(phase * Math.PI * 2) * 0.45;
    const bob = (e.z || 0) * 0.4;

    const legLen = rad * 1.3, legW = rad * 0.4;
    const torsoW = rad * 1.25, torsoH = rad * 1.25;
    const armLen = rad * 1.15, armW = rad * 0.3;
    const headR = rad * 0.52;
    const mainColor = e.enraged ? '#ff5c3c' : e.color;

    const hipY = -legLen + bob;
    const shoulderY = hipY - torsoH;
    const headCenterY = shoulderY - headR * 1.05;

    // Cape (flows behind, swaying)
    const capeSway = Math.sin(phase * Math.PI * 2 + 0.4) * rad * 0.3;
    const capeGrad = ctx.createLinearGradient(0, shoulderY, 0, hipY + rad * 0.4);
    capeGrad.addColorStop(0, '#7a1f2b');
    capeGrad.addColorStop(1, '#2d0a10');
    ctx.fillStyle = capeGrad;
    ctx.beginPath();
    ctx.moveTo(-torsoW * 0.45, shoulderY + torsoH * 0.1);
    ctx.lineTo(torsoW * 0.45, shoulderY + torsoH * 0.1);
    ctx.lineTo(torsoW * 0.65 + capeSway, hipY + rad * 0.5);
    ctx.lineTo(-torsoW * 0.65 + capeSway, hipY + rad * 0.5);
    ctx.closePath(); ctx.fill();

    if (e.enraged) {
      ctx.save();
      ctx.globalAlpha = 0.35 + 0.25 * Math.sin(state.time * 8);
      ctx.strokeStyle = '#ff5c3c'; ctx.lineWidth = rad * 0.12;
      ctx.beginPath(); ctx.ellipse(0, hipY - torsoH * 0.4, torsoW * 0.9, torsoH * 0.9, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    drawLimb(0, hipY, -swing, legLen, legW * 0.9, darkenHex(mainColor, 0.3));
    drawLimb(0, shoulderY, swing * 0.7, armLen * 0.9, armW * 0.85, darkenHex(mainColor, 0.32));
    drawLimb(0, hipY, swing, legLen, legW, mainColor);

    const tGrad = ctx.createLinearGradient(-torsoW / 2, shoulderY, torsoW / 2, hipY);
    tGrad.addColorStop(0, lightenHex(mainColor, 0.3));
    tGrad.addColorStop(1, darkenHex(mainColor, 0.15));
    ctx.fillStyle = tGrad;
    roundRect(-torsoW / 2, shoulderY, torsoW, torsoH, torsoW * 0.28);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = Math.max(1, rad * 0.05);
    ctx.beginPath(); ctx.moveTo(0, shoulderY + torsoH * 0.1); ctx.lineTo(0, hipY - torsoH * 0.05); ctx.stroke();

    drawLimb(0, shoulderY, -swing * 0.7, armLen, armW, mainColor);
    // Sword
    ctx.save();
    ctx.translate(armW * 1.4, shoulderY + armLen * 0.7);
    ctx.rotate(-0.5);
    ctx.fillStyle = '#e2e8f0';
    ctx.fillRect(-rad * 0.05, -rad * 1.3, rad * 0.1, rad * 1.3);
    ctx.fillStyle = '#b8860b';
    ctx.fillRect(-rad * 0.16, -rad * 0.05, rad * 0.32, rad * 0.12);
    ctx.restore();

    // Head + skin
    const headGrad = ctx.createRadialGradient(-headR * 0.35, headCenterY - headR * 0.35, 1, 0, headCenterY, headR);
    headGrad.addColorStop(0, lightenHex(SKIN_TONE, 0.25));
    headGrad.addColorStop(1, darkenHex(SKIN_TONE, 0.3));
    ctx.beginPath(); ctx.arc(0, headCenterY, headR, 0, Math.PI * 2);
    ctx.fillStyle = headGrad; ctx.fill();

    // Crown
    ctx.fillStyle = e.enraged ? '#ff4d4d' : '#ffd700';
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 8;
    const cw = headR * 1.3, ch = headR;
    const cy0 = headCenterY - headR + 2;
    ctx.beginPath();
    ctx.moveTo(-cw / 2, cy0);
    ctx.lineTo(-cw / 2, cy0 - ch);
    ctx.lineTo(-cw / 4, cy0 - ch * 0.4);
    ctx.lineTo(0, cy0 - ch * 1.15);
    ctx.lineTo(cw / 4, cy0 - ch * 0.4);
    ctx.lineTo(cw / 2, cy0 - ch);
    ctx.lineTo(cw / 2, cy0);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#8a6300'; ctx.lineWidth = 1; ctx.stroke();

    return headCenterY - headR - ch;
  }

  // Quadcopter reconnaissance drone
  function drawDrone(e, rad) {
    const bodyW = rad * 1.3, bodyH = rad * 0.55;
    const armLen = rad * 1.15;
    const propAngle = e.propAngle || 0;

    // 4 rotor arms
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sy]) => {
      const ax = sx * armLen * 0.55, ay = sy * bodyH * 0.9;
      ctx.strokeStyle = '#334155'; ctx.lineWidth = Math.max(1.5, rad * 0.08);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(ax, ay); ctx.stroke();

      ctx.save();
      ctx.translate(ax, ay);
      ctx.rotate(propAngle * sx);
      ctx.fillStyle = 'rgba(220,230,255,0.75)';
      ctx.beginPath(); ctx.ellipse(0, 0, rad * 0.45, rad * 0.09, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#1e293b';
      ctx.beginPath(); ctx.arc(ax, ay, rad * 0.1, 0, Math.PI * 2); ctx.fill();
    });

    // Body
    const bGrad = ctx.createLinearGradient(0, -bodyH, 0, bodyH);
    bGrad.addColorStop(0, lightenHex(e.color, 0.35));
    bGrad.addColorStop(1, darkenHex(e.color, 0.25));
    ctx.fillStyle = bGrad;
    roundRect(-bodyW / 2, -bodyH / 2, bodyW, bodyH, bodyH * 0.5);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1;
    ctx.stroke();

    // Camera lens / sensor light
    const blink = 0.5 + 0.5 * Math.sin(state.time * 8);
    ctx.fillStyle = `rgba(239,68,68,${0.5 + blink * 0.5})`;
    ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(0, bodyH * 0.35, rad * 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#7cf5c4';
    ctx.beginPath(); ctx.arc(0, -bodyH * 0.1, rad * 0.16, 0, Math.PI * 2); ctx.fill();

    return -bodyH / 2 - rad * 0.55;
  }

  // Master character dispatcher
  function drawCharacter(e) {
    const rad = e.radius * tileW;
    const shadowScale = e.flying ? Math.max(0.18, 1 - e.z / (tileW * 1.6)) : 1;
    const groundY = e.flying ? e.y + e.z : e.y;

    // Contact / cast shadow
    ctx.beginPath();
    ctx.ellipse(e.x, groundY + 2, rad * 0.85 * shadowScale, rad * 0.4 * shadowScale, 0, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0,0,0,${0.4 * shadowScale})`;
    ctx.fill();

    const facingDir = Math.cos(e.facing || 0) >= 0 ? 1 : -1;

    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.scale(facingDir, 1);

    let topY;
    switch (e.type) {
      case 'flyer':   topY = drawDrone(e, rad); break;
      case 'tank':    topY = drawMechBeast(e, rad); break;
      case 'bomber':  topY = drawSpiderBot(e, rad); break;
      case 'phantom': topY = drawPhantomTrooper(e, rad); break;
      case 'medic':   topY = drawMedicTrooper(e, rad); break;
      case 'boss':    topY = drawKingBoss(e, rad); break;
      case 'runner':  topY = drawSoldier(e, rad, true); break;
      default:        topY = drawSoldier(e, rad, false); break;
    }

    // Freeze slow visual halo
    if (state.time < e.slowUntil) {
      ctx.save();
      ctx.strokeStyle = 'rgba(92,225,255,0.85)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([3, 3]);
      ctx.strokeRect(-rad * 1.15, topY - 4, rad * 2.3, -topY + 4);
      ctx.setLineDash([]);
      ctx.restore();
    }

    // Overhead health & shield bar
    const barW = rad * 1.6, barH = 3.5;
    const barX = -barW / 2, barY = topY - 8;
    const pct = Math.max(0, e.hp / e.maxHp);
    roundRect(barX, barY, barW, barH, 2);
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fill();
    roundRect(barX, barY, barW * pct, barH, 2);
    ctx.fillStyle = pct > 0.5 ? '#b6ff5a' : (pct > 0.25 ? '#ffd54f' : '#ff6b6b');
    ctx.fill();
    if (e.shield > 0 && e.maxShield > 0) {
      const sPct = Math.min(1, e.shield / e.maxShield);
      roundRect(barX, barY - 4, barW * sPct, 2.5, 1);
      ctx.fillStyle = '#5ce1ff'; ctx.fill();
    }

    ctx.restore();
  }

  // Draw 3D Tower Pedestal & Turret
  function drawTower3D(t) {
    const stats = towerStats(t);
    const info = TOWER_TYPES[t.type];
    const hw = tileW / 2, hh = tileH / 2;
    const pos = cellToPx(t.c, t.r);

    // Range preview when selected
    if (state.selectedTower === t) {
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(pos.x, pos.y, stats.range, stats.range * 0.5, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(92,225,255,0.08)'; ctx.fill();
      ctx.strokeStyle = 'rgba(92,225,255,0.6)'; ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]); ctx.stroke();

      if (stats.chainRange) {
        ctx.beginPath();
        ctx.ellipse(pos.x, pos.y, stats.chainRange, stats.chainRange * 0.5, 0, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(244,255,92,0.65)'; ctx.stroke();
      }
      ctx.restore();
    }

    const pedW = tileW * 0.68, pedH = tileH * 0.68;
    const pH = tileW * 0.38;
    const topY = pos.y - pH;

    let topColor = '#2b2d42', leftColor = '#1a1b29', rightColor = '#222436';
    if (t.type === 'gatling') {
      topColor = '#8d5b4c'; leftColor = '#5c382e'; rightColor = '#6d4337';
    } else if (t.type === 'cannon') {
      topColor = '#3a3f58'; leftColor = '#202433'; rightColor = '#2c3147';
    } else if (t.type === 'frost') {
      topColor = '#4cc9f0'; leftColor = '#2a7b9b'; rightColor = '#3aa4cb';
    } else if (t.type === 'sniper') {
      topColor = '#e2e8f0'; leftColor = '#94a3b8'; rightColor = '#cbd5e1';
    } else if (t.type === 'lightning') {
      topColor = '#4f46e5'; leftColor = '#312e81'; rightColor = '#3730a3';
    } else if (t.type === 'flak') {
      topColor = '#2d6a4f'; leftColor = '#1b4332'; rightColor = '#24563f';
    }

    // Pedestal Block (gradient-shaded faces for a richer, more volumetric look)
    const pedLeftGrad = ctx.createLinearGradient(pos.x - pedW / 2, topY, pos.x - pedW / 2, pos.y);
    pedLeftGrad.addColorStop(0, lightenHex(leftColor, 0.1));
    pedLeftGrad.addColorStop(1, darkenHex(leftColor, 0.3));
    ctx.fillStyle = pedLeftGrad;
    ctx.beginPath();
    ctx.moveTo(pos.x - pedW / 2, pos.y);
    ctx.lineTo(pos.x, pos.y + pedH / 2);
    ctx.lineTo(pos.x, topY + pedH / 2);
    ctx.lineTo(pos.x - pedW / 2, topY);
    ctx.closePath(); ctx.fill();

    const pedRightGrad = ctx.createLinearGradient(pos.x + pedW / 2, topY, pos.x + pedW / 2, pos.y);
    pedRightGrad.addColorStop(0, lightenHex(rightColor, 0.05));
    pedRightGrad.addColorStop(1, darkenHex(rightColor, 0.35));
    ctx.fillStyle = pedRightGrad;
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y + pedH / 2);
    ctx.lineTo(pos.x + pedW / 2, pos.y);
    ctx.lineTo(pos.x + pedW / 2, topY);
    ctx.lineTo(pos.x, topY + pedH / 2);
    ctx.closePath(); ctx.fill();

    const pedTopGrad = ctx.createLinearGradient(pos.x - pedW / 2, topY, pos.x + pedW / 2, topY);
    pedTopGrad.addColorStop(0, lightenHex(topColor, 0.22));
    pedTopGrad.addColorStop(1, darkenHex(topColor, 0.08));
    ctx.fillStyle = pedTopGrad;
    ctx.beginPath();
    ctx.moveTo(pos.x, topY - pedH / 2);
    ctx.lineTo(pos.x + pedW / 2, topY);
    ctx.lineTo(pos.x, topY + pedH / 2);
    ctx.lineTo(pos.x - pedW / 2, topY);
    ctx.closePath(); ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1; ctx.stroke();

    // Turret Animated Weapons
    ctx.save();
    ctx.translate(pos.x, topY);

    if (t.type === 'gatling') {
      ctx.rotate(t.facing || 0);
      const rec = (t.recoil || 0) * 3;
      ctx.fillStyle = '#b45309';
      ctx.fillRect(-6 - rec, -5, 14, 4);
      ctx.fillRect(-6 - rec, 1, 14, 4);
    } else if (t.type === 'cannon') {
      ctx.rotate(t.facing || 0);
      const rec = (t.recoil || 0) * 4;
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(-8 - rec, -5, 16, 10);
    } else if (t.type === 'frost') {
      ctx.save();
      ctx.rotate(state.time * 2.2);
      ctx.fillStyle = '#7dd3fc';
      ctx.beginPath();
      ctx.moveTo(0, -9); ctx.lineTo(7, 0); ctx.lineTo(0, 9); ctx.lineTo(-7, 0); ctx.closePath();
      ctx.fill();
      ctx.restore();
    } else if (t.type === 'sniper') {
      ctx.rotate(t.facing || 0);
      ctx.fillStyle = '#a855f7';
      ctx.fillRect(-2, -2, 18, 4);
    } else if (t.type === 'lightning') {
      ctx.save();
      ctx.rotate(state.time * 3);
      ctx.fillStyle = '#fde047'; ctx.shadowColor = '#fde047'; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(0, -2, 5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else if (t.type === 'flak') {
      ctx.rotate(t.facing || 0);
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(-4, -6, 12, 4);
      ctx.fillRect(-4, 2, 12, 4);
    }

    ctx.restore();

    // Disabled EMP Sparkles
    if (state.time < t.disabledUntil) {
      ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 1.5;
      ctx.strokeRect(pos.x - pedW/2, topY - pedH/2, pedW, pedH + pH);
    }

    // Stars on Tower
    if (t.level > 1) {
      ctx.fillStyle = '#ffd700'; ctx.font = '10px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(t.level === 3 ? '★★★' : '★★', pos.x, topY - pedH / 2 - 8);
    }
  }

  // 3D Entrance Portals & Sacred Core
  function drawPortal3D(pos) {
    ctx.save();
    ctx.translate(pos.x, pos.y);
    ctx.beginPath();
    ctx.ellipse(0, 0, tileW * 0.42, tileH * 0.42, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(239, 68, 68, 0.4)'; ctx.fill();
    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2; ctx.stroke();

    ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('▼', 0, -6 + Math.sin(state.time * 5) * 3);
    ctx.restore();
  }

  function drawCrystalCore3D(pos) {
    ctx.save();
    ctx.translate(pos.x, pos.y);
    ctx.beginPath();
    ctx.ellipse(0, 0, tileW * 0.48, tileH * 0.48, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(92, 225, 255, 0.2)'; ctx.fill();
    ctx.strokeStyle = '#5ce1ff'; ctx.lineWidth = 2; ctx.stroke();

    const floatY = -tileW * 0.45 + Math.sin(state.time * 2.5) * 5;
    ctx.save();
    ctx.translate(0, floatY);
    ctx.rotate(state.time * 1.5);
    ctx.fillStyle = '#5ce1ff'; ctx.shadowColor = '#5ce1ff'; ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(0, -12); ctx.lineTo(9, 0); ctx.lineTo(0, 12); ctx.lineTo(-9, 0); ctx.closePath();
    ctx.fill();
    ctx.restore();

    ctx.restore();
  }

  // All decorations are drawn as vector shapes (never bitmap glyphs) so that they stay
  // perfectly crisp no matter how far the camera zooms in.
  function drawObstacle3D(d) {
    const pos = cellToPx(d.c, d.r);
    if (d.type === 'rock') {
      const sz = tileW * 0.28;
      ctx.beginPath();
      ctx.ellipse(pos.x, pos.y + sz * 0.55, sz * 0.9, sz * 0.32, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();

      const grad = ctx.createLinearGradient(pos.x - sz, pos.y - sz * 1.3, pos.x + sz, pos.y);
      grad.addColorStop(0, '#6b7d94');
      grad.addColorStop(0.55, '#475569');
      grad.addColorStop(1, '#2c3644');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(pos.x - sz, pos.y);
      ctx.lineTo(pos.x - sz * 0.3, pos.y - sz * 1.3);
      ctx.lineTo(pos.x + sz * 0.5, pos.y - sz * 0.9);
      ctx.lineTo(pos.x + sz, pos.y);
      ctx.lineTo(pos.x + sz * 0.2, pos.y + sz * 0.6);
      ctx.lineTo(pos.x - sz * 0.4, pos.y + sz * 0.5);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(pos.x - sz * 0.3, pos.y - sz * 1.3); ctx.lineTo(pos.x - sz * 0.1, pos.y - sz * 0.2); ctx.stroke();
    } else if (d.type === 'pinetree') {
      const h = tileW * 0.55, w = tileW * 0.2;
      ctx.beginPath();
      ctx.ellipse(pos.x, pos.y + 3, w * 1.1, w * 0.4, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();

      ctx.fillStyle = '#4a2e17';
      ctx.fillRect(pos.x - w * 0.12, pos.y - h * 0.15, w * 0.24, h * 0.2);

      for (let i = 0; i < 3; i++) {
        const ty = pos.y - h * 0.15 - i * h * 0.28;
        const tw = w * (1.15 - i * 0.28);
        const grad = ctx.createLinearGradient(pos.x - tw, ty, pos.x + tw, ty - h * 0.35);
        grad.addColorStop(0, '#0e5c33');
        grad.addColorStop(0.5, '#1a8a4c');
        grad.addColorStop(1, '#0e5c33');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(pos.x - tw, ty);
        ctx.lineTo(pos.x, ty - h * 0.4);
        ctx.lineTo(pos.x + tw, ty);
        ctx.closePath(); ctx.fill();
      }
    } else if (d.type === 'roundtree') {
      const h = tileW * 0.5, r = tileW * 0.22;
      ctx.beginPath();
      ctx.ellipse(pos.x, pos.y + 3, r * 1.1, r * 0.4, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();

      ctx.fillStyle = '#4a2e17';
      ctx.fillRect(pos.x - r * 0.14, pos.y - h * 0.35, r * 0.28, h * 0.4);

      const foliageY = pos.y - h * 0.55;
      const grad = ctx.createRadialGradient(pos.x - r * 0.3, foliageY - r * 0.3, 1, pos.x, foliageY, r * 1.15);
      grad.addColorStop(0, '#3fae6a');
      grad.addColorStop(0.7, '#1a8a4c');
      grad.addColorStop(1, '#0c5a30');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(pos.x, foliageY, r, 0, Math.PI * 2); ctx.fill();
    } else if (d.type === 'flower') {
      const petalColor = ['#ff8fb3', '#ffd166', '#c77dff'][Math.floor((d.c + d.r) % 3)];
      ctx.save();
      ctx.translate(pos.x, pos.y - 2);
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2;
        ctx.beginPath();
        ctx.ellipse(Math.cos(a) * 2.4, Math.sin(a) * 2.4, 2.2, 1.3, a, 0, Math.PI * 2);
        ctx.fillStyle = hexToRgba(petalColor, 0.85);
        ctx.fill();
      }
      ctx.beginPath(); ctx.arc(0, 0, 1.6, 0, Math.PI * 2);
      ctx.fillStyle = '#ffe066'; ctx.fill();
      ctx.restore();
    } else {
      // grass tufts
      ctx.strokeStyle = 'rgba(120, 200, 140, 0.7)';
      ctx.lineCap = 'round';
      for (let i = -1; i <= 1; i++) {
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(pos.x + i * 3, pos.y + 2);
        ctx.quadraticCurveTo(pos.x + i * 3 + i * 1.5, pos.y - 5, pos.x + i * 4, pos.y - 9);
        ctx.stroke();
      }
    }
  }

  // ---------- Main Render Pipeline ----------
  function render() {
    ctx.clearRect(0, 0, W, H);

    // Deep Space Atmosphere
    const bgGrad = ctx.createRadialGradient(W / 2, H / 2, 80, W / 2, H / 2, Math.max(W, H) * 0.75);
    bgGrad.addColorStop(0, curLevel.theme.bg0);
    bgGrad.addColorStop(1, curLevel.theme.bg1);
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // Starfield
    for (const s of stars) {
      const tw = 0.5 + 0.5 * Math.sin(state.time * s.speed + s.phase);
      ctx.globalAlpha = 0.25 + tw * 0.65;
      ctx.fillStyle = s.color;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Camera Transform Applied to Sandtable & Entities
    ctx.save();
    let shakeX = 0, shakeY = 0;
    if (state.screenShake > 0) {
      shakeX = (Math.random() - 0.5) * 12 * (state.screenShake / 0.45);
      shakeY = (Math.random() - 0.5) * 12 * (state.screenShake / 0.45);
    }
    ctx.translate(W / 2 + camera.x + shakeX, H / 2 + camera.y + shakeY);
    ctx.scale(camera.scale, camera.scale);
    ctx.translate(-W / 2, -H / 2);

    // 1. Bedrock Foundation Slab
    drawFloatingIslandBase();

    // 2. Render 3D Grid Blocks (back-to-front depth)
    const hoverCell = state.selectedBuildType && state.hover ? state.hover : null;

    for (let depth = 0; depth < COLS + ROWS; depth++) {
      for (let r = 0; r < ROWS; r++) {
        const c = depth - r;
        if (c < 0 || c >= COLS) continue;

        const isPath = pathSet.has(keyOf(c, r));
        const isHovered = hoverCell && hoverCell.c === c && hoverCell.r === r;
        const liftZ = isHovered ? 8 : 0;

        let topStyle, leftStyle, rightStyle;
        if (isPath) {
          const pulse = 0.5 + 0.5 * Math.sin(state.time * 2.5 - (c + r) * 0.35);
          topStyle = curLevel.theme.pathTop;
          leftStyle = curLevel.theme.pathLeft;
          rightStyle = curLevel.theme.pathRight;
        } else {
          const isAlt = (c + r) % 2 === 0;
          topStyle = isAlt ? curLevel.theme.top : curLevel.theme.alt;
          leftStyle = curLevel.theme.left;
          rightStyle = curLevel.theme.right;
        }

        drawIsoBlock(c, r, topStyle, leftStyle, rightStyle, blockDepth, liftZ);

        if (isPath) {
          const pos = cellToPx(c, r, liftZ);
          ctx.strokeStyle = curLevel.theme.pathGlow;
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.ellipse(pos.x, pos.y, tileW * 0.25, tileH * 0.25, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
    }

    // 3. Flight Corridors
    for (const airPts of airPathsPoints) {
      if (airPts.length > 1) {
        ctx.save();
        ctx.strokeStyle = 'rgba(124, 245, 255, 0.4)';
        ctx.lineWidth = Math.max(2, tileW * 0.08);
        ctx.setLineDash([tileW * 0.35, tileW * 0.25]);
        ctx.lineDashOffset = -state.time * tileW * 1.5;
        ctx.beginPath();
        ctx.moveTo(airPts[0].x, airPts[0].y);
        for (let i = 1; i < airPts.length; i++) ctx.lineTo(airPts[i].x, airPts[i].y);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
      }
    }

    // 4. Portals & Sacred Core (Deduplicated)
    const startKeys = new Set();
    const endKeys = new Set();
    for (const gPath of groundPaths) {
      if (gPath.length > 0) {
        startKeys.add(keyOf(gPath[0].c, gPath[0].r));
        endKeys.add(keyOf(gPath[gPath.length - 1].c, gPath[gPath.length - 1].r));
      }
    }
    for (const k of startKeys) {
      const [c, r] = k.split(",").map(Number);
      drawPortal3D(cellToPx(c, r));
    }
    for (const k of endKeys) {
      const [c, r] = k.split(",").map(Number);
      drawCrystalCore3D(cellToPx(c, r));
    }

    // 6. Build Hologram Preview
    if (hoverCell && inGrid(hoverCell.c, hoverCell.r)) {
      const ok = canBuild(hoverCell.c, hoverCell.r) && state.gold >= TOWER_TYPES[state.selectedBuildType].cost;
      const pos = cellToPx(hoverCell.c, hoverCell.r, 8);
      const rangePx = TOWER_TYPES[state.selectedBuildType].range * cellUnit;

      ctx.save();
      ctx.beginPath();
      ctx.ellipse(pos.x, pos.y, rangePx, rangePx * 0.5, 0, 0, Math.PI * 2);
      ctx.fillStyle = ok ? 'rgba(182,255,90,0.14)' : 'rgba(255,107,107,0.14)';
      ctx.fill();
      ctx.strokeStyle = ok ? '#b6ff5a' : '#ff6b6b';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.font = '20px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.globalAlpha = 0.75;
      ctx.fillText(TOWER_TYPES[state.selectedBuildType].icon, pos.x, pos.y - tileW * 0.35);
      ctx.restore();
    }

    // 7. Depth-Sorted Scene Objects (Obstacles, Towers, Enemies)
    // Decorations are interleaved into the same depth sort as towers/enemies (rather
    // than drawn in a separate earlier pass) so a tree on a "further back" row can
    // never visually float in front of / above a taller foreground character.
    const renderList = [];
    for (const d of decorations) {
      renderList.push({ type: 'obstacle', depth: d.c + d.r, item: d });
    }
    for (const t of state.towers) {
      renderList.push({ type: 'tower', depth: t.c + t.r + 0.5, item: t });
    }
    for (const e of state.enemies) {
      const effR = (e.y + (e.flying ? e.z : 0) - Y_center) / tileH;
      const effC = (e.x - X_center) / tileW;
      const depth = effC + effR;
      renderList.push({ type: 'enemy', depth: e.flying ? depth + 4 : depth, item: e });
    }
    renderList.sort((a, b) => a.depth - b.depth);

    for (const entity of renderList) {
      if (entity.type === 'obstacle') drawObstacle3D(entity.item);
      else if (entity.type === 'tower') drawTower3D(entity.item);
      else if (entity.type === 'enemy') drawCharacter(entity.item);
    }

    // 8. Ground Shockwaves
    for (const sw of state.shockwaves) {
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(sw.x, sw.y, sw.r, sw.r * 0.5, 0, 0, Math.PI * 2);
      ctx.strokeStyle = sw.color;
      ctx.lineWidth = 2.5;
      ctx.globalAlpha = sw.life / sw.maxLife;
      ctx.stroke();
      ctx.restore();
    }

    // 9. Projectiles
    for (const p of state.projectiles) {
      const rad = Math.max(3.5, tileW * 0.07);
      if (p.type === 'cannon') {
        const progress = Math.min(1, p.currDist / (p.travelDist || 1));
        const arcZ = Math.sin(progress * Math.PI) * (tileW * 0.65);
        ctx.beginPath();
        ctx.ellipse(p.x, p.y + arcZ, rad * 0.8, rad * 0.4, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fill();
        ctx.beginPath(); ctx.arc(p.x, p.y, rad * 1.3, 0, Math.PI * 2);
        ctx.fillStyle = '#ff9d5c'; ctx.shadowColor = '#ff9d5c'; ctx.shadowBlur = 8;
        ctx.fill(); ctx.shadowBlur = 0;
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, rad * 1.6, 0, Math.PI * 2);
        ctx.fillStyle = hexToRgba(p.color, 0.35); ctx.fill();
        ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
        ctx.fillStyle = p.color; ctx.fill();
      }
    }

    // 10. Particles
    for (const pt of state.particles) {
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // 11. Lightning Arcs
    for (const a of state.lightnings) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, a.life / a.maxLife);
      ctx.shadowColor = '#f4ff5c'; ctx.shadowBlur = 10;
      ctx.strokeStyle = '#f4ff5c'; ctx.lineWidth = 2.5;
      ctx.beginPath();
      const mx = (a.x1 + a.x2) / 2 + (Math.random() - 0.5) * tileW * 0.4;
      const my = (a.y1 + a.y2) / 2 + (Math.random() - 0.5) * tileW * 0.4;
      ctx.moveTo(a.x1, a.y1); ctx.lineTo(mx, my); ctx.lineTo(a.x2, a.y2);
      ctx.stroke(); ctx.restore();
    }

    // 12. Floating Battle Texts (Miss, Heal, EMP, Berserk)
    for (const ft of state.floatingTexts) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, ft.life / ft.maxLife);
      ctx.font = 'bold 13px sans-serif';
      ctx.fillStyle = ft.color;
      ctx.textAlign = 'center';
      ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.restore();
    }

    ctx.restore();

    // Screen-space atmospheric vignette (drawn after the camera transform so it
    // stays fixed to the viewport regardless of zoom/pan — adds depth & focus).
    const vig = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.72);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.38)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);
  }

  // ---------- Utilities ----------
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  const colorCache = new Map();
  function hexToRgb(hex) {
    if (colorCache.has(hex)) return colorCache.get(hex);
    let h = hex.replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    const num = parseInt(h, 16);
    const rgb = { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    colorCache.set(hex, rgb);
    return rgb;
  }
  function hexToRgba(hex, a) {
    const { r, g, b } = hexToRgb(hex);
    return `rgba(${r},${g},${b},${a})`;
  }
  function lightenHex(hex, amt) {
    const { r, g, b } = hexToRgb(hex);
    const mix = (v) => Math.round(v + (255 - v) * amt);
    return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
  }
  function darkenHex(hex, amt) {
    const { r, g, b } = hexToRgb(hex);
    const mix = (v) => Math.round(v * (1 - amt));
    return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
  }

  // ---------- UI Synchronization & Modals ----------
  function syncHud() {
    levelNameEl.textContent = `第 ${curLevel.id} 关: ${curLevel.name}`;
    goldVal.textContent = state.gold;
    livesVal.textContent = state.lives;
    waveVal.textContent = state.wave + '/' + curLevel.wavesCount;
    scoreVal.textContent = state.score;
  }

  let bannerTimeout = null;
  function showBanner(html, ms) {
    bannerEl.innerHTML = html;
    bannerEl.style.display = 'block';
    if (bannerTimeout) clearTimeout(bannerTimeout);
    if (ms) bannerTimeout = setTimeout(() => { bannerEl.style.display = 'none'; }, ms);
  }

  function updateBetweenWaveBanner() {
    if (state.betweenWaves && !state.gameOver && !state.levelClear) {
      showBanner(`下一波倒计时: ${Math.ceil(state.countdown)}s <button id="skipBtn">立即开始</button>`, 0);
      const skipBtn = document.getElementById('skipBtn');
      if (skipBtn) skipBtn.onclick = () => { state.countdown = 0; };
    } else if (!bannerTimeout) {
      bannerEl.style.display = 'none';
    }
  }

  function buildShop() {
    shopEl.innerHTML = '';
    TOWER_ORDER.forEach((type, idx) => {
      const info = TOWER_TYPES[type];
      const btn = document.createElement('div');
      btn.className = 'tower-btn glass';
      btn.title = info.desc + (info.airOnly ? '（专精防空）' : (info.canAirTarget ? '（可打空中）' : '（仅地面）'));
      const badge = info.airOnly ? '<span style="font-size:9px;vertical-align:top;">🎯✈️</span>' : (info.canAirTarget ? '<span style="font-size:9px;vertical-align:top;">✈️</span>' : '');
      btn.innerHTML = `
        <div class="hotkey">${idx + 1}</div>
        <div class="icon">${info.icon}${badge}</div>
        <div class="name">${info.name}</div>
        <div class="cost">${info.cost}💰</div>
      `;
      btn.onclick = () => {
        ensureAudio();
        if (state.selectedBuildType === type) { state.selectedBuildType = null; }
        else { state.selectedBuildType = type; state.selectedTower = null; hideTowerPanel(); }
        refreshShopSelection();
      };
      btn.dataset.type = type;
      shopEl.appendChild(btn);
    });
  }

  function refreshShopSelection() {
    Array.from(shopEl.children).forEach(btn => {
      btn.classList.toggle('selected', btn.dataset.type === state.selectedBuildType);
      const cost = TOWER_TYPES[btn.dataset.type].cost;
      btn.classList.toggle('disabled', state.gold < cost);
    });
  }

  function showTowerPanel(t) {
    towerPanelEl.style.display = 'block';
    const info = TOWER_TYPES[t.type];
    const stats = towerStats(t);
    document.getElementById('tpTitle').textContent = `${info.icon} ${info.name} Lv.${t.level} [3D台座]`;
    let statsText = `伤害 ${Math.round(stats.dmg)} · 范围 ${(stats.range / cellUnit).toFixed(1)} 格 · 射速 ${stats.rate.toFixed(1)}/s`;
    statsText += stats.airOnly ? ' · 专精防空(仅空中)' : (stats.canAirTarget ? ' · 可打空中' : ' · 仅地面');
    if (stats.chain) statsText += ` · 连锁 ${stats.chain + 1} 目标`;
    document.getElementById('tpStats').textContent = statsText;

    const upBtn = document.getElementById('upgradeBtn');
    const sellBtn = document.getElementById('sellBtn');
    if (t.level >= 3) {
      upBtn.textContent = '已满级';
      upBtn.disabled = true;
    } else {
      const cost = upgradeCost(t);
      upBtn.textContent = `升级 (${cost}💰)`;
      upBtn.disabled = state.gold < cost;
    }
    sellBtn.textContent = `出售 (+${sellValue(t)}💰)`;
  }
  function hideTowerPanel() { towerPanelEl.style.display = 'none'; }

  document.getElementById('upgradeBtn').onclick = () => {
    const t = state.selectedTower;
    if (!t || t.level >= 3) return;
    const cost = upgradeCost(t);
    if (state.gold < cost) { sfx.error(); return; }
    state.gold -= cost;
    t.totalSpent += cost;
    t.level++;
    sfx.upgrade();
    spawnImpactParticles(t.x, t.y - tileW * 0.35, '#ffd54f', 16);
    showTowerPanel(t);
  };
  document.getElementById('sellBtn').onclick = () => {
    const t = state.selectedTower;
    if (!t) return;
    state.gold += sellValue(t);
    towerAt.delete(keyOf(t.c, t.r));
    state.towers = state.towers.filter(x => x !== t);
    state.selectedTower = null;
    hideTowerPanel();
    sfx.sell();
  };
  document.getElementById('closePanelBtn').onclick = () => {
    state.selectedTower = null;
    hideTowerPanel();
  };

  // ---------- Level Modal Management ----------
  function openLevelModal() {
    levelListEl.innerHTML = '';
    const starData = JSON.parse(localStorage.getItem(STARS_KEY) || '{}');

    LEVELS.forEach((lvl, idx) => {
      const item = document.createElement('div');
      item.className = 'level-item' + (idx === currentLevelIdx ? ' active' : '');
      const stars = starData[lvl.id] || 0;
      const starStr = stars > 0 ? '★'.repeat(stars) + '☆'.repeat(3 - stars) : '未通关';

      item.innerHTML = `
        <div class="lvl-info-main">
          <div class="lvl-name">关卡 ${lvl.id}: ${lvl.name} <span style="font-size:12px;color:#ffd54f;margin-left:6px;">${starStr}</span></div>
          <div class="lvl-desc">${lvl.desc}</div>
        </div>
        <div class="lvl-tag">${lvl.wavesCount} 波次</div>
      `;
      item.onclick = () => {
        switchLevel(idx);
        levelModalEl.classList.add('hidden');
      };
      levelListEl.appendChild(item);
    });
    levelModalEl.classList.remove('hidden');
  }

  levelBadgeEl.onclick = openLevelModal;
  levelBtnEl.onclick = openLevelModal;
  closeLevelModalBtn.onclick = () => levelModalEl.classList.add('hidden');

  function switchLevel(lvlIdx) {
    currentLevelIdx = lvlIdx;
    curLevel = LEVELS[currentLevelIdx];
    COLS = curLevel.cols; ROWS = curLevel.rows;
    loadLevelPaths(curLevel);
    resize();
    resetCamera();
    resetGame();
    state.running = true;
    overlayEl.classList.add('hidden');
  }

  // ---------- Level Victory & Game Over ----------
  function levelComplete() {
    state.levelClear = true;
    state.running = false;

    // Calculate stars (3 stars if lives >= 18, 2 if >= 10, else 1)
    const stars = state.lives >= 18 ? 3 : (state.lives >= 10 ? 2 : 1);
    const starData = JSON.parse(localStorage.getItem(STARS_KEY) || '{}');
    starData[curLevel.id] = Math.max(starData[curLevel.id] || 0, stars);
    localStorage.setItem(STARS_KEY, JSON.stringify(starData));

    const best = Math.max(state.score, parseInt(localStorage.getItem(BEST_KEY) || '0', 10));
    localStorage.setItem(BEST_KEY, String(best));

    document.getElementById('overlayTitle').textContent = `🎉 关卡胜利！第 ${curLevel.id} 关已守卫`;
    document.getElementById('overlayStars').textContent = '★'.repeat(stars) + '☆'.repeat(3 - stars);
    document.getElementById('overlayStars').style.color = '#ffd700';

    const isLast = currentLevelIdx === LEVELS.length - 1;
    document.getElementById('overlayDesc').textContent = isLast
      ? '🏆 传奇诞生！你成功平定了全套 5 场经典战役，晶石核心永耀沙盘！'
      : `已成功击退本关全部 ${curLevel.wavesCount} 波敌军部队，晶石核心完好无损！准备好迎战下一张地图了吗？`;

    document.getElementById('overlayStats').textContent = `本关得分: ${state.score} · 剩余生命: ${state.lives}`;

    const btnRow = document.getElementById('overlayBtnRow');
    btnRow.innerHTML = '';

    if (!isLast) {
      const nextBtn = document.createElement('button');
      nextBtn.className = 'big-btn';
      nextBtn.textContent = '进入下一关 ➔';
      nextBtn.onclick = () => switchLevel(currentLevelIdx + 1);
      btnRow.appendChild(nextBtn);
    }

    const replayBtn = document.createElement('button');
    replayBtn.className = 'big-btn secondary';
    replayBtn.textContent = '重新挑战本关';
    replayBtn.onclick = () => switchLevel(currentLevelIdx);
    btnRow.appendChild(replayBtn);

    const selectBtn = document.createElement('button');
    selectBtn.className = 'big-btn secondary';
    selectBtn.textContent = '关卡列表';
    selectBtn.onclick = () => { overlayEl.classList.add('hidden'); openLevelModal(); };
    btnRow.appendChild(selectBtn);

    overlayEl.classList.remove('hidden');
    sfx.win();
  }

  function endGame(won) {
    state.gameOver = true; state.win = won; state.running = false;
    const best = Math.max(state.score, parseInt(localStorage.getItem(BEST_KEY) || '0', 10));
    localStorage.setItem(BEST_KEY, String(best));

    document.getElementById('overlayTitle').textContent = '💥 晶石核心沦陷';
    document.getElementById('overlayStars').textContent = '';
    document.getElementById('overlayDesc').textContent = `在第 ${state.wave} 波，敌军部队攻破了防线。调整台座布局，再战一次吧！`;
    document.getElementById('overlayStats').textContent = `本关得分: ${state.score}　历史最高: ${best}`;

    const btnRow = document.getElementById('overlayBtnRow');
    btnRow.innerHTML = `
      <button class="big-btn" id="retryBtn">重试本关</button>
      <button class="big-btn secondary" id="chooseLvlBtn">选择关卡</button>
    `;
    document.getElementById('retryBtn').onclick = () => switchLevel(currentLevelIdx);
    document.getElementById('chooseLvlBtn').onclick = () => { overlayEl.classList.add('hidden'); openLevelModal(); };

    overlayEl.classList.remove('hidden');
    sfx.gameover();
  }

  function resetGame() {
    state = freshState(currentLevelIdx);
    buildMapExtras(curLevel);
    hideTowerPanel();
    bannerEl.style.display = 'none';
    speedBtn.textContent = 'x1';
    pauseBtn.textContent = '暂停';
    pauseBtn.classList.remove('active');
    refreshShopSelection();
    syncHud();
  }

  document.getElementById('startBtn').onclick = () => {
    ensureAudio();
    resetGame();
    state.running = true;
    overlayEl.classList.add('hidden');
  };

  // ---------- Camera Controls Listeners ----------
  zoomInBtn.onclick = () => setZoom(1.2);
  zoomOutBtn.onclick = () => setZoom(0.83);
  zoomResetBtn.onclick = resetCamera;

  canvas.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const sx = ev.clientX - rect.left;
    const sy = ev.clientY - rect.top;
    const factor = ev.deltaY < 0 ? 1.15 : 0.87;
    setZoom(factor, sx, sy);
  }, { passive: false });

  // ---------- Input Handling (Touch & Mouse Drag / Pan / Build) ----------
  function eventToScreen(ev) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: ev.clientX - rect.left,
      y: ev.clientY - rect.top
    };
  }

  canvas.addEventListener('pointerdown', (ev) => {
    ensureAudio();
    const sPos = eventToScreen(ev);
    camera.isDragging = true;
    camera.dragStartX = sPos.x;
    camera.dragStartY = sPos.y;
    camera.lastScreenX = sPos.x;
    camera.lastScreenY = sPos.y;
    camera.moved = false;
  });

  window.addEventListener('pointermove', (ev) => {
    if (!state) return;
    const sPos = eventToScreen(ev);

    if (camera.isDragging) {
      const dx = sPos.x - camera.lastScreenX;
      const dy = sPos.y - camera.lastScreenY;
      const totalMoved = Math.hypot(sPos.x - camera.dragStartX, sPos.y - camera.dragStartY);

      if (totalMoved > 6) {
        camera.moved = true;
        camera.x += dx;
        camera.y += dy;
      }
      camera.lastScreenX = sPos.x;
      camera.lastScreenY = sPos.y;
    }

    // Hover build cell in world coordinates
    if (state.selectedBuildType) {
      const wPos = screenToWorld(sPos.x, sPos.y);
      state.hover = pxToCell(wPos.x, wPos.y);
    }
  });

  window.addEventListener('pointerup', (ev) => {
    if (!camera.isDragging) return;
    camera.isDragging = false;

    // If was dragging the map view, don't trigger click action
    if (camera.moved) return;

    const sPos = eventToScreen(ev);
    const wPos = screenToWorld(sPos.x, sPos.y);

    // 1. Placing a new tower
    if (state.selectedBuildType) {
      const { c, r } = pxToCell(wPos.x, wPos.y);
      placeTower(state.selectedBuildType, c, r);
      state.selectedBuildType = null;
      state.hover = null;
      refreshShopSelection();
      return;
    }

    // 2. Select existing 3D tower
    const clickedTower = findTowerAtPx(wPos.x, wPos.y);
    if (clickedTower) {
      state.selectedTower = clickedTower;
      showTowerPanel(clickedTower);
      return;
    }

    // 3. Clicked ground cell
    const { c, r } = pxToCell(wPos.x, wPos.y);
    const t = towerAt.get(keyOf(c, r));
    if (t) {
      state.selectedTower = t;
      showTowerPanel(t);
    } else {
      state.selectedTower = null;
      hideTowerPanel();
    }
  });

  // Touch Pinch-to-Zoom
  canvas.addEventListener('touchstart', (ev) => {
    if (ev.touches.length === 2) {
      const t1 = ev.touches[0], t2 = ev.touches[1];
      camera.touchDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
    }
  }, { passive: true });

  canvas.addEventListener('touchmove', (ev) => {
    if (ev.touches.length === 2) {
      const t1 = ev.touches[0], t2 = ev.touches[1];
      const dist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
      if (camera.touchDist > 0) {
        const factor = dist / camera.touchDist;
        const midX = (t1.clientX + t2.clientX) / 2;
        const midY = (t1.clientY + t2.clientY) / 2;
        setZoom(factor, midX, midY);
      }
      camera.touchDist = dist;
    }
  }, { passive: true });

  // Keyboard Shortcuts
  window.addEventListener('keydown', (ev) => {
    if (ev.key === '1') { state.selectedBuildType = 'gatling'; refreshShopSelection(); }
    else if (ev.key === '2') { state.selectedBuildType = 'cannon'; refreshShopSelection(); }
    else if (ev.key === '3') { state.selectedBuildType = 'frost'; refreshShopSelection(); }
    else if (ev.key === '4') { state.selectedBuildType = 'sniper'; refreshShopSelection(); }
    else if (ev.key === '5') { state.selectedBuildType = 'lightning'; refreshShopSelection(); }
    else if (ev.key === '6') { state.selectedBuildType = 'flak'; refreshShopSelection(); }
    else if (ev.key === 'Escape') {
      state.selectedBuildType = null; state.selectedTower = null;
      hideTowerPanel(); refreshShopSelection();
    }
    else if (ev.key === 'r' || ev.key === 'R') { resetCamera(); }
    else if (ev.key === '+' || ev.key === '=') { setZoom(1.2); }
    else if (ev.key === '-' || ev.key === '_') { setZoom(0.83); }
    else if (ev.key === ' ') { togglePause(); ev.preventDefault(); }
    else if (ev.key === 'Enter') { if (state.betweenWaves) state.countdown = 0; }
  });

  speedBtn.onclick = () => {
    const opts = [1, 2, 3];
    const idx = opts.indexOf(state.speedMult);
    state.speedMult = opts[(idx + 1) % opts.length];
    speedBtn.textContent = 'x' + state.speedMult;
  };
  function togglePause() {
    state.paused = !state.paused;
    pauseBtn.textContent = state.paused ? '继续' : '暂停';
    pauseBtn.classList.toggle('active', state.paused);
  }
  pauseBtn.onclick = togglePause;

  // ---------- Main Game Loop ----------
  let lastTs = 0;
  function loop(ts) {
    requestAnimationFrame(loop);
    if (!lastTs) lastTs = ts;
    let dt = (ts - lastTs) / 1000;
    lastTs = ts;
    dt = Math.min(dt, 0.05);

    if (state && state.running && !state.paused && !state.gameOver && !state.levelClear) {
      update(dt);
    }
    if (state) {
      render();
      syncHud();
      refreshShopSelection();
      updateBetweenWaveBanner();
    }
  }

  // Initialization
  window.addEventListener('resize', resize);
  loadLevelPaths(curLevel);
  resize();
  buildShop();
  resetGame();

  const best0 = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
  document.getElementById('overlayStats').textContent = best0 > 0 ? (`历史最高分: ${best0}`) : '';
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
