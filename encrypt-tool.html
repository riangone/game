<style>
:root{--bg-base:#f8fafc;--bg-surface:#fff;--bg-subtle:#f1f5f9;--border-color:#e2e8f0;--border-focus:#0284c7;--text-main:#0f172a;--text-muted:#64748b;--text-light:#94a3b8;--primary:#0284c7;--primary-hover:#0369a1;--primary-subtle:#e0f2fe;--success:#10b981;--success-subtle:#d1fae5;--danger:#ef4444;--danger-subtle:#fee2e2;--radius-sm:8px;--radius-md:14px;--radius-lg:20px;--radius-pill:9999px;--shadow-sm:0 1px 3px rgba(0,0,0,.05);--font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;}
[data-theme="dark"]{--bg-base:#090d16;--bg-surface:#111827;--bg-subtle:#1f2937;--border-color:#374151;--border-focus:#38bdf8;--text-main:#f9fafb;--text-muted:#9ca3af;--text-light:#6b7280;--primary:#38bdf8;--primary-hover:#0ea5e9;--primary-subtle:rgba(56,189,248,.15);--success-subtle:rgba(16,185,129,.15);--danger-subtle:rgba(239,68,68,.18);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--font-sans);background:var(--bg-base);color:var(--text-main);min-height:100vh;display:flex;flex-direction:column;}
header.app-header{background:var(--bg-surface);border-bottom:1px solid var(--border-color);position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;flex-wrap:wrap;}
.header-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.back-link{display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:var(--text-muted);font-size:13px;font-weight:600;padding:6px 10px;border-radius:var(--radius-sm);}
.back-link:hover{background:var(--primary-subtle);color:var(--primary);}
.app-brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;}
.tool-switch,.theme-btn{padding:7px 10px;border-radius:var(--radius-sm);border:1px solid var(--border-color);background:var(--bg-subtle);color:var(--text-main);font-size:13px;font-weight:600;cursor:pointer;}
.container{max-width:760px;margin:0 auto;padding:24px 20px 48px;width:100%;flex:1;}
h1.page-title{font-size:22px;font-weight:800;margin-bottom:4px;}
p.page-sub{color:var(--text-muted);font-size:13px;margin-bottom:18px;}
.card{background:var(--bg-surface);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow-sm);}
.seg{display:flex;background:var(--bg-subtle);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:3px;margin-bottom:18px;width:fit-content;}
.seg button{border:none;background:transparent;padding:8px 20px;font-size:13px;font-weight:700;border-radius:var(--radius-sm);cursor:pointer;color:var(--text-muted);}
.seg button.active{background:var(--bg-surface);color:var(--primary);box-shadow:var(--shadow-sm);}
label.small{font-size:12px;color:var(--text-muted);font-weight:700;display:block;margin-bottom:6px;margin-top:14px;}
textarea{width:100%;min-height:140px;font-family:var(--font-mono);font-size:13px;border:1px solid var(--border-color);border-radius:var(--radius-md);padding:12px;background:var(--bg-subtle);color:var(--text-main);resize:vertical;}
input[type=password],input[type=text]{width:100%;font-size:13px;border:1px solid var(--border-color);border-radius:var(--radius-md);padding:11px 12px;background:var(--bg-subtle);color:var(--text-main);}
.pw-row{display:flex;gap:8px;align-items:center;}
.pw-row button{flex-shrink:0;padding:10px 12px;border-radius:var(--radius-md);border:1px solid var(--border-color);background:var(--bg-subtle);cursor:pointer;}
.btn{margin-top:18px;width:100%;padding:13px;border-radius:var(--radius-md);border:none;background:var(--primary);color:#fff;font-size:14px;font-weight:800;cursor:pointer;}
.btn:hover{background:var(--primary-hover);}
.msg{margin-top:12px;font-size:12.5px;font-weight:700;padding:10px 12px;border-radius:10px;}
.msg.ok{background:var(--success-subtle);color:var(--success);}
.msg.err{background:var(--danger-subtle);color:var(--danger);}
.hint{font-size:12px;color:var(--text-light);margin-top:10px;line-height:1.6;}
.strength{height:5px;border-radius:3px;background:var(--bg-subtle);margin-top:6px;overflow:hidden;}
.strength-bar{height:100%;width:0%;transition:all .2s;}
</style>
    <link rel="canonical" href="https://tool.0101.click/encrypt-tool.html">

<body>
<header class="app-header">
  <div class="header-left">
    <a href="tools.html" class="back-link">← 工具箱</a>
    <div class="app-brand"><span>🛡️</span><span>本地加解密工具</span></div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <select class="tool-switch" onchange="if(this.value) location.href=this.value;">
      <option value="">🔀 切换工具...</option>
      <option value="text-tools.html">🔤 文本工具箱</option>
      <option value="diff-tool.html">🪞 文本差异对比</option>
      <option value="hash-tool.html">#️⃣ 哈希校验</option>
      <option value="encrypt-tool.html">🛡️ 本地加解密</option>
      <option value="todolist.html">✅ 待办清单</option>
      <option value="expense-tracker.html">💰 记账本</option>
      <option value="habit-tracker.html">🔥 习惯打卡</option>
      <option value="countdown.html">⏳ 倒数日</option>
      <option value="time-tool.html">🕐 时间工具箱</option>
      <option value="loan-calculator.html">🏦 贷款计算器</option>
      <option value="color-tool.html">🎨 颜色工具箱</option>
      <option value="drawing-board.html">🖌️ 简易画板</option>
      <option value="img-to-pdf.html">📄 图片转PDF</option>
      <option value="network-info.html">🌐 网络信息</option>
      <option value="password.html">🔐 密码</option>
          <option value="calendar.html">📅 万年历</option>
</select>
    <button class="theme-btn" onclick="toggleTheme()">🌓</button>
  </div>
</header>

<main class="container">
  <h1 class="page-title">🛡️ 本地加解密工具</h1>
  <p class="page-sub">基于 Web Crypto API 的 AES-256-GCM 加密算法，密码经 PBKDF2（100,000 次迭代）派生密钥。密码与明文全程只在本机内存中处理，绝不触网。</p>

  <div class="card">
    <div class="seg">
      <button id="segEnc" class="active" onclick="setMode('enc')">🔒 加密</button>
      <button id="segDec" onclick="setMode('dec')">🔓 解密</button>
    </div>

    <label class="small" id="inputLabel">待加密的文本</label>
    <textarea id="inputText" placeholder="输入要加密的文本..."></textarea>

    <label class="small">密码 / 口令</label>
    <div class="pw-row">
      <input type="password" id="passphrase" placeholder="设置一个强密码，解密时需使用同一密码" oninput="checkStrength()">
      <button onclick="togglePwVisibility()" id="pwToggleBtn">👁️</button>
    </div>
    <div class="strength"><div class="strength-bar" id="strengthBar"></div></div>

    <button class="btn" id="actionBtn" onclick="doAction()">🔒 开始加密</button>
    <div id="resultMsg"></div>

    <label class="small" id="outputLabel" style="display:none;">加密结果（Base64，包含盐值与IV）</label>
    <textarea id="outputText" style="display:none;" readonly></textarea>
    <button class="btn" id="copyBtn" style="display:none;background:var(--bg-subtle);color:var(--text-main);" onclick="copyOutput()">📋 复制结果</button>

    <div class="hint">⚠️ 请牢记您的密码——没有密码任何人（包括本工具）都无法恢复原文。建议加密结果与密码分开保存/传输。</div>
  </div>
</main>

<script>
(function(){const t=localStorage.getItem('app_theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');})();
function toggleTheme(){const cur=document.documentElement.getAttribute('data-theme');const next=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',next);localStorage.setItem('app_theme',next);}

let mode = 'enc';
function setMode(m){
  mode = m;
  document.getElementById('segEnc').classList.toggle('active', m==='enc');
  document.getElementById('segDec').classList.toggle('active', m==='dec');
  document.getElementById('inputLabel').textContent = m==='enc' ? '待加密的文本' : '待解密的密文 (Base64)';
  document.getElementById('inputText').placeholder = m==='enc' ? '输入要加密的文本...' : '粘贴之前生成的加密结果...';
  document.getElementById('actionBtn').textContent = m==='enc' ? '🔒 开始加密' : '🔓 开始解密';
  document.getElementById('actionBtn').onclick = doAction;
  document.getElementById('outputLabel').textContent = m==='enc' ? '加密结果（Base64，包含盐值与IV）' : '解密后的原文';
  document.getElementById('outputText').style.display = 'none';
  document.getElementById('copyBtn').style.display = 'none';
  document.getElementById('outputLabel').style.display = 'none';
  document.getElementById('resultMsg').innerHTML = '';
}

function togglePwVisibility(){
  const el = document.getElementById('passphrase');
  el.type = el.type === 'password' ? 'text' : 'password';
}

function checkStrength(){
  const v = document.getElementById('passphrase').value;
  let score = 0;
  if(v.length >= 8) score++;
  if(v.length >= 14) score++;
  if(/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
  if(/[0-9]/.test(v)) score++;
  if(/[^A-Za-z0-9]/.test(v)) score++;
  const colors = ['#ef4444','#ef4444','#f59e0b','#f59e0b','#10b981','#10b981'];
  const widths = [10,25,45,65,85,100];
  const bar = document.getElementById('strengthBar');
  bar.style.width = widths[score] + '%';
  bar.style.background = colors[score];
}

function buf2b64(buf){
  return btoa(String.fromCharCode(...new Uint8Array(buf)));
}
function b642buf(b64){
  return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
}

async function deriveKey(passphrase, salt){
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

async function encryptText(plain, passphrase){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(passphrase, salt);
  const enc = new TextEncoder();
  const cipherBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(plain));
  const combined = new Uint8Array(salt.length + iv.length + cipherBuf.byteLength);
  combined.set(salt, 0);
  combined.set(iv, salt.length);
  combined.set(new Uint8Array(cipherBuf), salt.length + iv.length);
  return buf2b64(combined);
}

async function decryptText(b64, passphrase){
  const combined = b642buf(b64);
  const salt = combined.slice(0, 16);
  const iv = combined.slice(16, 28);
  const cipherBytes = combined.slice(28);
  const key = await deriveKey(passphrase, salt);
  const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, cipherBytes);
  return new TextDecoder().decode(plainBuf);
}

async function doAction(){
  const input = document.getElementById('inputText').value;
  const pass = document.getElementById('passphrase').value;
  const msgEl = document.getElementById('resultMsg');
  const outputEl = document.getElementById('outputText');
  if(!input.trim()){ msgEl.innerHTML = '<div class="msg err">请输入内容</div>'; return; }
  if(!pass){ msgEl.innerHTML = '<div class="msg err">请输入密码</div>'; return; }
  try{
    let result;
    if(mode === 'enc'){
      result = await encryptText(input, pass);
      msgEl.innerHTML = '<div class="msg ok">✓ 加密成功，请妥善保存密码</div>';
    } else {
      result = await decryptText(input.trim(), pass);
      msgEl.innerHTML = '<div class="msg ok">✓ 解密成功</div>';
    }
    outputEl.value = result;
    outputEl.style.display = 'block';
    document.getElementById('outputLabel').style.display = 'block';
    document.getElementById('copyBtn').style.display = 'block';
  }catch(e){
    msgEl.innerHTML = '<div class="msg err">✗ 操作失败：密码错误或密文已损坏</div>';
    outputEl.style.display = 'none';
    document.getElementById('outputLabel').style.display = 'none';
    document.getElementById('copyBtn').style.display = 'none';
  }
}

function copyOutput(){
  navigator.clipboard.writeText(document.getElementById('outputText').value);
}
</script>
</body>
</html>
