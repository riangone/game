input[type=text],input[type=number],textarea,select{width:100%;padding:10px 12px;border-radius:var(--radius-md);border:1px solid var(--border-color);background:var(--bg-subtle);color:var(--text-main);font-size:13px;outline:none;}
input:focus,textarea:focus,select:focus{border-color:var(--border-focus);}
label.field-label{font-size:12px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:6px;}
.stat-card{background:var(--bg-subtle);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:14px;text-align:center;}

<main class="container">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:12px;">
    <div>
      <h1 class="page-title">💧 喝水打卡与健康提醒</h1>
      <p class="page-sub">科学补水促进代谢。每日饮水进度、快捷记录容量、桌面定时提醒与 7 日摄入分布。</p>

    <div class="cup-card">
      <div class="water-circle">
        <div class="water-fill" id="waterFill" style="height:0%;"></div>

      </div>
      <div style="font-size:13px;color:var(--text-muted);font-weight:700;">今日饮水</div>
      <div style="font-size:28px;font-weight:900;color:var(--primary);margin:4px 0;"><span id="curWater">0</span> <small style="font-size:14px;">/ 2000 ml</small></div>

      <div class="quick-btns">
        <button class="btn btn-subtle" onclick="addWater(150)">+150 ml (一口)</button>
        <button class="btn btn-subtle" onclick="addWater(250)">+250 ml (水杯)</button>
        <button class="btn btn-subtle" onclick="addWater(350)">+350 ml (马克杯)</button>
        <button class="btn btn-subtle" onclick="addWater(500)">+500 ml (运动水壶)</button>
      </div>
      <div style="display:flex;gap:6px;margin-top:10px;">
        <input type="number" id="customWater" placeholder="自定义 ml..." style="padding:6px 10px;">
        <button class="btn btn-sm" onclick="addCustomWater()">记录</button>
      </div>
    </div>

    <div>
      <div class="panel active" style="margin-bottom:18px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">

      </div>

      <div class="panel active">
        <h3 style="font-size:15px;font-weight:700;margin-bottom:10px;">📊 最近 7 天饮水柱状图</h3>
        <canvas id="weekChart" width="600" height="180" style="width:100%;height:180px;background:var(--bg-subtle);border-radius:var(--radius-md);"></canvas>
      </div>
    </div>
  </div>
</main>

<script>
const TARGET = 2000;

function getTodayKey() {
  return 'water_' + new Date().toISOString().slice(0, 10);
}

function loadTodayData() {
  const data = JSON.parse(localStorage.getItem(getTodayKey()) || '[]');
  const sum = data.reduce((acc, cur) => acc + cur.amount, 0);
  document.getElementById('curWater').textContent = sum;
  const pct = Math.min(100, Math.round((sum / TARGET) * 100));
  document.getElementById('pctVal').textContent = pct;
  document.getElementById('waterFill').style.height = pct + '%';

  const list = document.getElementById('logList');
  if (data.length === 0) {
    list.innerHTML = '<div style="color:var(--text-muted);font-size:13px;padding:10px 0;">今日还没有喝水记录，喝一杯吧！</div>';
  } else {
    list.innerHTML = data.slice().reverse().map((item, idx) => {
      return '<div class="log-item"><span>💧 ' + item.amount + ' ml</span><span style="color:var(--text-muted);font-family:var(--font-mono);">' + item.time + '</span></div>';
    }).join('');
  }
  drawWeekChart();
}

function addWater(amount) {
  const key = getTodayKey();
  const data = JSON.parse(localStorage.getItem(key) || '[]');
  const now = new Date();
  const timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  data.push({ amount, time: timeStr });
  localStorage.setItem(key, JSON.stringify(data));
  loadTodayData();
  showToast('已记录饮水 +' + amount + ' ml 💧');
}

function addCustomWater() {
  const val = parseInt(document.getElementById('customWater').value, 10);
  if (val > 0) {
    addWater(val);
    document.getElementById('customWater').value = '';
  }
}

function resetToday() {
  if (confirm('确认清空今天的饮水记录吗？')) {
    localStorage.removeItem(getTodayKey());
    loadTodayData();
  }
}

function drawWeekChart() {
  const canvas = document.getElementById('weekChart');
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = 'water_' + d.toISOString().slice(0, 10);
    const records = JSON.parse(localStorage.getItem(key) || '[]');
    const total = records.reduce((acc, c) => acc + c.amount, 0);
    days.push({ label: (d.getMonth() + 1) + '/' + d.getDate(), total });
  }

  const pad = 30;
  const barWidth = 36;
  const maxVal = Math.max(TARGET, ...days.map(d => d.total));
  const step = (w - 2 * pad) / 7;

  // Target line
  const targetY = h - pad - (TARGET / maxVal) * (h - 2 * pad);
  ctx.strokeStyle = '#f59e0b';
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(pad, targetY);
  ctx.lineTo(w - pad, targetY);
  ctx.stroke();
  ctx.setLineDash([]);

  days.forEach((day, i) => {
    const x = pad + i * step + (step - barWidth) / 2;
    const barH = (day.total / maxVal) * (h - 2 * pad);
    const y = h - pad - barH;

    ctx.fillStyle = day.total >= TARGET ? '#10b981' : '#38bdf8';
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y, barWidth, barH, [4, 4, 0, 0]) : ctx.rect(x, y, barWidth, barH);
    ctx.fill();

    ctx.fillStyle = '#64748b';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(day.label, x + barWidth / 2, h - pad + 16);
    if (day.total > 0) {
      ctx.fillText(day.total, x + barWidth / 2, y - 6);
    }
  });
}

function requestNotification() {
  if (!('Notification' in window)) return showToast('当前浏览器不支持桌面通知');
  Notification.requestPermission().then(perm => {
    if (perm === 'granted') {
      showToast('已开启补水提醒！');
      new Notification('💧 补水助手已就绪', { body: '该喝口水啦，放松一下眼睛与身体！' });
    } else {
      showToast('通知权限已被拒绝');
    }
  });
}

window.addEventListener('DOMContentLoaded', loadTodayData);
</script>

<script>
function initTheme(){
  const saved=localStorage.getItem('app_theme');
  if(saved){document.documentElement.setAttribute('data-theme',saved);}
  else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const target=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',target);
  localStorage.setItem('app_theme',target);
}
initTheme();
function showToast(msg, duration=2200){
  const el=document.createElement('div');
  el.textContent=msg;
  el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:9999px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 10px 25px rgba(0,0,0,.2);transition:opacity .3s;';
  document.body.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),300);},duration);
}
</script>
