.del-btn{border:none;background:transparent;color:var(--text-light);cursor:pointer;font-size:16px;}
.del-btn:hover{color:var(--danger);}
.heatmap{display:grid;grid-template-columns:repeat(26,1fr);grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px;}
.cell{width:13px;height:13px;border-radius:3px;background:var(--bg-subtle);cursor:pointer;border:1px solid var(--border-color);}
.cell.done{background:var(--success);border-color:var(--success);}
.cell.today{outline:2px solid var(--primary);outline-offset:1px;}
.legend-row{display:flex;justify-content:flex-end;align-items:center;gap:6px;font-size:11px;color:var(--text-light);margin-top:8px;}
.legend-row .cell{width:11px;height:11px;cursor:default;}
.empty-state{text-align:center;padding:40px;color:var(--text-light);}

<main class="container">
  <h1 class="page-title">🔥 习惯打卡</h1>
  <p class="page-sub">类 GitHub 贡献热力图追踪每日打卡，自动统计连续打卡天数与累计总数。点击格子即可标记当天完成。</p>

  <div class="add-bar">
    <input type="text" id="newHabitName" placeholder="新建习惯，如：早起、阅读、健身..." onkeydown="if(event.key==='Enter')addHabit()">
    <button onclick="addHabit()">+ 新建</button>
  </div>

  <div id="habitsContainer"></div>
</main>

<script>
(function(){const t=localStorage.getItem('app_theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');})();
function toggleTheme(){const cur=document.documentElement.getAttribute('data-theme');const next=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',next);localStorage.setItem('app_theme',next);}

const STORAGE_KEY = 'habit_tracker_v1';
let habits = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); // [{id,name,log:{'YYYY-MM-DD':true}}]

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(habits)); render(); }

function addHabit(){
  const input = document.getElementById('newHabitName');
  const name = input.value.trim();
  if(!name) return;
  habits.push({ id: Date.now(), name, log: {} });
  input.value = '';
  save();
}
function removeHabit(id){ if(!confirm('确定删除该习惯及其全部打卡记录？')) return; habits = habits.filter(h=>h.id!==id); save(); }

function toDateStr(d){ return d.toISOString().slice(0,10); }

function toggleDay(habitId, dateStr){
  const h = habits.find(x=>x.id===habitId);
  if(!h) return;
  if(h.log[dateStr]) delete h.log[dateStr]; else h.log[dateStr] = true;
  save();
}

function calcStreak(log){
  let streak = 0;
  let d = new Date();
  while(true){
    const key = toDateStr(d);
    if(log[key]){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}

function render(){
  const container = document.getElementById('habitsContainer');
  if(habits.length === 0){
    container.innerHTML = '<div class="empty-state">还没有习惯，添加一个开始养成好习惯吧 🌱</div>';
    return;
  }
  const today = new Date();
  const totalDays = 182; // 26 weeks
  container.innerHTML = habits.map(h => {
    const days = [];
    for(let i=totalDays-1;i>=0;i--){
      const d = new Date(today); d.setDate(d.getDate()-i);
      days.push(toDateStr(d));
    }
    const cells = days.map(dateStr => {
      const isToday = dateStr === toDateStr(today);
      const done = !!h.log[dateStr];
      return `<div class="cell ${done?'done':''} ${isToday?'today':''}" title="${dateStr}" onclick="toggleDay(${h.id},'${dateStr}')"></div>`;
    }).join('');
    const streak = calcStreak(h.log);
    const total = Object.keys(h.log).length;
    return `
      <div class="habit-card">
        <div class="habit-head">
          <div class="habit-name">${escapeHtml(h.name)}</div>
          <div style="display:flex;align-items:center;gap:14px;">
            <div class="habit-stats"><span>🔥 连续 <b>${streak}</b> 天</span><span>✅ 累计 <b>${total}</b> 次</span></div>
            <button class="del-btn" onclick="removeHabit(${h.id})">✕</button>
          </div>
        </div>
        <div class="heatmap">${cells}</div>
        <div class="legend-row">少 <div class="cell"></div><div class="cell done" style="opacity:.4"></div><div class="cell done" style="opacity:.7"></div><div class="cell done"></div> 多</div>
      </div>`;
  }).join('');
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

render();
</script>
