<script>

/* =========================================================================
 * 农历换算引擎 (Lunar <-> Solar Conversion Engine)
 * 数据区间 1900-2100，二进制编码表示每年的闰月信息与大小月天数。
 * 数据来源参考：香港天文台（Hong Kong Observatory）1900-2100 公历农历对照表，
 * 该套算法与编码表为中文农历换算领域业界广泛采用的标准实现方式。
 * 本文件为原创实现（变量命名与结构均独立编写），仅复用该天文历法数据集。
 * ======================================================================= */
const LUNAR_INFO=[0x4bd8,0x4ae0,0xa570,0x54d5,0xd260,0xd950,0x16554,0x56a0,0x9ad0,0x55d2,
0x4ae0,0xa5b6,0xa4d0,0xd250,0x1d255,0xb540,0xd6a0,0xada2,0x95b0,0x14977,
0x4970,0xa4b0,0xb4b5,0x6a50,0x6d40,0x1ab54,0x2b60,0x9570,0x52f2,0x4970,
0x6566,0xd4a0,0xea50,0x16a95,0x5ad0,0x2b60,0x186e3,0x92e0,0x1c8d7,0xc950,
0xd4a0,0x1d8a6,0xb550,0x56a0,0x1a5b4,0x25d0,0x92d0,0xd2b2,0xa950,0xb557,
0x6ca0,0xb550,0x15355,0x4da0,0xa5b0,0x14573,0x52b0,0xa9a8,0xe950,0x6aa0,
0xaea6,0xab50,0x4b60,0xaae4,0xa570,0x5260,0xf263,0xd950,0x5b57,0x56a0,
0x96d0,0x4dd5,0x4ad0,0xa4d0,0xd4d4,0xd250,0xd558,0xb540,0xb6a0,0x195a6,
0x95b0,0x49b0,0xa974,0xa4b0,0xb27a,0x6a50,0x6d40,0xaf46,0xab60,0x9570,
0x4af5,0x4970,0x64b0,0x74a3,0xea50,0x6b58,0x5ac0,0xab60,0x96d5,0x92e0,
0xc960,0xd954,0xd4a0,0xda50,0x7552,0x56a0,0xabb7,0x25d0,0x92d0,0xcab5,
0xa950,0xb4a0,0xbaa4,0xad50,0x55d9,0x4ba0,0xa5b0,0x15176,0x52b0,0xa930,
0x7954,0x6aa0,0xad50,0x5b52,0x4b60,0xa6e6,0xa4e0,0xd260,0xea65,0xd530,
0x5aa0,0x76a3,0x96d0,0x4afb,0x4ad0,0xa4d0,0x1d0b6,0xd250,0xd520,0xdd45,
0xb5a0,0x56d0,0x55b2,0x49b0,0xa577,0xa4b0,0xaa50,0x1b255,0x6d20,0xada0,
0x14b63,0x9370,0x49f8,0x4970,0x64b0,0x168a6,0xea50,0x6aa0,0x1a6c4,0xaae0,
0x92e0,0xd2e3,0xc960,0xd557,0xd4a0,0xda50,0x5d55,0x56a0,0xa6d0,0x55d4,
0x52d0,0xa9b8,0xa950,0xb4a0,0xb6a6,0xad50,0x55a0,0xaba4,0xa5b0,0x52b0,
0xb273,0x6930,0x7337,0x6aa0,0xad50,0x14b55,0x4b60,0xa570,0x54e4,0xd160,
0xe968,0xd520,0xdaa0,0x16aa6,0x56d0,0x4ae0,0xa9d4,0xa2d0,0xd150,0xf252,
0xd520];
const GAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const ZHI=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const ZODIAC=['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
const N_DAY1=['日','一','二','三','四','五','六','七','八','九','十'];
const N_DAY2=['初','十','廿','三十'];
const N_MONTH=['正','二','三','四','五','六','七','八','九','十','冬','腊'];
const LUNAR_MIN_YEAR=1900, LUNAR_MAX_YEAR=2100;

function lLeapMonth(y){ return LUNAR_INFO[y-1900] & 0xf; }
function lLeapDays(y){ return lLeapMonth(y) ? ((LUNAR_INFO[y-1900] & 0x10000) ? 30 : 29) : 0; }
function lMonthDays(y,m){ return (LUNAR_INFO[y-1900] & (0x10000 >> m)) ? 30 : 29; }
function lYearDays(y){ let sum=348; for(let i=0x8000;i>0x8;i>>=1) sum += (LUNAR_INFO[y-1900]&i)?1:0; return sum + lLeapDays(y); }
function ganzhiYear(y){ let g=(y-3)%10, z=(y-3)%12; if(g<=0)g+=10; if(z<=0)z+=12; return GAN[g-1]+ZHI[z-1]; }
function zodiacOf(y){ let z=(y-4)%12; if(z<0)z+=12; return ZODIAC[z]; }
function chinaMonthStr(m,isLeap){ return (isLeap?'闰':'') + N_MONTH[m-1] + '月'; }
function chinaDayStr(d){
  if(d===10) return '初十';
  if(d===20) return '二十';
  if(d===30) return '三十';
  return N_DAY2[Math.floor(d/10)] + N_DAY1[d%10];
}
/** 公历转农历：传入 y,m,d (Date对象字段)，返回农历详情对象 */
function solar2lunar(y,m,d){
  if(y<LUNAR_MIN_YEAR || y>LUNAR_MAX_YEAR) return null;
  const od = new Date(y,m-1,d);
  let offset = Math.round((Date.UTC(od.getFullYear(),od.getMonth(),od.getDate()) - Date.UTC(1900,0,31)) / 86400000);
  let i, temp=0;
  for(i=1900; i<2101 && offset>0; i++){ temp = lYearDays(i); offset -= temp; }
  if(offset<0){ offset += temp; i--; }
  const lYear = i;
  const leap = lLeapMonth(i);
  let isLeap = false;
  for(i=1; i<13 && offset>0; i++){
    let t;
    if(leap>0 && i===(leap+1) && !isLeap){ i--; isLeap=true; t=lLeapDays(lYear); }
    else t = lMonthDays(lYear,i);
    if(isLeap && i===(leap+1)) isLeap=false;
    offset -= t; temp = t;
  }
  if(offset===0 && leap>0 && i===leap+1){ if(isLeap) isLeap=false; else { isLeap=true; i--; } }
  if(offset<0){ offset += temp; i--; }
  const lMonth = i, lDay = offset+1;
  return {
    lYear, lMonth, lDay, isLeap,
    monthCn: chinaMonthStr(lMonth,isLeap),
    dayCn: chinaDayStr(lDay),
    ganzhi: ganzhiYear(lYear),
    zodiac: zodiacOf(lYear)
  };
}
/** 在给定公历年份附近，查找某个农历 (月,日,是否闰月) 对应的公历日期字符串 */
function findLunarDateInYear(solarYear, lm, ld, wantLeap){
  for(let off=-50; off<420; off++){
    const base = new Date(solarYear,0,1); base.setDate(base.getDate()+off);
    const r = solar2lunar(base.getFullYear(), base.getMonth()+1, base.getDate());
    if(r && r.lYear===solarYear && r.lMonth===lm && r.lDay===ld && !!r.isLeap===!!wantLeap){
      return isoDate(base.getFullYear(), base.getMonth()+1, base.getDate());
    }
  }
  return null;
}

/* =========================================================================
 * 通用日期工具
 * ======================================================================= */
function pad2(n){ return String(n).padStart(2,'0'); }
function isoDate(y,m,d){ return y+'-'+pad2(m)+'-'+pad2(d); }
function parseIso(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDaysIso(s,n){ const dt=parseIso(s); dt.setDate(dt.getDate()+n); return isoDate(dt.getFullYear(),dt.getMonth()+1,dt.getDate()); }
function dowOfIso(s){ return parseIso(s).getDay(); }
function dowYmd(y,m,d){ return new Date(y,m-1,d).getDay(); }
function nthWeekday(y,m,weekday,n){ let c=0; const days=new Date(y,m,0).getDate(); for(let d=1;d<=days;d++){ if(dowYmd(y,m,d)===weekday){ c++; if(c===n) return d; } } return null; }

function isWeekendIso(s){ const w=dowOfIso(s); return w===0||w===6; }
/** 高斯复活节算法 (Anonymous Gregorian algorithm / Meeus-Jones-Butcher)，公共数学算法，适用于公历1583年至今 */
function easterSunday(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
        h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,mm=Math.floor((a+11*h+22*l)/451);
  const month=Math.floor((h+l-7*mm+114)/31), day=((h+l-7*mm+114)%31)+1;
  return isoDate(y,month,day);
}

function jpShunbun(y){ return Math.floor(20.8431 + 0.242194*(y-1980) - Math.floor((y-1980)/4)); }
function jpShuubun(y){ return Math.floor(23.2488 + 0.242194*(y-1980) - Math.floor((y-1980)/4)); }

function jpHolidays(y){

  const dates = raw.map(h=>h[0]); const set = new Set(dates);
  for(const d of dates){
    const next2 = addDaysIso(d,2);

      const between = addDaysIso(d,1);
      if(!set.has(between) && dowOfIso(between)!==0){ map.set(between,'国民の休日'); set.add(between); }
    }
  }
  const sorted=[...map.keys()].sort();
  for(const d of sorted){
    if(dowOfIso(d)===0){ let cur=addDaysIso(d,1); while(set.has(cur)) cur=addDaysIso(cur,1); map.set(cur,'振替休日'); set.add(cur); }

}

function krHolidays(y){

function ukWeekendShift(dates){
  const set=new Set(); const result=[];
  for(const d of [...dates].sort()){ let cur=d; while(isWeekendISO(cur)||set.has(cur)) cur=addDaysIso(cur,1); set.add(cur); result.push(cur); }

/* =========================================================================
 * 应用状态与渲染
 * ======================================================================= */
const today = new Date();
const state = { country: localStorage.getItem('calendar_country_v1') || 'CN', year: today.getFullYear(), month: today.getMonth()+1, selected: isoDate(today.getFullYear(),today.getMonth()+1,today.getDate()), holidayCache:{} };

function currentLang(){ return (COUNTRIES.find(c=>c.code===state.country)||COUNTRIES[0]).lang; }
function T(){ return I18N[currentLang()]; }

function getHolidayMap(country,year){
  const key=country+'_'+year;
  if(!state.holidayCache[key]){
    const list = getHolidays(country,year);
    const map = new Map();
    list.forEach(h=>{
      if(!map.has(h.date)) map.set(h.date, h);
      else {
        const existing = map.get(h.date);
        if(h.type==='public' || existing.type!=='public') map.set(h.date, h.type==='public'?h:existing);
      }
    });
    state.holidayCache[key] = { list, map };
  }
  return state.holidayCache[key];
}

function buildCountrySelect(){
  const sel = document.getElementById('countrySelect');
  sel.innerHTML = COUNTRIES.map(c=>`<option value="${c.code}" ${c.code===state.country?'selected':''}>${c.flag} ${c.label}</option>`).join('');
}

function onCountryChange(code){
  state.country = code;
  localStorage.setItem('calendar_country_v1', code);
  applyI18n();
  renderAll();
}

function applyI18n(){
  const t = T();
  const lang = currentLang();
  const htmlLangMap = {zh:'zh-CN',zhHant:'zh-Hant',ja:'ja',ko:'ko',en:'en'};
  document.getElementById('htmlRoot').lang = htmlLangMap[lang] || 'zh-CN';
  document.title = t.brand + ' · ' + t.subtitle.slice(0,30);
  document.getElementById('brandText').textContent = t.brand;
  document.getElementById('pageTitle').textContent = '📅 ' + t.brand;
  document.getElementById('pageSub').textContent = t.subtitle;
  document.getElementById('lblCountry').textContent = t.country;
  document.getElementById('todayBtn').textContent = t.today;
  document.getElementById('lblLunarToggle').textContent = t.lunarToggle;
  document.getElementById('lblSidebarTitle').textContent = t.sidebarTitle;
  document.getElementById('footerNote').textContent = t.footer;
  document.getElementById('weekdayRow').innerHTML = t.weekday.map(w=>`<div>${w}</div>`).join('');
  document.getElementById('legendBar').innerHTML = `
    <span><span class="dot public"></span>${t.legendPublic}</span>
    <span><span class="dot observance"></span>${t.legendObservance}</span>
    <span><span class="dot weekend"></span>${t.legendWeekend}</span>
    <span><span class="dot workday"></span>${t.legendWorkday}</span>`;
}

function navMonth(delta){
  let m = state.month + delta, y = state.year;
  if(m<1){ m=12; y--; } else if(m>12){ m=1; y++; }
  state.month = m; state.year = y;
  renderAll();
}
function navYear(delta){ state.year += delta; renderAll(); }
function goToday(){
  const now = new Date();
  state.year = now.getFullYear(); state.month = now.getMonth()+1;
  state.selected = isoDate(now.getFullYear(), now.getMonth()+1, now.getDate());
  renderAll();
}
function selectDate(y,m,d){
  state.selected = isoDate(y,m,d);
  if(m!==state.month || y!==state.year){ state.year=y; state.month=m; }
  renderAll();
}

function renderDataBanner(){
  const t=T();
  const el = document.getElementById('dataBanner');
  const official = isOfficialYear(state.country, state.year);
  el.className = 'data-banner ' + (official?'official':'approx');
  el.textContent = official ? t.dataOfficial : t.dataApprox;
}

function buildMonthCells(year,month){
  const firstDow = new Date(year,month-1,1).getDay();
  const daysInMonth = new Date(year,month,0).getDate();
  const prevMonthDays = new Date(year,month-1,0).getDate();
  let py=year, pm=month-1; if(pm<1){pm=12;py=year-1;}
  let ny=year, nm=month+1; if(nm>12){nm=1;ny=year+1;}
  const cells=[];
  for(let i=0;i<firstDow;i++){ const d=prevMonthDays-firstDow+1+i; cells.push({y:py,m:pm,d,other:true}); }
  for(let d=1;d<=daysInMonth;d++){ cells.push({y:year,m:month,d,other:false}); }
  let nd=1; while(cells.length%7!==0){ cells.push({y:ny,m:nm,d:nd++,other:true}); }
  return cells;
}

function renderCalendarGrid(){
  const t = T();
  const showLunar = document.getElementById('lunarToggle').checked;
  document.getElementById('periodLabel').textContent = t.period(state.year, state.month);
  const cells = buildMonthCells(state.year, state.month);
  const yearsNeeded = new Set(cells.map(c=>c.y));
  yearsNeeded.add(state.year);
  const maps = {}; yearsNeeded.forEach(y=> maps[y] = getHolidayMap(state.country,y).map );
  const todayIso = isoDate(today.getFullYear(),today.getMonth()+1,today.getDate());
  const html = cells.map(c=>{
    const iso = isoDate(c.y,c.m,c.d);
    const dow = new Date(c.y,c.m-1,c.d).getDay();
    const weekend = dow===0 || dow===6;
    const h = maps[c.y] ? maps[c.y].get(iso) : null;
    const isToday = iso===todayIso;
    const isSelected = iso===state.selected;
    let cls = 'day-cell';
    if(c.other) cls+=' other-month';
    if(weekend) cls+=' weekend';
    if(isToday) cls+=' today';
    if(isSelected) cls+=' selected';
    if(h && h.type==='public') cls+=' has-public';
    let lunarHtml='';
    if(showLunar){
      const ld = solar2lunar(c.y,c.m,c.d);
      if(ld){
        const txt = ld.lDay===1 ? ld.monthCn : ld.dayCn;
        const isFestival = !!(h && h.type==='public');
        lunarHtml = `<div class="lunar-txt${isFestival?' is-festival':''}">${txt}</div>`;
      }
    }
    let badgeHtml='';
    if(h && h.type==='public'){ badgeHtml = `<div class="hbadge" title="${h.name}">${h.name}</div>`; }
    else if(h && h.type==='observance'){ badgeHtml = `<div class="hbadge observance" title="${h.name}">${h.name}</div>`; }
    let workdayFlag='';
    if(h && h.type==='workday'){ workdayFlag = `<div class="workday-flag">${currentLang()==='en'?'W':'班'}</div>`; }
    return `<div class="${cls}" onclick="selectDate(${c.y},${c.m},${c.d})">
      <div class="dnum">${c.d}</div>
      ${lunarHtml}
      ${badgeHtml}
      ${workdayFlag}
    </div>`;
  }).join('');
  document.getElementById('daysGrid').innerHTML = html;
}

function renderDetail(){
  const t = T();
  const d = parseIso(state.selected);
  const y=d.getFullYear(), m=d.getMonth()+1, dd=d.getDate();
  const ld = solar2lunar(y,m,dd);
  const map = getHolidayMap(state.country, y).map;
  const h = map.get(state.selected);
  let html = `<div class="ddate">${isoDate(y,m,dd)}</div>`;
  html += `<div class="drow"><b>${t.detailWeekday}</b>${t.weekday[d.getDay()]}</div>`;
  if(ld){
    html += `<div class="drow"><b>${t.detailLunar}</b>${ld.ganzhi}${ld.zodiac===''?'':'年 ('+ld.zodiac+')'} ${ld.monthCn}${ld.dayCn}</div>`;
  }
  if(h && h.type==='public'){
    html += `<div class="dholiday">🎉 ${h.name}</div>`;
  } else if(h && h.type==='workday'){
    html += `<div class="dworkday-note">${t.detailWorkdayNote}</div>`;
  } else {
    html += `<div class="drow" style="color:var(--text-light);">${t.detailNoHoliday}</div>`;
  }
  document.getElementById('detailBox').innerHTML = html;
}

function renderSidebarList(){
  const t = T();
  const {list} = getHolidayMap(state.country, state.year);
  const relevant = list.filter(h=>h.type==='public'||h.type==='observance').sort((a,b)=>a.date<b.date?-1:1);
  const todayIso = isoDate(today.getFullYear(),today.getMonth()+1,today.getDate());
  if(!relevant.length){
    document.getElementById('holidayList').innerHTML = `<div class="empty-note">${t.sidebarEmpty}</div>`;
    return;
  }
  document.getElementById('holidayList').innerHTML = relevant.map(h=>{
    const past = h.date < todayIso;
    const [yy,mm,ddv] = h.date.split('-').map(Number);
    return `<div class="hl-item${past?' past':''}" onclick="selectDate(${yy},${mm},${ddv})">
      <div class="hl-date">${h.date.slice(5)}</div>
      <div class="hl-name">${h.name}</div>
      <div class="hl-tag">${h.type==='public'?t.legendPublic:t.legendObservance}</div>
    </div>`;
  }).join('');
}

function renderAll(){
  renderDataBanner();
  renderCalendarGrid();
  renderDetail();
  renderSidebarList();
}

buildCountrySelect();
applyI18n();
renderAll();
</script>
