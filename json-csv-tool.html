<style>

body{font-family:var(--font-sans);background:var(--bg-base);color:var(--text-main);min-height:100vh;display:flex;flex-direction:column;}
header.app-header{background:var(--bg-surface);border-bottom:1px solid var(--border-color);position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;flex-wrap:wrap;}
.header-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.back-link{display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:var(--text-muted);font-size:13px;font-weight:600;padding:6px 10px;border-radius:var(--radius-sm);}

.tab-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.panel{display:none;background:var(--bg-surface);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm);}
.panel.active{display:block;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--radius-md);border:none;background:var(--primary);color:#fff;font-weight:700;font-size:13px;cursor:pointer;transition:.2s;}
.btn:hover{background:var(--primary-hover);}
.btn-subtle{background:var(--bg-subtle);color:var(--text-main);border:1px solid var(--border-color);}
.btn-subtle:hover{border-color:var(--primary);color:var(--primary);}
.btn-sm{padding:6px 12px;font-size:12px;}
input[type=text],input[type=number],textarea,select{width:100%;padding:10px 12px;border-radius:var(--radius-md);border:1px solid var(--border-color);background:var(--bg-subtle);color:var(--text-main);font-size:13px;outline:none;}
input:focus,textarea:focus,select:focus{border-color:var(--border-focus);}
label.field-label{font-size:12px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:6px;}
.badge{display:inline-block;padding:3px 8px;border-radius:var(--radius-pill);font-size:11px;font-weight:700;}
.badge-success{background:rgba(16,185,129,.15);color:var(--success);}
.badge-warning{background:rgba(245,158,11,.15);color:var(--warning);}
.badge-primary{background:var(--primary-subtle);color:var(--primary);}
</style>
    <link rel="canonical" href="https://tool.0101.click/json-csv-tool.html">
</head>
<style>
.io-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
@media(max-width:768px){.io-grid{grid-template-columns:1fr;}}
.code-area{width:100%;height:380px;font-family:var(--font-mono);font-size:13px;line-height:1.5;padding:14px;border-radius:var(--radius-md);border:1px solid var(--border-color);background:var(--bg-subtle);color:var(--text-main);resize:vertical;}
.opt-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--bg-subtle);padding:10px 14px;border-radius:var(--radius-md);border:1px solid var(--border-color);margin-bottom:14px;}
.error-banner{display:none;background:rgba(239,68,68,.1);border:1px solid var(--danger);color:var(--danger);padding:10px 14px;border-radius:var(--radius-md);font-size:13px;margin-bottom:14px;}
</style>

<header class="app-header">
  <div class="header-left">
    <a href="tools.html" class="back-link">← 工具箱</a>
    <div class="app-brand"><span>🔄</span><span>JSON / CSV 互转工坊</span></div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <select class="tool-switch" onchange="if(this.value) location.href=this.value;">
      <option value="">🔀 切换工具...</option>
      <option value="markdown-editor.html">📝 Markdown排版</option>
      <option value="uuid-generator.html">🆔 唯一标识生成</option>
      <option value="json-csv-tool.html">🔄 JSON/CSV互转</option>
      <option value="cron-parser.html">⏰ Cron表达式</option>
      <option value="css-generator.html">🎨 CSS视觉工坊</option>
      <option value="ascii-art.html">🔤 字符画艺术</option>
      <option value="tools.html">🏠 返回全部工具</option>
    </select>
    <button class="theme-btn" onclick="toggleTheme()" title="切换明暗主题">🌓</button>
  </div>
</header>
<main class="container">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:12px;">
    <div>
      <h1 class="page-title">🔄 JSON / CSV 互转工坊</h1>
      <p class="page-sub">RFC-4180 严格转义分词，支持嵌套对象多层展平（Flatten）、TS 接口与 Markdown 表格生成。</p>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-subtle btn-sm" onclick="loadSampleData()">📋 加载测试数据</button>
      <button class="btn btn-subtle btn-sm" onclick="swapIo()">⇄ 左右交换</button>
      <button class="btn btn-sm" onclick="convertData()">⚡ 立即转换</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-mode="json2csv" onclick="setMode('json2csv')">JSON ➔ CSV</button>
    <button class="tab-btn" data-mode="csv2json" onclick="setMode('csv2json')">CSV ➔ JSON</button>
    <button class="tab-btn" data-mode="json2md" onclick="setMode('json2md')">JSON ➔ Markdown 表格</button>
  </div>

  <div class="opt-row">
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer;">
      <input type="checkbox" id="flattenNested" checked> 深度展平嵌套对象 (user.city)
    </label>
    <div style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;">
      <span>分隔符:</span>
      <select id="csvDelimiter" style="width:100px;padding:4px 8px;">
        <option value=",">逗号 (,)</option>
        <option value=";">分号 (;)</option>
        <option value="\t">制表符 (Tab)</option>
      </select>
    </div>
  </div>

  <div id="errorBanner" class="error-banner"></div>

  <div class="io-grid">
    <div>
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;align-items:center;">
        <label class="field-label" id="srcLabel">源数据 (输入 JSON)</label>
        <div style="display:flex;gap:6px;">
          <input type="file" id="fileUploader" style="display:none;" onchange="handleFileUpload(event)">
          <button class="btn btn-subtle btn-sm" onclick="document.getElementById('fileUploader').click()">📂 导入文件</button>
          <button class="btn btn-subtle btn-sm" onclick="document.getElementById('srcInput').value='';">清空</button>
        </div>
      </div>
      <textarea id="srcInput" class="code-area" placeholder="在此粘贴源数据..." oninput="autoConvert()"></textarea>
    </div>

    <div>
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;align-items:center;">
        <label class="field-label" id="destLabel">转换结果 (输出 CSV)</label>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-subtle btn-sm" onclick="copyDest()">📋 复制结果</button>
          <button class="btn btn-subtle btn-sm" onclick="downloadDest()">💾 导出文件</button>
        </div>
      </div>
      <textarea id="destOutput" class="code-area" readonly></textarea>
    </div>
  </div>
</main>

<script>
let currentMode = 'json2csv';

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-mode') === mode));
  if (mode === 'json2csv') {
    document.getElementById('srcLabel').textContent = '源数据 (输入 JSON 数组或对象)';
    document.getElementById('destLabel').textContent = '转换结果 (输出 CSV)';
  } else if (mode === 'csv2json') {
    document.getElementById('srcLabel').textContent = '源数据 (输入 CSV 文本)';
    document.getElementById('destLabel').textContent = '转换结果 (输出 JSON)';
  } else if (mode === 'json2md') {
    document.getElementById('srcLabel').textContent = '源数据 (输入 JSON 数组)';
    document.getElementById('destLabel').textContent = '转换结果 (输出 Markdown 表格)';
  }
  convertData();
}

function flattenObject(ob, prefix = '', res = {}) {
  for (const i in ob) {
    if (Object.prototype.hasOwnProperty.call(ob, i)) {
      const propName = prefix ? prefix + '.' + i : i;
      if (typeof ob[i] === 'object' && ob[i] !== null && !Array.isArray(ob[i])) {
        flattenObject(ob[i], propName, res);
      } else {
        res[propName] = ob[i];
      }
    }
  }
  return res;
}

function parseCSV(text, delimiter = ',') {
  const rows = [];
  let currentRow = [];
  let currentVal = '';
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    const next = text[i + 1];
    if (inQuotes) {
      if (c === '"' && next === '"') {
        currentVal += '"';
        i++;
      } else if (c === '"') {
        inQuotes = false;
      } else {
        currentVal += c;
      }
    } else {
      if (c === '"') {
        inQuotes = true;
      } else if (c === delimiter) {
        currentRow.push(currentVal);
        currentVal = '';
      } else if (c === '\r' && next === '\n') {
        currentRow.push(currentVal);
        rows.push(currentRow);
        currentRow = [];
        currentVal = '';
        i++;
      } else if (c === '\n' || c === '\r') {
        currentRow.push(currentVal);
        rows.push(currentRow);
        currentRow = [];
        currentVal = '';
      } else {
        currentVal += c;
      }
    }
  }
  if (currentVal || currentRow.length > 0) {
    currentRow.push(currentVal);
    rows.push(currentRow);
  }
  return rows;
}

function escapeCSVCell(val, delimiter = ',') {
  if (val === null || val === undefined) return '';
  const str = String(val);
  if (str.includes(delimiter) || str.includes('"') || str.includes('\n') || str.includes('\r')) {
    return '"' + str.replace(/"/g, '""') + '"';
  }
  return str;
}

function convertData() {
  const err = document.getElementById('errorBanner');
  err.style.display = 'none';
  const src = document.getElementById('srcInput').value.trim();
  if (!src) {
    document.getElementById('destOutput').value = '';
    return;
  }

  const delimiter = document.getElementById('csvDelimiter').value;
  const doFlatten = document.getElementById('flattenNested').checked;

  try {
    if (currentMode === 'json2csv') {
      let parsed = JSON.parse(src);
      if (!Array.isArray(parsed)) parsed = [parsed];
      if (parsed.length === 0) throw new Error('JSON 数组为空');
      
      const flatList = doFlatten ? parsed.map(o => flattenObject(o)) : parsed;
      const headers = Array.from(new Set(flatList.flatMap(o => Object.keys(o))));
      const csvLines = [headers.map(h => escapeCSVCell(h, delimiter)).join(delimiter)];
      
      flatList.forEach(item => {
        const row = headers.map(h => escapeCSVCell(item[h], delimiter));
        csvLines.push(row.join(delimiter));
      });
      document.getElementById('destOutput').value = csvLines.join('\n');
    } else if (currentMode === 'csv2json') {
      const rows = parseCSV(src, delimiter);
      if (rows.length < 2) throw new Error('CSV 必须包含至少一行表头与一行数据');
      const headers = rows[0];
      const items = [];
      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        if (row.length === 1 && !row[0]) continue;
        const obj = {};
        headers.forEach((h, idx) => {
          let val = row[idx] !== undefined ? row[idx] : '';
          if (/^-?\d+(\.\d+)?$/.test(val)) val = Number(val);
          else if (val.toLowerCase() === 'true') val = true;
          else if (val.toLowerCase() === 'false') val = false;
          else if (val.toLowerCase() === 'null') val = null;
          obj[h] = val;
        });
        items.push(obj);
      }
      document.getElementById('destOutput').value = JSON.stringify(items, null, 2);
    } else if (currentMode === 'json2md') {
      let parsed = JSON.parse(src);
      if (!Array.isArray(parsed)) parsed = [parsed];
      const flatList = doFlatten ? parsed.map(o => flattenObject(o)) : parsed;
      const headers = Array.from(new Set(flatList.flatMap(o => Object.keys(o))));
      const headerRow = '| ' + headers.join(' | ') + ' |';
      const sepRow = '| ' + headers.map(() => '---').join(' | ') + ' |';
      const rows = flatList.map(item => '| ' + headers.map(h => (item[h] !== undefined ? String(item[h]).replace(/\|/g, '\\|') : '')).join(' | ') + ' |');
      document.getElementById('destOutput').value = [headerRow, sepRow, ...rows].join('\n');
    }
  } catch (e) {
    err.textContent = '❌ 解析转换错误: ' + e.message;
    err.style.display = 'block';
  }
}

let debounceTimer = null;
function autoConvert() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(convertData, 250);
}

function swapIo() {
  const destVal = document.getElementById('destOutput').value;
  if (!destVal) return;
  document.getElementById('srcInput').value = destVal;
  if (currentMode === 'json2csv') setMode('csv2json');
  else if (currentMode === 'csv2json') setMode('json2csv');
  else convertData();
}

function copyDest() {
  const val = document.getElementById('destOutput').value;
  if (!val) return;
  navigator.clipboard.writeText(val).then(() => showToast('转换结果已复制到剪贴板'));
}

function downloadDest() {
  const val = document.getElementById('destOutput').value;
  if (!val) return;
  const ext = currentMode === 'json2csv' ? 'csv' : (currentMode === 'csv2json' ? 'json' : 'md');
  const type = currentMode === 'json2csv' ? 'text/csv' : (currentMode === 'csv2json' ? 'application/json' : 'text/markdown');
  const blob = new Blob([val], { type: type + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'converted_' + Date.now() + '.' + ext;
  a.click();
  showToast('已下载文件: .' + ext);
}

function handleFileUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('srcInput').value = ev.target.result;
    if (file.name.endsWith('.csv')) setMode('csv2json');
    else if (file.name.endsWith('.json')) setMode('json2csv');
    else convertData();
    showToast('已加载文件: ' + file.name);
  };
  reader.readAsText(file);
}

const SAMPLE_JSON = JSON.stringify([
  { "id": 101, "name": "张伟", "role": "架构师", "contact": { "city": "北京", "email": "zhang@0101.click" }, "isActive": true },
  { "id": 102, "name": "李娜", "role": "前端开发", "contact": { "city": "上海", "email": "li@0101.click" }, "isActive": true },
  { "id": 103, "name": "王强", "role": "运维工程师", "contact": { "city": "深圳", "email": "wang@0101.click" }, "isActive": false }
], null, 2);

function loadSampleData() {
  document.getElementById('srcInput').value = SAMPLE_JSON;
  if (currentMode !== 'json2csv' && currentMode !== 'json2md') setMode('json2csv');
  else convertData();
  showToast('已加载测试用户数据');
}

window.addEventListener('DOMContentLoaded', loadSampleData);
</script>

<script>
function initTheme(){
  const saved=localStorage.getItem('app_theme');
  if(saved){document.documentElement.setAttribute('data-theme',saved);}
  else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const target=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',target);
  localStorage.setItem('app_theme',target);
}
initTheme();
function showToast(msg, duration=2200){
  const el=document.createElement('div');
  el.textContent=msg;
  el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:9999px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 10px 25px rgba(0,0,0,.2);transition:opacity .3s;';
  document.body.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),300);},duration);
}
</script>
