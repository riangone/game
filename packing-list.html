<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<style>
:root{--bg-base:#f8fafc;--bg-surface:#fff;--bg-subtle:#f1f5f9;--border-color:#e2e8f0;--border-focus:#0284c7;--text-main:#0f172a;--text-muted:#64748b;--text-light:#94a3b8;--primary:#0284c7;--primary-hover:#0369a1;--primary-subtle:#e0f2fe;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--purple:#8b5cf6;--radius-sm:8px;--radius-md:14px;--radius-lg:20px;--radius-pill:9999px;--shadow-sm:0 1px 3px rgba(0,0,0,.05);--shadow-md:0 4px 6px -1px rgba(0,0,0,.06);--shadow-lg:0 10px 15px -3px rgba(0,0,0,.08);--font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;}
[data-theme="dark"]{--bg-base:#090d16;--bg-surface:#111827;--bg-subtle:#1f2937;--border-color:#374151;--border-focus:#38bdf8;--text-main:#f9fafb;--text-muted:#9ca3af;--text-light:#6b7280;--primary:#38bdf8;--primary-hover:#0ea5e9;--primary-subtle:rgba(56,189,248,.15);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--font-sans);background:var(--bg-base);color:var(--text-main);min-height:100vh;display:flex;flex-direction:column;}
header.app-header{background:var(--bg-surface);border-bottom:1px solid var(--border-color);position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;flex-wrap:wrap;}
.header-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.back-link{display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:var(--text-muted);font-size:13px;font-weight:600;padding:6px 10px;border-radius:var(--radius-sm);}
.back-link:hover{background:var(--primary-subtle);color:var(--primary);}
.app-brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;}
.tool-switch,.theme-btn{padding:7px 10px;border-radius:var(--radius-sm);border:1px solid var(--border-color);background:var(--bg-subtle);color:var(--text-main);font-size:13px;font-weight:600;cursor:pointer;}
.container{max-width:1050px;margin:0 auto;padding:24px 20px 48px;width:100%;flex:1;}
h1.page-title{font-size:22px;font-weight:800;margin-bottom:4px;}
p.page-sub{color:var(--text-muted);font-size:13px;margin-bottom:18px;}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.tab-btn{padding:8px 14px;border-radius:var(--radius-pill);border:1px solid var(--border-color);background:var(--bg-surface);color:var(--text-muted);font-size:13px;font-weight:700;cursor:pointer;transition:.2s;}
.tab-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.panel{display:none;background:var(--bg-surface);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm);}
.panel.active{display:block;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--radius-md);border:none;background:var(--primary);color:#fff;font-weight:700;font-size:13px;cursor:pointer;transition:.2s;}
.btn:hover{background:var(--primary-hover);}
.btn-subtle{background:var(--bg-subtle);color:var(--text-main);border:1px solid var(--border-color);}
.btn-subtle:hover{border-color:var(--primary);color:var(--primary);}
.btn-sm{padding:6px 12px;font-size:12px;}
input[type=text],input[type=number],textarea,select{width:100%;padding:10px 12px;border-radius:var(--radius-md);border:1px solid var(--border-color);background:var(--bg-subtle);color:var(--text-main);font-size:13px;outline:none;}
input:focus,textarea:focus,select:focus{border-color:var(--border-focus);}
label.field-label{font-size:12px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:6px;}
.stat-card{background:var(--bg-subtle);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:14px;text-align:center;}
.stat-card b{display:block;font-size:24px;color:var(--primary);font-weight:800;font-family:var(--font-mono);}
.stat-card span{font-size:12px;color:var(--text-muted);}
</style>
    <link rel="canonical" href="https://tool.0101.click/packing-list.html">
</head>
<style>
.preset-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.cat-block{background:var(--bg-subtle);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:16px;margin-bottom:16px;}
.cat-title{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;}
.check-item{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg-surface);border:1px solid var(--border-color);border-radius:var(--radius-md);cursor:pointer;font-size:13px;user-select:none;transition:.2s;}
.check-item.done{opacity:.5;text-decoration:line-through;background:var(--bg-subtle);}
.progress-bar-container{height:12px;background:var(--bg-subtle);border-radius:var(--radius-pill);overflow:hidden;border:1px solid var(--border-color);margin:14px 0;}
.progress-bar-fill{height:100%;background:var(--success);width:0%;transition:width .3s ease;}
</style>

<header class="app-header">
  <div class="header-left">
    <a href="tools.html" class="back-link">← 工具箱</a>
    <div class="app-brand"><span>🧳</span><span>旅行与出差行李清单</span></div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <select class="tool-switch" onchange="if(this.value) location.href=this.value;">
      <option value="">🔀 切换工具...</option>
      <option value="random-picker.html">🎯 随机抉择转盘</option>
      <option value="bmi-tracker.html">⚖️ BMI健康追踪</option>
      <option value="water-reminder.html">💧 喝水打卡提醒</option>
      <option value="packing-list.html">🧳 旅行行李清单</option>
      <option value="tip-calculator.html">🧾 账单AA计算器</option>
      <option value="tools.html">🏠 全部工具大厅</option>
    </select>
    <button class="theme-btn" onclick="toggleTheme()" title="切换明暗主题">🌓</button>
  </div>
</header>
<main class="container">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:12px;">
    <div>
      <h1 class="page-title">🧳 旅行与出差行李清单</h1>
      <p class="page-sub">出发前打勾自查，告别落东西！多场景出行预设、分类清单与打包进度追踪。</p>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-subtle" onclick="resetChecks()">🔄 一键重置勾选</button>
      <button class="btn" onclick="window.print()">🖨️ 打印清单</button>
    </div>
  </div>

  <div class="preset-bar">
    <button class="btn btn-subtle btn-sm active" onclick="loadPreset('business')">🚅 短途商务出差 (1-3天)</button>
    <button class="btn btn-subtle btn-sm" onclick="loadPreset('vacation')">✈️ 休闲长途度假 (4-7天)</button>
    <button class="btn btn-subtle btn-sm" onclick="loadPreset('outdoor')">🏕️ 户外露营徒步</button>
  </div>

  <div class="panel active" style="padding:16px;margin-bottom:18px;">
    <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;">
      <span>打包进度</span>
      <span id="packStat">0 / 0 已完成 (0%)</span>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
  </div>

  <div id="categoryContainer"></div>
</main>

<script>
const PRESETS = {
  business: {
    '📄 证件与财务': ['身份证 / 护照', '公司工牌 / 名片', '现金 / 银行卡', '交通票据 / 行程单'],
    '🔌 电子数码': ['笔记本电脑 & 充电器', '手机 & 充电线', '充电宝 (小于 20000mAh)', '降噪耳机', '转接头 / 拓展坞'],
    '👔 衣物穿搭': ['换洗正装 / 衬衫 2 套', '贴身内衣裤 3 套', '商务皮鞋 / 舒适平底鞋', '便携雨伞 / 外套'],
    '🧴 洗漱个护': ['牙刷牙膏旅行装', '洗发沐浴小样', '剃须刀', '便携纸巾 / 湿巾', '日常备用药品 (肠胃/感冒)']
  },
  vacation: {
    '📄 证件与重要资料': ['身份证 / 护照', '驾驶证 (租车)', '酒店确认单', '紧急联系人卡片'],
    '🔌 电子设备': ['单反相机 / 存储卡', '无人机 & 备用电池', '自拍杆 / 三脚架', '多口快充头 & 数据线'],
    '👕 度假穿搭': ['换洗衣物 5 套', '防晒衣 / 遮阳帽', '墨镜', '泳衣 / 拖鞋', '轻便双肩包'],
    '🧴 防晒与应急': ['高倍防晒霜', '驱蚊水 / 止痒膏', '创可贴 / 晕车药', '免洗洗手液', '折叠烧水壶']
  },
  outdoor: {
    '🏕️ 露营装备': ['双人帐篷 & 地席', '睡袋 & 充气防潮垫', '户外露营灯 / 头灯', '折叠桌椅', '卡式炉 & 气罐'],
    '🔌 户外电源': ['大容量户外电源', '备用手电筒 & 电池', '对讲机', '卫星定位/指南针'],
    '🧗 户外服饰': ['冲锋衣 / 冲锋裤', '专业中高帮登山鞋', '速干排汗打底衣', '抓绒保暖层', '防风手套'],
    '💊 急救物资': ['止血带 / 医用纱布', '碘伏棉棒', '净水片 / 保温水壶', '多功能军刀', '高热量压缩饼干/能量胶']
  }
};

let currentPresetKey = 'business';
let checklistData = {};

function loadPreset(key) {
  currentPresetKey = key;
  document.querySelectorAll('.preset-bar button').forEach(b => b.classList.toggle('active', b.textContent.includes(key === 'business' ? '出差' : (key === 'vacation' ? '度假' : '户外'))));
  checklistData = JSON.parse(JSON.stringify(PRESETS[key]));
  renderCategories();
}

function renderCategories() {
  const container = document.getElementById('categoryContainer');
  container.innerHTML = '';

  const savedStates = JSON.parse(localStorage.getItem('pack_checks_' + currentPresetKey) || '{}');

  for (const cat in checklistData) {
    const block = document.createElement('div');
    block.className = 'cat-block';

    const title = document.createElement('div');
    title.className = 'cat-title';
    title.innerHTML = '<span>' + cat + '</span><small style="font-size:12px;color:var(--text-muted);">' + checklistData[cat].length + ' 件物品</small>';
    block.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'item-grid';

    checklistData[cat].forEach(item => {
      const isDone = !!savedStates[item];
      const div = document.createElement('div');
      div.className = 'check-item' + (isDone ? ' done' : '');
      div.innerHTML = '<span>' + (isDone ? '☑' : '☐') + '</span><span>' + item + '</span>';
      div.onclick = () => toggleItem(item, div);
      grid.appendChild(div);
    });

    block.appendChild(grid);
    container.appendChild(block);
  }
  updateStats();
}

function toggleItem(item, el) {
  const savedStates = JSON.parse(localStorage.getItem('pack_checks_' + currentPresetKey) || '{}');
  savedStates[item] = !savedStates[item];
  localStorage.setItem('pack_checks_' + currentPresetKey, JSON.stringify(savedStates));
  el.classList.toggle('done', savedStates[item]);
  el.querySelector('span').textContent = savedStates[item] ? '☑' : '☐';
  updateStats();
}

function updateStats() {
  const savedStates = JSON.parse(localStorage.getItem('pack_checks_' + currentPresetKey) || '{}');
  let total = 0;
  let done = 0;
  for (const cat in checklistData) {
    checklistData[cat].forEach(item => {
      total++;
      if (savedStates[item]) done++;
    });
  }
  const pct = total === 0 ? 0 : Math.round((done / total) * 100);
  document.getElementById('packStat').textContent = done + ' / ' + total + ' 已打包 (' + pct + '%)';
  document.getElementById('progressFill').style.width = pct + '%';
}

function resetChecks() {
  if (confirm('确认将所有勾选状态清空重置吗？')) {
    localStorage.removeItem('pack_checks_' + currentPresetKey);
    renderCategories();
    showToast('已重置勾选状态');
  }
}

window.addEventListener('DOMContentLoaded', () => loadPreset('business'));
</script>

<script>
function initTheme(){
  const saved=localStorage.getItem('app_theme');
  if(saved){document.documentElement.setAttribute('data-theme',saved);}
  else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const target=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',target);
  localStorage.setItem('app_theme',target);
}
initTheme();
function showToast(msg, duration=2200){
  const el=document.createElement('div');
  el.textContent=msg;
  el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:9999px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 10px 25px rgba(0,0,0,.2);transition:opacity .3s;';
  document.body.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),300);},duration);
}
</script>
