    <button class="btn btn-subtle btn-sm" onclick="setPreset('0 0 * * *')">每天午夜 00:00</button>
    <button class="btn btn-subtle btn-sm" onclick="setPreset('30 9 * * 1-5')">工作日 09:30</button>
    <button class="btn btn-subtle btn-sm" onclick="setPreset('0 2 * * 0')">每周日凌晨 02:00</button>
    <button class="btn btn-subtle btn-sm" onclick="setPreset('0 0 1 * *')">每月 1 日午夜</button>

<script>
function setPreset(val) {
  document.getElementById('cronInput').value = val;
  parseCron();
}

function parsePart(part, name, min, max) {
  if (part === '*') return '每' + name;
  if (part.includes('/')) {
    const [, step] = part.split('/');
    return '每隔 ' + step + ' ' + name;
  }
  if (part.includes('-')) {
    const [start, end] = part.split('-');
    return '在第 ' + start + ' 到 ' + end + ' ' + name;
  }
  if (part.includes(',')) {
    return '在第 ' + part + ' ' + name;
  }
  return '第 ' + part + ' ' + name;
}

function explainCronExpression(expr) {
  const parts = expr.trim().split(/\s+/);
  if (parts.length < 5 || parts.length > 6) return '无效的 Cron 表达式格式（应为 5 段或 6 段，空格分隔）';
  
  let sec = parts.length === 6 ? parts[0] : null;
  let min = parts.length === 6 ? parts[1] : parts[0];
  let hour = parts[2 - (parts.length === 6 ? 0 : 1)];
  let day = parts[3 - (parts.length === 6 ? 0 : 1)];
  let month = parts[4 - (parts.length === 6 ? 0 : 1)];
  let week = parts[5 - (parts.length === 6 ? 0 : 1)];

  let desc = '';
  // Month
  if (month !== '*') desc += parsePart(month, '月', 1, 12) + '，';
  // Week & Day
  if (week !== '*') {
    const weekMap = { '0':'周日','1':'周一','2':'周二','3':'周三','4':'周四','5':'周五','6':'周六','7':'周日' };
    let weekDesc = week;
    for (const k in weekMap) weekDesc = weekDesc.replace(new RegExp(k, 'g'), weekMap[k]);
    desc += weekDesc + '，';
  }
  if (day !== '*') desc += parsePart(day, '日', 1, 31) + '，';

  // Hour & Min
  if (hour.includes('-')) desc += '在 ' + hour + ' 点之间，';
  else if (hour !== '*') desc += hour + ' 点，';
  else desc += '每小时，';

  if (min.includes('/')) desc += '每隔 ' + min.split('/')[1] + ' 分钟';
  else if (min === '*') desc += '每分钟';
  else desc += min + ' 分';

  if (sec && sec !== '0') desc += ' ' + sec + ' 秒';
  desc += ' 执行';
  return desc;
}

function matchCronField(val, fieldExpr, min, max) {
  if (fieldExpr === '*') return true;
  if (fieldExpr.includes('/')) {
    const [base, stepStr] = fieldExpr.split('/');
    const step = parseInt(stepStr, 10);
    const start = base === '*' ? min : parseInt(base, 10);
    return (val >= start) && ((val - start) % step === 0);
  }
  if (fieldExpr.includes('-')) {
    const [start, end] = fieldExpr.split('-').map(Number);
    return val >= start && val <= end;
  }
  if (fieldExpr.includes(',')) {
    return fieldExpr.split(',').map(Number).includes(val);
  }
  return parseInt(fieldExpr, 10) === val;
}

function calculateNextRuns(expr, count = 10) {
  const parts = expr.trim().split(/\s+/);
  if (parts.length < 5 || parts.length > 6) return [];
  const is6 = parts.length === 6;
  const secP = is6 ? parts[0] : '0';
  const minP = is6 ? parts[1] : parts[0];
  const hourP = is6 ? parts[2] : parts[1];
  const dayP = is6 ? parts[3] : parts[2];
  const monP = is6 ? parts[4] : parts[3];
  const weekP = is6 ? parts[5] : parts[4];

  const results = [];
  let cur = new Date();
  cur.setMilliseconds(0);
  cur.setSeconds(cur.getSeconds() + 1);

  let iterations = 0;
  while (results.length < count && iterations < 50000) {
    iterations++;
    const s = cur.getSeconds();
    const m = cur.getMinutes();
    const h = cur.getHours();
    const d = cur.getDate();
    const mon = cur.getMonth() + 1;
    const w = cur.getDay();

    if (matchCronField(mon, monP, 1, 12) &&
        matchCronField(d, dayP, 1, 31) &&
        matchCronField(w, weekP, 0, 6) &&
        matchCronField(h, hourP, 0, 23) &&
        matchCronField(m, minP, 0, 59) &&
        matchCronField(s, secP, 0, 59)) {
      results.push(new Date(cur));
    }
    cur.setSeconds(cur.getSeconds() + (is6 ? 1 : 60));
    if (!is6) cur.setSeconds(0);
  }
  return results;
}

function parseCron() {
  const expr = document.getElementById('cronInput').value.trim();
  const exp = explainCronExpression(expr);
  document.getElementById('explainText').textContent = exp;

  const list = document.getElementById('timeList');
  list.innerHTML = '';
  const runs = calculateNextRuns(expr, 10);
  if (runs.length === 0) {
    list.innerHTML = '<li style="color:var(--text-muted);font-size:13px;">无法计算下一次执行时间，请检查表达式语法。</li>';
    return;
  }

  runs.forEach((r, idx) => {
    const pad = n => String(n).padStart(2, '0');
    const timeStr = r.getFullYear() + '-' + pad(r.getMonth() + 1) + '-' + pad(r.getDate()) + ' ' + pad(r.getHours()) + ':' + pad(r.getMinutes()) + ':' + pad(r.getSeconds());
    const li = document.createElement('li');
    li.className = 'time-item';
    li.innerHTML = '<span>#' + (idx + 1) + '</span><b>' + timeStr + '</b>';
    list.appendChild(li);
  });
}

function copyCron() {
  const val = document.getElementById('cronInput').value;
  navigator.clipboard.writeText(val).then(() => showToast('Cron 表达式已复制: ' + val));
}

window.addEventListener('DOMContentLoaded', parseCron);
</script>

<script>
function initTheme(){
  const saved=localStorage.getItem('app_theme');
  if(saved){document.documentElement.setAttribute('data-theme',saved);}
  else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const target=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',target);
  localStorage.setItem('app_theme',target);
}
initTheme();
function showToast(msg, duration=2200){
  const el=document.createElement('div');
  el.textContent=msg;
  el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:9999px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 10px 25px rgba(0,0,0,.2);transition:opacity .3s;';
  document.body.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),300);},duration);
}
</script>
