<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ピンイン・リズムランナー - 萌趣拼音跑酷 (Pinyin Rhythm Dash)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #10B981;
    --primary-hover: #059669;
    --secondary: #F59E0B;
    --accent-pink: #FF5E8E;
    --accent-cyan: #06B6D4;
    --accent-purple: #8B5CF6;
    --bg-dark: #0f172a;
    --text-main: #1e293b;
    --text-light: #f8fafc;
    --radius-lg: 20px;
    --radius-md: 14px;
    --shadow-pop: 0 8px 0 rgba(0, 0, 0, 0.15);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #090D16;
    font-family: "M PLUS Rounded 1c", "Outfit", system-ui, sans-serif;
    color: var(--text-light);
    touch-action: none;
  }

  #gameCanvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 1;
  }

  /* HUD Top Bar */
  #hud {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 12px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
    pointer-events: none;
  }

  .hud-pill {
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 2px solid rgba(255, 255, 255, 0.15);
    border-radius: 999px;
    padding: 6px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    font-weight: 800;
    pointer-events: auto;
  }

  .hud-btn {
    cursor: pointer;
    border: none;
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: transform 0.15s, background 0.15s;
  }
  .hud-btn:hover { background: rgba(255, 255, 255, 0.25); transform: scale(1.06); }
  .hud-btn:active { transform: scale(0.94); }

  /* Current Audio Target Banner (Center Top) */
  #targetBanner {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    background: linear-gradient(135deg, #10B981, #059669);
    border: 3px solid #6EE7B7;
    border-radius: 28px;
    padding: 6px 20px 6px 12px;
    box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4), var(--shadow-pop);
    z-index: 10;
    pointer-events: auto;
    cursor: pointer;
    animation: bounceTarget 2s infinite ease-in-out;
  }
  @keyframes bounceTarget {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-3px); }
  }
  @keyframes bannerPop {
    0% { transform: translateX(-50%) scale(0.92); }
    50% { transform: translateX(-50%) scale(1.1); }
    100% { transform: translateX(-50%) scale(1); }
  }
  #targetBanner.pulse-accent {
    animation: bannerPop 0.4s ease-out;
  }

  .target-speaker {
    font-size: 26px;
    margin-right: 8px;
    animation: speakerPulse 1.2s infinite;
  }
  @keyframes speakerPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.18); }
  }

  .target-info {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .target-label {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: #D1FAE5;
    text-transform: uppercase;
  }
  .target-glyph-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .target-glyph {
    font-size: 26px;
    font-weight: 900;
    color: #FFFFFF;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    line-height: 1.1;
  }
  .target-kana {
    font-size: 13px;
    font-weight: 800;
    color: #FEF08A;
    background: rgba(0, 0, 0, 0.25);
    padding: 1px 6px;
    border-radius: 8px;
  }

  /* Combo Indicator */
  #comboIndicator {
    position: fixed;
    top: 114px;
    left: 50%;
    transform: translateX(-50%) scale(0.8);
    font-size: 22px;
    font-weight: 900;
    color: #FBBF24;
    text-shadow: 0 0 12px rgba(245, 158, 11, 0.8), 0 3px 0 #92400E;
    letter-spacing: 1px;
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #comboIndicator.show {
    opacity: 1;
    transform: translateX(-50%) scale(1.1);
  }

  /* Bottom Controls Dock for Touch & Ergonomic Play */
  #laneTouchControls {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 84px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0 16px 10px 16px;
    background: linear-gradient(to top, rgba(10, 15, 29, 0.95) 0%, rgba(10, 15, 29, 0.7) 65%, rgba(10, 15, 29, 0) 100%);
    z-index: 10;
    pointer-events: none;
  }

  .lane-controls-dock {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    width: 94%;
    max-width: 480px;
    pointer-events: auto;
  }

  .lane-btn {
    flex: 1;
    background: rgba(30, 41, 59, 0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 16px;
    padding: 8px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #F8FAFC;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .lane-btn:active {
    transform: scale(0.95);
  }
  .lane-btn span.lane-num {
    font-size: 11px;
    opacity: 0.8;
  }
  .lane-btn span.lane-arrow {
    font-size: 18px;
    font-weight: 900;
    margin-top: 1px;
  }

  /* Active Lane Glowing States synced with Player */
  .lane-btn.lane-0.active {
    background: rgba(16, 185, 129, 0.35);
    border-color: #10B981;
    box-shadow: 0 0 16px rgba(16, 185, 129, 0.6), inset 0 0 8px rgba(16, 185, 129, 0.25);
    color: #A7F3D0;
    transform: translateY(-2px);
  }
  .lane-btn.lane-1.active {
    background: rgba(245, 158, 11, 0.35);
    border-color: #F59E0B;
    box-shadow: 0 0 16px rgba(245, 158, 11, 0.6), inset 0 0 8px rgba(245, 158, 11, 0.25);
    color: #FDE68A;
    transform: translateY(-2px);
  }
  .lane-btn.lane-2.active {
    background: rgba(139, 92, 246, 0.35);
    border-color: #8B5CF6;
    box-shadow: 0 0 16px rgba(139, 92, 246, 0.6), inset 0 0 8px rgba(139, 92, 246, 0.25);
    color: #DDD6FE;
    transform: translateY(-2px);
  }

  /* Overlay Panels (Menu, Stage Select, Clear) */
  .overlay-screen {
    position: fixed;
    inset: 0;
    background: rgba(10, 15, 29, 0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .overlay-screen.active {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-card {
    background: #FFFFFF;
    color: var(--text-main);
    width: 92%;
    max-width: 440px;
    border-radius: 28px;
    padding: 26px 22px;
    text-align: center;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 8px 0 #CBD5E1;
    position: relative;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal-mascot {
    font-size: 54px;
    margin-bottom: 4px;
    display: inline-block;
    animation: mascotWave 2.5s infinite ease-in-out;
  }
  @keyframes mascotWave {
    0%, 100% { transform: rotate(0deg); }
    20% { transform: rotate(-8deg) scale(1.05); }
    40% { transform: rotate(8deg) scale(1.05); }
    60% { transform: rotate(0deg); }
  }

  .modal-title {
    font-size: 24px;
    font-weight: 900;
    color: #0F172A;
    margin-bottom: 6px;
  }
  .modal-subtitle {
    font-size: 13px;
    font-weight: 700;
    color: #64748B;
    margin-bottom: 18px;
    line-height: 1.5;
  }

  /* Stage Grid */
  .stage-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    margin-bottom: 20px;
    text-align: left;
  }

  .stage-card {
    background: #F8FAFC;
    border: 2px solid #E2E8F0;
    border-radius: 18px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .stage-card:hover {
    border-color: #10B981;
    background: #ECFDF5;
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(16, 185, 129, 0.15);
  }
  .stage-card:active {
    transform: translateY(1px);
  }
  .stage-info h4 {
    font-size: 15px;
    font-weight: 800;
    color: #1E293B;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stage-info p {
    font-size: 11px;
    color: #64748B;
    margin-top: 3px;
    font-weight: 600;
  }
  .stage-badge {
    background: #FEF3C7;
    color: #D97706;
    font-size: 11px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 8px;
    white-space: nowrap;
  }

  .btn-action {
    background: linear-gradient(135deg, #10B981, #059669);
    border: none;
    color: #fff;
    font-size: 17px;
    font-weight: 900;
    padding: 14px 28px;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 6px 0 #047857, 0 10px 20px rgba(16, 185, 129, 0.4);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn-action:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 0 #047857, 0 14px 24px rgba(16, 185, 129, 0.5);
  }
  .btn-action:active {
    transform: translateY(3px);
    box-shadow: 0 3px 0 #047857;
  }

  .btn-secondary {
    background: #F1F5F9;
    color: #475569;
    box-shadow: 0 5px 0 #CBD5E1;
    margin-top: 10px;
  }
  .btn-secondary:hover {
    background: #E2E8F0;
    box-shadow: 0 7px 0 #94A3B8;
  }
  .btn-secondary:active {
    box-shadow: 0 2px 0 #94A3B8;
  }

  /* Result Stats in Clear Modal */
  .result-stars {
    font-size: 40px;
    letter-spacing: 6px;
    margin: 8px 0 16px;
  }
  .stats-row {
    display: flex;
    justify-content: space-around;
    background: #F8FAFC;
    border-radius: 16px;
    padding: 12px;
    margin-bottom: 20px;
    border: 1px solid #E2E8F0;
  }
  .stat-item {
    display: flex;
    flex-direction: column;
  }
  .stat-item .val {
    font-size: 22px;
    font-weight: 900;
    color: #10B981;
  }
  .stat-item .lbl {
    font-size: 11px;
    font-weight: 700;
    color: #64748B;
  }

  /* Pediatric / Japanese Helper Tip Bubble (Layered cleanly below Target Banner) */
  #pedagogyTip {
    position: fixed;
    top: 72px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1.5px solid rgba(251, 191, 36, 0.8);
    border-radius: 16px;
    padding: 5px 16px;
    color: #FEF3C7;
    font-size: 12px;
    font-weight: 800;
    z-index: 10;
    pointer-events: none;
    max-width: 90%;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.35);
    transition: opacity 0.3s, transform 0.2s;
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- Top HUD -->
<div id="hud">
  <div class="hud-pill">
    <span>⭐</span>
    <span id="scoreText">0</span>
  </div>

  <div class="hud-pill" style="gap: 6px;">
    <button class="hud-btn" id="speedToggleBtn" title="スピード切替 (ゆっくり/ふつう)">🐢</button>
    <button class="hud-btn" id="soundToggleBtn" title="音声切替">🔊</button>
    <button class="hud-btn" id="menuBtn" title="メニュー">⏸️</button>
    <a class="hud-btn" href="index.html" title="ゲームセンターに戻る" style="text-decoration: none; display: flex; align-items: center; justify-content: center;">🏠</a>
  </div>
</div>

<!-- Center Pronunciation Prompt (Target) -->
<div id="targetBanner" onclick="GameApp.repeatTargetSound()">
  <span class="target-speaker">🔊</span>
  <div class="target-info">
    <span class="target-label">めざすピンイン (タップで再生)</span>
    <div class="target-glyph-row">
      <span class="target-glyph" id="bannerGlyph">a</span>
      <span class="target-kana" id="bannerKana">アー</span>
    </div>
  </div>
</div>

<!-- Combo Floating Popup -->
<div id="comboIndicator">🔥 3 COMBO!</div>

<!-- Pedagogical Tip Bar -->
<div id="pedagogyTip">🐼 口を大きく開けて「あー」と叫ぼう！</div>

<!-- Bottom Mobile Touch Controls (3 Lanes) -->
<div id="laneTouchControls">
  <div class="lane-controls-dock">
    <button class="lane-btn lane-0" id="laneBtn0" onclick="GameApp.setPlayerLane(0)" aria-label="レーン1 左">
      <span class="lane-num">レーン 1 (左)</span>
      <span class="lane-arrow">◀ A</span>
    </button>
    <button class="lane-btn lane-1 active" id="laneBtn1" onclick="GameApp.setPlayerLane(1)" aria-label="レーン2 中">
      <span class="lane-num">レーン 2 (中)</span>
      <span class="lane-arrow">▲ S</span>
    </button>
    <button class="lane-btn lane-2" id="laneBtn2" onclick="GameApp.setPlayerLane(2)" aria-label="レーン3 右">
      <span class="lane-num">レーン 3 (右)</span>
      <span class="lane-arrow">▶ D</span>
    </button>
  </div>
</div>

<!-- START & STAGE SELECT SCREEN -->
<div class="overlay-screen active" id="stageSelectScreen">
  <div class="modal-card">
    <div class="modal-mascot">🐼💨</div>
    <h2 class="modal-title">ピンイン・リズムランナー</h2>
    <p class="modal-subtitle">かわいいパンダの「パオパオ」と一緒に<br>リズムに乗って正しいピンインを集めよう！</p>

    <div class="stage-grid" id="stageListContainer">
      <!-- Injected by JS -->
    </div>

    <div style="display: flex; gap: 10px;">
      <button class="btn-action" style="flex: 1;" onclick="GameApp.startSelectedStage()">
        <span>🚀</span> ゲームスタート！
      </button>
      <a href="index.html" class="btn-action btn-secondary" style="flex: 0 0 auto; text-decoration: none; display: flex; align-items: center; justify-content: center; padding: 0 16px;" title="ゲームセンターに戻る">
        <span>🏠</span>
      </a>
    </div>
  </div>
</div>

<!-- STAGE CLEAR MODAL -->
<div class="overlay-screen" id="stageClearScreen">
  <div class="modal-card">
    <div class="modal-mascot">🎉🐼🎊</div>
    <h2 class="modal-title" id="clearTitle">ステージクリア！</h2>
    <p class="modal-subtitle" id="clearDesc">よくがんばったね！ピンイン名人だ！</p>
    
    <div class="result-stars" id="clearStars">⭐⭐⭐</div>

    <div class="stats-row">
      <div class="stat-item">
        <span class="val" id="finalScoreVal">0</span>
        <span class="lbl">スコア</span>
      </div>
      <div class="stat-item">
        <span class="val" id="maxComboVal">0</span>
        <span class="lbl">最大コンボ</span>
      </div>
      <div class="stat-item">
        <span class="val" id="accuracyVal">100%</span>
        <span class="lbl">せいかい率</span>
      </div>
    </div>

    <button class="btn-action" onclick="GameApp.nextStage()">
      <span>⏩</span> 次のステージへ！
    </button>
    <div style="display: flex; gap: 10px; margin-top: 10px;">
      <button class="btn-action btn-secondary" style="flex: 1;" onclick="GameApp.openStageSelect()">
        <span>📋</span> ステージいちらん
      </button>
      <a href="index.html" class="btn-action btn-secondary" style="flex: 0 0 auto; text-decoration: none; display: flex; align-items: center; justify-content: center; padding: 0 16px;" title="ゲームセンターに戻る">
        <span>🏠</span>
      </a>
    </div>
  </div>
</div>

<script>
/**
 * 拼音冲冲冲 - ピンイン・リズムランナー (Pinyin Rhythm Dash)
 * 专为日本儿童设计的拼音节奏跑酷游戏
 * 
 * 架构核心：
 * 1. AudioSubsystem: Web Audio API Master Clock + Project MP3 (`audio/zh/*.mp3`) + Web Speech API
 * 2. PedagogicalEngine: 日本儿童痛点知识库（单母音、そり舌音、破裂有气音、四声过山车）
 * 3. RunnerEngine: 2.5D Canvas 视差与透视三轨道系统，带弹性缓动
 * 4. Fail-Safe DDA: 零死亡负挫败设计，自适应速度与辅助脚手架
 */

// ==========================================
// 1. PEDAGOGICAL CURRICULUM FOR JAPANESE KIDS
// ==========================================
const CURRICULUM_STAGES = [
  {
    id: 'vowels',
    title: '1. 単母音の森',
    desc: '基本の6つの母音（a, o, e, i, u, ü）',
    badge: 'かんたん',
    tip: '口の形に注目！特に「ü」は口笛の形、「e」は喉の奥から！',
    items: [
      { glyph: 'a', kana: 'アー', audio: 'a', tip: '口を大きく開けて「あー」' },
      { glyph: 'o', kana: 'オー', audio: 'o', tip: '唇を丸く前に突き出して「おー」' },
      { glyph: 'e', kana: 'エ(奥)', audio: 'e', tip: '口を半開き、喉の奥から発音！' },
      { glyph: 'i', kana: 'イー', audio: 'i', tip: '口を横に引いて「いー」' },
      { glyph: 'u', kana: 'ウー', audio: 'u', tip: '唇をすぼめて突き出す「うー」' },
      { glyph: 'ü', kana: 'ユ(口笛)', audio: 'ü', tip: '「い」の口のまま唇を丸めて口笛の形！' }
    ]
  },
  {
    id: 'retroflex',
    title: '2. そり舌音の谷',
    desc: '日本人が最も苦手な「巻き舌 vs 平舌」（zh/z, ch/c, sh/s）',
    badge: '超重要！',
    tip: 'zh/ch/shは舌先を上にスプーンのように巻き上げるよ！',
    items: [
      { glyph: 'zh', kana: 'ヂー(巻)', audio: 'zh', tip: '舌先を上あごに巻いて当てる（巻き舌）' },
      { glyph: 'z', kana: 'ズー(平)', audio: 'z', tip: '舌先を平らに前歯の裏につける（平舌）' },
      { glyph: 'ch', kana: 'チー(巻)', audio: 'ch', tip: '巻き舌で強い息を一気に吐き出す！' },
      { glyph: 'c', kana: 'ツー(平)', audio: 'c', tip: '平らな舌のまま息を強くプッと吹く！' },
      { glyph: 'sh', kana: 'シー(巻)', audio: 'sh', tip: '舌を巻いたまま隙間から息を出す' },
      { glyph: 's', kana: 'スー(平)', audio: 's', tip: '前歯の隙間から「スッ」と息を通す' }
    ]
  },
  {
    id: 'aspirated',
    title: '3. 息の爆発レース',
    desc: '有気音（息を強く吹く） vs 無気音（b/p, d/t, g/k）',
    badge: 'コツをつかもう',
    tip: 'p/t/kはティッシュが激しく揺れるくらい息を吹き出そう！',
    items: [
      { glyph: 'b', kana: 'ボー(無気)', audio: 'b', tip: '唇を閉じて息を破裂させる（息控えめ）' },
      { glyph: 'p', kana: 'ポー(有気)', audio: 'p', tip: '強い息を一気にポンッと吹き出す！' },

// ==========================================
// 2. AUDIO SUBSYSTEM (Web Audio + MP3 + TTS)
// ==========================================
class AudioSubsystem {
  constructor() {
    this.audioCtx = null;
    this.soundEnabled = true;
    this.currentAudio = null;
    this.bgmPlaying = false;
    this.bgmGain = null;
    this.nextBeatTime = 0;
    this.bpm = 95;
    this.step = 0;
  }

  init() {
    if (!this.audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      this.audioCtx = new AudioContextClass();
    }
    if (this.audioCtx.state === 'suspended') {
      this.audioCtx.resume();
    }
    this.startBgmLoop();
  }

  playPinyinAudio(audioKey, fallbackGlyph) {
    if (!this.soundEnabled) return;
    this.init();

    // 1. Try real human studio MP3 from audio/zh/
    if (this.currentAudio) {
      try {
        this.currentAudio.pause();
        this.currentAudio.currentTime = 0;
      } catch(e) {}
    }

    const sound = new Audio('audio/zh/' + encodeURIComponent(audioKey) + '.mp3');
    this.currentAudio = sound;
    let played = false;
    sound.onplay = () => { played = true; };
    sound.play().then(() => {
      // Succeeded
    }).catch(() => {
      if (!played) this.fallbackTTS(audioKey || fallbackGlyph);
    });
    sound.onerror = () => {
      if (!played) this.fallbackTTS(audioKey || fallbackGlyph);
    };
  }

  fallbackTTS(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-CN';
      u.rate = 0.85;
      window.speechSynthesis.speak(u);
    }
  }

  // Synthesized Sound Effects (Instant & Juicy)
  playHitSound(perfect = true) {
    if (!this.soundEnabled || !this.audioCtx) return;
    const now = this.audioCtx.currentTime;
    const osc = this.audioCtx.createOscillator();
    const gain = this.audioCtx.createGain();
    osc.connect(gain);
    gain.connect(this.audioCtx.destination);

    if (perfect) {
      // Arpeggio chime
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, now); // C5
      osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
      osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
      osc.frequency.setValueAtTime(1046.50, now + 0.24); // C6
      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
      osc.start(now);
      osc.stop(now + 0.45);
    } else {
      // Soft gentle bump (Fail-safe, no jarring buzzer!)
      osc.type = 'sine';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(140, now + 0.18);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc.start(now);
      osc.stop(now + 0.2);
    }
  }

  playSwitchLane() {
    if (!this.soundEnabled || !this.audioCtx) return;
    const now = this.audioCtx.currentTime;
    const osc = this.audioCtx.createOscillator();
    const gain = this.audioCtx.createGain();
    osc.connect(gain);
    gain.connect(this.audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, now);
    osc.frequency.exponentialRampToValueAtTime(600, now + 0.06);
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
    osc.start(now);
    osc.stop(now + 0.07);
  }

  // Kid-friendly dynamic Procedural BGM Drum/Synth loop
  startBgmLoop() {
    if (this.bgmPlaying) return;
    this.bgmPlaying = true;
    this.nextBeatTime = this.audioCtx.currentTime + 0.1;
    this.scheduleBgmBeats();
  }

  scheduleBgmBeats() {
    if (!this.bgmPlaying || !this.audioCtx) return;
    const secondsPerBeat = 60.0 / this.bpm;
    while (this.nextBeatTime < this.audioCtx.currentTime + 0.3) {
      if (this.soundEnabled) {
        this.playBeatSynth(this.nextBeatTime, this.step);
      }
      this.nextBeatTime += secondsPerBeat / 2; // 8th notes
      this.step = (this.step + 1) % 16;
    }
    setTimeout(() => this.scheduleBgmBeats(), 100);
  }

  playBeatSynth(time, step) {
    // Soft kick on beat 0, 4, 8, 12
    if (step % 4 === 0) {
      const osc = this.audioCtx.createOscillator();
      const gain = this.audioCtx.createGain();
      osc.connect(gain);
      gain.connect(this.audioCtx.destination);
      osc.frequency.setValueAtTime(110, time);
      osc.frequency.exponentialRampToValueAtTime(40, time + 0.08);
      gain.gain.setValueAtTime(0.12, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
      osc.start(time);
      osc.stop(time + 0.1);
    }
    // High hat tick on off-beats
    if (step % 2 === 1) {
      const osc = this.audioCtx.createOscillator();
      const gain = this.audioCtx.createGain();
      osc.type = 'highpass';
      osc.frequency.setValueAtTime(8000, time);
      gain.gain.setValueAtTime(0.02, time);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.03);
      osc.connect(gain);
      gain.connect(this.audioCtx.destination);
      osc.start(time);
      osc.stop(time + 0.03);
    }
  }

  toggleSound() {
    this.soundEnabled = !this.soundEnabled;
    return this.soundEnabled;
  }
}

// ==========================================
// 3. GAMEPLAY & RUNNER ENGINE
// ==========================================
class RunnerEngine {
  constructor(canvas, audio) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.audio = audio;

    this.currentStage = CURRICULUM_STAGES[0];
    this.targetItem = null;
    this.optionsInPlay = [];

    // Player State (3 Lanes: 0=Left, 1=Center, 2=Right)
    this.playerLane = 1;
    this.targetLane = 1;
    this.playerZ = 120; // Positioned comfortably in playable track, safely above bottom controls
    this.bottomBarHeight = 88;
    this.playerX = 1; // smoothly interpolated
    this.playerY = 0; // jump offset
    this.jumpVel = 0;
    this.isJumping = false;
    this.stumbleTimer = 0;

    // Track & Horizon Math
    this.speed = 1.0;
    this.targetSpeed = 1.0;
    this.speedMultiplier = 0.75; // Default to gentle slow mode for kids (0.75x)
    this.speedSetting = 'slow';
    this.distance = 0;
    this.score = 0;
    this.combo = 0;
    this.maxCombo = 0;
    this.correctCount = 0;
    this.totalEncounters = 0;
    this.targetGoal = 10; // 10 correct hits to clear stage

    // Collectibles & Waves
    this.gates = [];
    this.particles = [];
    this.waveState = 'idle'; // 'approaching' | 'wave_pause'
    this.wavePauseTimer = 0;

    this.isRunning = false;
    this.isPaused = false;
    this.feverActive = false;

    this.initEvents();
    this.resize();
  }

  initEvents() {
    window.addEventListener('resize', () => this.resize());
    window.addEventListener('keydown', (e) => {
      if (!this.isRunning || this.isPaused) return;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        this.shiftLane(-1);
      } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        this.shiftLane(1);
      } else if (e.key === '1') {
        this.setLane(0);
      } else if (e.key === '2') {
        this.setLane(1);
      } else if (e.key === '3') {
        this.setLane(2);
      } else if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') {
        this.jump();
      }
    });

    // Touch Swipe Detection on Canvas
    let touchStartX = 0;
    let touchStartY = 0;
    this.canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    this.canvas.addEventListener('touchend', (e) => {
      if (!this.isRunning || this.isPaused) return;
      if (e.changedTouches.length > 0) {
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(dx) > 35) {
          if (dx < 0) this.shiftLane(-1);
          else this.shiftLane(1);
        } else if (dy < -35) {
          this.jump();
        } else {
          // Tap on third of screen
          const rect = this.canvas.getBoundingClientRect();
          const clickX = touchStartX - rect.left;
          const w = rect.width;
          if (clickX < w * 0.33) this.setLane(0);
          else if (clickX > w * 0.66) this.setLane(2);
          else this.setLane(1);
        }
      }
    }, { passive: true });
  }

  resize() {
    this.width = this.canvas.width = window.innerWidth;
    this.height = this.canvas.height = window.innerHeight;
    this.bottomBarHeight = this.height < 500 ? 70 : 88;
    this.trackBottomY = Math.max(200, this.height - this.bottomBarHeight);
    this.horizonY = this.trackBottomY * 0.32;
  }

  startStage(stage) {
    this.currentStage = stage;
    this.playerLane = 1;
    this.targetLane = 1;
    this.playerX = 1;
    this.playerY = 0;
    this.updateLaneButtonsUI();
    this.jumpVel = 0;
    this.stumbleTimer = 0;
    this.speed = 1.0;
    this.targetSpeed = 1.0;
    this.distance = 0;
    this.score = 0;
    this.combo = 0;
    this.maxCombo = 0;
    this.correctCount = 0;
    this.totalEncounters = 0;
    this.gates = [];
    this.particles = [];
    this.waveState = 'approaching';
    this.wavePauseTimer = 0;
    this.isRunning = true;
    this.isPaused = false;

    this.startNextWave();
    this.updateHUD();

    document.getElementById('pedagogyTip').innerText = `🐼 ${this.currentStage.tip}`;
    document.getElementById('pedagogyTip').style.opacity = '1';
  }

  toggleSpeed() {
    if (this.speedSetting === 'slow') {
      this.speedSetting = 'normal';
      this.speedMultiplier = 1.0;
      return false; // not slow
    } else {
      this.speedSetting = 'slow';
      this.speedMultiplier = 0.75;
      return true; // is slow
    }
  }

  selectNewTarget() {
    const items = this.currentStage.items;
    let candidates = items;
    if (this.targetItem && items.length > 1) {
      candidates = items.filter(i => i.glyph !== this.targetItem.glyph);
    }
    this.targetItem = candidates[Math.floor(Math.random() * candidates.length)];

    document.getElementById('bannerGlyph').innerText = this.targetItem.glyph;
    document.getElementById('bannerKana').innerText = this.targetItem.kana;

    const banner = document.getElementById('targetBanner');
    if (banner) {
      banner.classList.remove('pulse-accent');
      void banner.offsetWidth;
      banner.classList.add('pulse-accent');
    }

    // Play Target Audio promptly
    this.audio.playPinyinAudio(this.targetItem.audio, this.targetItem.glyph);
  }

  setLane(lane) {
    const clamped = Math.max(0, Math.min(2, lane));
    if (this.targetLane !== clamped) {
      this.targetLane = clamped;
      this.playerLane = clamped;
      this.audio.playSwitchLane();
      this.updateLaneButtonsUI();
    }
  }

  updateLaneButtonsUI() {
    for (let i = 0; i <= 2; i++) {
      const btn = document.getElementById(`laneBtn${i}`);
      if (btn) {
        if (this.targetLane === i) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      }
    }
  }

  shiftLane(dir) {
    this.setLane(this.targetLane + dir);
  }

  jump() {
    if (!this.isJumping) {
      this.isJumping = true;
      this.jumpVel = 14;
      this.audio.playSwitchLane();
    }
  }

  startNextWave() {
    if (this.correctCount >= this.targetGoal) {
      this.triggerStageClear();
      return;
    }

    this.selectNewTarget();

    const stageItems = this.currentStage.items;
    const correctLane = Math.floor(Math.random() * 3);

    // Pick 2 distractors
    const otherItems = stageItems.filter(i => i.glyph !== this.targetItem.glyph);
    const shuffledOthers = [...otherItems].sort(() => Math.random() - 0.5);

    const rowGates = [];
    let otherIdx = 0;

    for (let lane = 0; lane < 3; lane++) {
      const isTarget = (lane === correctLane);
      let gateItem = isTarget ? this.targetItem : (shuffledOthers[otherIdx++] || this.targetItem);
      rowGates.push({
        lane: lane,
        z: 1000,
        item: gateItem,
        isTarget: isTarget,
        collected: false,
        dissolving: false,
        dissolveAlpha: 1.0
      });
    }

    this.gates = [rowGates];
    this.waveState = 'approaching';
    this.totalEncounters++;
  }

  update(dt) {
    if (!this.isRunning || this.isPaused) return;

    // Interpolate Player X
    this.playerX += (this.targetLane - this.playerX) * 0.22;

    // Handle Jump Physics
    if (this.isJumping) {
      this.playerY += this.jumpVel;
      this.jumpVel -= 0.85;
      if (this.playerY <= 0) {
        this.playerY = 0;
        this.isJumping = false;
        this.jumpVel = 0;
      }
    }

    // Stumble Animation
    if (this.stumbleTimer > 0) {
      this.stumbleTimer -= dt;
    }

    // Dynamic Difficulty Adjustment (DDA) Speed smoothing
    this.speed += (this.targetSpeed - this.speed) * 0.05;
    this.distance += this.speed * 2.5 * this.speedMultiplier;

    // Wave Pause Handler (Rhythmic Breather between encounters)
    if (this.waveState === 'wave_pause') {
      this.wavePauseTimer--;
      if (this.wavePauseTimer <= 0) {
        this.startNextWave();
      }
    }

    // Update Gates with comfortable approach rate
    const zStep = this.speed * 3.8 * this.speedMultiplier;
    for (let i = this.gates.length - 1; i >= 0; i--) {
      const row = this.gates[i];
      let rowPassed = false;

      for (let g of row) {
        g.z -= zStep;

        if (g.dissolving) {
          g.dissolveAlpha = Math.max(0, g.dissolveAlpha - 0.05);
        }

        // Collision Check near player (Z ~ this.playerZ)
        if (!g.collected && !g.dissolving && g.z < (this.playerZ + 25) && g.z > (this.playerZ - 30)) {
          const laneDist = Math.abs(this.playerX - g.lane);
          if (laneDist < 0.45) {
            g.collected = true;
            this.handleGateHit(g);
            break;
          }
        }

        if (g.z <= this.playerZ - 35) {
          rowPassed = true;
        }
      }

      if (rowPassed) {
        const rowHandled = row.some(g => g.collected || g.dissolving);
        if (!rowHandled && this.waveState === 'approaching') {
          this.handleWaveMiss();
        }
        this.gates.splice(i, 1);
      }
    }

    // Update Particles
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.alpha -= 0.025;
      p.size = Math.max(0, p.size - 0.15);
      if (p.alpha <= 0) {
        this.particles.splice(i, 1);
      }
    }
  }

  handleGateHit(gate) {
    const screenPos = this.projectLane(gate.lane, this.playerZ);

    if (gate.isTarget) {
      // SUCCESS HIT!
      this.correctCount++;
      this.combo++;
      if (this.combo > this.maxCombo) this.maxCombo = this.combo;

      const comboBonus = Math.min(this.combo * 50, 300);
      this.score += 100 + comboBonus;

      this.audio.playHitSound(true);
      this.spawnParticles(screenPos.x, screenPos.y, '#10B981', 28);
      this.showComboPopup(this.combo);

      document.getElementById('pedagogyTip').innerText = `✨ だいせいかい！「${gate.item.glyph}」(${gate.item.kana})`;

      // Check Stage Clear Goal
      if (this.correctCount >= this.targetGoal) {
        this.isRunning = false;
        setTimeout(() => this.triggerStageClear(), 450);
        return;
      }
    } else {
      // SOFT FAIL-SAFE: NO DEATH!
      this.combo = 0;
      this.stumbleTimer = 0.5;
      this.audio.playHitSound(false);
      this.spawnParticles(screenPos.x, screenPos.y, '#F59E0B', 14);

      // Friendly reminder tip
      document.getElementById('pedagogyTip').innerText = `惜しい！もう一度きいてみよう：${this.targetItem.glyph} (${this.targetItem.kana})`;
      this.audio.playPinyinAudio(this.targetItem.audio, this.targetItem.glyph);
    }

    this.updateHUD();

    // Mark remaining gates in wave to dissolve softly
    for (let row of this.gates) {
      for (let g of row) {
        if (!g.collected) {
          g.dissolving = true;
          g.dissolveAlpha = 1.0;
        }
      }
    }

    // Set short musical breath pause before next encounter
    this.waveState = 'wave_pause';
    this.wavePauseTimer = 55; // frames (~0.9s)
  }

  handleWaveMiss() {
    this.combo = 0;
    this.stumbleTimer = 0.5;
    this.audio.playHitSound(false);

    document.getElementById('pedagogyTip').innerText = `きこえたかな？もう一度：${this.targetItem.glyph} (${this.targetItem.kana})`;
    this.audio.playPinyinAudio(this.targetItem.audio, this.targetItem.glyph);

    this.updateHUD();

    this.waveState = 'wave_pause';
    this.wavePauseTimer = 65; // frames (~1.1s)
  }

  spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const spd = 2 + Math.random() * 6;
      this.particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd - 2,
        size: 5 + Math.random() * 6,
        color: color,
        alpha: 1.0
      });
    }
  }

  showComboPopup(combo) {
    if (combo < 2) return;
    const el = document.getElementById('comboIndicator');
    el.innerText = `🔥 ${combo} 連続せいかい！`;
    el.classList.add('show');
    clearTimeout(this.comboTimeout);
    this.comboTimeout = setTimeout(() => {
      el.classList.remove('show');
    }, 1200);
  }

  updateHUD() {
    document.getElementById('scoreText').innerText = this.score;
  }

  triggerStageClear() {
    this.isRunning = false;
    const accuracy = Math.round((this.correctCount / Math.max(1, this.totalEncounters)) * 100);
    
    let stars = '⭐⭐⭐';
    if (accuracy < 70) stars = '⭐';
    else if (accuracy < 85) stars = '⭐⭐';

    document.getElementById('clearStars').innerText = stars;
    document.getElementById('finalScoreVal').innerText = this.score;
    document.getElementById('maxComboVal').innerText = this.maxCombo;
    document.getElementById('accuracyVal').innerText = `${accuracy}%`;

    document.getElementById('stageClearScreen').classList.add('active');
  }

  // Perspective 3D -> 2D Projection with gentle child-friendly curve
  projectLane(laneIndex, z) {
    // z ranges from 1000 (horizon) to 0 (camera plane)
    const factor = Math.max(0.01, 1 - (z / 1000));
    const scale = Math.pow(factor, 1.35); // Gentle curve so orbs stay readable far longer

    const bottomW = this.width * 0.88;
    const topW = this.width * 0.15;
    const trackWidth = topW + (bottomW - topW) * scale;

    const laneOffset = (laneIndex - 1) * (trackWidth / 3);
    const x = (this.width / 2) + laneOffset;
    const y = this.horizonY + (this.trackBottomY - this.horizonY) * scale;

    return { x, y, scale };
  }

  render() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.width, this.height);

    // 1. Cyber-Kawaii Gradient Sky with Twinkling Stars
    const skyGrad = ctx.createLinearGradient(0, 0, 0, this.horizonY);
    skyGrad.addColorStop(0, '#0F172A');
    skyGrad.addColorStop(0.7, '#1E1B4B');
    skyGrad.addColorStop(1, '#312E81');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, this.width, this.horizonY);

    // Distant Mountain & Sun
    ctx.save();
    ctx.beginPath();
    ctx.arc(this.width / 2, this.horizonY + 10, 60, Math.PI, 0);
    ctx.fillStyle = 'rgba(251, 191, 36, 0.35)';
    ctx.fill();
    ctx.restore();

    // 2. 3-Lane Track with Moving Ground Grid
    const groundGrad = ctx.createLinearGradient(0, this.horizonY, 0, this.height);
    groundGrad.addColorStop(0, '#1E1B4B');
    groundGrad.addColorStop(0.4, '#0F172A');
    groundGrad.addColorStop(1, '#090D16');
    ctx.fillStyle = groundGrad;
    ctx.fillRect(0, this.horizonY, this.width, this.height - this.horizonY);

    // Draw Rainbow Road Lanes
    this.drawLanes(ctx);

    // 3. Render Collectible Pinyin Orbs (Sorted back-to-front by Z)
    const allGates = [];
    for (let row of this.gates) {
      for (let g of row) {
        if (!g.collected && g.z > 10) allGates.push(g);
      }
    }
    allGates.sort((a, b) => b.z - a.z);

    for (let gate of allGates) {
      this.drawPinyinOrb(ctx, gate);
    }

    // 4. Render Cute Panda Mascot Runner
    this.drawPlayerPanda(ctx);

    // 5. Render Particle Effects
    for (let p of this.particles) {
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  drawLanes(ctx) {
    const bottomW = this.width * 0.88;
    const topW = this.width * 0.15;
    const centerX = this.width / 2;

    // Track Outer Boundary
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(centerX - topW / 2, this.horizonY);
    ctx.lineTo(centerX + topW / 2, this.horizonY);
    ctx.lineTo(centerX + bottomW / 2, this.trackBottomY);
    ctx.lineTo(centerX - bottomW / 2, this.trackBottomY);
    ctx.closePath();
    ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#38BDF8';
    ctx.stroke();

    // 2 Divider lines separating the 3 lanes
    for (let i = 1; i <= 2; i++) {
      const topDividerX = centerX - topW / 2 + (topW / 3) * i;
      const bottomDividerX = centerX - bottomW / 2 + (bottomW / 3) * i;

      ctx.beginPath();
      ctx.setLineDash([12, 10]);
      ctx.lineDashOffset = -this.distance * 1.5;
      ctx.moveTo(topDividerX, this.horizonY);
      ctx.lineTo(bottomDividerX, this.trackBottomY);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Neon baseline threshold at track end
    ctx.beginPath();
    ctx.moveTo(centerX - bottomW / 2, this.trackBottomY);
    ctx.lineTo(centerX + bottomW / 2, this.trackBottomY);
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.7)';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.restore();
  }

  drawPinyinOrb(ctx, gate) {
    const p = this.projectLane(gate.lane, gate.z);
    if (p.scale <= 0.03) return;

    // Generous minimum visual scale so even distant orbs are clearly readable
    const vScale = Math.max(0.32, p.scale);

    ctx.save();
    // Smooth bobbing
    const bob = Math.sin((gate.z * 0.015) + gate.lane * 2.2) * (7 * vScale);
    ctx.translate(p.x, p.y - 48 * vScale + bob);

    if (gate.dissolving) {
      ctx.globalAlpha = Math.max(0, gate.dissolveAlpha !== undefined ? gate.dissolveAlpha : 1.0);
    }

    // Orb Radius: between 38px (horizon) and 62px (close)
    const radius = Math.max(30, 32 + 30 * vScale);

    // Lane color schemes:
    // Lane 0 (Left): Cyan Gem
    // Lane 1 (Center): Amber / Golden Sun Gem
    // Lane 2 (Right): Violet / Magenta Star Gem
    const laneStyles = [
      { border: '#38BDF8', glow: '#06B6D4', grad1: '#38BDF8', grad2: '#0284C7', innerCore: 'rgba(8, 47, 73, 0.55)' },
      { border: '#FBBF24', glow: '#F59E0B', grad1: '#FBBF24', grad2: '#D97706', innerCore: 'rgba(69, 26, 3, 0.55)' },
      { border: '#F472B6', glow: '#EC4899', grad1: '#E879F9', grad2: '#9333EA', innerCore: 'rgba(74, 4, 78, 0.55)' }
    ];
    const style = laneStyles[gate.lane] || laneStyles[0];

    // 1. Outer Glow Aura
    ctx.beginPath();
    ctx.arc(0, 0, radius + 8 * vScale, 0, Math.PI * 2);
    ctx.fillStyle = style.glow;
    ctx.shadowColor = style.glow;
    ctx.shadowBlur = 18 * vScale;
    ctx.globalAlpha = 0.35 * (gate.dissolving ? (gate.dissolveAlpha || 1) : 1);
    ctx.fill();
    ctx.globalAlpha = gate.dissolving ? (gate.dissolveAlpha || 1) : 1;

    // 2. Crystal Sphere Body with Radial 3D Gradient
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    const orbGrad = ctx.createRadialGradient(
      -radius * 0.35, -radius * 0.35, radius * 0.08,
      0, 0, radius
    );
    orbGrad.addColorStop(0, '#FFFFFF');
    orbGrad.addColorStop(0.35, style.grad1);
    orbGrad.addColorStop(1, style.grad2);
    ctx.fillStyle = orbGrad;
    ctx.shadowBlur = 0;
    ctx.fill();

    // 3. Crisp Glass Border
    ctx.lineWidth = Math.max(2.5, 4.5 * vScale);
    ctx.strokeStyle = style.border;
    ctx.stroke();

    // 4. Inner High-Contrast Vignette for Razor-Sharp Text Contrast
    ctx.beginPath();
    ctx.arc(0, -2 * vScale, radius * 0.72, 0, Math.PI * 2);
    ctx.fillStyle = style.innerCore;
    ctx.fill();

    // 5. Specular Gloss Reflection (Top-left highlight)
    ctx.beginPath();
    ctx.ellipse(-radius * 0.34, -radius * 0.34, radius * 0.22, radius * 0.14, -Math.PI / 4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
    ctx.fill();

    // 6. GIANT PINYIN GLYPH (Main Educational Focus)
    const pinyinFontSize = Math.max(26, Math.round(24 + 30 * vScale));
    ctx.font = `900 ${pinyinFontSize}px "Outfit", "M PLUS Rounded 1c", system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const glyphY = -4 * vScale;

    // Heavy dark outline to ensure 100% legibility on any screen & background
    ctx.lineJoin = 'round';
    ctx.miterLimit = 2;
    ctx.strokeStyle = '#0B132B';
    ctx.lineWidth = Math.max(4, Math.round(8 * vScale));
    ctx.strokeText(gate.item.glyph, 0, glyphY);

    // Bright White Glyph Fill
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText(gate.item.glyph, 0, glyphY);

    // 7. KATAKANA SUB-HINT BADGE (Japanese Learner Scaffold)
    const kanaFont = Math.max(11, Math.round(11 + 6 * vScale));
    ctx.font = `800 ${kanaFont}px "M PLUS Rounded 1c", sans-serif`;
    const kanaText = gate.item.kana;
    const textMetrics = ctx.measureText(kanaText);
    const pillW = Math.max(textMetrics.width + 12 * vScale, 36 * vScale);
    const pillH = kanaFont + 7 * vScale;
    const kanaY = radius * 0.72;

    // Dark pill backing
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(-pillW / 2, kanaY - pillH / 2, pillW, pillH, pillH / 2);
    } else {
      ctx.rect(-pillW / 2, kanaY - pillH / 2, pillW, pillH);
    }
    ctx.fillStyle = 'rgba(15, 23, 42, 0.90)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
    ctx.lineWidth = Math.max(1, 1.5 * vScale);
    ctx.stroke();

    // Yellow Accent Katakana Text
    ctx.fillStyle = '#FEF08A';
    ctx.fillText(kanaText, 0, kanaY);

    ctx.restore();
  }

  drawPlayerPanda(ctx) {
    const p = this.projectLane(this.playerX, this.playerZ);
    const scale = p.scale;
    const x = p.x;
    const y = p.y - this.playerY * scale;

    ctx.save();
    ctx.translate(x, y);

    // Stumble Shake Animation
    if (this.stumbleTimer > 0) {
      ctx.translate((Math.random() - 0.5) * 8, 0);
    }

    // Shadow on Ground
    ctx.beginPath();
    ctx.ellipse(0, 4 * scale, 28 * scale, 10 * scale, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.fill();

    // Cute Panda Body & Running Dynamics
    const bounce = Math.sin(this.distance * 0.15) * 4 * scale;
    const legSwing = Math.sin(this.distance * 0.3) * 6 * scale;
    const bodyY = -28 * scale + bounce;

    // Little running feet (behind body)
    ctx.fillStyle = '#0F172A';
    ctx.beginPath();
    ctx.ellipse(-12 * scale, bodyY + 22 * scale + legSwing, 6 * scale, 4 * scale, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(12 * scale, bodyY + 22 * scale - legSwing, 6 * scale, 4 * scale, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body
    ctx.beginPath();
    ctx.arc(0, bodyY, 26 * scale, 0, Math.PI * 2);
    ctx.fillStyle = '#FFFFFF';
    ctx.fill();
    ctx.lineWidth = 2.5 * scale;
    ctx.strokeStyle = '#0F172A';
    ctx.stroke();

    // Panda Black Ears
    ctx.fillStyle = '#0F172A';
    ctx.beginPath();
    ctx.arc(-18 * scale, bodyY - 18 * scale, 9 * scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(18 * scale, bodyY - 18 * scale, 9 * scale, 0, Math.PI * 2);
    ctx.fill();

    // Panda Black Eye Patches
    ctx.beginPath();
    ctx.ellipse(-9 * scale, bodyY - 4 * scale, 6 * scale, 8 * scale, -0.2, 0, Math.PI * 2);
    ctx.ellipse(9 * scale, bodyY - 4 * scale, 6 * scale, 8 * scale, 0.2, 0, Math.PI * 2);
    ctx.fill();

    // Sparkling Eyes
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.arc(-8 * scale, bodyY - 6 * scale, 2.5 * scale, 0, Math.PI * 2);
    ctx.arc(10 * scale, bodyY - 6 * scale, 2.5 * scale, 0, Math.PI * 2);
    ctx.fill();

    // Cute Little Nose & Mouth
    ctx.fillStyle = '#0F172A';
    ctx.beginPath();
    ctx.arc(0, bodyY + 4 * scale, 3 * scale, 0, Math.PI * 2);
    ctx.fill();

    // Rosy Cheeks
    ctx.fillStyle = 'rgba(255, 94, 142, 0.6)';
    ctx.beginPath();
    ctx.arc(-16 * scale, bodyY + 2 * scale, 4 * scale, 0, Math.PI * 2);
    ctx.arc(16 * scale, bodyY + 2 * scale, 4 * scale, 0, Math.PI * 2);
    ctx.fill();

    // Running hands / paws in front
    ctx.fillStyle = '#0F172A';
    ctx.beginPath();
    ctx.ellipse(-20 * scale, bodyY + 6 * scale - legSwing, 5 * scale, 5 * scale, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(20 * scale, bodyY + 6 * scale + legSwing, 5 * scale, 5 * scale, 0, 0, Math.PI * 2);
    ctx.fill();

    // Headband with Pinyin Badge
    ctx.fillStyle = '#10B981';
    ctx.fillRect(-22 * scale, bodyY - 15 * scale, 44 * scale, 5 * scale);

    ctx.restore();
  }
}

// ==========================================
// 4. MAIN APP CONTROLLER & INTERFACE
// ==========================================
const GameApp = {
  audio: null,
  runner: null,
  selectedStageIdx: 0,

  init() {
    const canvas = document.getElementById('gameCanvas');
    this.audio = new AudioSubsystem();
    this.runner = new RunnerEngine(canvas, this.audio);

    this.renderStageList();
    this.bindUI();

    // Main Game Loop (60 FPS)
    let lastTime = performance.now();
    const loop = (now) => {
      const dt = (now - lastTime) / 1000;
      lastTime = now;
      this.runner.update(dt);
      this.runner.render();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  },

  renderStageList() {
    const container = document.getElementById('stageListContainer');
    container.innerHTML = '';
    CURRICULUM_STAGES.forEach((st, idx) => {
      const card = document.createElement('div');
      card.className = `stage-card ${idx === this.selectedStageIdx ? 'selected' : ''}`;
      if (idx === this.selectedStageIdx) {
        card.style.borderColor = '#10B981';
        card.style.background = '#ECFDF5';
      }
      card.onclick = () => {
        this.selectedStageIdx = idx;
        this.renderStageList();
      };
      card.innerHTML = `
        <div class="stage-info">
          <h4>${st.title} <span class="stage-badge">${st.badge}</span></h4>
          <p>${st.desc}</p>
        </div>
        <span style="font-size: 20px;">👉</span>
      `;
      container.appendChild(card);
    });
  },

  bindUI() {
    const speedBtn = document.getElementById('speedToggleBtn');
    if (speedBtn) {
      speedBtn.onclick = () => {
        const isSlow = this.runner.toggleSpeed();
        speedBtn.innerText = isSlow ? '🐢' : '🐇';
        const tipEl = document.getElementById('pedagogyTip');
        if (tipEl) {
          tipEl.innerText = isSlow ? '🐢 ゆっくりモード (0.75倍速) にしたよ！' : '🐇 ふつうモード (1.0倍速) にしたよ！';
        }
      };
    }

    document.getElementById('soundToggleBtn').onclick = () => {
      const enabled = this.audio.toggleSound();
      document.getElementById('soundToggleBtn').innerText = enabled ? '🔊' : '🔇';
    };

    document.getElementById('menuBtn').onclick = () => {
      this.openStageSelect();
    };
  },

  setPlayerLane(lane) {
    if (this.runner) this.runner.setLane(lane);
  },

  repeatTargetSound() {
    if (this.runner && this.runner.targetItem) {
      this.audio.playPinyinAudio(this.runner.targetItem.audio, this.runner.targetItem.glyph);
    }
  },

  startSelectedStage() {
    document.getElementById('stageSelectScreen').classList.remove('active');
    document.getElementById('stageClearScreen').classList.remove('active');
    this.audio.init();
    const stage = CURRICULUM_STAGES[this.selectedStageIdx];
    this.runner.startStage(stage);
  },

  openStageSelect() {
    if (this.runner) this.runner.isPaused = true;
    document.getElementById('stageSelectScreen').classList.add('active');
    document.getElementById('stageClearScreen').classList.remove('active');
    this.renderStageList();
  },

  nextStage() {
    this.selectedStageIdx = (this.selectedStageIdx + 1) % CURRICULUM_STAGES.length;
    this.startSelectedStage();
  }
};

window.addEventListener('DOMContentLoaded', () => {
  GameApp.init();
});
</script>
