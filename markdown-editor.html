<script>
let isSyncing = false;
function syncScroll(src, dest) {
  if (isSyncing) return;
  isSyncing = true;
  const ratio = src.scrollTop / (src.scrollHeight - src.clientHeight || 1);
  dest.scrollTop = ratio * (dest.scrollHeight - dest.clientHeight);
  setTimeout(() => isSyncing = false, 50);
}

function parseMarkdown(md) {
  let html = md;
  // Code blocks
  const codeBlocks = [];
  html = html.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (m, lang, code) => {
    const id = '___CB_' + codeBlocks.length + '___';
    codeBlocks.push('<pre><code>' + escapeHtml(code.trim()) + '</code></pre>');
    return id;
  });

  // Inline code
  const inlineCodes = [];
  html = html.replace(/`([^\`]+)`/g, (m, code) => {
    const id = '___IC_' + inlineCodes.length + '___';
    inlineCodes.push('<code>' + escapeHtml(code) + '</code>');
    return id;
  });

  // Headers
  html = html.replace(/^###### (.*$)/gim, '<h6>$1</h6>');
  html = html.replace(/^##### (.*$)/gim, '<h5>$1</h5>');
  html = html.replace(/^#### (.*$)/gim, '<h4>$1</h4>');
  html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
  html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
  html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');

  // Blockquote
  html = html.replace(/^\> (.*$)/gim, '<blockquote>$1</blockquote>');

  // HR
  html = html.replace(/^---$/gim, '<hr>');

  // Bold & Italic & Strikethrough
  html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
  html = html.replace(/~~(.*?)~~/g, '<del>$1</del>');

  // Task list
  html = html.replace(/^- \[ \] (.*$)/gim, '<li style="list-style:none;">☐ $1</li>');
  html = html.replace(/^- \[x\] (.*$)/gim, '<li style="list-style:none;">☑ $1</li>');

  // Unordered list
  html = html.replace(/^\* (.*$)/gim, '<li>$1</li>');
  html = html.replace(/^- (.*$)/gim, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');

  // Links & Images
  html = html.replace(/!\[([^\]]*)\]\((.*?)\)/g, '<img src="$2" alt="$1" style="max-width:100%;border-radius:8px;">');
  html = html.replace(/\[([^\]]+)\]\((.*?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  // Simple tables
  html = html.replace(/\|(.+)\|\n\|[-| :]+\|\n((?:\|.+\|\n?)+)/g, (match, header, body) => {
    const headers = header.split('|').filter(h => h.trim() !== '').map(h => '<th>' + h.trim() + '</th>').join('');
    const rows = body.trim().split('\n').map(row => {
      const cells = row.split('|').filter(c => c.trim() !== '').map(c => '<td>' + c.trim() + '</td>').join('');
      return '<tr>' + cells + '</tr>';
    }).join('');
    return '<table><thead><tr>' + headers + '</tr></thead><tbody>' + rows + '</tbody></table>';
  });

  // Paragraphs
  const lines = html.split(/\n\n+/);
  html = lines.map(line => {
    line = line.trim();
    if (!line) return '';
    if (/^<(h[1-6]|pre|blockquote|table|ul|ol|hr|li)/i.test(line)) return line;
    return '<p>' + line.replace(/\n/g, '<br>') + '</p>';
  }).join('\n');

  // Restore codes
  inlineCodes.forEach((ic, i) => { html = html.replace('___IC_' + i + '___', ic); });
  codeBlocks.forEach((cb, i) => { html = html.replace('___CB_' + i + '___', cb); });

  return html;
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function onInputChanged() {
  const text = document.getElementById('mdInput').value;
  document.getElementById('previewPane').innerHTML = parseMarkdown(text);
  updateStats(text);
  localStorage.setItem('md_editor_content', text);
  const status = document.getElementById('saveStatus');
  status.textContent = '✓ 本地已保存';
}

function updateStats(text) {
  const chars = text.length;
  const words = (text.match(/[\w\d\u4e00-\u9fa5]+/g) || []).length;
  const lines = text.split('\n').length;
  const mins = Math.max(1, Math.round(words / 300));
  document.getElementById('statWords').textContent = '字数: ' + words;
  document.getElementById('statChars').textContent = '字符数: ' + chars;
  document.getElementById('statLines').textContent = '行数: ' + lines;
  document.getElementById('statTime').textContent = '预估阅读: ~' + mins + ' 分钟';
}

function insertSyntax(before, after) {
  const ta = document.getElementById('mdInput');
  const start = ta.selectionStart;
  const end = ta.selectionEnd;
  const sel = ta.value.substring(start, end);
  const rep = before + (sel || '内容') + after;
  ta.value = ta.value.substring(0, start) + rep + ta.value.substring(end);
  ta.focus();
  ta.selectionStart = start + before.length;
  ta.selectionEnd = ta.selectionStart + (sel ? sel.length : 2);
  onInputChanged();
}

function clearContent() {
  if (confirm('确认清空当前编辑器内容吗？')) {
    document.getElementById('mdInput').value = '';
    onInputChanged();
  }
}

function copyRenderedHtml() {
  const html = document.getElementById('previewPane').innerHTML;
  navigator.clipboard.writeText(html).then(() => showToast('HTML 代码已复制到剪贴板！'));
}

function exportMarkdown() {
  const text = document.getElementById('mdInput').value;
  const blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'document_' + new Date().toISOString().slice(0, 10) + '.md';
  a.click();
  showToast('已导出 Markdown 文件');
}

function exportHtml() {
  const title = (document.getElementById('mdInput').value.match(/^#\s+(.*)$/m) || [,'Markdown排版文档'])[1];
  const content = document.getElementById('previewPane').innerHTML;
  const fullHtml = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + escapeHtml(title) + '</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;max-width:800px;margin:40px auto;padding:0 20px;line-height:1.7;color:#1e293b;}pre{background:#f1f5f9;padding:14px;border-radius:8px;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #cbd5e1;padding:8px 12px;}</style></head><body>' + content + '</body></html>';
  const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'document_' + new Date().toISOString().slice(0, 10) + '.html';
  a.click();
  showToast('已导出独立 HTML 文件');
}

function initTheme(){
  const saved=localStorage.getItem('app_theme');
  if(saved){document.documentElement.setAttribute('data-theme',saved);}
  else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const target=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',target);
  localStorage.setItem('app_theme',target);
}
initTheme();
function showToast(msg, duration=2200){
  const el=document.createElement('div');
  el.textContent=msg;
  el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:9999px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 10px 25px rgba(0,0,0,.2);transition:opacity .3s;';
  document.body.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),300);},duration);
}
</script>
