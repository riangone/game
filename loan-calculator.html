  <h1 class="page-title">🏦 贷款 / 房贷计算器</h1>
  <p class="page-sub">支持等额本息（每月还款额固定）与等额本金（每月本金固定，利息递减）两种模式，自动生成完整还款计划表。</p>

  <div class="grid2">
    <div class="card">
      <label class="small">贷款总额（元）</label>
      <input type="number" id="principal" value="1000000" step="1000">
      <label class="small">年利率（%）</label>
      <input type="number" id="rate" value="3.95" step="0.01">

      <div class="seg">
        <button id="segEqual" class="active" onclick="setMethod('equal')">等额本息</button>
        <button id="segPrincipal" onclick="setMethod('principal')">等额本金</button>
      </div>
      <button class="btn" onclick="calculate()">📊 计算还款计划</button>
    </div>

        <table>
          <thead><tr><th>期数</th><th>月供</th><th>本金</th><th>利息</th><th>剩余本金</th></tr></thead>

<script>
(function(){const t=localStorage.getItem('app_theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');})();
function toggleTheme(){const cur=document.documentElement.getAttribute('data-theme');const next=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',next);localStorage.setItem('app_theme',next);}

let method = 'equal';
function setMethod(m){
  method = m;
  document.getElementById('segEqual').classList.toggle('active', m==='equal');
  document.getElementById('segPrincipal').classList.toggle('active', m==='principal');
}
function fmt(n){ return n.toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2}); }

function calculate(){
  const P = parseFloat(document.getElementById('principal').value);
  const annualRate = parseFloat(document.getElementById('rate').value) / 100;
  const years = parseInt(document.getElementById('years').value);
  const months = years * 12;
  const r = annualRate / 12;
  if(!P || !years || isNaN(annualRate)){ alert('请输入有效的贷款参数'); return; }

  let schedule = [];
  let totalInterest = 0, totalPayment = 0;

  if(method === 'equal'){
    const monthlyPayment = r === 0 ? P/months : P * r * Math.pow(1+r, months) / (Math.pow(1+r, months) - 1);
    let remaining = P;
    for(let i=1;i<=months;i++){
      const interest = remaining * r;
      const principalPart = monthlyPayment - interest;
      remaining -= principalPart;
      if(i===months) remaining = 0;
      schedule.push({month:i, payment:monthlyPayment, principal:principalPart, interest, remaining});
      totalInterest += interest;
    }
    totalPayment = monthlyPayment * months;
  } else {
    const monthlyPrincipal = P / months;
    let remaining = P;
    for(let i=1;i<=months;i++){
      const interest = remaining * r;
      const payment = monthlyPrincipal + interest;
      remaining -= monthlyPrincipal;
      if(i===months) remaining = 0;
      schedule.push({month:i, payment, principal:monthlyPrincipal, interest, remaining});
      totalInterest += interest;
      totalPayment += payment;
    }
  }

  const firstPayment = schedule[0].payment;
  const lastPayment = schedule[schedule.length-1].payment;
  document.getElementById('summaryGrid').innerHTML = `
    <div class="summary-card"><b>¥${fmt(method==='equal'?firstPayment:firstPayment)}</b><span>${method==='equal'?'每月月供':'首月月供'}</span></div>
    <div class="summary-card"><b>¥${fmt(totalInterest)}</b><span>总利息</span></div>
    <div class="summary-card"><b>¥${fmt(totalPayment)}</b><span>还款总额</span></div>`;

  const principalPct = (P/totalPayment*100).toFixed(1);
  const interestPct = (totalInterest/totalPayment*100).toFixed(1);
  document.getElementById('barChart').innerHTML =
    `<div class="bar-principal" style="width:${principalPct}%"></div><div class="bar-interest" style="width:${interestPct}%"></div>`;

  document.getElementById('scheduleBody').innerHTML = schedule.map(s => `
    <tr><td>第${s.month}期</td><td>¥${fmt(s.payment)}</td><td>¥${fmt(s.principal)}</td><td>¥${fmt(s.interest)}</td><td>¥${fmt(Math.max(0,s.remaining))}</td></tr>
  `).join('');
}

calculate();
</script>
