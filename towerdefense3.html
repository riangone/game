    if (state.lives <= 0) { state.lives = 0; endGame(false); }
  }

  function updateEnemyMove(e, dt) {
    if (e.hitFlash > 0) e.hitFlash = Math.max(0, e.hitFlash - dt);

    const slowActive = state.time < e.slowUntil;
    const spd = e.speedCells * cellUnit * (slowActive ? e.slowFactor : 1);
    const pts = pointsForEnemy(e);
    const target = pts[e.idx + 1];
    if (!target) { leakEnemy(e); return; }

    const dx = target.x - e.x, dy = target.y - e.y;
    const dist = Math.hypot(dx, dy);
    const step = spd * dt;

    if (dist > 0.001) {
      e.targetFacing = Math.atan2(dy, dx);
      e.facing = lerpAngle(e.facing, e.targetFacing, dt * 11);
    }

    // Sweetheart Nurse Medic Heart-Pulse Heal
    if (e.type === 'medic' && !e.dead) {
      e.healTimer += dt;
      if (e.healTimer >= 2.0) {
        e.healTimer = 0;
        let healedAny = false;
        const healRange = cellUnit * 2.5;
        for (const ally of state.enemies) {
          if (ally === e || ally.dead) continue;
          const d = Math.hypot(ally.x - e.x, ally.y - e.y);
          if (d <= healRange && ally.hp < ally.maxHp) {
            const healAmt = Math.round(ally.maxHp * 0.18);
            ally.hp = Math.min(ally.maxHp, ally.hp + healAmt);
            healedAny = true;
            spawnImpactParticles(ally.x, ally.y - 10, '#f472b6', 5);
            addFloatingText('💖+元气', ally.x, enemyHitY(ally) - 10, '#f472b6');
          }
        }
        if (healedAny) {
          sfx.heal();
          state.shockwaves.push({
            x: e.x, y: e.y, r: 2, maxR: healRange, life: 0.45, maxLife: 0.45, color: '#f472b6'
          });
        }
      }
    }

    // Bouncy Chibi Walk / Chug / Rotor animation update
    if (!e.flying) {
      const moveFactor = dist > 0.001 ? Math.min(1, step / Math.max(0.0001, dt * cellUnit)) : 0;
      e.walkPhase = (e.walkPhase || 0) + dt * (e.strideFreq || 2.6) * Math.max(0.35, moveFactor);
      const phi = e.walkPhase % 1.0;
      e.bobPhase = phi;
      e.z = Math.abs(Math.sin(phi * Math.PI * 2)) * (e.bobH || 3.0);

      // Cute puffy white clouds from chugging mini-vehicles
      if (e.isVehicle) {
        e.exhaustTimer = (e.exhaustTimer || 0) + dt;
        if (e.exhaustTimer > (e.type === 'boss' ? 0.12 : 0.2)) {
          e.exhaustTimer = 0;
          const backX = e.x - Math.cos(e.facing) * (e.radius * tileW * 0.85);
          const backY = e.y - Math.sin(e.facing) * (e.radius * tileW * 0.42) - 5;
          state.particles.push({
            x: backX, y: backY,
            vx: -Math.cos(e.facing) * 12 + (Math.random() - 0.5) * 6,
            vy: -14 - Math.random() * 8,
            r: e.type === 'boss' ? 4.0 : 3.0,
            grow: 7,
            life: 0.4, maxLife: 0.4,
            color: 'rgba(255, 255, 255, 0.65)'
          });
        }
      }
    } else {
      e.z = 42 + Math.sin(state.time * 5.0 + e.id * 10) * 4.0;
      e.propAngle = (e.propAngle || 0) + dt * 42;
      e.walkPhase = (e.walkPhase || 0) + dt * 2.5;
    }

    if (step >= dist) {
      e.x = target.x;
      e.y = target.y;
      e.idx++;
    } else {
      e.x += (dx / dist) * step;
      e.y += (dy / dist) * step;
    }
  }

  function update(dtRaw) {
    const dt = dtRaw * state.speedMult;
    state.time += dt;

    if (state.screenShake > 0) state.screenShake = Math.max(0, state.screenShake - dt);

    // Update ambient weather
    for (const wp of weatherParticles) {
      wp.x += wp.vx * dt;
      wp.y += wp.vy * dt;
      if (wp.x > W + 100) wp.x = -100;
      if (wp.y > H + 40) { wp.y = -20; wp.x = Math.random() * W; }
    }

    // Spawning wave
    if (state.waveActive) {
      if (state.spawnQueue.length > 0) {
        state.spawnTimer -= dt;
        if (state.spawnTimer <= 0) {
          spawnEnemy(state.spawnQueue.shift());
          state.spawnTimer = state.spawnInterval;
        }
      } else if (state.enemies.length === 0) {
        state.waveActive = false;
        state.gold += 25 + state.wave * 4 + curLevel.id * 5;
        if (state.wave >= curLevel.wavesCount) {
          levelComplete();
          return;
        }
        state.betweenWaves = true;
        state.countdown = WAVE_COUNTDOWN;
      }
    } else if (state.betweenWaves && state.wave < curLevel.wavesCount) {
      state.countdown -= dt;
      if (state.countdown <= 0) startWave();
    }

    // Enemies
    for (const e of state.enemies) if (!e.dead) updateEnemyMove(e, dt);
    state.enemies = state.enemies.filter(e => !e.dead);

    // Towers
    for (const t of state.towers) {
      if (t.buildAnim > 0) t.buildAnim = Math.max(0, t.buildAnim - dt * 4.5);
      t.radarAngle = (t.radarAngle || 0) + dt * 2.6;

      // Track target smoothly even between shots
      const stats = towerStats(t);
      const trackTarget = findTarget(t, stats);
      if (trackTarget && state.time >= t.disabledUntil) {
        t.targetFacing = Math.atan2(trackTarget.y - t.y, trackTarget.x - t.x);
        t.facing = lerpAngle(t.facing, t.targetFacing, dt * 10);
      }

      if (t.cooldown > 0) t.cooldown -= dt;
      else fireTower(t);

      if (t.muzzleFlash > 0) {
        t.muzzleFlash -= dt;
        t.barrelSpin = (t.barrelSpin || 0) + dt * 35;
      }
      if (t.recoil > 0) t.recoil = Math.max(0, t.recoil - dt * 6.5);
    }

    // Projectiles
    for (const p of state.projectiles) {
      if (!p.target || p.target.dead) { p.dead = true; continue; }
      const targetY = enemyHitY(p.target);
      const dx = p.target.x - p.x, dy = targetY - p.y;
      const dist = Math.hypot(dx, dy);
      const step = p.speed * dt;
      p.currDist += step;
      p.facing = Math.atan2(dy, dx);

      // Smoke trail for artillery shells & SAM missiles
      if (p.type === 'cannon' || p.type === 'flak') {
        p.trailTimer = (p.trailTimer || 0) + dt;
        if (p.trailTimer >= 0.028) {
          p.trailTimer = 0;
          const progress = Math.min(1, p.currDist / (p.travelDist || 1));
          const arcOffset = p.type === 'cannon' ? Math.sin(progress * Math.PI) * (tileW * 0.65) : 0;
          state.particles.push({
            x: p.x, y: p.y - arcOffset,
            vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
            r: p.type === 'flak' ? 2.8 : 3.4,
            grow: 6,
            life: 0.28, maxLife: 0.28,
            color: p.type === 'flak' ? 'rgba(226, 232, 240, 0.65)' : 'rgba(148, 163, 184, 0.5)'
          });
        }
      }

      if (step >= dist) {
        p.dead = true;
        damageEnemy(p.target, p.dmg, p.armorPierce);
        if (p.slow) {
          p.target.slowUntil = state.time + 1.7;
          p.target.slowFactor = 1 - p.slow;
        }
        if (p.splash > 0) {
          state.shockwaves.push({
            x: p.target.x, y: p.target.y, r: 4, maxR: p.splash,
            life: 0.36, maxLife: 0.36, color: p.color
          });
          if (p.type === 'cannon') {
            state.scorchMarks.push({ x: p.target.x, y: p.target.y, r: tileW * 0.24, life: 5.5, maxLife: 5.5 });
            spawnSmokeParticles(p.target.x, p.target.y - 6, 5);
          }
          for (const e of state.enemies) {
            if (e === p.target || e.dead) continue;
            const d2 = Math.hypot(e.x - p.target.x, e.y - p.target.y);
            if (d2 <= p.splash) damageEnemy(e, p.dmg * 0.65, p.armorPierce);
          }
        }
      } else {
        p.x += (dx / dist) * step;
        p.y += (dy / dist) * step;
      }
    }
    state.projectiles = state.projectiles.filter(p => !p.dead);
    state.enemies = state.enemies.filter(e => !e.dead);

    // Shell casings physics
    for (const sc of state.shellCasings) {
      sc.x += sc.vx * dt;
      sc.y += sc.vy * dt;
      sc.vy += sc.gravity * dt;
      sc.rot += sc.vRot * dt;
      sc.life -= dt;
    }
    state.shellCasings = state.shellCasings.filter(sc => sc.life > 0);

    // Scorch marks
    for (const sm of state.scorchMarks) sm.life -= dt;
    state.scorchMarks = state.scorchMarks.filter(sm => sm.life > 0);

    // Particles
    for (const pt of state.particles) {
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      if (pt.grow) pt.r += pt.grow * dt;
      pt.life -= dt;
    }
    state.particles = state.particles.filter(pt => pt.life > 0);

    // Shockwaves
    for (const sw of state.shockwaves) {
      sw.life -= dt;
      sw.r += ((sw.maxR - sw.r) * 12) * dt;
    }
    state.shockwaves = state.shockwaves.filter(sw => sw.life > 0);

    // Floating Texts
    for (const ft of state.floatingTexts) {
      ft.y += ft.vy * dt;
      ft.life -= dt;
    }
    state.floatingTexts = state.floatingTexts.filter(ft => ft.life > 0);

    // Lightning & Laser beams
    for (const a of state.lightnings) a.life -= dt;
    state.lightnings = state.lightnings.filter(a => a.life > 0);
    for (const lb of state.laserBeams) lb.life -= dt;
    state.laserBeams = state.laserBeams.filter(lb => lb.life > 0);
  }

  // ---------- 3D Isometric Terrain & Military Rendering ----------

  function drawIsoBlock(c, r, topStyle, leftStyle, rightStyle, depth, liftZ = 0) {
    const hw = tileW / 2, hh = tileH / 2;
    const cx = X_center + (c - r) * hw;
    const cy = Y_center + (c + r + 1) * hh - blockDepth - liftZ;

    const EPS = 0.75;
    function inflate(px, py) {
      const dx = px - cx, dy = py - cy;
      const len = Math.hypot(dx, dy) || 1;
      return { x: px + (dx / len) * EPS, y: py + (dy / len) * EPS };
    }

    const topPt    = inflate(cx,      cy - hh);
    const rightPt  = inflate(cx + hw, cy);
    const bottomPt = inflate(cx,      cy + hh);
    const leftPt   = inflate(cx - hw, cy);

    const leftGrad = ctx.createLinearGradient(leftPt.x, leftPt.y, leftPt.x, leftPt.y + depth);
    leftGrad.addColorStop(0, lightenHex(leftStyle, 0.08));
    leftGrad.addColorStop(1, darkenHex(leftStyle, 0.28));
    ctx.fillStyle = leftGrad;
    ctx.beginPath();
    ctx.moveTo(leftPt.x, leftPt.y);
    ctx.lineTo(bottomPt.x, bottomPt.y);
    ctx.lineTo(bottomPt.x, bottomPt.y + depth);
    ctx.lineTo(leftPt.x, leftPt.y + depth);
    ctx.closePath();
    ctx.fill();

    const rightGrad = ctx.createLinearGradient(rightPt.x, rightPt.y, rightPt.x, rightPt.y + depth);
    rightGrad.addColorStop(0, lightenHex(rightStyle, 0.04));
    rightGrad.addColorStop(1, darkenHex(rightStyle, 0.32));
    ctx.fillStyle = rightGrad;
    ctx.beginPath();
    ctx.moveTo(bottomPt.x, bottomPt.y);
    ctx.lineTo(rightPt.x, rightPt.y);
    ctx.lineTo(rightPt.x, rightPt.y + depth);
    ctx.lineTo(bottomPt.x, bottomPt.y + depth);
    ctx.closePath();
    ctx.fill();

    const topGrad = ctx.createLinearGradient(topPt.x, topPt.y, bottomPt.x, bottomPt.y);
    topGrad.addColorStop(0, lightenHex(topStyle, 0.12));
    topGrad.addColorStop(0.55, topStyle);
    topGrad.addColorStop(1, darkenHex(topStyle, 0.08));
    ctx.fillStyle = topGrad;
    ctx.beginPath();
    ctx.moveTo(topPt.x, topPt.y);
    ctx.lineTo(rightPt.x, rightPt.y);
    ctx.lineTo(bottomPt.x, bottomPt.y);
    ctx.lineTo(leftPt.x, leftPt.y);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.07)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function drawEarthTerrainSlab() {
    const hw = tileW / 2, hh = tileH / 2;
    const slabDepth = blockDepth + 30;

    const rightPt  = { x: X_center + (COLS - 0) * hw,    y: Y_center + (COLS + 0) * hh - blockDepth };
    const bottomPt = { x: X_center + (COLS - ROWS) * hw, y: Y_center + (COLS + ROWS + 1) * hh - blockDepth + hh };
    const leftPt   = { x: X_center + (0 - ROWS) * hw,    y: Y_center + (0 + ROWS) * hh - blockDepth };

    // Soft terrain shadow on earth/water surface
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(leftPt.x, leftPt.y + slabDepth + 14);
    ctx.lineTo(bottomPt.x, bottomPt.y + slabDepth + 14);
    ctx.lineTo(rightPt.x, rightPt.y + slabDepth + 14);
    ctx.lineTo(bottomPt.x, bottomPt.y + slabDepth + 34);
    ctx.closePath();
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.filter = 'blur(14px)';
    ctx.fill();
    ctx.restore();

    // Geological Earth Strata Left Face
    const gradL = ctx.createLinearGradient(leftPt.x, leftPt.y, bottomPt.x, bottomPt.y + slabDepth);
    gradL.addColorStop(0, curLevel.theme.cliffL);
    gradL.addColorStop(0.5, darkenHex(curLevel.theme.cliffL, 0.25));
    gradL.addColorStop(1, '#14110f');
    ctx.fillStyle = gradL;
    ctx.beginPath();
    ctx.moveTo(leftPt.x, leftPt.y);
    ctx.lineTo(bottomPt.x, bottomPt.y);
    ctx.lineTo(bottomPt.x, bottomPt.y + slabDepth);
    ctx.lineTo(leftPt.x, leftPt.y + slabDepth - 8);
    ctx.closePath();
    ctx.fill();

    // Geological Earth Strata Right Face
    const gradR = ctx.createLinearGradient(bottomPt.x, bottomPt.y, rightPt.x, rightPt.y + slabDepth);
    gradR.addColorStop(0, curLevel.theme.cliffR);
    gradR.addColorStop(0.5, darkenHex(curLevel.theme.cliffR, 0.28));
    gradR.addColorStop(1, '#0f0d0c');
    ctx.fillStyle = gradR;
    ctx.beginPath();
    ctx.moveTo(bottomPt.x, bottomPt.y);
    ctx.lineTo(rightPt.x, rightPt.y);
    ctx.lineTo(rightPt.x, rightPt.y + slabDepth - 8);
    ctx.lineTo(bottomPt.x, bottomPt.y + slabDepth);
    ctx.closePath();
    ctx.fill();
  }

  function enemyHitY(e) {
    if (e.flying) return e.y;
    return e.y - e.radius * tileW * (e.isVehicle ? 0.9 : 1.45);
  }

  // Two-segment articulated limb (thigh + shin or upper + lower arm) for realistic human gait
  function drawArticulatedLeg(hipX, hipY, hipAngle, kneeBend, len, width, pantsColor, bootColor) {
    const thighLen = len * 0.52;
    const shinLen = len * 0.48;
    ctx.save();
    ctx.translate(hipX, hipY);
    ctx.rotate(hipAngle);
    ctx.fillStyle = pantsColor;
    roundRect(-width / 2, 0, width, thighLen, width * 0.4);
    ctx.fill();

    ctx.translate(0, thighLen * 0.88);
    ctx.rotate(kneeBend);
    ctx.fillStyle = darkenHex(pantsColor, 0.12);
    roundRect(-width * 0.45, 0, width * 0.9, shinLen, width * 0.35);
    ctx.fill();

    // Combat boot
    ctx.fillStyle = bootColor || '#1e293b';
    roundRect(-width * 0.45, shinLen * 0.78, width * 1.15, shinLen * 0.32, width * 0.25);
    ctx.fill();
    ctx.restore();
  }

  function drawLimb(originX, originY, angle, length, width, color) {
    ctx.save();
    ctx.translate(originX, originY);
    ctx.rotate(angle);
    ctx.fillStyle = color;
    roundRect(-width / 2, 0, width, length, width / 2);
    ctx.fill();
    ctx.restore();
  }

  const SKIN_TONE = '#ffe0bd';

  // Helper: Draw cute chibi eyes with blinking & pink rosy cheeks
  function drawChibiFace(headX, headY, headR, expression = 'happy', seed = 0) {
    const isBlinking = Math.sin(state.time * 3.2 + seed * 7) > 0.94;
    // Pink rosy cheeks
    ctx.fillStyle = 'rgba(244, 114, 182, 0.65)';
    ctx.beginPath();
    ctx.ellipse(headX - headR * 0.42, headY + headR * 0.16, headR * 0.18, headR * 0.11, 0, 0, Math.PI * 2);
    ctx.ellipse(headX + headR * 0.52, headY + headR * 0.16, headR * 0.18, headR * 0.11, 0, 0, Math.PI * 2);
    ctx.fill();

    // Eyes
    ctx.fillStyle = '#1e293b';
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 1.6;
    if (isBlinking || expression === 'wink') {
      ctx.beginPath();
      ctx.arc(headX - headR * 0.18, headY + headR * 0.02, headR * 0.14, Math.PI, 0, false);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(headX + headR * 0.36, headY + headR * 0.02, headR * 0.14, Math.PI, 0, false);
      ctx.stroke();
    } else {
      // Big shiny anime eyes
      [-0.18, 0.36].forEach(ox => {
        const ex = headX + headR * ox, ey = headY - headR * 0.02;
        ctx.fillStyle = '#0f172a';
        ctx.beginPath(); ctx.arc(ex, ey, headR * 0.17, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(ex - headR * 0.05, ey - headR * 0.06, headR * 0.07, 0, Math.PI * 2); ctx.fill();
      });
    }

    // Cute tiny mouth
    ctx.strokeStyle = '#9f1239';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.arc(headX + headR * 0.09, headY + headR * 0.2, headR * 0.11, 0.15, Math.PI - 0.15, false);
    ctx.stroke();
  }

  // Stubby cute chibi foot/limb
  function drawChibiStubLimb(originX, originY, angle, len, width, color) {
    ctx.save();
    ctx.translate(originX, originY);
    ctx.rotate(angle);
    ctx.fillStyle = color;
    roundRect(-width / 2, 0, width, len, width * 0.5);
    ctx.fill();
    ctx.strokeStyle = '#451a03';
    ctx.lineWidth = 1.1;
    ctx.stroke();
    ctx.restore();
  }

  // 1 & 2. Chibi Camo Soldier & Cat-Ear Scout (Big round head, rosy cheeks, oversized helmet with leaf or cat ears, toy pop-gun)
  function drawModernSoldier(e, rad, isRunner) {
    const phase = e.bobPhase || 0;
    const swing = Math.sin(phase * Math.PI * 2) * (isRunner ? 0.85 : 0.6);
    const bounce = Math.abs(Math.sin(phase * Math.PI * 2));
    const squashX = 1 + (1 - bounce) * 0.08;
    const squashY = 1 - (1 - bounce) * 0.07;
    const bob = (e.z || 0) * 0.55;

    const legLen = rad * 0.65, legW = rad * 0.34;
    const torsoW = rad * 0.88, torsoH = rad * 0.68;
    const headR = rad * 0.72; // Big adorable 1:1 Chibi head!
    const hipY = -legLen * 0.85 - bob;
    const shoulderY = hipY - torsoH * 0.85;
    const headY = shoulderY - headR * 0.78;
    const uniformColor = e.hitFlash > 0 ? '#ffffff' : (isRunner ? '#facc15' : '#65a30d');

    ctx.save();
    ctx.scale(squashX, squashY);
    if (isRunner) ctx.rotate(0.12);

    // Chubby stubby legs
    drawChibiStubLimb(-torsoW * 0.2, hipY, -swing, legLen, legW, '#451a03');
    drawChibiStubLimb(torsoW * 0.2, hipY, swing, legLen, legW, '#78350f');

    // Cute tiny rucksack
    ctx.fillStyle = isRunner ? '#f97316' : '#a16207';
    roundRect(-torsoW * 0.68, shoulderY + torsoH * 0.05, torsoW * 0.42, torsoH * 0.75, rad * 0.16);
    ctx.fill();
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.3; ctx.stroke();

    // Chubby Bean Torso
    ctx.fillStyle = uniformColor;
    roundRect(-torsoW / 2, shoulderY, torsoW, torsoH, torsoW * 0.42);
    ctx.fill();
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.4; ctx.stroke();

    // Cute toy blaster with orange safety tip
    ctx.save();
    ctx.translate(torsoW * 0.15, shoulderY + torsoH * 0.42);
    ctx.rotate(Math.sin(phase * Math.PI * 4) * 0.08);
    ctx.fillStyle = '#334155';
    roundRect(-rad * 0.2, -rad * 0.14, rad * 0.88, rad * 0.28, rad * 0.1);
    ctx.fill();
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = '#f97316';
    ctx.beginPath(); ctx.arc(rad * 0.72, 0, rad * 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // Big Chibi Head
    ctx.fillStyle = SKIN_TONE;
    ctx.beginPath(); ctx.arc(0, headY, headR, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.5; ctx.stroke();

    drawChibiFace(0, headY, headR, 'happy', e.blinkSeed || 1);

    // Oversized Round Helmet
    ctx.fillStyle = e.hitFlash > 0 ? '#fff' : (isRunner ? '#eab308' : '#4d7c0f');
    ctx.beginPath();
    ctx.arc(0, headY - headR * 0.12, headR * 1.08, Math.PI * 0.94, Math.PI * 0.06, false);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.5; ctx.stroke();

    if (isRunner) {
      // Cute Cat Ears on Scout Helmet!
      [-0.55, 0.55].forEach(cx => {
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.moveTo(cx * headR - headR * 0.22, headY - headR * 0.85);
        ctx.lineTo(cx * headR, headY - headR * 1.38);
        ctx.lineTo(cx * headR + headR * 0.22, headY - headR * 0.85);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#f472b6';
        ctx.beginPath();
        ctx.moveTo(cx * headR - headR * 0.1, headY - headR * 0.9);
        ctx.lineTo(cx * headR, headY - headR * 1.22);
        ctx.lineTo(cx * headR + headR * 0.1, headY - headR * 0.9);
        ctx.closePath(); ctx.fill();
      });
    } else {
      // Little green sprout leaf on top of soldier helmet!
      ctx.strokeStyle = '#15803d'; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.moveTo(0, headY - headR * 1.15); ctx.quadraticCurveTo(3, headY - headR * 1.45, 7, headY - headR * 1.4); ctx.stroke();
      ctx.fillStyle = '#4ade80';
      ctx.beginPath(); ctx.ellipse(8, headY - headR * 1.42, 4.5, 2.5, -0.3, 0, Math.PI * 2); ctx.fill();
    }

    ctx.restore();
    return headY - headR * 1.45;
  }

  // 5. Sweetheart Chibi Nurse Medic (Pink & white uniform, nurse cap with heart, giant band-aid / heart wand)
  function drawCombatMedic(e, rad) {
    const phase = e.bobPhase || 0;
    const swing = Math.sin(phase * Math.PI * 2) * 0.55;
    const bob = (e.z || 0) * 0.55;
    const legLen = rad * 0.62, legW = rad * 0.32;
    const torsoW = rad * 0.9, torsoH = rad * 0.7;
    const headR = rad * 0.72;
    const hipY = -legLen * 0.85 - bob;
    const shoulderY = hipY - torsoH * 0.85;
    const headY = shoulderY - headR * 0.78;

    drawChibiStubLimb(-torsoW * 0.2, hipY, -swing, legLen, legW, '#be185d');
    drawChibiStubLimb(torsoW * 0.2, hipY, swing, legLen, legW, '#ec4899');

    // Cute White & Pink Medical Backpack
    ctx.fillStyle = '#ffffff';
    roundRect(-torsoW * 0.75, shoulderY, torsoW * 0.48, torsoH * 0.8, rad * 0.16);
    ctx.fill();
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.3; ctx.stroke();

    // Nurse Dress Torso
    ctx.fillStyle = e.hitFlash > 0 ? '#fff' : '#fbcfe8';
    roundRect(-torsoW / 2, shoulderY, torsoW, torsoH, torsoW * 0.4);
    ctx.fill();
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.4; ctx.stroke();

    // Red Cross / Heart on Apron
    ctx.fillStyle = '#f43f5e';
    ctx.fillRect(-rad * 0.08, shoulderY + torsoH * 0.24, rad * 0.16, rad * 0.38);
    ctx.fillRect(-rad * 0.2, shoulderY + torsoH * 0.36, rad * 0.4, rad * 0.16);

    // Big Chibi Head
    ctx.fillStyle = SKIN_TONE;
    ctx.beginPath(); ctx.arc(0, headY, headR, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.5; ctx.stroke();
    drawChibiFace(0, headY, headR, 'wink', e.blinkSeed || 2);

    // Cute White Nurse Cap with Red Cross
    ctx.fillStyle = '#ffffff';
    roundRect(-headR * 0.65, headY - headR * 1.25, headR * 1.3, headR * 0.52, headR * 0.2);
    ctx.fill();
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(-headR * 0.08, headY - headR * 1.14, headR * 0.16, headR * 0.32);
    ctx.fillRect(-headR * 0.2, headY - headR * 1.04, headR * 0.4, headR * 0.14);

    return headY - headR * 1.4;
  }

  // 6. Fluffy Bush Ball Chibi Sniper (Walking round leafy bush with glowing cute eyes & flower on top!)
  function drawStealthCommando(e, rad) {
    const phase = e.bobPhase || 0;
    const swing = Math.sin(phase * Math.PI * 2) * 0.65;
    const bob = (e.z || 0) * 0.55;
    const bushR = rad * 0.92;
    const bushY = -bushR * 0.95 - bob;

    drawChibiStubLimb(-rad * 0.24, -rad * 0.45 - bob, -swing, rad * 0.55, rad * 0.3, '#451a03');
    drawChibiStubLimb(rad * 0.24, -rad * 0.45 - bob, swing, rad * 0.55, rad * 0.3, '#451a03');

    // Fluffy Leafy Bush Ball
    ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : '#65a30d';
    ctx.beginPath();
    ctx.arc(0, bushY, bushR, 0, Math.PI * 2);
    ctx.arc(-bushR * 0.45, bushY + bushR * 0.15, bushR * 0.65, 0, Math.PI * 2);
    ctx.arc(bushR * 0.45, bushY + bushR * 0.15, bushR * 0.65, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#365314'; ctx.lineWidth = 1.5; ctx.stroke();

    // Cute peeking eyes inside dark bush slot
    ctx.fillStyle = '#1a2e05';
    roundRect(-bushR * 0.4, bushY - bushR * 0.22, bushR * 0.95, bushR * 0.42, bushR * 0.2);
    ctx.fill();
    ctx.fillStyle = '#fef08a';
    ctx.beginPath();
    ctx.arc(-bushR * 0.08, bushY - bushR * 0.02, bushR * 0.15, 0, Math.PI * 2);
    ctx.arc(bushR * 0.32, bushY - bushR * 0.02, bushR * 0.15, 0, Math.PI * 2);
    ctx.fill();

    // Cute daisy flower on top of bush!
    const fy = bushY - bushR * 1.05;
    ctx.fillStyle = '#f472b6';
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2 + state.time * 2;
      ctx.beginPath(); ctx.arc(Math.cos(a) * 4.5, fy + Math.sin(a) * 4.5, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#fef08a';
    ctx.beginPath(); ctx.arc(0, fy, 2.8, 0, Math.PI * 2); ctx.fill();

    return fy - 8;
  }

  // 7. Wind-Up Toy Bomb Buggy (Chubby yellow toy car with spinning golden clockwork key on back!)
  function drawUGVRover(e, rad) {
    const wheelSpin = state.time * 14;
    const bodyY = -rad * 0.72 - (e.z || 0) * 0.4;
    const bodyW = rad * 1.5, bodyH = rad * 0.75;

    // Golden Wind-Up Clockwork Key spinning on the back!
    const keyScale = Math.cos(state.time * 9);
    ctx.save();
    ctx.translate(-bodyW * 0.58, bodyY - bodyH * 0.25);
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 2;
    ctx.fillStyle = '#facc15';
    ctx.beginPath();
    ctx.ellipse(-4, -5, 5, Math.max(1.5, Math.abs(keyScale) * 5), 0, 0, Math.PI * 2);
    ctx.ellipse(-4, 5, 5, Math.max(1.5, Math.abs(keyScale) * 5), 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.restore();

    // Chubby Yellow Toy Buggy Body
    ctx.fillStyle = e.hitFlash > 0 ? '#fff' : '#f59e0b';
    roundRect(-bodyW / 2, bodyY - bodyH / 2, bodyW, bodyH, rad * 0.32);
    ctx.fill();
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.6; ctx.stroke();

    // Big Cartoon Bomb with Sparkling Fuse on Roof
    ctx.fillStyle = '#1e293b';
    ctx.beginPath(); ctx.arc(0, bodyY - bodyH * 0.68, rad * 0.44, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.4; ctx.stroke();
    // Sparkling fuse
    ctx.fillStyle = (Math.floor(state.time * 16) % 2 === 0) ? '#fef08a' : '#ef4444';
    ctx.beginPath(); ctx.arc(0, bodyY - bodyH * 1.25, rad * 0.2, 0, Math.PI * 2); ctx.fill();

    // Chubby Toy Wheels
    const wheelR = rad * 0.34;
    [-0.38, 0.38].forEach(wx => {
      const cx = bodyW * wx, cy = bodyY + bodyH * 0.38;
      ctx.fillStyle = '#1e293b';
      ctx.beginPath(); ctx.arc(cx, cy, wheelR, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = '#fde047';
      ctx.beginPath(); ctx.arc(cx, cy, wheelR * 0.42, 0, Math.PI * 2); ctx.fill();
    });

    return bodyY - bodyH * 1.5;
  }

  // 3. Cute Chibi Mini-Tank (Metal Slug / Advance Wars style chubby tank with commander peeking out!)
  function drawMainBattleTank(e, rad) {
    const bob = (e.z || 0) * 0.35;
    const hullW = rad * 1.78, hullH = rad * 0.72;
    const hullY = -rad * 0.38 - bob;

    // Chubby rounded caterpillar tracks
    const trackH = rad * 0.48;
    ctx.fillStyle = '#334155';
    roundRect(-hullW * 0.48, -trackH, hullW * 0.96, trackH, trackH * 0.48);
    ctx.fill();
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.6; ctx.stroke();

    // Cute yellow bogie wheels
    for (let i = -1; i <= 1; i++) {
      ctx.fillStyle = '#facc15';
      ctx.beginPath(); ctx.arc(i * (hullW * 0.26), -trackH * 0.5, trackH * 0.32, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.2; ctx.stroke();
    }

    // Chubby Rounded Tank Hull
    const armorColor = e.hitFlash > 0 ? '#ffffff' : '#65a30d';
    ctx.fillStyle = armorColor;
    roundRect(-hullW * 0.5, hullY - hullH * 0.75, hullW, hullH * 0.8, rad * 0.28);
    ctx.fill();
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.6; ctx.stroke();

    // Stubby Flared Cannon Barrel
    const turretY = hullY - hullH * 0.7;
    const turretW = hullW * 0.64, turretH = hullH * 0.78;
    ctx.fillStyle = '#4d7c0f';
    roundRect(turretW * 0.25, turretY - turretH * 0.65, hullW * 0.52, rad * 0.32, rad * 0.12);
    ctx.fill();
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.5; ctx.stroke();

    // Round Bubble Turret with White Star Emblem
    ctx.fillStyle = '#84cc16';
    roundRect(-turretW * 0.5, turretY - turretH, turretW, turretH, turretH * 0.45);
    ctx.fill();
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.6; ctx.stroke();

    // Cute Commander Head Peeking from Cupola!
    const cmdY = turretY - turretH - rad * 0.22;
    ctx.fillStyle = SKIN_TONE;
    ctx.beginPath(); ctx.arc(0, cmdY, rad * 0.28, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = '#365314';
    ctx.beginPath(); ctx.arc(0, cmdY - rad * 0.05, rad * 0.3, Math.PI, 0, false); ctx.fill(); ctx.stroke();

    return cmdY - rad * 0.45;
  }

  // 8. Giant Rubber-Duck / King Chibi Twin-Cannon Fortress Tank Boss!
  function drawHeavyCommandTank(e, rad) {
    const bob = (e.z || 0) * 0.28;
    const hullW = rad * 2.15, hullH = rad * 0.88;
    const hullY = -rad * 0.42 - bob;
    const mainColor = e.hitFlash > 0 ? '#ffffff' : (e.enraged ? '#f97316' : '#ef4444');

    if (e.enraged) {
      ctx.save();
      ctx.strokeStyle = '#facc15'; ctx.lineWidth = 3;
      ctx.setLineDash([6, 4]);
      ctx.beginPath(); ctx.ellipse(0, hullY - hullH * 0.55, hullW * 0.68, hullH * 1.4, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    // Giant Toy Tracks
    const trackH = rad * 0.52;
    ctx.fillStyle = '#1e293b';
    roundRect(-hullW * 0.5, -trackH, hullW, trackH, trackH * 0.48);
    ctx.fill();
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.8; ctx.stroke();
    for (let i = -2; i <= 2; i++) {
      ctx.fillStyle = '#facc15';
      ctx.beginPath(); ctx.arc(i * (hullW * 0.18), -trackH * 0.5, trackH * 0.34, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.3; ctx.stroke();
    }

    // Fortress Armored Hull
    ctx.fillStyle = mainColor;
    roundRect(-hullW * 0.5, hullY - hullH, hullW, hullH, rad * 0.28);
    ctx.fill();
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.8; ctx.stroke();

    // Twin Chubby Gold-Tipped Cannons
    const turretY = hullY - hullH;
    const turretW = hullW * 0.68, turretH = hullH * 0.85;
    ctx.fillStyle = '#334155';
    roundRect(turretW * 0.2, turretY - turretH * 0.72, hullW * 0.58, rad * 0.24, 4); ctx.fill(); ctx.stroke();
    roundRect(turretW * 0.2, turretY - turretH * 0.38, hullW * 0.58, rad * 0.24, 4); ctx.fill(); ctx.stroke();

    // Cute Yellow Duck-Themed Boss Turret + Golden Crown!
    ctx.fillStyle = '#facc15';
    roundRect(-turretW * 0.5, turretY - turretH, turretW, turretH, turretH * 0.45);
    ctx.fill();
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.8; ctx.stroke();
    // Cute duck bill & angry/cute boss eyes on turret
    ctx.fillStyle = '#f97316';
    roundRect(turretW * 0.25, turretY - turretH * 0.52, rad * 0.36, rad * 0.22, 4);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(turretW * 0.15, turretY - turretH * 0.65, rad * 0.13, 0, Math.PI * 2); ctx.fill();

    // Golden King Crown on top of Boss!
    const crY = turretY - turretH;
    ctx.fillStyle = '#fde047';
    ctx.beginPath();
    ctx.moveTo(-rad * 0.35, crY);
    ctx.lineTo(-rad * 0.42, crY - rad * 0.38);
    ctx.lineTo(-rad * 0.15, crY - rad * 0.18);
    ctx.lineTo(0, crY - rad * 0.45);
    ctx.lineTo(rad * 0.15, crY - rad * 0.18);
    ctx.lineTo(rad * 0.42, crY - rad * 0.38);
    ctx.lineTo(rad * 0.35, crY);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    return crY - rad * 0.58;
  }

  // 4. Chubby Bumblebee / Bubble Helicopter (Round glass bubble nose with smiling eyes & spinning rotor)
  function drawAttackHelicopter(e, rad) {
    const bodyW = rad * 1.65, bodyH = rad * 0.92;
    const propAngle = e.propAngle || 0;
    const hullColor = e.hitFlash > 0 ? '#ffffff' : '#38bdf8';

    ctx.save();
    ctx.rotate(0.06);

    // Cute stubby tail boom & tail propeller
    ctx.fillStyle = '#0284c7';
    roundRect(-bodyW * 0.85, -bodyH * 0.22, bodyW * 0.55, bodyH * 0.32, 5);
    ctx.fill();
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.5; ctx.stroke();

    ctx.fillStyle = '#facc15';
    ctx.beginPath(); ctx.arc(-bodyW * 0.82, -bodyH * 0.06, rad * 0.26, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    // Landing skids
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-bodyW * 0.32, bodyH * 0.62); ctx.lineTo(bodyW * 0.38, bodyH * 0.62);
    ctx.moveTo(-bodyW * 0.16, bodyH * 0.35); ctx.lineTo(-bodyW * 0.16, bodyH * 0.62);
    ctx.moveTo(bodyW * 0.18, bodyH * 0.35); ctx.lineTo(bodyW * 0.18, bodyH * 0.62);
    ctx.stroke();

    // Chubby Egg-Shaped Helicopter Body
    ctx.fillStyle = hullColor;
    ctx.beginPath();
    ctx.ellipse(0, 0, bodyW * 0.55, bodyH * 0.52, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.6; ctx.stroke();

    // Cute Big Eyes & Rosy Cheeks on the Helicopter Nose!
    drawChibiFace(bodyW * 0.12, -bodyH * 0.04, rad * 0.65, 'happy', e.blinkSeed || 3);

    // Top Spinning Toy Propeller
    const rotorY = -bodyH * 0.58;
    const rotorR = rad * 1.45;
    ctx.fillStyle = '#facc15';
    ctx.fillRect(-rad * 0.1, -bodyH * 0.58, rad * 0.2, bodyH * 0.18);

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2.8;
    for (let i = 0; i < 2; i++) {
      const a = propAngle + i * (Math.PI / 2);
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * rotorR, rotorY + Math.sin(a) * rotorR * 0.3);
      ctx.lineTo(-Math.cos(a) * rotorR, rotorY - Math.sin(a) * rotorR * 0.3);
      ctx.stroke();
    }

    ctx.restore();
    return -bodyH * 0.72 - rad * 0.35;
  }

  function drawCharacter(e) {
    const rad = e.radius * tileW;
    const shadowScale = e.flying ? Math.max(0.25, 1 - e.z / (tileW * 1.7)) : 1;
    const groundY = e.flying ? e.y + e.z : e.y;

    // Crisp cartoon ground shadow
    ctx.beginPath();
    ctx.ellipse(e.x, groundY + 2, rad * (e.isVehicle ? 1.2 : 0.85) * shadowScale, rad * 0.42 * shadowScale, 0, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(15, 23, 42, ${0.32 * shadowScale})`;
    ctx.fill();

    const facingDir = Math.cos(e.facing || 0) >= 0 ? 1 : -1;

    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.scale(facingDir, 1);

    let topY;
    switch (e.type) {
      case 'flyer':   topY = drawAttackHelicopter(e, rad); break;
      case 'tank':    topY = drawMainBattleTank(e, rad); break;
      case 'bomber':  topY = drawUGVRover(e, rad); break;
      case 'phantom': topY = drawStealthCommando(e, rad); break;
      case 'medic':   topY = drawCombatMedic(e, rad); break;
      case 'boss':    topY = drawHeavyCommandTank(e, rad); break;
      case 'runner':  topY = drawModernSoldier(e, rad, true); break;
      default:        topY = drawModernSoldier(e, rad, false); break;
    }

    // Snowflake slow icon overlay
    if (state.time < e.slowUntil) {
      ctx.save();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.setLineDash([3, 3]);
      ctx.strokeRect(-rad * 1.1, topY - 4, rad * 2.2, -topY + 4);
      ctx.setLineDash([]);
      ctx.restore();
    }

    // Cute Cartoon Rounded Health & Shield Bar
    ctx.scale(facingDir, 1);
    const barW = rad * 1.7, barH = 5.2;
    const barX = -barW / 2, barY = topY - 10;
    const pct = Math.max(0, e.hp / e.maxHp);
    roundRect(barX, barY, barW, barH, 3);
    ctx.fillStyle = '#451a03'; ctx.fill();
    roundRect(barX + 1, barY + 1, Math.max(0, (barW - 2) * pct), barH - 2, 2);
    ctx.fillStyle = pct > 0.5 ? '#4ade80' : (pct > 0.25 ? '#facc15' : '#ef4444');
    ctx.fill();
    if (e.shield > 0 && e.maxShield > 0) {
      const sPct = Math.min(1, e.shield / e.maxShield);
      roundRect(barX, barY - 5, barW * sPct, 3.5, 2);
      ctx.fillStyle = '#38bdf8'; ctx.fill();
    }

    ctx.restore();
  }

  // Draw Cute Chibi Military Towers & Operators
  function drawTower3D(t) {
    const stats = towerStats(t);
    const pos = cellToPx(t.c, t.r);

    if (state.selectedTower === t) {
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(pos.x, pos.y, stats.range, stats.range * 0.5, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(74, 222, 128, 0.15)'; ctx.fill();
      ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 2.5;
      ctx.setLineDash([6, 4]); ctx.stroke();

      if (stats.chainRange) {
        ctx.beginPath();
        ctx.ellipse(pos.x, pos.y, stats.chainRange, stats.chainRange * 0.5, 0, 0, Math.PI * 2);
        ctx.strokeStyle = '#38bdf8'; ctx.stroke();
      }
      ctx.restore();
    }

    const scalePop = t.buildAnim > 0 ? (1 + Math.sin(t.buildAnim * Math.PI) * 0.28) : 1;
    const pedW = tileW * 0.74 * scalePop, pedH = tileH * 0.74 * scalePop;
    const pH = tileW * 0.36 * scalePop;
    const topY = pos.y - pH;

    let topColor = '#fde68a', leftColor = '#f59e0b', rightColor = '#d97706';
    if (t.type === 'gatling') {
      topColor = '#fde68a'; leftColor = '#d97706'; rightColor = '#b45309'; // Cute Sandbag Fort
    } else if (t.type === 'cannon') {
      topColor = '#fdba74'; leftColor = '#ea580c'; rightColor = '#c2410c'; // Chubby Mortar Pad
    } else if (t.type === 'frost') {
      topColor = '#bae6fd'; leftColor = '#0284c7'; rightColor = '#0369a1'; // Penguin Ice Block
    } else if (t.type === 'sniper') {
      topColor = '#d9f99d'; leftColor = '#65a30d'; rightColor = '#4d7c0f'; // Treehouse Base
    } else if (t.type === 'lightning') {
      topColor = '#c7d2fe'; leftColor = '#4f46e5'; rightColor = '#3730a3'; // Tesla Toy Base
    } else if (t.type === 'flak') {
      topColor = '#bbf7d0'; leftColor = '#16a34a'; rightColor = '#15803d'; // Rocket Pad
    }

    // Toy Block Pedestal
    ctx.fillStyle = leftColor;
    ctx.beginPath();
    ctx.moveTo(pos.x - pedW / 2, pos.y);
    ctx.lineTo(pos.x, pos.y + pedH / 2);
    ctx.lineTo(pos.x, topY + pedH / 2);
    ctx.lineTo(pos.x - pedW / 2, topY);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = rightColor;
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y + pedH / 2);
    ctx.lineTo(pos.x + pedW / 2, pos.y);
    ctx.lineTo(pos.x + pedW / 2, topY);
    ctx.lineTo(pos.x, topY + pedH / 2);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = topColor;
    ctx.beginPath();
    ctx.moveTo(pos.x, topY - pedH / 2);
    ctx.lineTo(pos.x + pedW / 2, topY);
    ctx.lineTo(pos.x, topY + pedH / 2);
    ctx.lineTo(pos.x - pedW / 2, topY);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.4; ctx.stroke();

    // Cute Chibi Weapon & Operator on Top!
    ctx.save();
    ctx.translate(pos.x, topY);

    if (t.type === 'gatling') {
      // Cute Chibi Gunner Helmet peeking behind rotary gun
      ctx.fillStyle = '#65a30d';
      ctx.beginPath(); ctx.arc(-3, -4, 6.5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.4; ctx.stroke();

      ctx.rotate(t.facing || 0);
      const rec = (t.recoil || 0) * 3;
      ctx.fillStyle = '#facc15';
      roundRect(-6 - rec, -5.5, 11, 11, 4); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#334155';
      ctx.fillRect(4 - rec, -4, 12, 2.5);
      ctx.fillRect(4 - rec, 1.5, 12, 2.5);
      if (t.muzzleFlash > 0) {
        ctx.fillStyle = '#fef08a';
        ctx.beginPath(); ctx.arc(18 - rec, 0, 5.5, 0, Math.PI * 2); ctx.fill();
      }
    } else if (t.type === 'cannon') {
      ctx.rotate(t.facing || 0);
      const rec = (t.recoil || 0) * 5;
      // Chubby Pot-Belly Mortar Cannon
      ctx.fillStyle = '#1e293b';
      ctx.beginPath(); ctx.arc(-2 - rec * 0.5, 0, 8.5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.6; ctx.stroke();
      ctx.fillStyle = '#334155';
      roundRect(1 - rec, -5.5, 15, 11, 3); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#f97316';
      roundRect(13 - rec, -6.5, 4.5, 13, 2); ctx.fill(); ctx.stroke();
    } else if (t.type === 'frost') {
      // Cute Chibi Penguin Snowblower!
      ctx.fillStyle = '#1e293b';
      ctx.beginPath(); ctx.arc(0, -3, 7.5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.4; ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(0, -2, 5.2, 0, Math.PI * 2); ctx.fill();
      ctx.rotate(t.facing || 0);
      ctx.fillStyle = '#38bdf8';
      roundRect(2, -4, 12, 8, 3); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#f97316'; // Penguin beak
      ctx.beginPath(); ctx.arc(3, 0, 3, 0, Math.PI * 2); ctx.fill();
    } else if (t.type === 'sniper') {
      // Cute Cat-Ear Chibi Sniper on Wooden Watchtower
      ctx.fillStyle = '#4d7c0f';
      ctx.beginPath(); ctx.arc(-2, -4, 6.8, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.4; ctx.stroke();
      ctx.rotate(t.facing || 0);
      const rec = (t.recoil || 0) * 4;
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(2 - rec, -2, 21, 4);
      ctx.fillStyle = '#ef4444';
      ctx.beginPath(); ctx.arc(7 - rec, -3.5, 3, 0, Math.PI * 2); ctx.fill();
    } else if (t.type === 'lightning') {
      // Cute Bouncing Plasma Toy Orb with Smiling Face!
      const pulseR = 7.5 + Math.sin(state.time * 8) * 1.2;
      ctx.fillStyle = '#60a5fa';
      ctx.beginPath(); ctx.arc(0, -4, pulseR, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = '#fef08a';
      ctx.beginPath(); ctx.arc(-2.5, -5, 1.5, 0, Math.PI * 2); ctx.arc(2.5, -5, 1.5, 0, Math.PI * 2); ctx.fill();
    } else if (t.type === 'flak') {
      // Chubby Red-Nose Mini-Rocket Box
      ctx.rotate(t.facing || 0);
      const rec = (t.recoil || 0) * 3;
      ctx.fillStyle = '#ffffff';
      roundRect(-7 - rec, -7, 15, 14, 4); ctx.fill();
      ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(8 - rec, -3.5, 3, 0, Math.PI * 2);
      ctx.arc(8 - rec, 3.5, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();

    if (state.time < t.disabledUntil) {
      ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2;
      ctx.strokeRect(pos.x - pedW / 2, topY - pedH / 2, pedW, pedH + pH);
    }

    if (t.level > 1) {
      ctx.fillStyle = '#facc15'; ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.strokeStyle = '#451a03'; ctx.lineWidth = 2.5;
      const starTxt = t.level === 3 ? '★★★' : '★★';
      ctx.strokeText(starTxt, pos.x, topY - pedH / 2 - 9);
      ctx.fillText(starTxt, pos.x, topY - pedH / 2 - 9);
    }
  }

  // Cute Striped Circus/Camp Tent Outpost Entrance
  function drawForwardOutpost3D(pos) {
    ctx.save();
    ctx.translate(pos.x, pos.y);
    ctx.beginPath();
    ctx.ellipse(0, 0, tileW * 0.46, tileH * 0.46, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#fde68a'; ctx.fill();
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 2; ctx.stroke();

    // Cute Striped Military Tent
    const tw = tileW * 0.56, th = tileW * 0.42;
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.moveTo(-tw / 2, 0);
    ctx.lineTo(0, -th);
    ctx.lineTo(tw / 2, 0);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // Tent entrance flap
    ctx.fillStyle = '#451a03';
    ctx.beginPath();
    ctx.moveTo(-tw * 0.22, 0);
    ctx.lineTo(0, -th * 0.55);
    ctx.lineTo(tw * 0.22, 0);
    ctx.closePath();
    ctx.fill();

    // Waving little red flag on top
    const wave = Math.sin(state.time * 6) * 3;
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(0, -th); ctx.lineTo(0, -th - 10); ctx.stroke();
    ctx.fillStyle = '#facc15';
    ctx.beginPath();
    ctx.moveTo(0, -th - 10);
    ctx.lineTo(10, -th - 6 + wave);
    ctx.lineTo(0, -th - 2);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // Cute Toy Command Castle HQ with Heart Flag & Spinning Radar!
  function drawCommandHQ3D(pos) {
    ctx.save();
    ctx.translate(pos.x, pos.y);

    ctx.beginPath();
    ctx.ellipse(0, 0, tileW * 0.52, tileH * 0.52, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#bbf7d0'; ctx.fill();
    ctx.strokeStyle = '#14532d'; ctx.lineWidth = 2; ctx.stroke();

    // Cute Cream & Blue Roof Toy Castle HQ
    const bw = tileW * 0.62, bh = tileW * 0.44;
    ctx.fillStyle = '#fffbeb';
    roundRect(-bw / 2, -bh, bw, bh, 6);
    ctx.fill();
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 2; ctx.stroke();

    // Cute arched door & windows
    ctx.fillStyle = '#38bdf8';
    roundRect(-bw * 0.34, -bh * 0.72, bw * 0.68, bh * 0.26, 3);
    ctx.fill(); ctx.stroke();

    // Cute Conical Blue Roof
    ctx.fillStyle = '#2563eb';
    ctx.beginPath();
    ctx.moveTo(-bw * 0.58, -bh);
    ctx.lineTo(0, -bh * 1.55);
    ctx.lineTo(bw * 0.58, -bh);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // Waving Golden Star/Heart Flag on Top
    const flagY = -bh * 1.55;
    const wave = Math.sin(state.time * 5) * 3;
    ctx.beginPath(); ctx.moveTo(0, flagY); ctx.lineTo(0, flagY - 12); ctx.stroke();
    ctx.fillStyle = '#f43f5e';
    ctx.beginPath();
    ctx.moveTo(0, flagY - 12);
    ctx.lineTo(13, flagY - 7 + wave);
    ctx.lineTo(0, flagY - 2);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    ctx.restore();
  }

  function drawObstacle3D(d) {
    const pos = cellToPx(d.c, d.r);
    const sway = Math.sin(state.time * 2.4 + d.c * 0.7 + d.r * 0.5) * 1.8;

    if (d.type === 'windmill') {
      // Cute Dutch Windmill with Spinning Blades!
      const h = tileW * 0.58, w = tileW * 0.32;
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.moveTo(pos.x - w / 2, pos.y);
      ctx.lineTo(pos.x - w * 0.32, pos.y - h);
      ctx.lineTo(pos.x + w * 0.32, pos.y - h);
      ctx.lineTo(pos.x + w / 2, pos.y);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.5; ctx.stroke();

      ctx.save();
      ctx.translate(pos.x, pos.y - h * 0.78);
      ctx.rotate(state.time * 1.8 + d.seed * 5);
      ctx.fillStyle = '#fef08a';
      for (let i = 0; i < 4; i++) {
        ctx.rotate(Math.PI / 2);
        roundRect(-2, 0, 4, tileW * 0.38, 1.5);
        ctx.fill(); ctx.stroke();
      }
      ctx.restore();
    } else if (d.type === 'snowman') {
      // Cute Chibi Snowman with Red Scarf!
      const r1 = tileW * 0.2, r2 = tileW * 0.14;
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(pos.x, pos.y - r1 * 0.8, r1, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(pos.x, pos.y - r1 * 1.9, r2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(pos.x - r2 * 0.9, pos.y - r1 * 1.4, r2 * 1.8, 3.5);
    } else if (d.type === 'palmtree') {
      const h = tileW * 0.52;
      ctx.strokeStyle = '#92400e'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(pos.x, pos.y); ctx.quadraticCurveTo(pos.x + 4, pos.y - h * 0.5, pos.x + sway, pos.y - h); ctx.stroke();
      ctx.fillStyle = '#22c55e';
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2 + 0.3;
        ctx.beginPath();
        ctx.ellipse(pos.x + sway + Math.cos(a) * 8, pos.y - h + Math.sin(a) * 4, 8, 3.5, a, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (d.type === 'rock' || d.type === 'sandrock' || d.type === 'icerock') {
      const sz = tileW * 0.26;
      ctx.fillStyle = d.type === 'sandrock' ? '#f59e0b' : (d.type === 'icerock' ? '#bae6fd' : '#94a3b8');
      ctx.beginPath();
      ctx.arc(pos.x, pos.y - sz * 0.45, sz, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.4; ctx.stroke();
    } else if (d.type === 'pinetree' || d.type === 'snowpine') {
      const h = tileW * 0.55, w = tileW * 0.22;
      ctx.fillStyle = '#78350f';
      ctx.fillRect(pos.x - w * 0.16, pos.y - h * 0.18, w * 0.32, h * 0.22);
      for (let i = 0; i < 3; i++) {
        const ty = pos.y - h * 0.15 - i * h * 0.26;
        const tw = w * (1.2 - i * 0.26);
        ctx.fillStyle = d.type === 'snowpine' ? (i === 2 ? '#ffffff' : '#38bdf8') : '#22c55e';
        ctx.beginPath();
        ctx.moveTo(pos.x - tw + sway * 0.3, ty);
        ctx.lineTo(pos.x + sway * (0.5 + i * 0.2), ty - h * 0.4);
        ctx.lineTo(pos.x + tw + sway * 0.3, ty);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.2; ctx.stroke();
      }
    } else if (d.type === 'roundtree') {
      const h = tileW * 0.48, r = tileW * 0.24;
      ctx.fillStyle = '#78350f';
      ctx.fillRect(pos.x - r * 0.18, pos.y - h * 0.38, r * 0.36, h * 0.42);
      const fy = pos.y - h * 0.58;
      ctx.fillStyle = '#4ade80';
      ctx.beginPath(); ctx.arc(pos.x + sway * 0.5, fy, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#14532d'; ctx.lineWidth = 1.5; ctx.stroke();
      // Cute red apples on tree!
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(pos.x - r * 0.35 + sway * 0.5, fy - r * 0.1, 2.5, 0, Math.PI * 2);
      ctx.arc(pos.x + r * 0.3 + sway * 0.5, fy + r * 0.2, 2.5, 0, Math.PI * 2);
      ctx.fill();
    } else if (d.type === 'cactus') {
      const h = tileW * 0.42;
      ctx.fillStyle = '#22c55e';
      roundRect(pos.x - 3.5, pos.y - h, 7, h, 3.5); ctx.fill();
      ctx.strokeStyle = '#14532d'; ctx.lineWidth = 1.2; ctx.stroke();
      // Cute pink flower on cactus top
      ctx.fillStyle = '#f472b6';
      ctx.beginPath(); ctx.arc(pos.x, pos.y - h - 2, 3, 0, Math.PI * 2); ctx.fill();
    } else if (d.type === 'oilbarrel' || d.type === 'bunkerprop') {
      const w = tileW * 0.28, h = tileW * 0.26;
      ctx.fillStyle = d.type === 'oilbarrel' ? '#ef4444' : '#facc15';
      roundRect(pos.x - w / 2, pos.y - h, w, h, 4); ctx.fill();
      ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.4; ctx.stroke();
    } else if (d.type === 'mushroom') {
      // Cute Red Polka-Dot Mushroom!
      ctx.fillStyle = '#fef3c7';
      ctx.fillRect(pos.x - 2, pos.y - 5, 4, 5);
      ctx.fillStyle = '#ef4444';
      ctx.beginPath(); ctx.arc(pos.x, pos.y - 5, 5.5, Math.PI, 0, false); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(pos.x - 2, pos.y - 7, 1.3, 0, Math.PI * 2); ctx.arc(pos.x + 2, pos.y - 6.5, 1.3, 0, Math.PI * 2); ctx.fill();
    } else if (d.type === 'flower') {
      ctx.fillStyle = d.seed > 0.5 ? '#f472b6' : '#facc15';
      ctx.beginPath(); ctx.arc(pos.x + sway * 0.4, pos.y - 3, 3.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(pos.x + sway * 0.4, pos.y - 3, 1.3, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.strokeStyle = '#16a34a';
      ctx.lineCap = 'round';
      for (let i = -1; i <= 1; i++) {
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(pos.x + i * 3, pos.y + 1);
        ctx.quadraticCurveTo(pos.x + i * 3 + sway, pos.y - 5, pos.x + i * 4 + sway * 1.2, pos.y - 8);
        ctx.stroke();
      }
    }
  }

  // ---------- Main Render Pipeline ----------
  function render() {
    ctx.clearRect(0, 0, W, H);

    // Bright Cheerful Cartoon Backdrop
    const bgGrad = ctx.createRadialGradient(W / 2, H / 2, 80, W / 2, H / 2, Math.max(W, H) * 0.78);
    bgGrad.addColorStop(0, curLevel.theme.bg0);
    bgGrad.addColorStop(1, curLevel.theme.bg1);
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // Camera Transform
    ctx.save();
    let shakeX = 0, shakeY = 0;
    if (state.screenShake > 0) {
      shakeX = (Math.random() - 0.5) * 12 * (state.screenShake / 0.45);
      shakeY = (Math.random() - 0.5) * 12 * (state.screenShake / 0.45);
    }
    ctx.translate(W / 2 + camera.x + shakeX, H / 2 + camera.y + shakeY);
    ctx.scale(camera.scale, camera.scale);
    ctx.translate(-W / 2, -H / 2);

    // 1. Geological Earth Strata Base
    drawEarthTerrainSlab();

    // 2. Render 29x19 3D Grid Blocks (Grass, Paths, Sparkling Rivers, Wooden Bridges & High-Grounds!)
    const hoverCell = state.selectedBuildType && state.hover ? state.hover : null;

    for (let depth = 0; depth < COLS + ROWS; depth++) {
      for (let r = 0; r < ROWS; r++) {
        const c = depth - r;
        if (c < 0 || c >= COLS) continue;

        const k = keyOf(c, r);
        const isPath = pathSet.has(k);
        const isWater = waterSet.has(k);
        const isBridge = bridgeSet.has(k);
        const isHigh = highgroundSet.has(k);
        const isHovered = hoverCell && hoverCell.c === c && hoverCell.r === r;

        const baseLift = cellLiftZ(c, r);
        const liftZ = baseLift + (isHovered ? 8 : 0);

        let topStyle, leftStyle, rightStyle;
        if (isBridge) {
          topStyle = '#d97706'; leftStyle = '#92400e'; rightStyle = '#78350f';
        } else if (isWater) {
          const isAlt = (c + r + Math.floor(state.time * 2)) % 2 === 0;
          topStyle = isAlt ? curLevel.theme.waterTop : curLevel.theme.waterAlt;
          leftStyle = curLevel.theme.waterLeft;
          rightStyle = curLevel.theme.waterRight;
        } else if (isPath) {
          topStyle = curLevel.theme.pathTop;
          leftStyle = curLevel.theme.pathLeft;
          rightStyle = curLevel.theme.pathRight;
        } else if (isHigh) {
          topStyle = curLevel.theme.highTop;
          leftStyle = curLevel.theme.highLeft;
          rightStyle = curLevel.theme.highRight;
        } else {
          const isAlt = (c + r) % 2 === 0;
          topStyle = isAlt ? curLevel.theme.top : curLevel.theme.alt;
          leftStyle = curLevel.theme.left;
          rightStyle = curLevel.theme.right;
        }

        drawIsoBlock(c, r, topStyle, leftStyle, rightStyle, blockDepth + Math.max(0, baseLift), liftZ);

        const pos = cellToPx(c, r, isHovered ? 8 : 0);

        // Wooden Bridge Planks & Railings
        if (isBridge) {
          ctx.strokeStyle = '#fef3c7';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(pos.x - tileW * 0.22, pos.y - tileH * 0.22);
          ctx.lineTo(pos.x + tileW * 0.22, pos.y + tileH * 0.22);
          ctx.stroke();
        } else if (isPath) {
          // Cute Stepping Stones / Dashed Trail Line
          const dir = pathDirMap.get(k);
          ctx.strokeStyle = curLevel.theme.pathLine;
          ctx.lineWidth = 2.0;
          ctx.beginPath();
          if (dir && (dir.dc !== 0 || dir.dr !== 0)) {
            const nextPos = cellToPx(c + dir.dc * 0.26, r + dir.dr * 0.26, isHovered ? 8 : 0);
            const prevPos = cellToPx(c - dir.dc * 0.26, r - dir.dr * 0.26, isHovered ? 8 : 0);
            ctx.moveTo(prevPos.x, prevPos.y);
            ctx.lineTo(nextPos.x, nextPos.y);
          } else {
            ctx.arc(pos.x, pos.y, 2, 0, Math.PI * 2);
          }
          ctx.stroke();
        } else if (isWater) {
          // Animated Water Sparkles
          if ((c * 7 + r * 13 + Math.floor(state.time * 3)) % 5 === 0) {
            ctx.strokeStyle = 'rgba(255,255,255,0.55)';
            ctx.lineWidth = 1.3;
            ctx.beginPath();
            ctx.moveTo(pos.x - 4, pos.y);
            ctx.lineTo(pos.x + 4, pos.y);
            ctx.stroke();
          }
        } else if (isHigh && !towerAt.has(k)) {
          // High-ground +15% Range target badge
          ctx.fillStyle = 'rgba(255, 251, 235, 0.75)';
          ctx.font = 'bold 9px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('▲+15%', pos.x, pos.y + 3);
        }
      }
    }

    // 2.5 Ground Scorch Marks
    for (const sm of state.scorchMarks) {
      ctx.save();
      ctx.globalAlpha = Math.min(0.4, (sm.life / sm.maxLife) * 0.45);
      ctx.fillStyle = '#451a03';
      ctx.beginPath();
      ctx.ellipse(sm.x, sm.y, sm.r, sm.r * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 3. Air Tactical Corridors
    for (const airPts of airPathsPoints) {
      if (airPts.length > 1) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.48)';
        ctx.lineWidth = Math.max(2, tileW * 0.07);
        ctx.setLineDash([tileW * 0.35, tileW * 0.25]);
        ctx.lineDashOffset = -state.time * tileW * 1.5;
        ctx.beginPath();
        ctx.moveTo(airPts[0].x, airPts[0].y);
        for (let i = 1; i < airPts.length; i++) ctx.lineTo(airPts[i].x, airPts[i].y);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
      }
    }

    // 4. Forward Outpost Entrances & Command HQ
    const startKeys = new Set();
    const endKeys = new Set();
    for (const gPath of groundPaths) {
      if (gPath.length > 0) {
        startKeys.add(keyOf(gPath[0].c, gPath[0].r));
        endKeys.add(keyOf(gPath[gPath.length - 1].c, gPath[gPath.length - 1].r));
      }
    }
    for (const k of startKeys) {
      const [c, r] = k.split(",").map(Number);
      drawForwardOutpost3D(cellToPx(c, r));
    }
    for (const k of endKeys) {
      const [c, r] = k.split(",").map(Number);
      drawCommandHQ3D(cellToPx(c, r));
    }

    // 6. Build Hologram Preview
    if (hoverCell && inGrid(hoverCell.c, hoverCell.r)) {
      const ok = canBuild(hoverCell.c, hoverCell.r) && state.gold >= TOWER_TYPES[state.selectedBuildType].cost;
      const pos = cellToPx(hoverCell.c, hoverCell.r, 8);
      const rangePx = TOWER_TYPES[state.selectedBuildType].range * cellUnit;

      ctx.save();
      ctx.beginPath();
      ctx.ellipse(pos.x, pos.y, rangePx, rangePx * 0.5, 0, 0, Math.PI * 2);
      ctx.fillStyle = ok ? 'rgba(74, 222, 128, 0.14)' : 'rgba(239, 68, 68, 0.14)';
      ctx.fill();
      ctx.strokeStyle = ok ? '#4ade80' : '#ef4444';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.font = '20px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.globalAlpha = 0.8;
      ctx.fillText(TOWER_TYPES[state.selectedBuildType].icon, pos.x, pos.y - tileW * 0.35);
      ctx.restore();
    }

    // 7. Depth-Sorted Scene Objects
    const renderList = [];
    for (const d of decorations) {
      renderList.push({ type: 'obstacle', depth: d.c + d.r, item: d });
    }
    for (const t of state.towers) {
      renderList.push({ type: 'tower', depth: t.c + t.r + 0.5, item: t });
    }
    for (const e of state.enemies) {
      const effR = (e.y + (e.flying ? e.z : 0) - Y_center) / tileH;
      const effC = (e.x - X_center) / tileW;
      const depth = effC + effR;
      renderList.push({ type: 'enemy', depth: e.flying ? depth + 4 : depth, item: e });
    }
    renderList.sort((a, b) => a.depth - b.depth);

    for (const entity of renderList) {
      if (entity.type === 'obstacle') drawObstacle3D(entity.item);
      else if (entity.type === 'tower') drawTower3D(entity.item);
      else if (entity.type === 'enemy') drawCharacter(entity.item);
    }

    // 8. Ground Shockwaves
    for (const sw of state.shockwaves) {
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(sw.x, sw.y, sw.r, sw.r * 0.5, 0, 0, Math.PI * 2);
      ctx.strokeStyle = sw.color;
      ctx.lineWidth = 2.5;
      ctx.globalAlpha = sw.life / sw.maxLife;
      ctx.stroke();
      ctx.restore();
    }

    // 8.5 Brass Shell Casings
    for (const sc of state.shellCasings) {
      ctx.save();
      ctx.translate(sc.x, sc.y);
      ctx.rotate(sc.rot);
      ctx.globalAlpha = Math.max(0, sc.life / sc.maxLife);
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(-2, -1, 4, 2);
      ctx.restore();
    }

    // 9. Projectiles (Artillery Shells, SAM Missiles, Tracer Rounds)
    for (const p of state.projectiles) {
      const rad = Math.max(3.2, tileW * 0.068);
      if (p.type === 'cannon') {
        const progress = Math.min(1, p.currDist / (p.travelDist || 1));
        const arcZ = Math.sin(progress * Math.PI) * (tileW * 0.65);
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, rad * 0.8, rad * 0.4, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.32)'; ctx.fill();

        ctx.save();
        ctx.translate(p.x, p.y - arcZ);
        ctx.rotate(p.facing || 0);
        ctx.fillStyle = '#334155';
        roundRect(-rad * 1.4, -rad * 0.7, rad * 2.8, rad * 1.4, rad * 0.6);
        ctx.fill();
        ctx.fillStyle = '#f97316';
        ctx.beginPath(); ctx.arc(rad * 1.1, 0, rad * 0.6, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      } else if (p.type === 'flak') {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.facing || 0);
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(-rad * 1.6, -rad * 0.5, rad * 3.2, rad);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(rad * 1.2, -rad * 0.5, rad * 0.8, rad);
        ctx.restore();
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, rad * 1.5, 0, Math.PI * 2);
        ctx.fillStyle = hexToRgba(p.color, 0.35); ctx.fill();
        ctx.beginPath(); ctx.arc(p.x, p.y, rad * 0.95, 0, Math.PI * 2);
        ctx.fillStyle = p.color; ctx.fill();
      }
    }

    // 10. Particles & Smoke
    for (const pt of state.particles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r || 3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // 11. Sniper Infrared Laser Beams & HPM Arcs
    for (const lb of state.laserBeams) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, lb.life / lb.maxLife);
      ctx.strokeStyle = lb.color;
      ctx.lineWidth = 2;
      ctx.shadowColor = lb.color; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.moveTo(lb.x1, lb.y1); ctx.lineTo(lb.x2, lb.y2); ctx.stroke();
      ctx.restore();
    }

    for (const a of state.lightnings) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, a.life / a.maxLife);
      ctx.shadowColor = '#60a5fa'; ctx.shadowBlur = 10;
      ctx.strokeStyle = '#93c5fd'; ctx.lineWidth = 2.4;
      ctx.beginPath();
      const mx = (a.x1 + a.x2) / 2 + (Math.random() - 0.5) * tileW * 0.35;
      const my = (a.y1 + a.y2) / 2 + (Math.random() - 0.5) * tileW * 0.35;
      ctx.moveTo(a.x1, a.y1); ctx.lineTo(mx, my); ctx.lineTo(a.x2, a.y2);
      ctx.stroke(); ctx.restore();
    }

    // 12. Floating Tactical Texts
    for (const ft of state.floatingTexts) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, ft.life / ft.maxLife);
      ctx.font = 'bold 13px sans-serif';
      ctx.fillStyle = ft.color;
      ctx.textAlign = 'center';
      ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.restore();
    }

    ctx.restore();

    // Screen-Space Weather Overlay (Clouds / Rain / Snow / Sandstorm)
    ctx.save();
    for (const wp of weatherParticles) {
      ctx.globalAlpha = wp.alpha;
      if (curLevel.weather === 'rain') {
        ctx.strokeStyle = '#bae6fd';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(wp.x, wp.y);
        ctx.lineTo(wp.x - 4, wp.y - 14);
        ctx.stroke();
      } else if (curLevel.weather === 'snow') {
        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.arc(wp.x + Math.sin(state.time * 2 + wp.phase) * 4, wp.y, wp.r, 0, Math.PI * 2);
        ctx.fill();
      } else if (curLevel.weather === 'sand') {
        ctx.fillStyle = '#fde68a';
        ctx.beginPath();
        ctx.arc(wp.x, wp.y, wp.r, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.ellipse(wp.x, wp.y, wp.r, wp.r * 0.45, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();

    // Vignette
    const vig = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.38, W / 2, H / 2, Math.max(W, H) * 0.74);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);
  }

  // ---------- Utilities ----------
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  const colorCache = new Map();
  function hexToRgb(hex) {
    if (colorCache.has(hex)) return colorCache.get(hex);
    let h = hex.replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    const num = parseInt(h, 16);
    const rgb = { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    colorCache.set(hex, rgb);
    return rgb;
  }
  function hexToRgba(hex, a) {
    const { r, g, b } = hexToRgb(hex);
    return `rgba(${r},${g},${b},${a})`;
  }
  function lightenHex(hex, amt) {
    const { r, g, b } = hexToRgb(hex);
    const mix = (v) => Math.round(v + (255 - v) * amt);
    return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
  }
  function darkenHex(hex, amt) {
    const { r, g, b } = hexToRgb(hex);
    const mix = (v) => Math.round(v * (1 - amt));
    return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
  }

  // ---------- UI Synchronization & Modals ----------
  function syncHud() {
    levelNameEl.textContent = `战区 ${curLevel.id}: ${curLevel.name}`;
    goldVal.textContent = state.gold;
    livesVal.textContent = state.lives;
    waveVal.textContent = state.wave + '/' + curLevel.wavesCount;
    scoreVal.textContent = state.score;
  }

  let bannerTimeout = null;
  function showBanner(html, ms) {
    bannerEl.innerHTML = html;
    bannerEl.style.display = 'block';
    if (bannerTimeout) clearTimeout(bannerTimeout);
    if (ms) bannerTimeout = setTimeout(() => { bannerEl.style.display = 'none'; }, ms);
  }

  function updateBetweenWaveBanner() {
    if (state.betweenWaves && !state.gameOver && !state.levelClear) {
      showBanner(`下一波敌军推进倒计时: ${Math.ceil(state.countdown)}s <button id="skipBtn">立即迎敌</button>`, 0);
      const skipBtn = document.getElementById('skipBtn');
      if (skipBtn) skipBtn.onclick = () => { state.countdown = 0; };
    } else if (!bannerTimeout) {
      bannerEl.style.display = 'none';
    }
  }

  function buildShop() {
    shopEl.innerHTML = '';
    TOWER_ORDER.forEach((type, idx) => {
      const info = TOWER_TYPES[type];
      const btn = document.createElement('div');
      btn.className = 'tower-btn';
      btn.title = info.desc + (info.airOnly ? '（专精防空）' : (info.canAirTarget ? '（陆空兼备）' : '（对地火力）'));
      const badge = info.airOnly ? '<span style="font-size:9px;vertical-align:top;">🎯✈️</span>' : (info.canAirTarget ? '<span style="font-size:9px;vertical-align:top;">✈️</span>' : '');
      btn.innerHTML = `
        <div class="hotkey">${idx + 1}</div>
        <div class="icon">${info.icon}${badge}</div>
        <div class="name">${info.name}</div>
        <div class="cost">${info.cost}💰</div>
      `;
      btn.onclick = () => {
        ensureAudio();
        if (state.selectedBuildType === type) { state.selectedBuildType = null; }
        else { state.selectedBuildType = type; state.selectedTower = null; hideTowerPanel(); }
        refreshShopSelection();
      };
      btn.dataset.type = type;
      shopEl.appendChild(btn);
    });
  }

  function refreshShopSelection() {
    Array.from(shopEl.children).forEach(btn => {
      btn.classList.toggle('selected', btn.dataset.type === state.selectedBuildType);
      const cost = TOWER_TYPES[btn.dataset.type].cost;
      btn.classList.toggle('disabled', state.gold < cost);
    });
  }

  function showTowerPanel(t) {
    towerPanelEl.style.display = 'block';
    const info = TOWER_TYPES[t.type];
    const stats = towerStats(t);
    document.getElementById('tpTitle').textContent = `${info.icon} ${info.name} Lv.${t.level}`;
    let statsText = `火力 ${Math.round(stats.dmg)} · 射程 ${(stats.range / cellUnit).toFixed(1)} 格 · 射速 ${stats.rate.toFixed(1)}/s`;
    statsText += stats.airOnly ? ' · 防空导弹(仅对空)' : (stats.canAirTarget ? ' · 陆空兼备' : ' · 对地重火器');
    if (stats.chain) statsText += ` · 电磁连锁 ${stats.chain + 1} 目标`;
    document.getElementById('tpStats').textContent = statsText;

    const upBtn = document.getElementById('upgradeBtn');
    const sellBtn = document.getElementById('sellBtn');
    if (t.level >= 3) {
      upBtn.textContent = '已满级';
      upBtn.disabled = true;
    } else {
      const cost = upgradeCost(t);
      upBtn.textContent = `升级 (${cost}💰)`;
      upBtn.disabled = state.gold < cost;
    }
    sellBtn.textContent = `撤收 (+${sellValue(t)}💰)`;
  }
  function hideTowerPanel() { towerPanelEl.style.display = 'none'; }

  document.getElementById('upgradeBtn').onclick = () => {
    const t = state.selectedTower;
    if (!t || t.level >= 3) return;
    const cost = upgradeCost(t);
    if (state.gold < cost) { sfx.error(); return; }
    state.gold -= cost;
    t.totalSpent += cost;
    t.level++;
    t.buildAnim = 1.0;
    sfx.upgrade();
    spawnImpactParticles(t.x, t.y - tileW * 0.35, '#fbbf24', 16);
    showTowerPanel(t);
  };
  document.getElementById('sellBtn').onclick = () => {
    const t = state.selectedTower;
    if (!t) return;
    state.gold += sellValue(t);
    towerAt.delete(keyOf(t.c, t.r));
    state.towers = state.towers.filter(x => x !== t);
    state.selectedTower = null;
    hideTowerPanel();
    sfx.sell();
  };
  document.getElementById('closePanelBtn').onclick = () => {
    state.selectedTower = null;
    hideTowerPanel();
  };

  // ---------- Level Modal Management ----------
  function openLevelModal() {
    levelListEl.innerHTML = '';
    const starData = JSON.parse(localStorage.getItem(STARS_KEY) || '{}');

    LEVELS.forEach((lvl, idx) => {
      const item = document.createElement('div');
      item.className = 'level-item' + (idx === currentLevelIdx ? ' active' : '');
      const stars = starData[lvl.id] || 0;
      const starStr = stars > 0 ? '★'.repeat(stars) + '☆'.repeat(3 - stars) : '未收复';

      item.innerHTML = `
        <div class="lvl-info-main">
          <div class="lvl-name">战区 ${lvl.id}: ${lvl.name} <span style="font-size:12px;color:#fbbf24;margin-left:6px;">${starStr}</span></div>
          <div class="lvl-desc">${lvl.desc}</div>
        </div>
        <div class="lvl-tag">${lvl.wavesCount} 波攻势</div>
      `;
      item.onclick = () => {
        switchLevel(idx);
        levelModalEl.classList.add('hidden');
      };
      levelListEl.appendChild(item);
    });
    levelModalEl.classList.remove('hidden');
  }

  levelBadgeEl.onclick = openLevelModal;
  levelBtnEl.onclick = openLevelModal;
  closeLevelModalBtn.onclick = () => levelModalEl.classList.add('hidden');

  function switchLevel(lvlIdx) {
    currentLevelIdx = lvlIdx;
    curLevel = LEVELS[currentLevelIdx];
    COLS = curLevel.cols; ROWS = curLevel.rows;
    loadLevelPaths(curLevel);
    resize();
    resetCamera();
    resetGame();
    state.running = true;
    overlayEl.classList.add('hidden');
  }

  function levelComplete() {
    state.levelClear = true;
    state.running = false;

    const stars = state.lives >= 18 ? 3 : (state.lives >= 10 ? 2 : 1);
    const starData = JSON.parse(localStorage.getItem(STARS_KEY) || '{}');
    starData[curLevel.id] = Math.max(starData[curLevel.id] || 0, stars);
    localStorage.setItem(STARS_KEY, JSON.stringify(starData));

    const best = Math.max(state.score, parseInt(localStorage.getItem(BEST_KEY) || '0', 10));
    localStorage.setItem(BEST_KEY, String(best));

    document.getElementById('overlayTitle').textContent = `🎖️ 战区防卫成功！${curLevel.name}已稳固`;
    document.getElementById('overlayStars').textContent = '★'.repeat(stars) + '☆'.repeat(3 - stars);
    document.getElementById('overlayStars').style.color = '#fbbf24';

    const isLast = currentLevelIdx === LEVELS.length - 1;
    document.getElementById('overlayDesc').textContent = isLast
      ? '🏆 最高统帅勋章！你已成功赢下全球五大战区防卫战役，联合指挥部向你致敬！'
      : `已成功歼灭本战区全部 ${curLevel.wavesCount} 波敌方合成部队，联合指挥所安然无恙！`;

    document.getElementById('overlayStats').textContent = `本战区战功: ${state.score} · 剩余防线耐久: ${state.lives}`;

    const btnRow = document.getElementById('overlayBtnRow');
    btnRow.innerHTML = '';

    if (!isLast) {
      const nextBtn = document.createElement('button');
      nextBtn.className = 'big-btn';
      nextBtn.textContent = '开赴下一战区 ➔';
      nextBtn.onclick = () => switchLevel(currentLevelIdx + 1);
      btnRow.appendChild(nextBtn);
    }

    const replayBtn = document.createElement('button');
    replayBtn.className = 'big-btn secondary';
    replayBtn.textContent = '重演本战区';
    replayBtn.onclick = () => switchLevel(currentLevelIdx);
    btnRow.appendChild(replayBtn);

    const selectBtn = document.createElement('button');
    selectBtn.className = 'big-btn secondary';
    selectBtn.textContent = '战区列表';
    selectBtn.onclick = () => { overlayEl.classList.add('hidden'); openLevelModal(); };
    btnRow.appendChild(selectBtn);

    overlayEl.classList.remove('hidden');
    sfx.win();
  }

  function endGame(won) {
    state.gameOver = true; state.win = won; state.running = false;
    const best = Math.max(state.score, parseInt(localStorage.getItem(BEST_KEY) || '0', 10));
    localStorage.setItem(BEST_KEY, String(best));

    document.getElementById('overlayTitle').textContent = '💥 联合指挥部失守';
    document.getElementById('overlayStars').textContent = '';
    document.getElementById('overlayDesc').textContent = `在第 ${state.wave} 波攻势中，敌军装甲集群突破了防线。调整火力配系，重整防线再战！`;
    document.getElementById('overlayStats').textContent = `本局战功: ${state.score}　最高纪录: ${best}`;

    const btnRow = document.getElementById('overlayBtnRow');
    btnRow.innerHTML = `
      <button class="big-btn" id="retryBtn">重整防线</button>
      <button class="big-btn secondary" id="chooseLvlBtn">切换战区</button>
    `;
    document.getElementById('retryBtn').onclick = () => switchLevel(currentLevelIdx);
    document.getElementById('chooseLvlBtn').onclick = () => { overlayEl.classList.add('hidden'); openLevelModal(); };

    overlayEl.classList.remove('hidden');
    sfx.gameover();
  }

  function resetGame() {
    state = freshState(currentLevelIdx);
    buildMapExtras(curLevel);
    hideTowerPanel();
    bannerEl.style.display = 'none';
    speedBtn.textContent = 'x1';
    pauseBtn.textContent = '暂停';
    pauseBtn.classList.remove('active');
    refreshShopSelection();
    syncHud();
  }

  document.getElementById('startBtn').onclick = () => {
    ensureAudio();
    resetGame();
    state.running = true;
    overlayEl.classList.add('hidden');
  };

  zoomInBtn.onclick = () => setZoom(1.2);
  zoomOutBtn.onclick = () => setZoom(0.83);
  zoomResetBtn.onclick = resetCamera;

  canvas.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const sx = ev.clientX - rect.left;
    const sy = ev.clientY - rect.top;
    const factor = ev.deltaY < 0 ? 1.15 : 0.87;
    setZoom(factor, sx, sy);
  }, { passive: false });

  function eventToScreen(ev) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: ev.clientX - rect.left,
      y: ev.clientY - rect.top
    };
  }

  canvas.addEventListener('pointerdown', (ev) => {
    ensureAudio();
    const sPos = eventToScreen(ev);
    camera.isDragging = true;
    camera.dragStartX = sPos.x;
    camera.dragStartY = sPos.y;
    camera.lastScreenX = sPos.x;
    camera.lastScreenY = sPos.y;
    camera.moved = false;
  });

  window.addEventListener('pointermove', (ev) => {
    if (!state) return;
    const sPos = eventToScreen(ev);

    if (camera.isDragging) {
      const dx = sPos.x - camera.lastScreenX;
      const dy = sPos.y - camera.lastScreenY;
      const totalMoved = Math.hypot(sPos.x - camera.dragStartX, sPos.y - camera.dragStartY);

      if (totalMoved > 6) {
        camera.moved = true;
        camera.x += dx;
        camera.y += dy;
      }
      camera.lastScreenX = sPos.x;
      camera.lastScreenY = sPos.y;
    }

    if (state.selectedBuildType) {
      const wPos = screenToWorld(sPos.x, sPos.y);
      state.hover = pxToCell(wPos.x, wPos.y);
    }
  });

  window.addEventListener('pointerup', (ev) => {
    if (!camera.isDragging) return;
    camera.isDragging = false;
    if (camera.moved) return;

    const sPos = eventToScreen(ev);
    const wPos = screenToWorld(sPos.x, sPos.y);

    if (state.selectedBuildType) {
      const { c, r } = pxToCell(wPos.x, wPos.y);
      placeTower(state.selectedBuildType, c, r);
      state.selectedBuildType = null;
      state.hover = null;
      refreshShopSelection();
      return;
    }

    const clickedTower = findTowerAtPx(wPos.x, wPos.y);
    if (clickedTower) {
      state.selectedTower = clickedTower;
      showTowerPanel(clickedTower);
      return;
    }

    const { c, r } = pxToCell(wPos.x, wPos.y);
    const t = towerAt.get(keyOf(c, r));
    if (t) {
      state.selectedTower = t;
      showTowerPanel(t);
    } else {
      state.selectedTower = null;
      hideTowerPanel();
    }
  });

  canvas.addEventListener('touchstart', (ev) => {
    if (ev.touches.length === 2) {
      const t1 = ev.touches[0], t2 = ev.touches[1];
      camera.touchDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
    }
  }, { passive: true });

  canvas.addEventListener('touchmove', (ev) => {
    if (ev.touches.length === 2) {
      const t1 = ev.touches[0], t2 = ev.touches[1];
      const dist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
      if (camera.touchDist > 0) {
        const factor = dist / camera.touchDist;
        const midX = (t1.clientX + t2.clientX) / 2;
        const midY = (t1.clientY + t2.clientY) / 2;
        setZoom(factor, midX, midY);
      }
      camera.touchDist = dist;
    }
  }, { passive: true });

  window.addEventListener('keydown', (ev) => {
    if (ev.key === '1') { state.selectedBuildType = 'gatling'; refreshShopSelection(); }
    else if (ev.key === '2') { state.selectedBuildType = 'cannon'; refreshShopSelection(); }
    else if (ev.key === '3') { state.selectedBuildType = 'frost'; refreshShopSelection(); }
    else if (ev.key === '4') { state.selectedBuildType = 'sniper'; refreshShopSelection(); }
    else if (ev.key === '5') { state.selectedBuildType = 'lightning'; refreshShopSelection(); }
    else if (ev.key === '6') { state.selectedBuildType = 'flak'; refreshShopSelection(); }
    else if (ev.key === 'Escape') {
      state.selectedBuildType = null; state.selectedTower = null;
      hideTowerPanel(); refreshShopSelection();
    }
    else if (ev.key === 'r' || ev.key === 'R') { resetCamera(); }
    else if (ev.key === '+' || ev.key === '=') { setZoom(1.2); }
    else if (ev.key === '-' || ev.key === '_') { setZoom(0.83); }
    else if (ev.key === ' ') { togglePause(); ev.preventDefault(); }
    else if (ev.key === 'Enter') { if (state.betweenWaves) state.countdown = 0; }
  });

  speedBtn.onclick = () => {
    const opts = [1, 2, 3];
    const idx = opts.indexOf(state.speedMult);
    state.speedMult = opts[(idx + 1) % opts.length];
    speedBtn.textContent = 'x' + state.speedMult;
  };
  function togglePause() {
    state.paused = !state.paused;
    pauseBtn.textContent = state.paused ? '继续' : '暂停';
    pauseBtn.classList.toggle('active', state.paused);
  }
  pauseBtn.onclick = togglePause;

  let lastTs = 0;
  function loop(ts) {
    requestAnimationFrame(loop);
    if (!lastTs) lastTs = ts;
    let dt = (ts - lastTs) / 1000;
    lastTs = ts;
    dt = Math.min(dt, 0.05);

    if (state && state.running && !state.paused && !state.gameOver && !state.levelClear) {
      update(dt);
    }
    if (state) {
      render();
      syncHud();
      refreshShopSelection();
      updateBetweenWaveBanner();
    }
  }

  window.addEventListener('resize', resize);
  loadLevelPaths(curLevel);
  resize();
  buildShop();
  resetGame();

  const best0 = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
  document.getElementById('overlayStats').textContent = best0 > 0 ? (`最高战功纪录: ${best0}`) : '';
  requestAnimationFrame(loop);
})();
</script>
</body>
