<script>
(function(){

  const shopEl = document.getElementById('shop');

  const levelBadgeEl = document.getElementById('levelBadge');
  const levelBtnEl = document.getElementById('levelBtn');

  const goldVal = document.getElementById('goldVal');
  const livesVal = document.getElementById('livesVal');
  const waveVal = document.getElementById('waveVal');
  const scoreVal = document.getElementById('scoreVal');
  const speedBtn = document.getElementById('speedBtn');
  const pauseBtn = document.getElementById('pauseBtn');

  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const zoomResetBtn = document.getElementById('zoomResetBtn');
  const zoomValEl = document.getElementById('zoomVal');

  const BEST_KEY = 'td_chibi_earth_best_score';
  const STARS_KEY = 'td_chibi_earth_level_stars';

  // ---------- 5 Extra-Large Cute Earth Theater Levels (29x19 Giant Maps with Rivers, Bridges & High Ground) ----------
  const LEVELS = [
    {
      id: 1,
      name: '诺曼底风车水乡',
      weather: 'clouds',
      desc: '【29×19 双桥交汇水乡】碧蓝运河蜿蜒穿过风车田园，敌军从南北双小径跨过木拱桥汇合再分流，高台享 +15% 射程加成！',
      cols: 29, rows: 19,
      wavesCount: 9,
      startGold: 260,
      obstacleCount: 30,
      obstacles: ['roundtree', 'pinetree', 'windmill', 'rock'],
      foliage: ['flower', 'grass', 'mushroom'],
      theme: {
        top: '#74d14c', alt: '#65c23e', left: '#4a9e2b', right: '#3b8220',
        pathTop: '#f3d9a4', pathLeft: '#cfa968', pathRight: '#b08b4c', pathLine: '#fffbeb',
        waterTop: '#38bdf8', waterAlt: '#0ea5e9', waterLeft: '#0284c7', waterRight: '#0369a1',
        highTop: '#a3e635', highLeft: '#65a30d', highRight: '#4d7c0f',
        cliffL: '#8c5a32', cliffR: '#6e4423',
        bg0: '#38bdf8', bg1: '#1d4ed8', water: true
      },
      generatePaths: () => {
        const water = [];
        for (let r = 0; r < 19; r++) {
          const cRiver = 13 + Math.round(Math.sin(r * 0.42) * 1.3);
          water.push({ c: cRiver, r }, { c: cRiver + 1, r });
        }
        const highgrounds = [
          { c: 7, r: 7 }, { c: 8, r: 7 }, { c: 7, r: 11 }, { c: 8, r: 11 },
          { c: 11, r: 9 }, { c: 18, r: 6 }, { c: 19, r: 6 },
          { c: 18, r: 12 }, { c: 19, r: 12 }, { c: 23, r: 9 }
        ];

        // Path A: North Entry -> weaves south -> crosses North Bridge -> loops south -> HQ (27, 9)
        const pA = [];
        for (let c = 1; c <= 5; c++) pA.push({ c, r: 2 });
        for (let r = 3; r <= 7; r++) pA.push({ c: 5, r });
        for (let c = 6; c <= 10; c++) pA.push({ c, r: 7 });
        for (let r = 6; r >= 3; r--) pA.push({ c: 10, r });
        for (let c = 11; c <= 17; c++) pA.push({ c, r: 3 }); // Crosses river bridge at r=3
        for (let r = 4; r <= 9; r++) pA.push({ c: 17, r });
        for (let c = 18; c <= 21; c++) pA.push({ c, r: 9 });
        for (let r = 8; r >= 4; r--) pA.push({ c: 21, r });
        for (let c = 22; c <= 25; c++) pA.push({ c, r: 4 });
        for (let r = 5; r <= 9; r++) pA.push({ c: 25, r });
        for (let c = 26; c <= 27; c++) pA.push({ c, r: 9 });

        // Path B: South Entry -> weaves north -> crosses South Bridge -> loops north -> HQ (27, 9)
        const pB = [];
        for (let c = 1; c <= 5; c++) pB.push({ c, r: 16 });
        for (let r = 15; r >= 11; r--) pB.push({ c: 5, r });
        for (let c = 6; c <= 10; c++) pB.push({ c, r: 11 });
        for (let r = 12; r <= 15; r++) pB.push({ c: 10, r });
        for (let c = 11; c <= 17; c++) pB.push({ c, r: 15 }); // Crosses river bridge at r=15
        for (let r = 14; r >= 9; r--) pB.push({ c: 17, r });
        for (let c = 18; c <= 21; c++) pB.push({ c, r: 9 });
        for (let r = 10; r <= 14; r++) pB.push({ c: 21, r });
        for (let c = 22; c <= 25; c++) pB.push({ c, r: 14 });
        for (let r = 13; r >= 9; r--) pB.push({ c: 25, r });
        for (let c = 26; c <= 27; c++) pB.push({ c, r: 9 });

        return {
          groundPaths: [pA, pB],
          waterCells: water,
          highCells: highgrounds,
          airCorridors: [
            [{ c: 29.5, r: -1 }, { c: 15, r: 4 }, { c: 27, r: 9 }],
            [{ c: 29.5, r: 19 }, { c: 15, r: 14 }, { c: 27, r: 9 }]
          ]
        };
      }
    },
    {
      id: 2,
      name: '撒哈拉翡翠绿洲',
      weather: 'sand',
      desc: '【29×19 绿洲双环迷宫】阳光沙海中央镶嵌翡翠绿洲湖泊，两条沙漠驼道在绿洲木栈桥十字交汇、九曲回肠！',
      cols: 29, rows: 19,
      wavesCount: 10,
      startGold: 280,
      obstacleCount: 34,
      obstacles: ['cactus', 'sandrock', 'palmtree', 'oilbarrel'],
      foliage: ['drybush', 'pebbles', 'flower'],
      theme: {
        top: '#fbbf24', alt: '#f59e0b', left: '#d97706', right: '#b45309',
        pathTop: '#fde68a', pathLeft: '#d97706', pathRight: '#b45309', pathLine: '#fffbeb',
        waterTop: '#2dd4bf', waterAlt: '#14b8a6', waterLeft: '#0d9488', waterRight: '#0f766e',

  function updateZoomUI() {
    zoomValEl.textContent = Math.round(camera.scale * 100) + '%';
  }

  function setZoom(factor, screenX = W / 2, screenY = H / 2) {
    const oldScale = camera.scale;
    const newScale = Math.min(camera.maxScale, Math.max(camera.minScale, oldScale * factor));
    if (Math.abs(newScale - oldScale) < 0.001) return;
    const worldPos = screenToWorld(screenX, screenY);
    camera.scale = newScale;
    camera.x = screenX - (worldPos.x - W / 2) * newScale - W / 2;
    camera.y = screenY - (worldPos.y - H / 2) * newScale - H / 2;
    updateZoomUI();
  }

  function resetCamera() {
    camera.x = 0; camera.y = 0; camera.scale = 1.0;
    updateZoomUI();
  }

  function screenToWorld(sx, sy) {
    const cx = W / 2 + camera.x;
    const cy = H / 2 + camera.y;
    return {
      x: (sx - cx) / camera.scale + W / 2,
      y: (sy - cy) / camera.scale + H / 2
    };
  }

  function resize() {
    DPR = Math.min((window.devicePixelRatio || 1) * 1.3, 3);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.imageSmoothingEnabled = true;
    if ('imageSmoothingQuality' in ctx) ctx.imageSmoothingQuality = 'high';

    const topMargin = 68, bottomMargin = 135;
    const availW = W - 24;
    const availH = Math.max(220, H - topMargin - bottomMargin);

    const spanColsRows = (COLS + ROWS) * 0.5;
    tileW = Math.max(18, Math.min(availW / (spanColsRows * 1.02), availH / (spanColsRows * 0.54)));
    tileH = Math.round(tileW * 0.5);
    tileW = tileH * 2;
    blockDepth = Math.max(8, Math.round(tileH * 0.6));
    cellUnit = (tileW / 2) * Math.sqrt(1.25);

    X_center = Math.round(W / 2 - (COLS - ROWS) * (tileW / 4));
    const gridVisualHeight = (COLS + ROWS) * (tileH / 2) + blockDepth + tileW * 0.5;
    Y_center = Math.round(topMargin + Math.max(6, (availH - gridVisualHeight) / 2) + tileW * 0.2);

    rebuildPathPoints();
    buildWeather();
    updateZoomUI();

  function cellLiftZ(c, r) {
    const k = keyOf(c, r);
    if (highgroundSet && highgroundSet.has(k)) return Math.round(blockDepth * 0.72);
    if (waterSet && waterSet.has(k) && !bridgeSet.has(k)) return -Math.round(blockDepth * 0.35);
    return 0;
  }

  function cellToPx(c, r, z = 0) {
    const baseLift = inGrid(Math.round(c), Math.round(r)) ? cellLiftZ(Math.round(c), Math.round(r)) : 0;
    const x = X_center + (c - r) * (tileW / 2);
    const y = Y_center + (c + r + 1) * (tileH / 2) - blockDepth - baseLift - (z || 0);
    return { x, y };
  }

  function pxToCell(wx, wy) {
    const dx = wx - X_center;
    const dy = (wy + blockDepth) - Y_center;
    const c = Math.floor(dx / tileW + dy / tileH - 0.5);
    const r = Math.floor(dy / tileH - dx / tileW - 0.5);
    return { c, r };
  }

  function inGrid(c, r) { return c >= 0 && c < COLS && r >= 0 && r < ROWS; }
  function keyOf(c, r) { return c + ',' + r; }

  function findTowerAtPx(wx, wy) {
    if (!state || !state.towers) return null;
    const sorted = state.towers.slice().sort((a, b) => (b.c + b.r) - (a.c + a.r));
    for (const t of sorted) {
      const pos = cellToPx(t.c, t.r);
      const towerH = tileW * 0.78;
      const cy = pos.y - towerH * 0.5;
      const rx = tileW * 0.46;
      const ry = towerH * 0.56;
      const nx = (wx - pos.x) / rx;
      const ny = (wy - cy) / ry;
      if (nx * nx + ny * ny <= 1) return t;
    }
    return null;
  }

  function loadLevelPaths(level) {

    airCorridors = res.airCorridors;
    pathSet = new Set();
    waterSet = new Set();
    bridgeSet = new Set();
    highgroundSet = new Set();
    pathDirMap = new Map();

    if (res.waterCells) {
      for (const wc of res.waterCells) {
        if (inGrid(wc.c, wc.r)) waterSet.add(keyOf(wc.c, wc.r));
      }
    }

    for (const p of groundPaths) {
      for (let i = 0; i < p.length; i++) {
        const cell = p[i];
        const k = keyOf(cell.c, cell.r);
        pathSet.add(k);
        if (waterSet.has(k)) bridgeSet.add(k);
        const next = p[i + 1] || p[i - 1] || cell;
        const dc = next.c - cell.c;
        const dr = next.r - cell.r;
        pathDirMap.set(k, { dc, dr });
      }
    }

    if (res.highCells) {
      for (const hc of res.highCells) {
        const k = keyOf(hc.c, hc.r);
        if (inGrid(hc.c, hc.r) && !pathSet.has(k) && !waterSet.has(k)) {
          highgroundSet.add(k);
        }
      }
    }

    rebuildPathPoints();
    buildMapExtras(level);
  }

  function rebuildPathPoints() {

      return airPathsPoints[e.pathIdx % airPathsPoints.length] || airPathsPoints[0];

    return groundPathsPoints[e.pathIdx % groundPathsPoints.length] || groundPathsPoints[0];

  function buildMapExtras(level) {
    obstacleSet = new Set();
    decorations = [];
    const free = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const k = keyOf(c, r);
        if (!pathSet.has(k) && !waterSet.has(k) && !highgroundSet.has(k)) free.push({ c, r });
      }
    }
    const shuffled = free.slice();
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    const count = Math.min(level.obstacleCount, Math.floor(shuffled.length * 0.12));
    const obstacleTypes = level.obstacles || ['roundtree', 'pinetree', 'rock'];
    const foliageTypes = level.foliage || ['flower', 'grass'];
    for (let i = 0; i < count; i++) {
      const cellPos = shuffled[i];
      obstacleSet.add(keyOf(cellPos.c, cellPos.r));
      decorations.push({ c: cellPos.c, r: cellPos.r, type: obstacleTypes[i % obstacleTypes.length], blocking: true, seed: Math.random() });
    }
    for (let i = count; i < shuffled.length; i++) {
      if (Math.random() < 0.18) {
        const cellPos = shuffled[i];
        decorations.push({ c: cellPos.c, r: cellPos.r, type: foliageTypes[i % foliageTypes.length], blocking: false, seed: Math.random() });
      }
    }
  }

  function canBuild(c, r) {
    if (!inGrid(c, r)) return false;
    const k = keyOf(c, r);
    if (pathSet.has(k)) return false;
    if (waterSet.has(k)) return false;
    if (obstacleSet.has(k)) return false;
    if (towerAt.has(k)) return false;
    return true;

  function tone(freq, dur, type, gain, slideTo, delay) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime + (delay || 0);
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
    g.gain.setValueAtTime(gain != null ? gain : 0.12, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.03);
  }

  function waveComposition(level, wave) {
    const isBoss = wave === level.wavesCount || (wave % 5 === 0 && wave >= 5);
    const baseCount = Math.round(14 + wave * 3.0 + (level.id - 1) * 4.0);
    const list = [];

    for (let i = 0; i < baseCount; i++) {
      let type = 'normal';
      const roll = Math.random();

      if (level.id >= 2 && wave >= 4 && roll < 0.19) type = 'bomber';
      else if (level.id >= 2 && wave >= 3 && roll < 0.37) type = 'phantom';
      else if (wave >= 3 && roll < 0.54) type = 'medic';
      else if (wave >= 2 && roll < 0.70) type = 'flyer';
      else if (wave >= 2 && roll < 0.87) type = 'tank';
      else if (roll < 0.96) type = 'runner';

      list.push({ type, pathIdx: i });
    }

    if (isBoss) {
      list.push({ type: 'boss', pathIdx: 0 });
      if (groundPaths.length > 1) list.push({ type: 'boss', pathIdx: 1 });
      list.push({ type: 'tank', pathIdx: 0 });
      if (wave >= 9) list.push({ type: 'tank', pathIdx: groundPaths.length > 1 ? 1 : 0 });
    }

    const spawnInterval = Math.max(0.15, 0.68 - wave * 0.03 - (level.id - 1) * 0.03);
    return { list, spawnInterval };
  }

  function startWave() {
    if (state.wave >= curLevel.wavesCount) return;
    state.wave++;
    const comp = waveComposition(curLevel, state.wave);
    state.spawnQueue = comp.list.slice();
    state.spawnInterval = comp.spawnInterval;
    state.spawnTimer = 0;
    state.waveActive = true;
    state.betweenWaves = false;
    sfx.wave();
    showBanner(`🎺 第 ${state.wave} / ${curLevel.wavesCount} 波攻势来袭！呆萌军团正在大步推进~`, 1800);
  }

  function spawnEnemy(entry) {
    const type = entry.type;
    const pathIdx = entry.pathIdx || 0;
    const base = ENEMY_TYPES[type];
    const hpScale = (1 + (state.wave - 1) * 0.23 + (curLevel.id - 1) * 0.28);
    const speedScale = 1 + Math.min(0.45, (state.wave - 1) * 0.016 + (curLevel.id - 1) * 0.018);
    const armorScale = 1 + Math.min(0.55, (state.wave - 1) * 0.018);
    const hp = Math.round(base.hp * hpScale);
    const flying = !!base.flying;

    const e = {
      type, hp, maxHp: hp, speedCells: base.speed * speedScale, armor: Math.min(0.75, base.armor * armorScale),
      bounty: base.bounty, leak: base.leak, color: base.color, radius: base.r,
      flying, isVehicle: !!base.isVehicle, bobH: base.bobH, strideFreq: base.strideFreq,
      dodgeRate: base.dodgeRate || 0,
      pathIdx, idx: 0,
      x: 0, y: 0, z: flying ? 42 : 0,
      walkPhase: Math.random(),
      blinkSeed: Math.random() * 10,
      facing: 0, targetFacing: 0,
      hitFlash: 0,
      slowUntil: 0, slowFactor: 1,
      healTimer: 0, exhaustTimer: 0,
      enraged: false, shield: 0, maxShield: 0,
      id: Math.random()
    };

    const pts = pointsForEnemy(e);
    if (!pts || pts.length === 0) return;
    const p0 = pts[0];
    e.x = p0.x; e.y = p0.y;
    if (pts[1]) {
      e.facing = Math.atan2(pts[1].y - p0.y, pts[1].x - p0.x);
      e.targetFacing = e.facing;
    }

    state.enemies.push(e);
    state.spawnCount++;
  }

  function addFloatingText(text, x, y, color = '#fff') {

  function towerStats(t) {
    const base = TOWER_TYPES[t.type];
    const lvl = t.level;
    const isHigh = highgroundSet && highgroundSet.has(keyOf(t.c, t.r));
    const highMult = isHigh ? 1.15 : 1.0;
    const dmgMult = 1 + (lvl - 1) * 0.42;
    const rangeMult = (1 + (lvl - 1) * 0.13) * highMult;
    const rateMult = 1 + (lvl - 1) * 0.22;
    return {
      dmg: base.dmg * dmgMult,
      range: base.range * rangeMult * cellUnit,
      rate: base.rate * rateMult,
      splash: base.splash ? base.splash * (1 + (lvl - 1) * 0.12) * cellUnit : 0,
      slow: base.slow,
      armorPierce: !!base.armorPierce,
      canAirTarget: !!base.canAirTarget,
      airOnly: !!base.airOnly,
      chain: base.chain || 0,
      chainRange: base.chain ? base.chainRange * rangeMult * cellUnit : 0,
      color: base.color,
      isHigh
    };
  }

    const base = TOWER_TYPES[t.type];

  function placeTower(type, c, r) {
    const base = TOWER_TYPES[type];
    if (state.gold < base.cost) { sfx.error(); return; }
    if (!canBuild(c, r)) { sfx.error(); return; }
    const pos = cellToPx(c, r);
    const t = {
      type, c, r, x: pos.x, y: pos.y, level: 1, cooldown: 0,
      disabledUntil: 0,
      recoil: 0, muzzleFlash: 0, facing: -Math.PI / 4, targetFacing: -Math.PI / 4,
      barrelSpin: 0, radarAngle: Math.random() * Math.PI * 2,
      buildAnim: 1.0, // Cute bouncy pop-in animation
      totalSpent: base.cost, id: Math.random()
    };
    state.towers.push(t);
    towerAt.set(keyOf(c, r), t);
    state.gold -= base.cost;
    sfx.place();
    spawnImpactParticles(pos.x, pos.y, base.color, 14);
    if (highgroundSet && highgroundSet.has(keyOf(c, r))) {
      addFloatingText('⛰️ 高地射程+15%!', pos.x, pos.y - 24, '#fde047');
    }

  function findTarget(t, stats, exclude) {
    let best = null, bestProgress = -1;
    for (const e of state.enemies) {
      if (exclude && exclude.has(e)) continue;
      if (e.flying && !stats.canAirTarget) continue;
      if (!e.flying && stats.airOnly) continue;
      const dx = e.x - t.x, dy = e.y - t.y;
      if (dx * dx + dy * dy > stats.range * stats.range) continue;
      const pts = pointsForEnemy(e);
      const nextPt = pts[e.idx + 1];
      let remain = nextPt ? Math.hypot(nextPt.x - e.x, nextPt.y - e.y) : 0;
      const progress = e.idx * 10000 - remain;
      if (progress > bestProgress) { bestProgress = progress; best = e; }
    }
    return best;
  }

  function lerpAngle(a, b, t) {
    let diff = ((b - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    return a + diff * Math.min(1, t);
  }

  function fireTower(t) {
    if (state.time < t.disabledUntil) return;
    const stats = towerStats(t);
    if (t.type === 'lightning') { fireLightning(t, stats); return; }

    if (!target) return;

    t.cooldown = 1 / stats.rate;
    t.targetFacing = Math.atan2(target.y - t.y, target.x - t.x);
    t.facing = lerpAngle(t.facing, t.targetFacing, 0.65);
    t.muzzleFlash = 0.12;
    t.recoil = 1.0;

      trailTimer: 0

  function fireLightning(t, stats) {
    const first = findTarget(t, stats);
    if (!first) return;
    t.cooldown = 1 / stats.rate;
    t.targetFacing = Math.atan2(first.y - t.y, first.x - t.x);
    t.facing = lerpAngle(t.facing, t.targetFacing, 0.7);
    t.muzzleFlash = 0.14;
    t.recoil = 1.0;

    const hit = new Set();
    const arcs = [];
    let from = { x: t.x, y: t.y - tileW * 0.52 };
    let cur = first;
    let dmg = stats.dmg;
    let jumps = stats.chain;
    while (cur) {
      damageEnemy(cur, dmg, stats.armorPierce);
      arcs.push({ x1: from.x, y1: from.y, x2: cur.x, y2: enemyHitY(cur), life: 0.24, maxLife: 0.24 });
      hit.add(cur);
      if (jumps <= 0) break;
      jumps--;
      dmg *= 0.75;
      let next = null, bestD = stats.chainRange;
      for (const e of state.enemies) {
        if (hit.has(e)) continue;
        if (e.flying && !stats.canAirTarget) continue;
        const d = Math.hypot(e.x - cur.x, e.y - cur.y);
        if (d <= bestD) { bestD = d; next = e; }
      }
      from = { x: cur.x, y: enemyHitY(cur) };
      cur = next;
    }
    state.lightnings.push(...arcs);
    sfx.shoot_lightning();
  }

  function damageEnemy(e, dmg, armorPierce) {
    // Bush Chibi Sniper Leaf-Confetti Dodge
    if (e.dodgeRate && Math.random() < e.dodgeRate) {
      addFloatingText('🍃 躲猫猫~!', e.x, enemyHitY(e) - 14, '#a3e635');
      spawnImpactParticles(e.x, enemyHitY(e), '#84cc16', 6);
      return;
    }

    let actual = armorPierce ? dmg : dmg * (1 - e.armor);

    if (e.shield > 0) {
      if (e.shield >= actual) {
        e.shield -= actual;
        actual = 0;
      } else {
        actual -= e.shield;
        e.shield = 0;
      }
    }

    e.hp -= actual;
    e.hitFlash = 0.14;

    // Boss Enrage at 50% HP
    if (e.type === 'boss' && !e.enraged && e.hp <= e.maxHp * 0.5) {
      e.enraged = true;
      e.speedCells *= 1.32;
      e.shield = Math.round(e.maxHp * 0.28);
      e.maxShield = e.shield;
      state.screenShake = 0.4;
      sfx.berserk();

      spawnImpactParticles(e.x, e.y, '#fbbf24', 24);
    }

    if (e.hp <= 0 && !e.dead) {
      e.dead = true;
      state.gold += e.bounty;
      state.score += e.bounty * 2;
      addFloatingText(`+${e.bounty}💰`, e.x, enemyHitY(e) - 10, '#fde047');

        });

          const d = Math.hypot(t.x - e.x, t.y - e.y);
          if (d <= cellUnit * 2.2) {

            addFloatingText('💫 晕乎乎~', t.x, t.y - 22, '#f43f5e');
          }
        }
      }
    }
  }

  function leakEnemy(e) {
    e.dead = true;

    setTimeout(() => { flashEl.style.opacity = '0'; }, 100);
