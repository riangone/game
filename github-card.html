<script>
async function fetchProfile() {
  const username = document.getElementById('ghUsername').value.trim();
  if (!username) return;

  try {
    const res = await fetch('https://api.github.com/users/' + encodeURIComponent(username));
    if (!res.ok) throw new Error('User not found');
    const u = await res.json();
    updateCard(u.avatar_url, u.name || u.login, u.bio || '无个人简介', u.public_repos, u.followers, new Date(u.created_at).getFullYear());
  } catch (err) {
    showToast('查询失败或被限流，展示预设离线数据');
  }
}

function updateCard(avatar, name, bio, repos, followers, year) {
  document.getElementById('ghAvatar').src = avatar;
  document.getElementById('ghName').textContent = name;
  document.getElementById('ghBio').textContent = bio;
  document.getElementById('ghRepos').textContent = repos;
  document.getElementById('ghFollowers').textContent = followers.toLocaleString();
  document.getElementById('ghYear').textContent = year;
}

function setPresetUser(usr) {
  document.getElementById('ghUsername').value = usr;
  fetchProfile();
}

function exportBadgeImg() {
  const name = document.getElementById('ghName').textContent;
  const bio = document.getElementById('ghBio').textContent;
  const repos = document.getElementById('ghRepos').textContent;
  const followers = document.getElementById('ghFollowers').textContent;
  const year = document.getElementById('ghYear').textContent;

  const cv = document.createElement('canvas');
  cv.width = 600;
  cv.height = 300;
  const ctx = cv.getContext('2d');

  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, 600, 300);

  ctx.strokeStyle = '#30363d';
  ctx.lineWidth = 2;
  ctx.strokeRect(10, 10, 580, 280);

  ctx.fillStyle = '#58a6ff';
  ctx.font = 'bold 28px sans-serif';
  ctx.fillText(name, 40, 70);

  ctx.fillStyle = '#8b949e';
  ctx.font = '16px sans-serif';
  ctx.fillText(bio.slice(0, 40), 40, 110);

  ctx.fillStyle = '#161b22';
  ctx.fillRect(40, 150, 520, 100);

  ctx.fillStyle = '#58a6ff';
  ctx.font = 'bold 24px monospace';
  ctx.fillText('Repos: ' + repos, 70, 210);
  ctx.fillStyle = '#3fb950';
  ctx.fillText('Followers: ' + followers, 240, 210);
  ctx.fillStyle = '#d2a8ff';
  ctx.fillText('Since: ' + year, 450, 210);

  const a = document.createElement('a');
  a.href = cv.toDataURL('image/png');
  a.download = 'github_card_' + Date.now() + '.png';
  a.click();
  showToast('GitHub 名片图片已保存！');
}

window.addEventListener('DOMContentLoaded', fetchProfile);
</script>

<script>
function initTheme(){
  const saved=localStorage.getItem('app_theme');
  if(saved){document.documentElement.setAttribute('data-theme',saved);}
  else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const target=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',target);
  localStorage.setItem('app_theme',target);
}
initTheme();
function showToast(msg, duration=2200){
  const el=document.createElement('div');
  el.textContent=msg;
  el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:9999px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 10px 25px rgba(0,0,0,.2);transition:opacity .3s;';
  document.body.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),300);},duration);
}
</script>
