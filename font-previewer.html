<script>
let curTab = 'waterfall';
let curFont = 'system-ui';

const PRESET_FONTS = [
  { name: '系统默认 (system-ui)', font: 'system-ui, -apple-system, sans-serif' },
  { name: '苹方 (PingFang SC)', font: '"PingFang SC", sans-serif' },
  { name: '冬青黑体 (Hiragino Sans)', font: '"Hiragino Sans GB", sans-serif' },
  { name: '微软雅黑 (Microsoft YaHei)', font: '"Microsoft YaHei", sans-serif' },
  { name: '楷体 (KaiTi)', font: 'KaiTi, "Kaiti SC", serif' },
  { name: '宋体 (SimSun)', font: 'SimSun, "Songti SC", serif' },
  { name: 'Arial', font: 'Arial, sans-serif' },
  { name: 'Helvetica', font: 'Helvetica, Arial, sans-serif' },
  { name: 'Times New Roman', font: '"Times New Roman", serif' },
  { name: 'Georgia', font: 'Georgia, serif' },
  { name: 'Courier New (等宽)', font: '"Courier New", monospace' },
  { name: 'SF Pro / Inter', font: '"SF Pro Display", Inter, sans-serif' }
];

function switchTab(tab) {
  curTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-tab') === tab));
  document.getElementById('panel-waterfall').classList.toggle('active', tab === 'waterfall');
  document.getElementById('panel-paragraph').classList.toggle('active', tab === 'paragraph');
  document.getElementById('panel-glyphs').classList.toggle('active', tab === 'glyphs');
  applyCurrentFont();
}

function renderFontList() {
  const container = document.getElementById('fontList');
  container.innerHTML = '';
  PRESET_FONTS.forEach((f, idx) => {
    const item = document.createElement('div');
    item.className = 'font-list-item' + (idx === 0 ? ' active' : '');
    item.textContent = f.name;
    item.onclick = () => selectFont(f.font, item);
    container.appendChild(item);
  });
}

function selectFont(font, el) {
  curFont = font;
  document.querySelectorAll('.font-list-item').forEach(i => i.classList.remove('active'));
  if (el) el.classList.add('active');
  applyCurrentFont();
}

function applyCurrentFont() {
  document.querySelectorAll('.waterfall-text').forEach(el => el.style.fontFamily = curFont);
  document.getElementById('paraInput').style.fontFamily = curFont;
  document.getElementById('glyphLatin').style.fontFamily = curFont;
  document.getElementById('glyphSymbols').style.fontFamily = curFont;
}

const SIZES = [12, 14, 16, 20, 24, 32, 48, 64];

function renderWaterfall() {
  const container = document.getElementById('waterfallList');
  container.innerHTML = '';
  const sample = document.getElementById('customSampleText').value;

  SIZES.forEach(sz => {
    const row = document.createElement('div');
    row.className = 'waterfall-row';
    row.innerHTML = '<div class="waterfall-meta">' + sz + 'px</div>' +
      '<div class="waterfall-text" style="font-size:' + sz + 'px;font-family:' + curFont + ';">' + escapeHtml(sample) + '</div>';
    container.appendChild(row);
  });
}

function updatePreviewText() {
  renderWaterfall();
}

function updateParaPreview() {
  applyCurrentFont();
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function handleFontFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const fontName = 'CustomFont_' + Date.now();
  const reader = new FileReader();
  reader.onload = async ev => {
    try {
      const fontFace = new FontFace(fontName, ev.target.result);
      await fontFace.load();
      document.fonts.add(fontFace);

      PRESET_FONTS.unshift({ name: '★ ' + file.name, font: fontName });
      renderFontList();
      selectFont(fontName, document.querySelector('.font-list-item'));
      showToast('已加载自定义字体: ' + file.name);
    } catch (err) {
      showToast('字体加载失败: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

async function querySystemFonts() {
  if (!('queryLocalFonts' in window)) {
    return showToast('当前浏览器不支持 Local Font Access API（仅 Chromium 桌面内核支持）');
  }
  try {
    const availableFonts = await window.queryLocalFonts();
    const uniqueFamilies = Array.from(new Set(availableFonts.map(f => f.family))).slice(0, 30);
    uniqueFamilies.forEach(family => {
      PRESET_FONTS.push({ name: '💻 ' + family, font: '"' + family + '", sans-serif' });
    });
    renderFontList();
    showToast('成功检测到 ' + uniqueFamilies.length + ' 个系统已安装字体！');
  } catch (err) {
    showToast('获取系统字体失败: ' + err.message);
  }
}

window.addEventListener('DOMContentLoaded', () => {
  renderFontList();
  renderWaterfall();
});
</script>

<script>
function initTheme(){
  const saved=localStorage.getItem('app_theme');
  if(saved){document.documentElement.setAttribute('data-theme',saved);}
  else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const target=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',target);
  localStorage.setItem('app_theme',target);
}
initTheme();
function showToast(msg, duration=2200){
  const el=document.createElement('div');
  el.textContent=msg;
  el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:9999px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 10px 25px rgba(0,0,0,.2);transition:opacity .3s;';
  document.body.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),300);},duration);
}
</script>
