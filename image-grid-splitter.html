<script>
let loadedImg = null;

function handleImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      loadedImg = img;
      updateGrid();
      showToast('图片加载成功！');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function updateGrid() {
  if (!loadedImg) return;
  const type = document.getElementById('gridType').value;
  const mode = document.getElementById('cropMode').value;
  const [cols, rows] = type.split('x').map(Number);

  const container = document.getElementById('gridPreview');
  container.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
  container.innerHTML = '';

  let srcX = 0, srcY = 0, srcW = loadedImg.width, srcH = loadedImg.height;

  if (mode === 'square') {
    const minDim = Math.min(srcW, srcH);
    srcX = (srcW - minDim) / 2;
    srcY = (srcH - minDim) / 2;
    srcW = minDim;
    srcH = minDim;
  }

  const sliceW = srcW / cols;
  const sliceH = srcH / rows;
  let counter = 1;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'slice-cell';

      const cv = document.createElement('canvas');
      cv.width = sliceW;
      cv.height = sliceH;
      const ctx = cv.getContext('2d');
      ctx.drawImage(loadedImg, srcX + c * sliceW, srcY + r * sliceH, sliceW, sliceH, 0, 0, sliceW, sliceH);

      const num = counter++;
      cell.appendChild(cv);
      cell.innerHTML += '<div class="slice-num">#' + num + '</div>';
      cell.onclick = () => downloadSingle(cv, num);
      container.appendChild(cell);
    }
  }
}

function downloadSingle(canvas, num) {
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'grid_slice_' + String(num).padStart(2, '0') + '.png';
  a.click();
}

function downloadAllSlices() {
  const canvases = document.querySelectorAll('.slice-cell canvas');
  if (canvases.length === 0) return showToast('请先选择一张图片！');
  canvases.forEach((cv, idx) => {
    setTimeout(() => {
      downloadSingle(cv, idx + 1);
    }, idx * 200);
  });
  showToast('正在按顺序批量下载 ' + canvases.length + ' 张切片...');
}

// Generate sample graphic on load
window.addEventListener('DOMContentLoaded', () => {
  const sampleCanvas = document.createElement('canvas');
  sampleCanvas.width = 600;
  sampleCanvas.height = 600;
  const ctx = sampleCanvas.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 600, 600);
  grad.addColorStop(0, '#0284c7');
  grad.addColorStop(1, '#8b5cf6');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 600, 600);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 64px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('九宫格切图', 300, 280);
  ctx.font = '32px sans-serif';
  ctx.fillText('上传图片开始制作', 300, 360);

  const img = new Image();
  img.onload = () => {
    loadedImg = img;
    updateGrid();
  };
  img.src = sampleCanvas.toDataURL();
});
</script>

<script>
function initTheme(){
  const saved=localStorage.getItem('app_theme');
  if(saved){document.documentElement.setAttribute('data-theme',saved);}
  else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const target=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',target);
  localStorage.setItem('app_theme',target);
}
initTheme();
function showToast(msg, duration=2200){
  const el=document.createElement('div');
  el.textContent=msg;
  el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:9999px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 10px 25px rgba(0,0,0,.2);transition:opacity .3s;';
  document.body.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),300);},duration);
}
</script>
