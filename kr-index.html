<style>
  :root{
    --kr-blue:#1d4ed8; --kr-blue-dark:#1e3a8a;
    --kr-red:#dc2626; --imperial-gold:#d97706; --gold-soft:#fef3c7;
    --ink:#1f2937; --muted:#64748b;
    --card:#ffffff;
    --radius-xl:26px; --radius-lg:18px;
    --shadow-card:0 12px 28px rgba(29,78,216,0.12);
    --shadow-pop:0 6px 0 rgba(0,0,0,0.1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;min-height:100%;background:linear-gradient(160deg,#eff6ff,#fef2f2 60%,#fefce8);
    font-family:"Noto Sans KR","M PLUS Rounded 1c","ZCOOL KuaiLe","PingFang SC",system-ui,sans-serif;color:var(--ink);}
  body{display:flex;flex-direction:column;align-items:center;padding:32px 16px 48px;min-height:100vh;}
  header{text-align:center;margin-bottom:26px;}
  header .ico{font-size:46px;filter:drop-shadow(0 6px 8px rgba(0,0,0,0.12));}
  h1{font-size:24px;font-weight:900;color:var(--kr-blue-dark);margin-top:8px;}
  p.sub{font-size:13px;color:var(--muted);margin-top:6px;max-width:480px;line-height:1.6;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;max-width:560px;margin-top:8px;}
  @media (max-width:420px){.grid{grid-template-columns:1fr;}}

  a.card{background:var(--card);border:2px solid #bfdbfe;border-radius:var(--radius-lg);padding:22px 14px;text-align:center;
    box-shadow:var(--shadow-card);text-decoration:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:8px;
    transition:transform .08s;}
  a.card:active{transform:scale(0.97);}
  a.card .ico{font-size:40px;}
  a.card .name{font-size:18px;font-weight:900;color:var(--kr-blue-dark);}
  a.card .name-en{font-size:11px;color:var(--muted);font-weight:700;}
  a.card .desc{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5;}

  .quick-links{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:24px;}
  .quick-link{font-size:12px;font-weight:700;padding:6px 12px;border-radius:14px;background:#fff;border:1.5px solid #cbd5e1;color:var(--ink);text-decoration:none;}
  .quick-link:hover{border-color:var(--kr-blue);color:var(--kr-blue);}

  footer{margin-top:36px;font-size:11px;color:var(--muted);text-align:center;}
</style>
</head>
<body>
  <header>
    <div class="ico">🇰🇷</div>

  </header>

  <div class="grid">
    <a class="card" href="/hangugeo.html">

          <path d="M32 10 A11 11 0 0 1 32 32 A11 11 0 0 0 32 54 A22 22 0 0 1 32 10 Z" fill="#1d4ed8"/>

      <div class="name">나의 일주일</div>
      <div class="name-en">My Week in Korea</div>
      <div class="desc">A1入门 · 一周生活识字闯关 · 12核心字块与7个星期</div>

    <a class="card" href="/korean.html" style="border-color:#fbcfe8;">
      <div class="ico">🧩</div>
      <div class="name">韩语数独与拼音</div>

      <div class="desc">40音发音图谱 · 元音辅音收音 · 趣味数独挑战</div>
    </a>
  </div>
