<script>
const trail = [];

async function fetchIssPosition() {
  try {
    const res = await fetch('https://api.wheretheiss.at/v1/satellites/25544');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    updateTelemetry(data.latitude, data.longitude, data.altitude, data.velocity, data.visibility);
  } catch (err) {
    // Offline / fallback Keplerian orbit approximation
    const now = Date.now() / 1000;
    const period = 92 * 60; // 92 min
    const phase = (now % period) / period;
    const lat = Math.sin(phase * Math.PI * 2) * 51.6;
    const lon = ((now / 240) % 360) - 180;
    updateTelemetry(lat, lon, 420.5, 27580, 'daylight (离线推演)');
  }
}

function updateTelemetry(lat, lon, alt, vel, vis) {
  document.getElementById('latVal').textContent = Number(lat).toFixed(2) + '°';
  document.getElementById('lonVal').textContent = Number(lon).toFixed(2) + '°';
  document.getElementById('altVal').textContent = Math.round(alt) + ' km';
  document.getElementById('velVal').textContent = Math.round(vel).toLocaleString() + ' km/h';
  document.getElementById('visVal').textContent = vis === 'daylight' ? '☀️ 白昼' : '🌙 地影';

  trail.push({ lat, lon });
  if (trail.length > 25) trail.shift();
  drawMap(lat, lon);
}

function drawMap(currentLat, currentLon) {
  const canvas = document.getElementById('mapCanvas');
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  // Background ocean
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, w, h);

  // Latitude / Longitude Grid
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 1;
  for (let x = 0; x <= w; x += w / 12) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  }
  for (let y = 0; y <= h; y += h / 6) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }

  // Equator line
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, h / 2);
  ctx.lineTo(w, h / 2);
  ctx.stroke();

  // Simplified land masses (stylized vector continents)
  ctx.fillStyle = '#1e293b';
  // Eurasia & Africa
  ctx.beginPath();
  ctx.ellipse(w * 0.55, h * 0.35, w * 0.22, h * 0.2, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(w * 0.52, h * 0.6, w * 0.1, h * 0.2, 0, 0, Math.PI * 2);
  ctx.fill();
  // Americas
  ctx.beginPath();
  ctx.ellipse(w * 0.22, h * 0.32, w * 0.12, h * 0.18, -0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(w * 0.28, h * 0.68, w * 0.08, h * 0.18, 0.3, 0, Math.PI * 2);
  ctx.fill();
  // Australia
  ctx.beginPath();
  ctx.ellipse(w * 0.8, h * 0.72, w * 0.08, h * 0.09, 0, 0, Math.PI * 2);
  ctx.fill();

  // Coordinates mapping
  const toX = lon => ((lon + 180) / 360) * w;
  const toY = lat => ((90 - lat) / 180) * h;

  // Draw trail
  if (trail.length > 1) {
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    trail.forEach((pt, i) => {
      const px = toX(pt.lon);
      const py = toY(pt.lat);
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    });
    ctx.stroke();
  }

  // Draw ISS location
  const curX = toX(currentLon);
  const curY = toY(currentLat);

  // Radar ping
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(curX, curY, 16, 0, Math.PI * 2);
  ctx.stroke();

  ctx.fillStyle = '#ef4444';
  ctx.beginPath();
  ctx.arc(curX, curY, 6, 0, Math.PI * 2);
  ctx.fill();

  // ISS Label
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 12px monospace';
  ctx.fillText('🛰️ ISS', curX + 12, curY + 4);
}

window.addEventListener('DOMContentLoaded', () => {
  fetchIssPosition();
  setInterval(fetchIssPosition, 5000);
});
</script>

<script>
function initTheme(){
  const saved=localStorage.getItem('app_theme');
  if(saved){document.documentElement.setAttribute('data-theme',saved);}
  else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const target=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',target);
  localStorage.setItem('app_theme',target);
}
initTheme();
function showToast(msg, duration=2200){
  const el=document.createElement('div');
  el.textContent=msg;
  el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:9999px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 10px 25px rgba(0,0,0,.2);transition:opacity .3s;';
  document.body.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),300);},duration);
}
</script>
