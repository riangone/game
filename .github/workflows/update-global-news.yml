name: Update Global News Aggregation

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  aggregate:
    name: Fetch & Aggregate CN/JP/KR/US News
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run News Aggregation Pipeline
        run: |
          python3 scripts/update_global_news.py data/global-news.json

      - name: Commit & Push if data changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/global-news.json
          if git diff --staged --quiet; then
            echo "No changes in global news data, skipping commit."
          else
            git commit -m "chore(data): auto-update global news perspectives feed [skip ci]"
            git push
          fi
